name: Hygiene

on:
  push:
    branches: ['**']

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check docs navigation
        run: ./scripts/check-docs-nav.sh

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/show/template.html$' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:" >&2
            echo "$unformatted" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "gofmt: clean."
