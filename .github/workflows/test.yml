name: Tests

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          # template.html is a minified third-party bundle, not ours to format.
          unformatted=$(gofmt -l . | grep -v '^internal/show/template.html$' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:" >&2
            echo "$unformatted" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "gofmt: clean."

      - name: Build
        run: go build ./cmd/spekk

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

      # Validate this repository's own specs with the binary from this commit.
      # A malformed field fails the parse of the whole tree, so one bad line on
      # main stops every command that rebuilds the index, for every user.
      - name: Validate specs
        run: go run ./cmd/spekk validate
