name: Tests

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/spekk

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s
