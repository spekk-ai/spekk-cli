name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/spekk-linux-amd64   ./cmd/spekk
          GOOS=linux   GOARCH=arm64 go build -o dist/spekk-linux-arm64   ./cmd/spekk
          GOOS=darwin  GOARCH=amd64 go build -o dist/spekk-darwin-amd64  ./cmd/spekk
          GOOS=darwin  GOARCH=arm64 go build -o dist/spekk-darwin-arm64  ./cmd/spekk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spekk-*
          generate_release_notes: true
