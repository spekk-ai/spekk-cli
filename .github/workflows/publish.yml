name: Publish to GemFury

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Publish to GemFury
        run: |
          TARBALL=$(ls *.tgz)
          curl -F package=@${TARBALL} https://${GEMFURY_TOKEN}@push.fury.io/thinknimble/
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
