name: Publish to GemFury

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, linux]
    container:
      image: node:20-slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Publish to GemFury
        run: |
          TARBALL=$(ls *.tgz)
          RESPONSE=$(curl -sS -F "package=@${TARBALL}" "https://${GEMFURY_TOKEN}@push.fury.io/thinknimble/")
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q "ok$"; then
            echo "::error::GemFury publish failed: $RESPONSE"
            exit 1
          fi
          echo "Successfully published ${TARBALL}"
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
