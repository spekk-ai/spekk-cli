name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -count=1 -timeout 120s

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/spekk-linux-amd64          ./cmd/spekk
          GOOS=linux   GOARCH=arm64 go build -o dist/spekk-linux-arm64          ./cmd/spekk
          GOOS=darwin  GOARCH=amd64 go build -o dist/spekk-darwin-amd64         ./cmd/spekk
          GOOS=darwin  GOARCH=arm64 go build -o dist/spekk-darwin-arm64         ./cmd/spekk
          GOOS=windows GOARCH=amd64 go build -o dist/spekk-windows-amd64.exe    ./cmd/spekk
          GOOS=windows GOARCH=arm64 go build -o dist/spekk-windows-arm64.exe    ./cmd/spekk
          GOOS=linux   GOARCH=amd64 go build -o dist/sandbox-linux-amd64        ./cmd/sandbox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
