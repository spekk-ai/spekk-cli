amples of decisions:\n  - \"Use deep-link searches instead of scraping\"\n  - \"Partner with platforms rather than replacing them\"\n  - \"Keep todos separate from specs in workflow\"\n- Appends to `CONTEXT.md` (creates file if it doesn't exist)\n- Shows diff of proposed CONTEXT.md changes for user approval before updating\n- Preserves existing CONTEXT.md structure and formatting\n- Decisions formatted clearly with context from the meeting\n- Date stamp included: \"Decision from meeting 2025-02-12: ...\"\n","branch":"main","created":"2025-02-12T19:30:00Z"},{"id":"extract-three-categories","parent":"meeting-notes-to-specs","title":"Extract Three Categories from Transcript","status":"done","priority":2,"file":"specs/meeting-notes-to-specs/assertions/extract-three-categories.md","content":"---\nid: extract-three-categories\nparent: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 2\nstatus: done\n---\n\n# Extract Three Categories from Transcript\n\nThe coach's meeting-processing skill identifies and separates todos, features/specs, and decisions/context from meeting transcripts.\n\n**Tests:** src/coach/__tests__/extract-three-categories.test.js\n\n## Success Criteria\n\n- Coach reads meeting transcript file (markdown, text, or copied transcript)\n- Identifies and separates three distinct categories:\n  - Todos (action items, follow-ups, assignments)\n  - Features/specs (product changes, new functionality)\n  - Decisions/context (architectural decisions, patterns established)\n- Categorization is accurate: todos ≠ features ≠ decisions\n- Each category extracted as separate output for further processing\n","branch":"main","created":"2025-02-12T19:30:00Z"},{"id":"features-become-spec-files","parent":"meeting-notes-to-specs","title":"Features Become Proper Spec Files","status":"done","priority":1,"file":"specs/meeting-notes-to-specs/assertions/features-become-spec-files.md","content":"---\nid: features-become-spec-files\nparent: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# Features Become Proper Spec Files\n\nFeature discussions from meetings are converted into proper spec files in the specs/ directory by the coach's meeting-processing skill.\n\n## Success Criteria\n\n- Feature discussions extracted from meeting → spec with assertions\n- Each spec includes: id, priority, assertions with success criteria\n- Specs follow existing format (no duplication of format rules from coach prompt):\n  - YAML frontmatter with id, created (ISO 8601), priority, status\n  - Kebab-case IDs\n  - Clear success criteria for each assertion\n- Coach proposes specs structure, waits for user approval before creating files\n- Specs created in `specs/{spec-id}/` directory with assertion files in `assertions/` subdirectory\n- Multiple features from one meeting → multiple separate specs (not combined)\n\n**Tests:** src/coach/__tests__/meeting-notes-to-specs.test.js\n","branch":"main","created":"2025-02-12T19:30:00Z"},{"id":"outputs-committed-together","parent":"meeting-notes-to-specs","title":"All Outputs Committed Together","status":"done","priority":2,"file":"specs/meeting-notes-to-specs/assertions/outputs-committed-together.md","content":"---\nid: outputs-committed-together\nparent: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 2\nstatus: done\n---\n\n# All Outputs Committed Together\n\n**Tests:** src/coach/__tests__/outputs-committed-together.test.js\n\nAfter the coach's meeting-processing skill finishes, all outputs (todos, specs, context) are committed in a single commit with clear categorization.\n\n## Success Criteria\n\n- Single git commit includes:\n  - TODOS.md (if todos were found)\n  - New spec files in specs/ (if features were discussed)\n  - Updated CONTEXT.md (if decisions were made)\n- Commit message format: `Process meeting: {date} - {brief summary}`\n- Example: `Process meeting: 2025-02-12 - Job scraping alternatives and match score improvements`\n- Each output type clearly labeled in commit message body:\n  ```\n  Todos:\n  - Follow up with Kaiser team\n\n  Specs created:\n  - meeting-notes-to-specs\n\n  Context updates:\n  - Decided to use deep-link searches over scraping\n  ```\n- Commit happens only after user approves all outputs\n","branch":"main","created":"2025-02-12T19:30:00Z"},{"id":"reuses-coach-prompt-as-base","parent":"meeting-notes-to-specs","title":"Reuses Coach Prompt as Base","status":"done","priority":1,"file":"specs/meeting-notes-to-specs/assertions/reuses-coach-prompt-as-base.md","content":"---\nid: reuses-coach-prompt-as-base\nparent: meeting-notes-to-specs\ncreated: 2026-02-24T23:59:00Z\npriority: 1\nstatus: done\n---\n\n# Reuses Coach Prompt as Base\n\n**Tests:** src/coach/__tests__/reuses-coach-prompt-as-base.test.js\n\nMeeting processing extends the coach prompt rather than defining a standalone agent prompt with duplicated rules.\n\n## Success Criteria\n\n- No standalone meeting-processor agent prompt exists\n- The coach prompt is the base for meeting processing\n- Meeting-processing skill adds behavior on top of the coach's existing capabilities\n- Spec format definitions (YAML frontmatter, kebab-case IDs, priority levels, status values) are NOT duplicated — the coach already knows these\n- Meeting-specific instructions (transcript categorization, todo extraction, context updates) are loaded as an additive skill\n- The skill follows the extensible skills framework pattern from `specs/coach-skills-system/`\n","branch":"main","created":"2026-02-24T23:59:00Z"},{"id":"todos-formatted-for-tracking","parent":"meeting-notes-to-specs","title":"Todos Formatted for Action Tracking","status":"done","priority":2,"file":"specs/meeting-notes-to-specs/assertions/todos-formatted-for-tracking.md","content":"---\nid: todos-formatted-for-tracking\nparent: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 2\nstatus: done\n---\n\n# Todos Formatted for Action Tracking\n\n**Tests:** src/coach/__tests__/todos-formatted-for-tracking.test.js\n\nTodo items extracted from meetings by the coach's meeting-processing skill are formatted and output to TODOS.md for tracking.\n\n## Success Criteria\n\n- Todo items include: description, owner (if mentioned in meeting), context\n- Outputs to `TODOS.md` in structured markdown format\n- Format: `- [ ] {description} (@{owner}) - from meeting {date}`\n- Example: `- [ ] Send spreadsheet to team (@marcy) - from meeting 2025-02-12`\n- Non-spec action items don't become specs (e.g., \"follow up with Kaiser\" is a todo, not a spec)\n- Todos are actionable and clearly separated from product features\n","branch":"main","created":"2025-02-12T19:30:00Z"},{"id":"cli-command-launches-observer-loop","parent":"observer-agent","title":"CLI Command Launches Observer in Continuous Loop","status":"done","priority":2,"file":"specs/observer-agent/assertions/cli-command-launches-observer-loop.md","content":"---\nid: cli-command-launches-observer-loop\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# CLI Command Launches Observer in Continuous Loop\n\nA CLI command starts the observer agent in continuous monitoring mode.\n\n## Success Criteria\n\n- [ ] Command `npm run observer` exists in package.json\n- [ ] Command `spekk observer` is available in main CLI (bin/spekk.js)\n- [ ] Both commands launch observer agent with continuous loop behavior (NOT JSON output)\n- [ ] Observer runs indefinitely until manually stopped (Ctrl+C)\n- [ ] Observer scans codebase and specs at regular intervals (every 30 seconds by default)\n- [ ] Observer outputs progress/status messages to console during scanning\n- [ ] Commands accept optional parameters (scan interval, quiet mode)\n- [ ] Observer gracefully handles interruption signals\n- [ ] Observer creates observations in observations/ directory when drift is detected\n\n**Tests:** src/observer/__tests__/observer.test.js, src/observer/__tests__/cli.test.js","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observations-use-markdown-yaml-format","parent":"observer-agent","title":"Observations Use Markdown + YAML Frontmatter Format","status":"done","priority":2,"file":"specs/observer-agent/assertions/observations-use-markdown-yaml-format.md","content":"---\nid: observations-use-markdown-yaml-format\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# Observations Use Markdown + YAML Frontmatter Format\n\nObservation files follow the same format conventions as specs and assertions for consistency.\n\n**Tests:** src/observer/__tests__/observation-format.test.js\n\n## Success Criteria\n\n- [x] Observations use YAML frontmatter with required fields\n- [x] Frontmatter includes: id, created (ISO 8601), type (observation type)\n- [x] Frontmatter includes: severity (low/medium/high), affected_specs (array)\n- [x] Frontmatter includes: affected_files (array of file paths)\n- [x] Body uses markdown format for human-readable findings\n- [x] Format is consistent with existing spec parser expectations\n- [x] Files are parseable by existing YAML/markdown tooling","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-catches-spec-conflicts","parent":"observer-agent","title":"Observer Catches Spec Conflicts","status":"done","priority":2,"file":"specs/observer-agent/assertions/observer-catches-spec-conflicts.md","content":"---\nid: observer-catches-spec-conflicts\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# Observer Catches Spec Conflicts\n\nThe observer detects contradictory requirements between different specifications that need resolution.\n\n## Success Criteria\n\n- [ ] Observer identifies specs with mutually exclusive requirements\n- [ ] Observer detects conflicting file/directory structure requirements\n- [ ] Observer finds contradictory behavior specifications for same features\n- [ ] Observer identifies priority conflicts (high-priority specs blocking each other)\n- [ ] Observer creates observations highlighting specific conflict details\n- [ ] Observer references all conflicting specs in each conflict observation\n- [ ] Observer suggests which conflicts are blocking vs informational","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-creates-observations-directory","parent":"observer-agent","title":"Observer Creates Observations in observations/ Directory","status":"done","priority":2,"file":"specs/observer-agent/assertions/observer-creates-observations-directory.md","content":"---\nid: observer-creates-observations-directory\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# Observer Creates Observations in observations/ Directory\n\nThe observer agent records its findings in a centralized observations directory for human review.\n\n## Success Criteria\n\n- [ ] Observer creates `observations/` directory if it doesn't exist\n- [ ] Observations are saved as individual timestamped files\n- [ ] Each observation file contains specific drift detection findings\n- [ ] Observation files reference relevant specs and code files\n- [ ] Files are named with timestamp pattern (e.g., `2026-01-22T17-30-00Z.md`)\n- [ ] Directory serves as ephemeral inbox for processing and dismissal\n\n**Tests:** src/observer/__tests__/observer.test.js (testObserverCreatesObservationsDir, testObserverCreatesObservationFiles), src/observer/__tests__/observation-format.test.js","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-detects-code-spec-misalignment","parent":"observer-agent","title":"Observer Detects Code-Spec Misalignment","status":"done","priority":2,"file":"specs/observer-agent/assertions/observer-detects-code-spec-misalignment.md","content":"---\nid: observer-detects-code-spec-misalignment\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# Observer Detects Code-Spec Misalignment\n\nThe observer identifies places where implementation doesn't match what specifications declare.\n\n**Tests:** src/observer/__tests__/observer.test.js\n\n## Success Criteria\n\n- [ ] Observer compares assertion success criteria against actual code\n- [ ] Observer detects when functions/features exist but don't meet spec requirements\n- [ ] Observer detects when required files/directories are missing\n- [ ] Observer detects when code exists in wrong locations per spec constraints\n- [ ] Observer creates observations with specific misalignment details\n- [ ] Observer references both the spec assertion and problematic code files\n- [ ] Observer categorizes severity based on impact (critical features vs nice-to-haves)","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-finds-compression-opportunities","parent":"observer-agent","title":"Observer Finds Spec Compression Opportunities","status":"done","priority":3,"file":"specs/observer-agent/assertions/observer-finds-compression-opportunities.md","content":"---\nid: observer-finds-compression-opportunities\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 3\nstatus: done\n---\n\n# Observer Finds Spec Compression Opportunities\n\nThe observer identifies multiple specs that could be consolidated into fewer, clearer specifications.\n\n## Success Criteria\n\n- [ ] Observer detects specs with overlapping functionality or scope\n- [ ] Observer identifies assertion patterns that could be merged\n- [ ] Observer finds specs that are all targeting the same system component\n- [ ] Observer suggests consolidation when specs have similar success criteria\n- [ ] Observer creates observations with specific consolidation recommendations\n- [ ] Observer considers priority and status when suggesting merges\n- [ ] Observer maintains traceability to original separate specs in recommendations\n\n**Tests:** src/observer/__tests__/observer.test.js","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-identifies-outdated-specs","parent":"observer-agent","title":"Observer Identifies Outdated Specs","status":"done","priority":3,"file":"specs/observer-agent/assertions/observer-identifies-outdated-specs.md","content":"---\nid: observer-identifies-outdated-specs\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 3\nstatus: done\n---\n\n# Observer Identifies Outdated Specs\n\nThe observer detects specifications that no longer reflect current system needs or implementation reality.\n\n## Success Criteria\n\n- [ ] Observer identifies specs marked as \"done\" but code has significantly changed\n- [ ] Observer detects specs referencing deprecated or removed functionality\n- [ ] Observer finds specs with success criteria that are no longer relevant\n- [ ] Observer identifies specs that duplicate functionality now handled elsewhere\n- [ ] Observer creates observations suggesting spec retirement or updates\n- [ ] Observer considers timestamp patterns to identify stale specs\n- [ ] Observer flags specs that conflict with newer implementation patterns\n\n**Tests:** src/observer/__tests__/outdated-specs-detection.test.js","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"observer-is-claude-agent","parent":"observer-agent","title":"Observer Is Claude Agent","status":"done","priority":1,"file":"specs/observer-agent/assertions/observer-is-claude-agent.md","content":"---\nid: observer-is-claude-agent\nparent: observer-agent\ncreated: 2026-01-22T17:25:00Z\npriority: 1\nstatus: done\n---\n\n# Observer Is Claude Agent\n\nThe Observer must be implemented as a Claude agent (like Coach and Builder) that uses the observer-agent.prompt.md, not just a programmatic script.\n\n## Success Criteria\n\n- [ ] Observer runs as Claude agent instance with observer-agent.prompt.md\n- [ ] Observer has access to standard Claude tools (Read, Grep, Bash, Edit, etc.)\n- [ ] Observer can reason intelligently about code-spec alignment, not just pattern matching\n- [ ] Observer understands context and semantics when detecting drift\n- [ ] Observer makes reasoned decisions about severity and impact\n- [ ] Observer can analyze complex relationships between specs and implementation\n- [ ] Observer creates thoughtful observations based on understanding, not just file existence checks\n- [ ] Current programmatic drift detection becomes a tool the Claude agent can optionally use\n\n## Context\n\nThe current implementation in `src/observer/index.js` is just a Node.js script doing regex patterns and file checks. This should be replaced with (or supplemented by) an actual Claude agent that can think critically about drift and misalignment.","branch":"main","created":"2026-01-22T17:25:00Z"},{"id":"observer-prompt-defines-drift-detection","parent":"observer-agent","title":"Observer Prompt Defines Drift Detection Behavior","status":"done","priority":2,"file":"specs/observer-agent/assertions/observer-prompt-defines-drift-detection.md","content":"---\nid: observer-prompt-defines-drift-detection\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\nstatus: done\n---\n\n# Observer Prompt Defines Drift Detection Behavior\n\nThe observer agent has a detailed prompt file that defines how it detects different types of drift and misalignment.\n\n## Success Criteria\n\n- [ ] File exists at `specs/observer-agent/observer-agent.prompt.md`\n- [ ] Prompt defines behavior for detecting code-spec misalignment\n- [ ] Prompt defines behavior for identifying outdated specs\n- [ ] Prompt defines behavior for finding spec compression opportunities\n- [ ] Prompt defines behavior for catching spec conflicts\n- [ ] Prompt explains observation recording format and process\n- [ ] Prompt specifies continuous loop operation mode","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"spec-parser-handles-observations","parent":"observer-agent","title":"Spec Parser Handles Observation Files","status":"done","priority":3,"file":"specs/observer-agent/assertions/spec-parser-handles-observations.md","content":"---\nid: spec-parser-handles-observations\nparent: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 3\nstatus: done\n---\n\n# Spec Parser Handles Observation Files\n\n**Tests:** src/parser/__tests__/observations-parsing.test.js\n\nThe existing spec parser is extended to parse and validate observation files alongside specs and assertions.\n\n## Success Criteria\n\n- [ ] Parser scans `observations/` directory for `.md` files\n- [ ] Parser validates observation YAML frontmatter structure\n- [ ] Parser includes observations in JSON output with separate section\n- [ ] Parser validates required observation fields (id, created, type, severity)\n- [ ] Parser validates affected_specs references point to existing specs\n- [ ] Parser validates affected_files references point to existing files\n- [ ] Observation parsing errors are reported clearly","branch":"main","created":"2026-01-22T17:00:00Z"},{"id":"enable-parallel-test-execution","parent":"optimize-test-performance","title":"Enable Parallel Test Execution","status":"done","priority":2,"file":"specs/optimize-test-performance/assertions/enable-parallel-test-execution.md","content":"---\nid: enable-parallel-test-execution\nparent: optimize-test-performance\ncreated: 2026-01-28T21:25:00Z\npriority: 2\nstatus: done\n---\n\n# Enable Parallel Test Execution\n\n## What Must Be True\n\nTests run in parallel instead of sequentially to improve performance.\n\n## Current Issue\n\nTest runner uses `--test-concurrency=1` which forces sequential execution:\n```javascript\nspawn('node', ['--test', '--test-concurrency=1', ...testFiles])\n```\n\n## Success Criteria\n\n- ✅ Remove `--test-concurrency=1` flag to enable parallel execution\n- ✅ Tests are isolated and don't interfere with each other\n- ✅ No shared state between tests\n- ✅ Proper cleanup after each test\n\n## Implementation\n\n**Update test runner:**\n```javascript\n// From: ['--test', '--test-concurrency=1', ...testFiles]\n// To:   ['--test', ...testFiles]\n```\n\n**Ensure test isolation:**\n- No shared global variables\n- Proper mocking and cleanup\n- Independent file system operations (if any)\n\n## Validation\n\nTests should still pass when run in parallel, but complete faster.","branch":"main","created":"2026-01-28T21:25:00Z"},{"id":"mock-external-processes","parent":"optimize-test-performance","title":"Mock External Processes","status":"done","priority":1,"file":"specs/optimize-test-performance/assertions/mock-external-processes.md","content":"---\nid: mock-external-processes\nparent: optimize-test-performance\ncreated: 2026-01-28T21:25:00Z\npriority: 1\nstatus: done\n---\n\n# Mock External Processes\n\n## What Must Be True\n\nTests use mocks for external processes instead of spawning real child processes, which are slow and unreliable.\n\n## Current Problem\n\nTests like \"Orchestration Loops\" are spawning real processes:\n- `spawn('node', ['--test', '--test-concurrency=1', ...testFiles])`\n- Command executions that take 5+ seconds\n- Real file system operations\n\n## Success Criteria\n\n- ✅ No `spawn()` or `exec()` calls in tests\n- ✅ Mock child process responses\n- ✅ Mock file system operations where appropriate\n- ✅ Use in-memory fixtures instead of real files\n- ✅ Tests run in isolation without external dependencies\n\n## Implementation Strategy\n\n**Mock child processes:**\n```javascript\n// Instead of real spawn\nconst mockSpawn = () =\u003e ({ on: jest.fn(), stdout: { on: jest.fn() } })\n```\n\n**Mock file system:**\n```javascript\n// Use in-memory file system or simple mocks\nconst mockFs = { readFile: jest.fn(), writeFile: jest.fn() }\n```\n\n**Use fixtures:**\n```javascript\n// Hardcode expected outputs instead of calling real commands\nconst expectedOutput = { specs: [...], assertions: [...] }\n```","branch":"main","created":"2026-01-28T21:25:00Z"},{"id":"test-fixtures-use-isolated-temp-dirs","parent":"optimize-test-performance","title":"Test Fixtures Use Isolated Temp Directories","status":"done","priority":1,"file":"specs/optimize-test-performance/assertions/test-fixtures-use-isolated-temp-dirs.md","content":"---\nid: test-fixtures-use-isolated-temp-dirs\nparent: optimize-test-performance\ncreated: 2026-03-16T20:00:00Z\npriority: 1\nstatus: done\ndepends-on: enable-parallel-test-execution\n---\n\n# Test Fixtures Use Isolated Temp Directories\n\n## What Must Be True\n\nNo test creates artifacts inside the project's `specs/` directory. All test fixtures live in unique directories under `os.tmpdir()`, ensuring full isolation during parallel execution.\n\n## Success Criteria\n\n- No test file references `path.join(process.cwd(), 'specs', 'temp-*')` or similar patterns that write into the project tree\n- All test fixtures are created in `os.tmpdir()` (or equivalent) with unique per-test directory names\n- All previously-skipped test suites are re-enabled and passing:\n  - `src/parser/__tests__/cli-reads-local-specs.test.js` (5 `test.skip` calls)\n  - `src/parser/__tests__/malformed-file-handling.test.js` (`describe.skip`)\n  - `src/parser/__tests__/parser-basic.test.js` (`describe.skip`)\n  - `src/parser/__tests__/priority-algorithm.test.js` (`describe.skip`)\n  - `src/parser/__tests__/quote-handling.test.js` (`describe.skip`)\n- `npm test` reports 0 skipped tests\n- All tests pass when run in parallel (default Node.js test runner behavior)\n\n## Context\n\nSee GitHub issue #29. Tests currently create `temp-*` directories in the shared `specs/` directory, causing cross-contamination during parallel runs. This is why 5 suites were skipped.\n","branch":"main","dependsOn":"enable-parallel-test-execution","created":"2026-03-16T20:00:00Z"},{"id":"tests-complete-under-30-seconds","parent":"optimize-test-performance","title":"Tests Complete Under 30 Seconds","status":"done","priority":1,"file":"specs/optimize-test-performance/assertions/tests-complete-under-30-seconds.md","content":"---\nid: tests-complete-under-30-seconds\nparent: optimize-test-performance\ncreated: 2026-01-28T21:25:00Z\npriority: 1\nstatus: done\n---\n\n# Tests Complete Under 30 Seconds\n\n## What Must Be True\n\nThe entire test suite completes in under 30 seconds, with individual tests completing in under 500ms.\n\n## Current Performance Issues\n\n**Slow tests identified:**\n- `Orchestration Loops` - Over 10 seconds (spawn real processes)\n- `Coach CLI` - Over 1 second (file system operations)\n- Various CLI tests - File system heavy\n\n## Success Criteria\n\n- ✅ `npm test` completes in \u003c 30 seconds total\n- ✅ Individual tests complete in \u003c 500ms\n- ✅ No test timeouts in CI\n- ✅ Tests use mocks instead of real processes/file system\n- ✅ All 264 tests pass (currently 37 failing)\n\n## Optimization Strategies\n\n1. **Fix failing tests** - 37 tests currently failing\n2. **Mock external dependencies** - Don't spawn real processes\n3. **Use in-memory file system** - For tests that need file operations\n4. **Minimize I/O operations** - Use stubs and fixtures\n5. **Parallel test execution** - Remove `--test-concurrency=1` if safe\n6. **Remove unnecessary setup/teardown** - Only test what's needed\n\n## Validation\n\n```bash\ntime npm test  # Should complete in \u003c 30 seconds with all tests passing\n```","branch":"main","created":"2026-01-28T21:25:00Z"},{"id":"builder-loop-handles-parser-errors","parent":"robust-error-handling","title":"Builder Loop Handles Parser Errors Gracefully","status":"done","priority":1,"file":"specs/robust-error-handling/assertions/builder-loop-handles-parser-errors.md","content":"---\nid: builder-loop-handles-parser-errors\nparent: robust-error-handling\ncreated: 2026-03-16T18:00:00Z\npriority: 1\nstatus: done\ndepends-on: parser-skips-specs-without-assertions-dir\n---\n\n# Builder Loop Handles Parser Errors Gracefully\n\n**Tests:** `src/loops/__tests__/builder-loop-handles-parser-errors.test.js`\n\n**Closes:** #7\n\n## What Must Be True\n\nThe builder loop never crashes from a parser error. When `spekk next` fails or returns unexpected output, the builder logs the issue and retries after a delay — it does not `process.exit(1)`.\n\n## Success Criteria\n\n- Builder loop catches `spekk next` command failures (non-zero exit) and retries after a delay instead of exiting\n- Builder loop handles malformed JSON from parser by logging a warning and retrying\n- When all assertions are complete, builder logs a success message and waits for new work (already works — this assertion ensures parser errors don't prevent reaching that code path)\n- Builder loop remains running through transient parser errors caused by specs being authored mid-flight\n","branch":"main","dependsOn":"parser-skips-specs-without-assertions-dir","created":"2026-03-16T18:00:00Z"},{"id":"parser-handles-malformed-files","parent":"robust-error-handling","title":"Parser Handles Malformed Files","status":"done","priority":1,"file":"specs/robust-error-handling/assertions/parser-handles-malformed-files.md","content":"---\nid: parser-handles-malformed-files\nparent: robust-error-handling\ncreated: 2026-01-28T21:35:00Z\npriority: 1\nstatus: done\n---\n\n# Parser Handles Malformed Files\n\n**Tests:** src/parser/__tests__/malformed-file-handling.test.js\n\n## What Must Be True\n\nThe parser gracefully handles malformed files by warning and skipping them, never crashing the entire CLI.\n\n## Current Problem\n\nParser crashes with error like:\n```\nField 'affected_specs' must be an array in observations/file.md\n```\n\n## Success Criteria\n\n- ✅ Parser logs warnings for malformed files to stderr\n- ✅ Parser skips malformed files and continues processing\n- ✅ CLI returns valid JSON even when some files are malformed  \n- ✅ `spekk next` works even with malformed observation files\n- ✅ Builder can continue to operate despite file parsing issues\n\n## Implementation\n\nWrap file parsing in try/catch blocks:\n```javascript\ntry {\n  // parse file\n} catch (error) {\n  console.warn(`Warning: Skipping malformed file ${filePath}: ${error.message}`);\n  continue; // skip this file\n}\n```","branch":"main","created":"2026-01-28T21:35:00Z"},{"id":"parser-skips-malformed-assertions","parent":"robust-error-handling","title":"Parser Skips Malformed Assertion Files","status":"done","priority":1,"file":"specs/robust-error-handling/assertions/parser-skips-malformed-assertions.md","content":"---\nid: parser-skips-malformed-assertions\nparent: robust-error-handling\ncreated: 2026-03-16T18:00:00Z\npriority: 1\nstatus: done\ndepends-on: parser-skips-specs-without-assertions-dir\n---\n\n# Parser Skips Malformed Assertion Files\n\n**Closes:** #41\n**Tests:** src/parser/__tests__/parser-skips-malformed-assertions.test.js\n\n## What Must Be True\n\nWhen individual assertion files have invalid or missing frontmatter, the parser warns to stderr and skips them — it never crashes the CLI or returns an error JSON response.\n\n## Success Criteria\n\n- Assertion files missing required fields (id, parent, status, priority) are skipped with a stderr warning\n- Assertion files with unparseable YAML frontmatter are skipped with a stderr warning\n- The parent spec's computed status is derived only from its successfully-parsed assertions\n- `spekk next` returns the next valid assertion even when other assertion files are malformed\n- A spec with zero parseable assertions (all malformed) is treated the same as a spec with no assertions\n","branch":"main","dependsOn":"parser-skips-specs-without-assertions-dir","created":"2026-03-16T18:00:00Z"},{"id":"parser-skips-specs-without-assertions-dir","parent":"robust-error-handling","title":"Parser Skips Specs Without Assertions Directory","status":"done","priority":1,"file":"specs/robust-error-handling/assertions/parser-skips-specs-without-assertions-dir.md","content":"---\nid: parser-skips-specs-without-assertions-dir\nparent: robust-error-handling\ncreated: 2026-03-16T18:00:00Z\npriority: 1\nstatus: done\n---\n\n# Parser Skips Specs Without Assertions Directory\n\n**Closes:** #18, #30, #41\n\n## What Must Be True\n\nWhen a spec directory exists with a valid parent spec file but no `assertions/` subdirectory, the parser warns to stderr and skips that spec — it never throws or crashes.\n\n## Success Criteria\n\n- `validateFolderStructure` does not throw when `assertions/` is missing; it logs a warning to stderr and continues\n- `spekk next` returns valid JSON even when some spec directories lack `assertions/`\n- `spekk show` renders all valid specs and skips incomplete ones without crashing\n- `spekk status` counts only parseable specs; incomplete ones are excluded with a warning\n- A spec directory with a parent `.md` but no `assertions/` is treated as if it has zero assertions (not as an error)\n","branch":"main","created":"2026-03-16T18:00:00Z"},{"id":"do-api-client","parent":"sandbox-command","title":"DigitalOcean API Client","status":"done","priority":1,"file":"specs/sandbox-command/assertions/do-api-client.md","content":"---\nid: do-api-client\nparent: sandbox-command\ncreated: 2026-03-12T15:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: sandbox-command-routing\n---\n\n# DigitalOcean API Client\n\n## Requirement\n\nA thin API client in `src/sandbox/do-api.js` wraps DigitalOcean's REST API using Node.js native `fetch`. No external HTTP libraries or `doctl` dependency.\n\n## Success Criteria\n\n- `src/sandbox/do-api.js` exports functions for: `createDroplet`, `getDroplet`, `listDroplets`, `deleteDroplet`, `listSSHKeys`\n- All functions read `DO_API_TOKEN` from `process.env` and throw a clear error if it is not set\n- `createDroplet({ name, region, size, userData, sshKeyIds })` POSTs to `/v2/droplets` and returns the created droplet object\n- `getDroplet(id)` GETs `/v2/droplets/{id}` and returns droplet status, IP addresses, and metadata\n- `listDroplets(tag)` GETs `/v2/droplets?tag_name={tag}` to filter sandboxes by a `spekk-sandbox` tag\n- `deleteDroplet(id)` DELETEs `/v2/droplets/{id}` and returns success/failure\n- `listSSHKeys()` GETs `/v2/account/keys` and returns available SSH key IDs and fingerprints\n- All API errors (4xx, 5xx) are caught and re-thrown with the DO error message included\n- No dependencies added to `package.json` for HTTP -- uses global `fetch`\n","branch":"feature/sandbox-command","dependsOn":"sandbox-command-routing","created":"2026-03-12T15:00:00Z"},{"id":"sandbox-agent-env-loading","parent":"sandbox-command","title":"Sandbox Agent Environment Loading","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-agent-env-loading.md","content":"---\nid: sandbox-agent-env-loading\nparent: sandbox-command\ncreated: 2026-03-12T22:00:00Z\npriority: 1\nstatus: done\ndepends-on: sandbox-create-workflow\nbranch: feature/sandbox-command\n---\n\n# Sandbox Agent Environment Loading\n\n## Requirement\n\nThe agent systemd service loads credentials from `/etc/spekk/agent.env`, including `SPEKK_SERVER_URL` set to the full WebSocket endpoint.\n\n## Success Criteria\n\n- `cloud-init.yaml` systemd unit includes `EnvironmentFile=/etc/spekk/agent.env` so all credentials are available to the agent process\n- `src/sandbox/create.js` `injectCredentials` writes `SPEKK_SERVER_URL=wss://{host}/ws/agent/{token}/` to `/etc/spekk/agent.env` (constructed from `SPEKK_HOST` and `SPEKK_AGENT_TOKEN`, stripping any `https://` prefix from the host and replacing with `wss://`)\n- `src/sandbox/create.js` `injectCredentials` also writes `SPEKK_AGENT_NAME=spekk-{name}` to the env file so the agent identifies itself correctly\n- After `systemctl start spekk-agent`, the agent process has access to all env vars from agent.env (AWS creds, GitHub token, Spekk server URL)\n","branch":"feature/sandbox-command","dependsOn":"sandbox-create-workflow","created":"2026-03-12T22:00:00Z"},{"id":"sandbox-cli-wiring","parent":"sandbox-command","title":"Sandbox CLI Subcommand Wiring","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-cli-wiring.md","content":"---\nid: sandbox-cli-wiring\nparent: sandbox-command\ncreated: 2026-03-12T20:30:00Z\npriority: 1\nstatus: done\ndepends-on: sandbox-command-routing\nbranch: feature/sandbox-command\n---\n\n# Sandbox CLI Subcommand Wiring\n\n## Requirement\n\nAll sandbox subcommands must be wired up in `src/sandbox/cli.js`. Currently only `create` and `deploy` are connected — `list`, `status`, `ssh`, and `destroy` print \"not yet implemented\" stubs.\n\n## Success Criteria\n\n- `src/sandbox/cli.js` `list` case imports and calls `listCommand` from `./list.js`\n- `src/sandbox/cli.js` `status` case imports and calls `statusCommand` from `./status.js`, passing the sandbox name from `subArgs[0]`\n- `src/sandbox/cli.js` `ssh` case imports and calls `sshCommand` from `./ssh.js`, passing `subArgs`\n- `src/sandbox/cli.js` `destroy` case imports and calls `destroyCommand` from `./destroy.js`, passing `subArgs`\n- No \"not yet implemented\" stubs remain in `cli.js`\n- All six subcommands (create, list, status, ssh, destroy, deploy) execute their respective module when invoked\n","branch":"feature/sandbox-command","dependsOn":"sandbox-command-routing","created":"2026-03-12T20:30:00Z"},{"id":"sandbox-command-routing","parent":"sandbox-command","title":"Sandbox Command Routing","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-command-routing.md","content":"---\nid: sandbox-command-routing\nparent: sandbox-command\ncreated: 2026-03-12T15:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-command\n---\n\n# Sandbox Command Routing\n\n## Requirement\n\n`spekk sandbox \u003csubcommand\u003e` is a top-level CLI command registered in `bin/spekk.js`. It routes to subcommands: `create`, `list`, `status`, `ssh`, `destroy`, `deploy`. The implementation lives in `src/sandbox/`.\n\n## Success Criteria\n\n- `spekk sandbox --help` prints usage showing all six subcommands with descriptions\n- `spekk sandbox` with no subcommand prints help text and exits with code 0\n- `spekk sandbox unknown-cmd` prints an error and exits with code 1\n- `bin/spekk.js` has a `sandbox` case in its command switch that delegates to `src/sandbox/cli.js`\n- `src/sandbox/cli.js` exports a `launchSandbox(args)` function that parses subcommands and flags\n- `spekk sandbox create` accepts `--name` (required), `--region` (default `nyc1`), `--size` (default `s-2vcpu-4gb`)\n","branch":"feature/sandbox-command","created":"2026-03-12T15:00:00Z"},{"id":"sandbox-create-auto-token","parent":"sandbox-command","title":"Sandbox Create: Auto-Generate Agent Token","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-create-auto-token.md","content":"---\nid: sandbox-create-auto-token\nparent: sandbox-command\ncreated: 2026-03-13T00:00:00Z\npriority: 1\nstatus: done\ndepends-on: sandbox-token-generator\n---\n\n# Sandbox Create: Auto-Generate Agent Token\n\n`spekk sandbox create` auto-generates a unique `SPEKK_AGENT_TOKEN` per sandbox using `generateAgentToken()`. The token is no longer required as an environment variable. The `registerAgent()` API call is removed — agents are registered manually in Django admin.\n\n## Success Criteria\n\n- `SPEKK_AGENT_TOKEN` is removed from `REQUIRED_ENV_VARS` in `create.js`\n- `createSandbox()` calls `generateAgentToken()` to produce a fresh token at the start of each create run\n- The generated token (not any env var) is written to `/etc/spekk/agent.env` as `SPEKK_AGENT_TOKEN` on the sandbox\n- `registerAgent()` function and its call are removed from `create.js`\n- `DO_API_TOKEN` is used only for DigitalOcean API calls; it is never injected into the sandbox env\n- The final summary printed to stdout includes the generated token clearly labeled, e.g.:\n  ```\n  Sandbox created successfully:\n    Name:           spekk-adarose\n    IP:             1.2.3.4\n    AGENT_TOKEN:    \u003cgenerated-token\u003e\n\n  Next: Add this agent in Django admin at https://$SPEKK_HOST/staff/agent/agent/add/\n    - Name: adarose\n    - Sandbox ID: spekk-adarose\n    - Auth token: \u003cgenerated-token\u003e\n  ```\n- `SPEKK_HOST` in the summary URL uses the bare hostname (no scheme prefix)\n","branch":"main","dependsOn":"sandbox-token-generator","created":"2026-03-13T00:00:00Z"},{"id":"sandbox-create-workflow","parent":"sandbox-command","title":"Sandbox Create Workflow","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-create-workflow.md","content":"---\nid: sandbox-create-workflow\nparent: sandbox-command\ncreated: 2026-03-12T18:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: do-api-client\n---\n\n# Sandbox Create Workflow\n\n## Requirement\n\n`spekk sandbox create --name \u003cname\u003e` provisions a full sandbox: creates a DO droplet, waits for it to be ready, injects credentials, deploys the agent client, registers the agent in Django, and saves metadata locally.\n\n## Success Criteria\n\n- `src/sandbox/create.js` exports an async `createSandbox({ name, region, size })` function\n- The function calls `listSSHKeys()` from the DO API client and uses the first available key (or errors if none found)\n- It fetches `cloud-init.yaml` from the spekk-app GitHub release and passes it as `user_data` to `createDroplet`\n- The droplet is created with the tag `spekk-sandbox` and the name `spekk-{name}`\n- After droplet creation, polls `getDroplet(id)` every 5 seconds until status is `active` and a public IPv4 address is available (timeout after 5 minutes)\n- After the droplet is active, polls SSH connectivity (TCP connect to port 22) until it succeeds, then checks for the `/opt/spekk/.provisioned` marker file via SSH (timeout after 10 minutes)\n- Reads credentials from environment variables: `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_DEFAULT_REGION`, `GITHUB_TOKEN`, `SPEKK_AGENT_TOKEN`, `SPEKK_HOST` -- if any are missing, prints which are missing and exits with an error\n- AWS Bedrock is the default model provider for agent sandboxes (not direct Anthropic API)\n- SSHes into the droplet as `root` and writes `/etc/spekk/agent.env` with all six credential values, sets permissions to 600\n- The agent.env file also includes `CLAUDE_CODE_USE_BEDROCK=1` so Claude Code on the droplet uses Bedrock by default\n- Configures git credentials and gh CLI for the `agent` user via SSH commands (same steps as `setup-credentials.sh`)\n- Deploys the Go agent binary and starts the `spekk-agent` systemd service (via `deployAgent`)\n- Calls the Spekk API (`POST /api/agents/`) with the agent name, droplet IP, and agent token to register the sandbox\n- Saves metadata to the local store: `{ dropletId, ip, region, size, createdAt, status: 'active' }`\n- Prints a summary: sandbox name, IP, region, size, and \"Agent connected\" or connection error\n- If any step fails after droplet creation, prints the error and the droplet IP so the user can debug manually (does not auto-destroy)\n","branch":"feature/sandbox-command","dependsOn":"do-api-client","created":"2026-03-12T18:00:00Z"},{"id":"sandbox-destroy","parent":"sandbox-command","title":"Sandbox Destroy","status":"done","priority":2,"file":"specs/sandbox-command/assertions/sandbox-destroy.md","content":"---\nid: sandbox-destroy\nparent: sandbox-command\ncreated: 2026-03-12T18:00:00Z\npriority: 2\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: sandbox-metadata-store\n---\n\n# Sandbox Destroy\n\n## Requirement\n\n`spekk sandbox destroy \u003cname\u003e` deletes the DO droplet and removes local metadata.\n\n## Success Criteria\n\n- `spekk sandbox destroy \u003cname\u003e` looks up the sandbox in the local store to get the droplet ID\n- Prints a confirmation prompt: \"Destroy sandbox '\u003cname\u003e' (droplet \u003cid\u003e)? [y/N]\" and waits for input\n- If confirmed, calls `deleteDroplet(id)` from the DO API client\n- On successful deletion, removes the entry from `~/.config/spekk/sandboxes.json` via `removeSandbox(name)`\n- Prints \"Sandbox '\u003cname\u003e' destroyed.\" on success\n- If the DO API returns 404 (droplet already gone), still removes local metadata and prints a warning that the droplet was already deleted\n- If the sandbox name is not found in the local store, prints an error and exits with code 1\n- Supports `--force` or `-f` flag to skip the confirmation prompt\n","branch":"feature/sandbox-command","dependsOn":"sandbox-metadata-store","created":"2026-03-12T18:00:00Z"},{"id":"sandbox-list-and-status","parent":"sandbox-command","title":"Sandbox List and Status","status":"done","priority":2,"file":"specs/sandbox-command/assertions/sandbox-list-and-status.md","content":"---\nid: sandbox-list-and-status\nparent: sandbox-command\ncreated: 2026-03-12T18:00:00Z\npriority: 2\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: sandbox-metadata-store\n---\n\n# Sandbox List and Status\n\n## Requirement\n\n`spekk sandbox list` shows all known sandboxes. `spekk sandbox status \u003cname\u003e` shows detailed status for one sandbox, including live data from the DO API.\n\n## Success Criteria\n\n- `spekk sandbox list` reads `~/.config/spekk/sandboxes.json` and prints a table with columns: Name, IP, Region, Status, Created\n- If no sandboxes exist, prints \"No sandboxes found.\" and exits with code 0\n- `spekk sandbox status \u003cname\u003e` looks up the sandbox in the local store, then fetches live data from `getDroplet(id)`\n- Status output includes: sandbox name, droplet ID, IP address, region, size, droplet status (from DO API), and created timestamp\n- Status output also attempts an SSH check for the `/opt/spekk/.provisioned` marker and shows \"Provisioned: yes/no\"\n- Status output checks `systemctl is-active spekk-agent` via SSH and shows \"Agent service: active/inactive/unknown\"\n- If the sandbox name is not found in the local store, prints an error and exits with code 1\n- If the DO API call fails (e.g., droplet was deleted outside the CLI), prints a warning and shows only local metadata\n","branch":"feature/sandbox-command","dependsOn":"sandbox-metadata-store","created":"2026-03-12T18:00:00Z"},{"id":"sandbox-metadata-store","parent":"sandbox-command","title":"Sandbox Metadata Store","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-metadata-store.md","content":"---\nid: sandbox-metadata-store\nparent: sandbox-command\ncreated: 2026-03-12T15:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: sandbox-command-routing\n---\n\n# Sandbox Metadata Store\n\n## Requirement\n\nSandbox metadata is persisted locally in `~/.config/spekk/sandboxes.json` so the CLI can map sandbox names to droplet IDs, IPs, and other state without querying DO every time.\n\n## Success Criteria\n\n- `src/sandbox/store.js` exports functions: `loadSandboxes`, `saveSandbox`, `removeSandbox`, `getSandbox`\n- `~/.config/spekk/` directory is created automatically if it does not exist\n- `sandboxes.json` stores an object keyed by sandbox name with values: `{ dropletId, ip, region, size, createdAt, status }`\n- `saveSandbox(name, data)` merges data into the existing entry (or creates a new one)\n- `removeSandbox(name)` deletes the entry from the JSON file\n- `getSandbox(name)` returns the entry or `null` if not found\n- `loadSandboxes()` returns the full object (empty `{}` if file does not exist)\n- File reads and writes use `fs.promises` with proper error handling for missing files\n","branch":"feature/sandbox-command","dependsOn":"sandbox-command-routing","created":"2026-03-12T15:00:00Z"},{"id":"sandbox-project-assignment","parent":"sandbox-command","title":"Sandbox Project Assignment","status":"done","priority":2,"file":"specs/sandbox-command/assertions/sandbox-project-assignment.md","content":"---\nid: sandbox-project-assignment\nparent: sandbox-command\ncreated: 2026-03-12T21:00:00Z\npriority: 2\nstatus: done\ndepends-on: sandbox-create-workflow\nbranch: feature/sandbox-command\n---\n\n# Sandbox Project Assignment\n\n## Requirement\n\n`spekk sandbox create` accepts an optional `--project` flag to assign the new droplet to a DigitalOcean project. Since the DO API doesn't support project assignment at droplet creation time, the droplet is moved into the project immediately after creation.\n\n## Success Criteria\n\n- `src/sandbox/do-api.js` exports a `listProjects()` function that GETs `/v2/projects` and returns all projects\n- `src/sandbox/do-api.js` exports an `assignToProject(projectId, resourceUrns)` function that POSTs to `/v2/projects/{projectId}/resources` with the resource URNs\n- `spekk sandbox create --name foo --project \"My Project\"` looks up the project by name from `listProjects()`, creates the droplet, then assigns it to that project using URN `do:droplet:{dropletId}`\n- If `--project` value matches a project UUID instead of a name, it uses the ID directly without looking up by name\n- If `--project` is specified but no matching project is found, prints an error listing available project names and exits with code 1 (before creating the droplet)\n- If `--project` is not specified, no project assignment happens (droplet goes to the default project, same as current behavior)\n- The `--project` flag is documented in `spekk sandbox create --help` output\n- Project name (if specified) is saved in the local sandbox metadata store alongside existing fields\n","branch":"feature/sandbox-command","dependsOn":"sandbox-create-workflow","created":"2026-03-12T21:00:00Z"},{"id":"sandbox-security-hardening","parent":"sandbox-command","title":"Sandbox Security Hardening","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-security-hardening.md","content":"---\nid: sandbox-security-hardening\nparent: sandbox-command\ncreated: 2026-03-12T22:30:00Z\npriority: 1\nstatus: done\ndepends-on: sandbox-command-routing\nbranch: feature/sandbox-command\n---\n\n# Sandbox Security Hardening\n\n## Requirement\n\nSandboxes must be hardened before any credentials are deployed to them. The provisioning flow in cloud-init and the create workflow must ensure the box is locked down first, then credentials are injected.\n\n## Success Criteria\n\n### SSH hardening (cloud-init.yaml)\n- `PermitRootLogin` is set to `prohibit-password` (key-only, no password root login)\n- `PasswordAuthentication` is set to `no` for all users\n- SSHD is restarted after config changes\n- fail2ban is installed and enabled with default SSH jail active\n\n### Credential protection (cloud-init.yaml + create.js)\n- `/etc/spekk/` directory is created with permissions `700`, owned by `agent:agent`\n- `/etc/spekk/agent.env` is written with permissions `600`, owned by `agent:agent`\n- The systemd unit runs as `User=agent`, so only the agent process can read its own credentials\n- Root can still read the file (as root), but no other users can\n- The `NOPASSWD` sudo grant is removed from the agent user — agent does not need sudo after provisioning\n\n### Provisioning order (create.js)\n- Security hardening steps in cloud-init run before the `.provisioned` marker is written\n- `injectCredentials` in create.js writes agent.env owned by `agent:agent` with mode `600` (not root-owned)\n- `configureGitCredentials` writes `.git-credentials` with mode `600` under the agent user's home directory (already the case, but verify)\n\n### Docker isolation\n- Docker socket access is restricted to the `docker` group (default, but agent user should only be in the docker group if needed)\n","branch":"feature/sandbox-command","dependsOn":"sandbox-command-routing","created":"2026-03-12T22:30:00Z"},{"id":"sandbox-ssh","parent":"sandbox-command","title":"Sandbox SSH","status":"done","priority":2,"file":"specs/sandbox-command/assertions/sandbox-ssh.md","content":"---\nid: sandbox-ssh\nparent: sandbox-command\ncreated: 2026-03-12T18:00:00Z\npriority: 2\nstatus: done\nbranch: feature/sandbox-command\ndepends-on: sandbox-metadata-store\n---\n\n# Sandbox SSH\n\n## Requirement\n\n`spekk sandbox ssh \u003cname\u003e` opens an interactive SSH session to the sandbox droplet.\n\n## Success Criteria\n\n- `spekk sandbox ssh \u003cname\u003e` looks up the sandbox IP from the local store\n- Spawns `ssh root@\u003cip\u003e` as an interactive child process using `child_process.spawn` with `stdio: 'inherit'`\n- Exits with the same exit code as the SSH process\n- If the sandbox name is not found, prints an error and exits with code 1\n- Passes through any additional flags after the name to the SSH command (e.g., `spekk sandbox ssh agent-1 -L 8080:localhost:8080`)\n","branch":"feature/sandbox-command","dependsOn":"sandbox-metadata-store","created":"2026-03-12T18:00:00Z"},{"id":"sandbox-token-generator","parent":"sandbox-command","title":"Sandbox Token Generator","status":"done","priority":1,"file":"specs/sandbox-command/assertions/sandbox-token-generator.md","content":"---\nid: sandbox-token-generator\nparent: sandbox-command\ncreated: 2026-03-13T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# Sandbox Token Generator\n\n`src/sandbox/tokens.js` exists and exports a `generateAgentToken()` function that produces cryptographically random, URL-safe tokens in a consistent format.\n\n## Success Criteria\n\n- `src/sandbox/tokens.js` exports `generateAgentToken()`\n- Uses Node.js built-in `crypto.randomBytes(32).toString('base64url')`\n- Returns a 43-character URL-safe base64 string (no padding, no `=`)\n- Format matches existing tokens like `aB6Ye_fia5UH8k1KGTbpoPzDtYfaPqyiTcfsxR6X9EE`\n- Unit test in `src/sandbox/__tests__/tokens.test.js` verifies:\n  - Length is 43 characters\n  - Only contains `[A-Za-z0-9_-]` characters\n  - Two calls return different values\n","branch":"main","created":"2026-03-13T00:00:00Z"},{"id":"sandbox-go-deploy","parent":"sandbox-go-release","title":"Sandbox Deploy Uses Go Binary","status":"done","priority":1,"file":"specs/sandbox-go-release/assertions/sandbox-go-deploy.md","content":"---\nid: sandbox-go-deploy\nparent: sandbox-go-release\ncreated: 2026-04-01T00:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-go-release\ndepends-on: sandbox-release-downloader\n---\n\n# Sandbox Deploy Uses Go Binary\n\nBoth `sandbox create` and `sandbox deploy` use a single shared function to deploy the Go agent binary. No Python, uv, or venv steps remain.\n\n## Success Criteria\n\n- `src/sandbox/agent.js` exports `deployAgent(ip, artifacts?)` which:\n  - Uses provided `artifacts` or calls `fetchReleaseArtifacts()` to get the binary path and version\n  - rsyncs the binary to `root@{ip}:/opt/spekk/agent-client`\n  - SSHes to set `chmod +x /opt/spekk/agent-client`\n  - Creates `/var/log/spekk` with `agent:agent` ownership\n  - Writes the Go systemd unit file to `/etc/systemd/system/spekk-agent.service` (replacing any legacy Python unit), with stdout/stderr logging to `/var/log/spekk/agent.log`\n  - SSHes to run `systemctl daemon-reload \u0026\u0026 systemctl restart spekk-agent`\n  - Prints the deployed version (e.g. `Agent v1.2.3 deployed`)\n- `src/sandbox/create.js` calls `deployAgent(ip, releaseArtifacts)` instead of the inline `deployAgentClient` function, reusing artifacts already fetched for cloud-init\n- `src/sandbox/deploy.js` calls `deployAgent(ip)` instead of its inline deploy logic\n- `src/sandbox/create.js` passes `cloudInitPath` (from `fetchReleaseArtifacts()`) to `createDroplet` as user data instead of reading the bundled template\n- No calls to `uv`, `pip`, or `websockets` remain in any sandbox source file\n- `src/sandbox/templates/cloud-init.yaml` does not exist\n","branch":"feature/sandbox-go-release","dependsOn":"sandbox-release-downloader","created":"2026-04-01T00:00:00Z"},{"id":"sandbox-release-downloader","parent":"sandbox-go-release","title":"Sandbox Artifacts Are Downloaded from spekk-app GitHub Release","status":"done","priority":1,"file":"specs/sandbox-go-release/assertions/sandbox-release-downloader.md","content":"---\nid: sandbox-release-downloader\nparent: sandbox-go-release\ncreated: 2026-04-01T00:00:00Z\npriority: 1\nstatus: done\nbranch: feature/sandbox-go-release\n---\n\n# Sandbox Artifacts Are Downloaded from spekk-app GitHub Release\n\n`src/sandbox/release.js` fetches the sandbox binary and cloud-init template from a spekk-app GitHub Release. No infrastructure files are bundled in this repo.\n\n## Success Criteria\n\n- `src/sandbox/release.js` exports `fetchReleaseArtifacts(tag = 'latest')` which:\n  - Fetches the release from `GET /repos/spekk-ai/spekk-app/releases/tags/{tag}` (or `/releases/latest` when tag is `'latest'`)\n  - Uses `GITHUB_TOKEN` from env for auth (already required for other sandbox commands)\n  - Downloads two assets by name: `sandbox` (binary) and `cloud-init.yaml` using the GitHub API asset endpoint (`/releases/assets/{id}` with `Accept: application/octet-stream`) — not `browser_download_url`, which drops auth on redirect for private repos\n  - Writes both to temp files and returns `{ binaryPath, cloudInitPath, version }` where `version` is the release tag name\n  - Prints a clear error with HTTP status and exits if the release or either asset is not found\n- `src/sandbox/templates/cloud-init.yaml` does not exist — it is no longer bundled\n- `src/sandbox/templates.js` does not export `fetchAgentClient()` — that function is removed\n\n**Tests:** src/sandbox/__tests__/release.test.js\n","branch":"feature/sandbox-go-release","created":"2026-04-01T00:00:00Z"},{"id":"publish-workflow-uses-self-hosted-runner","parent":"self-hosted-gh-runners","title":"Publish Workflow Uses Self-Hosted Runner","status":"done","priority":1,"file":"specs/self-hosted-gh-runners/assertions/publish-workflow-uses-self-hosted-runner.md","content":"---\nid: publish-workflow-uses-self-hosted-runner\nparent: self-hosted-gh-runners\ncreated: 2026-03-10T00:00:00Z\npriority: 1\nstatus: done\nbranch: feature/self-hosted-runners\n---\n\n# Publish Workflow Uses Self-Hosted Runner\n\n`.github/workflows/publish.yml` runs on the self-hosted DO droplet runner inside a Node container.\n\n## Success Criteria\n\n- `runs-on` is `[self-hosted, linux]` (not `ubuntu-latest`)\n- `container.image` is `node:20-slim`\n- All existing publish steps are preserved (npm ci, npm test, npm pack, GemFury upload)\n","branch":"feature/self-hosted-runners","created":"2026-03-10T00:00:00Z"},{"id":"test-workflow-uses-self-hosted-runner","parent":"self-hosted-gh-runners","title":"Test Workflow Uses Self-Hosted Runner","status":"done","priority":1,"file":"specs/self-hosted-gh-runners/assertions/test-workflow-uses-self-hosted-runner.md","content":"---\nid: test-workflow-uses-self-hosted-runner\nparent: self-hosted-gh-runners\ncreated: 2026-03-10T00:00:00Z\npriority: 1\nstatus: done\nbranch: feature/self-hosted-runners\n---\n\n# Test Workflow Uses Self-Hosted Runner\n\n`.github/workflows/test.yml` runs on the self-hosted DO droplet runner inside a Node container.\n\n## Success Criteria\n\n- `runs-on` is `[self-hosted, linux]` (not `ubuntu-latest`)\n- `container.image` is `node:20-slim`\n- All existing test steps are preserved\n","branch":"feature/self-hosted-runners","created":"2026-03-10T00:00:00Z"},{"id":"atomic-binary-replace","parent":"self-update","title":"The Running Binary Is Replaced Atomically","status":"done","priority":1,"file":"specs/self-update/assertions/atomic-binary-replace.md","content":"---\nid: atomic-binary-replace\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# The Running Binary Is Replaced Atomically\n\n## Description\n\nThe update never leaves the user with a half-written `spekk` binary. The new\nbinary is staged as a temp file next to the target and swapped in with a\nrename.\n\n## Success Criteria\n\n- The target path is the real location of the running binary:\n  `os.Executable()` resolved through symlinks with `filepath.EvalSymlinks`\n- The downloaded binary is written to a temp file (`.spekk-update-*`) in the\n  same directory as the target, so the final `os.Rename` is atomic\n  (no cross-filesystem move)\n- On non-Windows platforms the temp file is chmodded `0755` before the\n  rename, so the installed binary stays executable\n- On Windows, where the running binary cannot be overwritten, the old binary\n  is first renamed to `\u003cpath\u003e.old`, then the temp file is renamed into place\n- On any failure path the temp file is removed; the existing binary is left\n  untouched if the swap never happened\n- After a successful swap, \"Updated successfully: \u003cold\u003e → \u003cnew\u003e\" is printed\n\n**Tests:** `TestDownloadAndReplace` in `internal/update/update_test.go`\n(verifies content replacement and the executable bit).\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"check-flag-previews-without-installing","parent":"self-update","title":"`spekk update --check` Previews Without Installing","status":"done","priority":2,"file":"specs/self-update/assertions/check-flag-previews-without-installing.md","content":"---\nid: check-flag-previews-without-installing\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 2\nstatus: done\n---\n\n# `spekk update --check` Previews Without Installing\n\n## Description\n\nUsers can find out whether an update is available without changing anything\non disk. `--check` performs only the API query — no asset download, no file\nwrites.\n\n## Success Criteria\n\n- `spekk update --check` queries the Releases API and compares versions\n- When a newer version exists, it prints the current version, the latest\n  version, and the hint to run `spekk update` to install\n- When already up to date, it prints \"Already on latest version (\u003cversion\u003e)\"\n- In check mode the binary on disk is never modified and no release asset is\n  downloaded\n- Exit code is 0 in both outcomes (an available update is not an error)\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"checks-github-releases-api","parent":"self-update","title":"Update Checks the GitHub Releases API Without Authentication","status":"done","priority":1,"file":"specs/self-update/assertions/checks-github-releases-api.md","content":"---\nid: checks-github-releases-api\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# Update Checks the GitHub Releases API Without Authentication\n\n## Description\n\n`spekk update` discovers the latest version by querying the public GitHub\nReleases API. No token, login, or other credentials are required — the same\nzero-auth posture as `install.sh`.\n\n## Success Criteria\n\n- Latest release fetched from\n  `https://api.github.com/repos/spekk-ai/spekk-cli/releases/latest` with\n  `Accept: application/vnd.github+json`\n- No `Authorization` header is sent on the API request or the asset download\n- The latest version is read from the release `tag_name` with any leading `v`\n  stripped; an empty tag yields a \"no releases found\" error\n- Network errors and non-200 API responses surface as clear errors\n  (status code and response body included), wrapped as\n  \"failed to check for updates\"\n- HTTP client is injectable (`update.Client`) so tests run without real\n  network access\n\n**Tests:** `TestFetchLatestRelease`, `TestFetchLatestReleaseAPIError` in\n`internal/update/update_test.go` (both verify the absence of an\n`Authorization` header via an injected transport).\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"fail-fast-permission-error","parent":"self-update","title":"Permission Problems Fail Fast With an Actionable Message","status":"in_progress","priority":1,"file":"specs/self-update/assertions/fail-fast-permission-error.md","content":"---\nid: fail-fast-permission-error\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 1\nstatus: in_progress\nbranch: fix/update-permission-message\n---\n\n# Permission Problems Fail Fast With an Actionable Message\n\n## Description\n\nWhen spekk was installed into a root-owned directory (e.g. `/usr/local/bin`\nvia a sudo install), `spekk update` cannot write the new binary. This must\nfail *before* downloading anything, and the error must tell the user exactly\nwhat to do.\n\nImplemented in PR #114 (`fix/update-permission-message`); marked\n`in_progress` until that PR merges to main.\n\n## Success Criteria\n\n- The temp file in the target directory is created **before** the asset\n  download starts, so a non-writable install dir fails immediately rather\n  than after a wasted download\n- On a permission error (`os.IsPermission`) creating the temp file, the error\n  is exactly:\n  `no write permission for \u003cdir\u003e (spekk was likely installed with sudo) — try: sudo spekk update`\n  where `\u003cdir\u003e` is the directory containing the binary\n- Other temp-file creation failures still surface as\n  \"cannot create temp file: \u003ccause\u003e\"\n- Atomicity guarantees from `atomic-binary-replace` are unchanged: temp file\n  in the same directory, rename to swap, temp file removed on every error\n  path\n\n## Notes\n\nAuto-escalating to sudo from inside the binary was considered and rejected;\nthe long-term fix is installing to a user-owned directory by default (see\n`specs/install-script/`, assertion `default-install-dir-user-owned`).\n","branch":"fix/update-permission-message","created":"2026-06-12T00:00:00Z"},{"id":"platform-asset-naming","parent":"self-update","title":"Update Selects the Correct Platform Asset","status":"done","priority":2,"file":"specs/self-update/assertions/platform-asset-naming.md","content":"---\nid: platform-asset-naming\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 2\nstatus: done\n---\n\n# Update Selects the Correct Platform Asset\n\n## Description\n\nThe updater downloads the release asset matching the running platform, using\nthe same naming scheme the release pipeline and `install.sh` use.\n\n## Success Criteria\n\n- Expected asset name is `spekk-{goos}-{goarch}` (e.g. `spekk-darwin-arm64`,\n  `spekk-linux-amd64`), computed by `AssetName(runtime.GOOS, runtime.GOARCH)`\n- On Windows the name carries an `.exe` suffix (`spekk-windows-amd64.exe`)\n- The asset is matched by exact name against the release's asset list and\n  downloaded via its `browser_download_url` with\n  `Accept: application/octet-stream`\n- If the release has no asset for the current platform, the error names the\n  platform and the release tag\n  (\"no binary found for \u003cgoos\u003e/\u003cgoarch\u003e in release \u003ctag\u003e\")\n\n**Tests:** `TestAssetName` in `internal/update/update_test.go`.\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"refuses-dev-build","parent":"self-update","title":"Update Refuses to Run on a Development Build","status":"done","priority":2,"file":"specs/self-update/assertions/refuses-dev-build.md","content":"---\nid: refuses-dev-build\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 2\nstatus: done\n---\n\n# Update Refuses to Run on a Development Build\n\n## Description\n\nA binary built from source without release ldflags reports\n`version.Version == \"dev\"`. Self-updating such a build would silently replace\na developer's working binary with a release, so `spekk update` refuses\nup front.\n\n## Success Criteria\n\n- When `version.Version` is `\"dev\"`, `spekk update` (and `--check`) returns\n  the error \"cannot update a development build; install a released version\n  first\" before making any network request\n- Released binaries are built with `-ldflags \"-X main.version=\u003ctag\u003e\"`\n  (publish.yml), so installed binaries report a real version and remain\n  updatable\n\n**Tests:** `TestRunDevBuild` in `internal/update/update_test.go`.\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"semantic-version-comparison","parent":"self-update","title":"Versions Are Compared Semantically, Not Lexically","status":"done","priority":1,"file":"specs/self-update/assertions/semantic-version-comparison.md","content":"---\nid: semantic-version-comparison\nparent: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# Versions Are Compared Semantically, Not Lexically\n\n## Description\n\nThe update decision uses numeric, component-wise version comparison\n(`ParseVersion` / `IsNewer` in `internal/update/update.go`), so `1.10.0` is\ncorrectly newer than `1.9.9` and an update only happens when the remote\nversion is strictly newer.\n\n## Success Criteria\n\n- `ParseVersion` accepts versions with or without a leading `v`\n  (`1.2.3`, `v1.2.3`) and splits them into numeric components\n- Anything after the first `-` is ignored (`1.2.3-dirty` → `1.2.3`)\n- Non-numeric input (e.g. `dev`) parses as `[0]` rather than panicking\n- `IsNewer(a, b)` is true only when `a` is strictly newer: component-wise\n  numeric comparison, missing components treated as `0`\n  (`1.1.0 \u003e 1.0.0`, `2.0.0 \u003e 1.9.9`, `1.0.0` vs `1.0.0` → false)\n- When the latest release is not newer than the running version,\n  `spekk update` prints \"Already on latest version (\u003cversion\u003e)\" and exits\n  successfully without downloading anything\n\n**Tests:** `TestParseVersion`, `TestIsNewer` in\n`internal/update/update_test.go`.\n","branch":"main","created":"2026-06-12T00:00:00Z"},{"id":"console-status-format","parent":"simplified-display-formatting","title":"Console Status Display Format","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/console-status-format.md","content":"---\nid: console-status-format\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:31:00Z\npriority: 2\nstatus: done\n---\n\n# Console Status Display Format\n\nThe `spekk status` command displays specs and assertions with simplified formatting.\n\n## What Must Be True\n\nConsole output shows status and priority in the format: `{priority} {status_icon} {title}`\n\n### Spec Lines Format\n- Spec display: `{priority} {status_icon} {spec_title} (x/y assertions complete)`\n- No text labels like \"Done\", \"In Progress\" \n- No priority emojis like 🔥, ⚠️, 💡\n\n### Assertion Lines Format  \n- Assertion display: `  {priority} {status_icon} {assertion_title}`\n- Indented with 2 spaces\n- No text labels on status\n- No emoji decorations on priority\n\n### Next Priority Item Format\n- Status line shows: `Status: {status_icon}` (no text label)\n- Priority shows number only\n\n## Success Criteria\n\n- ✅ Run `spekk status` and verify format matches specification\n- ✅ Spec lines show: `1 ✅ Example Spec (2/3 assertions complete)`\n- ✅ Assertion lines show: `  2 🚧 Example Assertion`\n- ✅ Next item shows: `Status: ✅` (not `Status: ✅ done`)","branch":"main","created":"2026-01-22T22:31:00Z"},{"id":"fix-all-failing-tests","parent":"simplified-display-formatting","title":"Fix All Failing Tests for Simplified Format","status":"done","priority":1,"file":"specs/simplified-display-formatting/assertions/fix-all-failing-tests.md","content":"---\nid: fix-all-failing-tests\nparent: simplified-display-formatting\ncreated: 2026-01-22T23:05:00Z\npriority: 1\nstatus: done\n---\n\n# Fix All Failing Tests for Simplified Format\n\nMultiple test suites are failing because they expect old behavior that was changed by our simplified formatting specs.\n\n## What Must Be True\n\nAll tests pass by updating expectations to match the new simplified format requirements.\n\n### Failing Test Categories\n\n1. **Priority Algorithm Tests** - Expecting 'not-started-assertion' but getting 'fix-javascript-template-errors'\n   - Update test data to use proper status values that match current spec state\n   - Ensure test assertions have 'not_started' status, not 'in_progress'\n\n2. **Web Interface Detail Badges Format Tests** - Expecting old badge HTML format\n   - Update tests to expect simplified badge format without text labels\n   - Status badges should contain only icons, not text\n   - Priority badges should contain only numbers, not emojis\n\n3. **JavaScript Template Errors Tests** - Backtick escaping test failing  \n   - Update test to verify proper escaping of backticks in generated HTML\n   - Ensure HTML content with backticks doesn't break JavaScript\n\n### Test File Updates Required\n\n- `src/parser/__tests__/priority-algorithm.test.js` - Fix priority algorithm expectations\n- `src/parser/__tests__/spec-parser.test.js` - Fix priority algorithm expectations  \n- `src/__tests__/web-detail-badges-format.test.js` - Fix badge format expectations\n- `src/__tests__/fix-javascript-template-errors.test.js` - Fix backtick escaping test\n\n### Test Data Status Alignment\n\nTests should use assertion status values that align with current spec state:\n- Created assertions with 'in_progress' status affect priority algorithm tests\n- Test data needs to reflect that builder has completed many assertions\n- Mock data should have proper 'not_started' vs 'in_progress' vs 'done' states\n\n## Success Criteria\n\n- ✅ All tests pass: `npm test` returns 0 exit code\n- ✅ Priority algorithm tests pick correct next assertion\n- ✅ Badge format tests expect simplified HTML structure  \n- ✅ JavaScript template tests verify proper character escaping\n- ✅ Test expectations match implemented simplified format requirements","branch":"main","created":"2026-01-22T23:05:00Z"},{"id":"fix-javascript-template-errors","parent":"simplified-display-formatting","title":"Fix JavaScript Template Generation Errors","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/fix-javascript-template-errors.md","content":"---\nid: fix-javascript-template-errors\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:58:00Z\npriority: 2\nstatus: done\n---\n\n# Fix JavaScript Template Generation Errors\n\nThe spekk show command should eliminate JavaScript escaping issues by using modern event delegation instead of inline event handlers.\n\n## What Must Be True\n\nGenerated HTML contains valid JavaScript without syntax errors by avoiding inline event handlers and using data attributes instead.\n\n### Previous Problems (Now Eliminated)\n\n1. ~~**\"Unexpected token '{'\"\"** - Template literal syntax issue~~ → **Solved by removing inline handlers**\n2. ~~**Quote escaping in onclick attributes**~~ → **Solved by using data attributes** \n3. **Missing JavaScript functions** - `toggleSpec` and `showDetail` functions still needed\n\n### New Approach: Event Delegation\n\n- **Replace all inline onclick handlers** with data attributes\n- **Use single document event listener** for all interactions\n- **No more string escaping issues** - data attributes are safe for any content\n- **Include JavaScript functions** (toggleSpec, showDetail) but called via event delegation\n\n### Required Implementation\n\n**Replace this pattern:**\n```html\nonclick=\"toggleSpec('spec-parser', event)\"\nonclick=\"showDetail('assertion-id', 'assertion', event)\" \n```\n\n**With this pattern:**\n```html\ndata-action=\"toggle-spec\" data-spec-id=\"spec-parser\"\ndata-action=\"show-detail\" data-assertion-id=\"assertion-id\"\n```\n\n### Test Cases\n\nGenerated HTML should work correctly when specs contain any characters:\n- Single quotes in titles: `User's Dashboard`  \n- Double quotes in content: `\"quoted text\"`\n- Backticks in code: `` `code example` ``\n- Curly braces: `{example: value}`\n- **No escaping needed** - data attributes handle all content safely\n\n**Tests:** src/__tests__/fix-javascript-template-errors.test.js\n\n## Success Criteria\n\n- ✅ Run `spekk show` and generated HTML has no JavaScript console errors\n- ✅ `toggleSpec` and `showDetail` functions are defined and working \n- ✅ All HTML uses data attributes instead of inline onclick handlers\n- ✅ Event delegation handles all user interactions via document listener\n- ✅ Click handlers work correctly regardless of special characters in spec data\n- ✅ No inline event handlers exist in generated HTML\n- ✅ Data attributes safely handle any spec content without escaping issues","branch":"main","created":"2026-01-22T22:58:00Z"},{"id":"fixed-width-markdown-font","parent":"simplified-display-formatting","title":"Fixed-Width Font for Markdown Content","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/fixed-width-markdown-font.md","content":"---\nid: fixed-width-markdown-font\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:50:00Z\npriority: 2\nstatus: done\n---\n\n# Fixed-Width Font for Markdown Content\n\nSpec and assertion markdown content should use a fixed-width font for better readability and code-like formatting.\n\n## What Must Be True\n\nDetail panel markdown content uses monospace font family for consistent character spacing.\n\n### Font Family Requirements\n\n- **Primary font:** Consolas (Windows/Office)\n- **Fallback fonts:** Monaco, 'Courier New', monospace\n- Apply to all markdown content in detail view\n- Maintain readability while providing fixed-width spacing\n\n### CSS Target\n\n`.detail-body` and `.detail-body pre` elements should use:\n```css\nfont-family: Consolas, Monaco, 'Courier New', monospace;\n```\n\n### Content Areas Affected\n\n- Spec descriptions and content\n- Assertion descriptions and success criteria  \n- All markdown text in the detail panel\n- Preserve existing `\u003cpre\u003e` tag styling but with better font\n\n## Success Criteria\n\n- ✅ Run `spekk show` and click on any spec/assertion\n- ✅ Markdown content displays in fixed-width font (Consolas/Monaco)\n- ✅ Text remains readable with proper line spacing\n- ✅ Code blocks and regular text both use monospace font","branch":"main","created":"2026-01-22T22:50:00Z"},{"id":"highlight-active-states","parent":"simplified-display-formatting","title":"Highlight Active Status States","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/highlight-active-states.md","content":"---\nid: highlight-active-states\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:37:00Z\npriority: 2\nstatus: done\n---\n\n# Highlight Active Status States\n\nFailed and in-progress specs should be the most visually prominent to draw attention to active work.\n\n## What Must Be True\n\nStatus styling emphasizes items that need attention while keeping completed items subtle.\n\n### In-Progress Status Styling\n- `.status-in_progress` uses soft yellow color scheme\n- Background: soft yellow (#fef3c7 or similar warm tone)\n- Text/border: darker yellow for contrast\n- Keeps pulsing animation to indicate active work\n- Animation: `pulse-yellow` with warm yellow glow effect\n\n### Failed Status Styling  \n- `.status-failed` (if applicable) uses attention-grabbing red\n- Should be most prominent of all status states\n- Clear visual indicator that requires immediate action\n\n### Completed Status Styling\n- `.status-done` remains subtle green\n- Less visually prominent than active states\n- Indicates completion without demanding attention\n\n### Not Started Status Styling\n- `.status-not_started` remains neutral\n- Minimal visual weight until work begins\n\n## Success Criteria\n\n- ✅ In-progress items use soft yellow with pulsing animation\n- ✅ Failed items (if any) are most visually prominent  \n- ✅ Completed items are subtle and don't compete for attention\n- ✅ Active states clearly stand out in the interface","branch":"main","created":"2026-01-22T22:37:00Z"},{"id":"ignore-readme-files","parent":"simplified-display-formatting","title":"Ignore Markdown Files Without Frontmatter","status":"done","priority":1,"file":"specs/simplified-display-formatting/assertions/ignore-readme-files.md","content":"---\nid: ignore-readme-files\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:45:00Z\npriority: 1\nstatus: done\n---\n\n# Ignore Markdown Files Without Frontmatter\n\nThe parser crashes on any .md file without YAML frontmatter. Files without frontmatter are NOT specs and should be silently ignored.\n\n## What Must Be True\n\nParser silently skips any .md file that doesn't start with YAML frontmatter.\n\n### Simple Rule\n\n**If a .md file doesn't start with `---`, skip it entirely.**\n\n- No error thrown for missing frontmatter\n- File is completely ignored during parsing\n- Only files with proper `---` YAML frontmatter are parsed as specs/assertions\n\n### Examples to Ignore\n\n- README.md, docs.md, notes.md (no frontmatter)\n- Any .md file without `---` at the start\n- Documentation files mixed in specs directories\n\n### Error Prevention\n\n- `spekk builder` should work even with README files present\n- Parser should not require YAML frontmatter on documentation files\n- Builder loops should not crash on mixed content in specs directories\n\n## Success Criteria\n\n- ✅ Parser skips any .md file not starting with `---`  \n- ✅ `spekk builder` works in `/Users/william/thinknimble/spekk/` without crashes\n- ✅ No error thrown for files without YAML frontmatter\n- ✅ README.md and other docs are silently ignored\n\n**Tests:** src/parser/__tests__/ignore-readme-files.test.js","branch":"main","created":"2026-01-22T22:45:00Z"},{"id":"project-name-in-title","parent":"simplified-display-formatting","title":"Include Project Name in Page Title","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/project-name-in-title.md","content":"---\nid: project-name-in-title\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:55:00Z\npriority: 2\nstatus: done\n---\n\n# Include Project Name in Page Title\n\nBrowser tab title should show which project the spekk explorer is for when multiple projects are open.\n\n## What Must Be True\n\nPage title includes the current project's directory name to distinguish between different spekk explorers.\n\n### Title Format\n\n- **Current:** \"Spec Explorer - Spekk\"\n- **New:** \"Spec Explorer - {project-name}\"\n\n### Examples\n\n- `~/thinknimble/spekk-cli/` → \"Spec Explorer - spekk-cli\"\n- `~/thinknimble/spekk/` → \"Spec Explorer - spekk\"\n- `~/my-project/` → \"Spec Explorer - my-project\"\n\n### Implementation\n\n- Derive project name from `process.cwd()` - use the last directory segment\n- Update both `\u003ctitle\u003e` tag and page he
