es (status → done/failed)\n2. Update YAML frontmatter:\n   ```yaml\n   status: done\n   # locked-by field MUST be removed\n   ```\n3. Commit immediately\n4. **CRITICAL:** Builders MUST remove `locked-by` when done, otherwise assertion stays locked forever\n\n**Parallel safety:**\n- Builder A claims assertion-1\n- Builder B runs `spekk next` → gets assertion-2 (assertion-1 is locked)\n- No conflicts!\n\n## Lock Format\n\n```\nlocked-by: builder-{hostname}-{pid}-{timestamp}\n```\n\nExample: `builder-macbook-pro-98765-1706210400`\n\nComponents:\n- `builder-` prefix (for clarity)\n- Hostname (identifies machine)\n- Process ID (uniqueness within machine)\n- Unix timestamp (for stale lock detection)\n\n## Stale Lock Detection\n\nIf current time - lock timestamp \u003e 2 hours (7200 seconds):\n- Lock is considered stale\n- `spekk next` ignores the lock\n- Allows recovery from crashed builders\n\n## Implementation Notes\n\n- Parser already handles arbitrary frontmatter fields\n- Add `lockedBy` to parser output alongside `status`, `priority`, etc.\n- Builder needs to:\n  - Generate lock ID on startup\n  - Write lock when claiming work\n  - Remove lock on completion\n  - Handle git conflicts gracefully\n- Backwards compatible: assertions without `locked-by` work as before\n\n**Tests:** `src/parser/__tests__/locked-by-field.test.js`\n","branch":"feature/spec-parser","dependsOn":"identifies-next-priority","created":"2026-02-25T19:30:00Z"},{"id":"no-implementation-outside-app","parent":"spec-parser","title":"All Code Lives in src/","status":"done","priority":1,"file":"specs/spec-parser/assertions/no-implementation-outside-app.md","content":"---\nid: no-implementation-outside-app\nparent: spec-parser\ncreated: 2026-01-20T18:50:00Z\npriority: 1\nstatus: done\nbranch: feature/spec-parser\n---\n\n# All Code Lives in src/\n\n## What Must Be True\n\n**All implementation code lives under the `src/` directory.**\n\nThe project uses standard CLI structure with `src/` for implementation and `bin/` for CLI entry points.\n\n## Directory Structure Required\n\n```\nsrc/\n├── parser/          # Parser implementation\n│   ├── index.js     # Core logic\n│   ├── cli.js       # CLI interface\n│   └── __tests__/   # Tests (optional)\n├── coach/           # Coach implementation\n│   ├── index.js\n│   └── cli.js\n└── builder/         # Builder implementation\n    ├── index.js\n    └── cli.js\n\nbin/\n└── spekk.js        # Main CLI entry point\n```\n\n## CLI Entry Points\n\n**Package.json scripts:**\n```json\n{\n  \"scripts\": {\n    \"next\": \"node src/parser/cli.js\",\n    \"coach\": \"node src/coach/cli.js\",\n    \"builder\": \"node src/builder/cli.js\"\n  },\n  \"bin\": {\n    \"spekk\": \"./bin/spekk.js\"\n  }\n}\n```\n\n**Direct invocation:**\n```bash\nnode src/parser/cli.js\n# or\n./bin/spekk.js next\n```\n\n## Tests Location\n\nTests should live co-located with code using `__tests__/` convention:\n- `src/parser/__tests__/parser.test.js`\n- `src/**/__tests__/*.test.js`\n\n## Success Criteria\n\n- ✅ All implementation code lives in `src/`\n- ✅ CLI entry point exists in `bin/spekk.js`\n- ✅ Module CLIs exist as `src/*/cli.js` files\n- ✅ Parser works via `npm run next`\n- ✅ Main CLI works via `spekk` command\n- ✅ No code scattered in random locations\n","branch":"feature/spec-parser","created":"2026-01-20T18:50:00Z"},{"id":"outputs-valid-json","parent":"spec-parser","title":"Parser Must Output Valid JSON","status":"done","priority":2,"file":"specs/spec-parser/assertions/outputs-valid-json.md","content":"---\nid: outputs-valid-json\nparent: spec-parser\ncreated: 2026-01-20T16:20:00Z\npriority: 2\nstatus: done\ndepends-on: parses-frontmatter\nbranch: feature/spec-parser\n---\n\n# Parser Must Output Valid JSON\n\n## What Must Be True\n\nThe parser must output well-formed, machine-readable JSON to stdout.\n\n## Output Format\n\n### Success Case (work item found)\n```json\n{\n  \"type\": \"assertion\",\n  \"id\": \"validates-required-fields\",\n  \"parent\": \"spec-parser\",\n  \"file\": \"specs/spec-parser/assertions/validates-required-fields.md\",\n  \"priority\": 1,\n  \"status\": \"not_started\",\n  \"title\": \"Parser Must Validate Required Fields\",\n  \"content\": \"... full markdown content including frontmatter ...\",\n  \"spec\": {\n    \"id\": \"spec-parser\",\n    \"file\": \"specs/spec-parser/spec-parser.md\",\n    \"title\": \"Spec Parser\"\n  }\n}\n```\n\n### All Complete Case\n```json\n{\n  \"status\": \"complete\",\n  \"message\": \"All specifications are complete\"\n}\n```\n\n### No Specs Found Case\n```json\n{\n  \"status\": \"empty\",\n  \"message\": \"No specifications found in specs/ directory\"\n}\n```\n\n### Error Case\n```json\n{\n  \"error\": true,\n  \"message\": \"Missing required field 'id' in specs/foo/bar.md\",\n  \"file\": \"specs/foo/bar.md\"\n}\n```\n\n## Field Requirements\n\n**Required fields (success case):**\n- `type` - Always \"assertion\" for next work item\n- `id` - The assertion's id\n- `parent` - The parent spec's id\n- `file` - Relative path to assertion file\n- `priority` - The assertion's priority\n- `status` - Current status\n- `title` - Extracted from markdown H1 heading\n- `content` - Full file content (for context)\n- `spec` - Object with parent spec metadata\n\n## JSON Validation\n\nOutput must:\n- Be valid JSON (parseable by `JSON.parse()`)\n- Be a single JSON object (not an array, not multiple objects)\n- Use consistent field names\n- Include all required fields\n- Use correct types (strings for text, numbers for priority)\n- Be written to stdout (not stderr)\n\n## Error Handling\n\nErrors should also be JSON:\n- Include `error: true` field\n- Include `message` with clear description\n- Include `file` if error relates to specific file\n- Write to stdout (not stderr) so ralph-loop can parse it\n\n## Success Criteria\n\n- ✅ Parser outputs valid, parseable JSON\n- ✅ JSON includes all required fields\n- ✅ JSON uses correct types\n- ✅ Output goes to stdout\n- ✅ Errors are also JSON format\n- ✅ Single JSON object per execution (not streaming/multiple)\n\n**Tests:** `src/parser/__tests__/spec-parser.test.js`\n","branch":"feature/spec-parser","dependsOn":"parses-frontmatter","created":"2026-01-20T16:20:00Z"},{"id":"parent-status-synchronization","parent":"spec-parser","title":"Parser Must Synchronize Parent Spec Status with Child Assertions","status":"done","priority":1,"file":"specs/spec-parser/assertions/parent-status-synchronization.md","content":"---\nid: parent-status-synchronization\nparent: spec-parser\ncreated: 2026-01-22T20:00:00Z\npriority: 1\nstatus: done\ndepends-on: validates-status-values\nbranch: feature/spec-parser\n---\n\n# Parser Must Synchronize Parent Spec Status with Child Assertions\n\n**Tests:** src/parser/__tests__/parent-status-sync.test.js\n\n## What Must Be True\n\nParent spec files do NOT contain a `status` field in their YAML frontmatter. Parent status is always computed at runtime by the parser from child assertions. The parser must compute parent status during `parseAllSpecs()` and expose it in the returned data, regardless of whether the file contains a `status` field.\n\n## Status Synchronization Rules\n\n### Parent Status = \"failed\"\nWhen **any** child assertion has status `failed`, the parent spec gets `failed` status.\n- Takes priority over all other statuses\n- Indicates blocking issues that must be resolved\n\n### Parent Status = \"done\"  \nWhen **all** active child assertions have status `done`, the parent spec gets `done` status.\n- Draft assertions are ignored (not counted as active)\n- Only applies when no children are failed\n\n### Parent Status = \"in_progress\"\nWhen **any** active child assertions have status `in_progress` or `not_started`, the parent spec gets `in_progress` status.\n- Only applies when no children are failed\n- Only applies when not all children are done\n\n### Parent Status = \"not_started\"\nWhen there are **no active child assertions**, the parent spec gets `not_started` status.\n- Applies when spec has no assertions at all\n- Applies when spec has only draft assertions\n\n## Draft Assertion Handling\n\nDraft assertions are excluded from parent status computation:\n- Parent with children: `[done, draft, done]` → Parent status: `done`\n- Parent with children: `[draft, draft]` → Parent status: `not_started`\n- Draft assertions don't affect parent status in any way\n\n## Priority Order\n\nParent status computation follows this priority:\n1. **failed** (any child failed → parent failed)\n2. **done** (all active children done → parent done)  \n3. **in_progress** (any active child incomplete → parent in_progress)\n4. **not_started** (no active children → parent not_started)\n\n## Implementation Details\n\nThe parser must:\n- Compute parent status automatically during `parseAllSpecs()`\n- Apply synchronization after all assertions are loaded\n- Use the `computeParentStatus()` function for consistency\n- If a parent spec file contains a `status` field (legacy), ignore/override it with the computed value\n\n## Success Criteria\n\n- ✅ Parent spec files do not contain a `status` field (coach agent enforces this)\n- ✅ Parent status automatically computed from child assertion statuses\n- ✅ Failed children force parent to failed status (highest priority)\n- ✅ All done children make parent done (when no failures)\n- ✅ Any incomplete children make parent in_progress\n- ✅ No active children make parent not_started\n- ✅ Draft children are excluded from status computation\n- ✅ Legacy `status` fields in parent files are overridden by computed status\n- ✅ Status computation happens automatically during parsing","branch":"feature/spec-parser","dependsOn":"validates-status-values","created":"2026-01-22T20:00:00Z"},{"id":"parser-handles-crlf-line-endings","parent":"spec-parser","title":"Parser handles CRLF line endings","status":"done","priority":1,"file":"specs/spec-parser/assertions/parser-handles-crlf-line-endings.md","content":"---\nid: parser-handles-crlf-line-endings\nparent: spec-parser\ncreated: 2026-03-16T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# Parser handles CRLF line endings\n\nSpec files with Windows-style CRLF line endings are parsed correctly. The frontmatter delimiter detection does not break when `\\r\\n` is present.\n\n## Success Criteria\n\n- Frontmatter parsing normalizes line endings before processing\n- A `.gitattributes` file enforces LF for `specs/**/*.md`\n","branch":"main","created":"2026-03-16T00:00:00Z"},{"id":"parser-script-exists","parent":"spec-parser","title":"Parser Module Must Exist and Work","status":"done","priority":1,"file":"specs/spec-parser/assertions/parser-script-exists.md","content":"---\nid: parser-script-exists\nparent: spec-parser\ncreated: 2026-01-20T16:05:00Z\npriority: 1\nstatus: done\nbranch: feature/spec-parser\n---\n\n# Parser Module Must Exist and Work\n\n## What Must Be True\n\nA working **Node.js parser module** must exist in `src/parser/` that:\n1. Reads spec folders from `specs/` directory\n2. Parses frontmatter from spec and assertion files\n3. Validates the format according to declared rules\n4. Identifies the next highest-priority incomplete assertion\n5. Outputs valid JSON to stdout\n\n## File Location\n\n```\nsrc/\n└── parser/\n    ├── index.js     # Core implementation\n    ├── cli.js       # CLI entry point\n    └── __tests__/   # Tests (optional)\n```\n\n## Expected Behavior\n\nWhen executed via npm script:\n```bash\nnpm run next\n```\n\nOr directly:\n```bash\nnode src/parser/cli.js\n```\n\nShould output JSON:\n```json\n{\n  \"type\": \"assertion\",\n  \"id\": \"enforces-folder-structure\",\n  \"parent\": \"spec-parser\",\n  \"file\": \"specs/spec-parser/assertions/enforces-folder-structure.md\",\n  \"priority\": 0,\n  \"status\": \"not_started\",\n  \"title\": \"Parser Must Enforce Folder Structure\",\n  \"content\": \"... full markdown content ...\"\n}\n```\n\n## Required Dependencies\n\n- Node.js runtime with ES modules support\n- Built-in YAML frontmatter parsing (no external dependencies required)\n- Should work with minimal dependencies\n\n## Success Criteria\n\nThis assertion is \"done\" when:\n- ✅ `src/parser/index.js` exists with core implementation\n- ✅ `src/parser/cli.js` exists with CLI entry point\n- ✅ Parser is executable via `npm run next`\n- ✅ Parser reads folder structure from `specs/`\n- ✅ Parser parses YAML frontmatter correctly\n- ✅ Parser identifies next priority assertion\n- ✅ Parser outputs valid JSON\n- ✅ Parser handles errors gracefully (malformed files, missing fields, etc.)\n- ✅ Parser runs in \u003c 100ms for typical spec count\n\n## Test Cases\n\nThe parser should handle:\n1. Empty `specs/` directory → output indicating no work to do\n2. All specs `done` → output indicating all complete\n3. Multiple specs with different priorities → return highest priority\n4. Malformed YAML → clear error message\n5. Missing required fields → validation error\n6. Duplicate IDs → detection and error\n\n## Implementation Notes\n\nThis is the bootstrap: we need this module to exist before we can be truly spec-driven. Once it works, the ralph-loop can use it to drive all subsequent work.\n","branch":"feature/spec-parser","created":"2026-01-20T16:05:00Z"},{"id":"parses-frontmatter","parent":"spec-parser","title":"Parser Must Parse YAML Frontmatter","status":"done","priority":1,"file":"specs/spec-parser/assertions/parses-frontmatter.md","content":"---\nid: parses-frontmatter\nparent: spec-parser\ncreated: 2026-01-20T16:25:00Z\npriority: 1\nstatus: done\ndepends-on: parser-script-exists\nbranch: feature/spec-parser\n---\n\n# Parser Must Parse YAML Frontmatter\n\n## What Must Be True\n\nThe parser must correctly parse YAML frontmatter from spec and assertion files.\n\n## Requirements\n\n### YAML Structure\n- Files MUST start with YAML frontmatter between `---` delimiters\n- YAML must be well-formed and parseable\n- Content after frontmatter is markdown\n\n### Expected Format\n```markdown\n---\nid: example-spec\ncreated: 2026-01-20T15:40:00Z\npriority: 1\n---\n\n# Spec Title\n\nMarkdown content here...\n```\n\n### Error Handling\nParser should handle and report errors for:\n- Missing frontmatter delimiters\n- Malformed YAML syntax\n- Invalid YAML structure\n- Files that don't start with frontmatter\n\n### Success Criteria\n\n- ✅ Parser extracts YAML frontmatter correctly\n- ✅ Parser separates frontmatter from markdown content  \n- ✅ Parser handles well-formed YAML\n- ✅ Parser reports clear errors for malformed YAML\n- ✅ Parser works with both spec and assertion files\n\n**Tests:** `src/parser/__tests__/spec-parser.test.js`","branch":"feature/spec-parser","dependsOn":"parser-script-exists","created":"2026-01-20T16:25:00Z"},{"id":"sidecar-test-runner","parent":"spec-parser","title":"Sidecar Test Runner Exists","status":"done","priority":1,"file":"specs/spec-parser/assertions/sidecar-test-runner.md","content":"---\nid: sidecar-test-runner\nparent: spec-parser\ncreated: 2026-01-20T19:35:00Z\npriority: 1\nstatus: done\ndepends-on: enforces-folder-structure\nbranch: feature/spec-parser\n---\n\n# Sidecar Test Runner Exists\n\n## What Must Be True\n\nA test runner must exist that discovers and runs all sidecar bash tests (`*.test.sh`) located alongside assertions in the spec tree.\n\n## Test Runner Location\n\n```\napp/\n└── spec-validator/\n    ├── run-sidecar-tests.js    # Test runner implementation\n    └── cli.js                   # CLI entry point\n```\n\n## Expected Behavior\n\nWhen running:\n```bash\nnpm run test:specs\n```\n\nThe runner must:\n1. Find all `specs/**/assertions/*.test.sh` files\n2. Execute each bash script\n3. Collect results (exit code 0 = pass, non-zero = fail)\n4. Report only failures (silent on success)\n5. Exit with code 0 if all pass, non-zero if any fail\n\n## Output Format\n\n**All tests pass:**\n```\n✅ All spec validation tests passed (12 tests)\n```\n\n**Some tests fail:**\n```\n❌ Failed: specs/builder-agent/assertions/prompt-exists.test.sh\n   Builder prompt missing at specs/builder-agent/builder-agent.prompt.md\n\n❌ Failed: specs/spec-parser/assertions/app-directory-structure.test.sh\n   scripts/ directory still exists\n\nFailed: 2 of 12 tests\n```\n\n## Implementation Requirements\n\n**Discovery:**\n- Use glob pattern: `specs/**/assertions/*.test.sh`\n- Skip if no test files found (not an error)\n\n**Execution:**\n- Run each test with `bash \u003ctest-file\u003e`\n- Capture stdout/stderr\n- Check exit code\n\n**Reporting:**\n- Only show output for failed tests\n- Show test file path\n- Show error message from test\n- Count total and failed tests\n\n**Exit behavior:**\n- Exit 0: All tests passed\n- Exit 1: One or more tests failed\n- Exit 0: No tests found (not an error)\n\n## package.json Script\n\n```json\n{\n  \"scripts\": {\n    \"test\": \"npm run test:impl \u0026\u0026 npm run test:specs\",\n    \"test:impl\": \"node --test 'app/**/__tests__/**/*.test.js'\",\n    \"test:specs\": \"node app/spec-validator/cli.js\"\n  }\n}\n```\n\nThis separates:\n- `npm run test:impl` - Implementation tests (JS)\n- `npm run test:specs` - Sidecar validation tests (bash)\n- `npm test` - Runs both\n\n## Example Sidecar Test\n\n```bash\n#!/usr/bin/env bash\n# specs/builder-agent/assertions/prompt-exists.test.sh\n\nPROMPT_FILE=\"specs/builder-agent/builder-agent.prompt.md\"\n\n[ -f \"$PROMPT_FILE\" ] || {\n  echo \"❌ Builder prompt missing at $PROMPT_FILE\"\n  exit 1\n}\n\ngrep -q \"Work on ONE assertion\" \"$PROMPT_FILE\" || {\n  echo \"❌ Builder prompt missing 'Work on ONE assertion' instruction\"\n  exit 1\n}\n\n# Silent on success\nexit 0\n```\n\n## Success Criteria\n\n- ✅ `app/spec-validator/` directory exists\n- ✅ Test runner discovers all `*.test.sh` files in specs tree\n- ✅ Runner executes bash scripts and captures exit codes\n- ✅ Runner only reports failures (silent on success)\n- ✅ Runner exits 0 if all pass, non-zero if any fail\n- ✅ `npm run test:specs` command exists\n- ✅ `npm test` runs both implementation and sidecar tests\n- ✅ Works with zero test files (not an error)\n- ✅ Clear error messages show which tests failed\n\n**Tests:** `src/spec-validator/__tests__/run-sidecar-tests.test.js`\n\nTest should validate:\n- Runner discovers test files correctly\n- Runner executes bash scripts\n- Runner captures and reports failures\n- Runner exits with correct code\n","branch":"feature/spec-parser","dependsOn":"enforces-folder-structure","created":"2026-01-20T19:35:00Z"},{"id":"target-directory-structure","parent":"spec-parser","title":"CLI Directory Structure","status":"done","priority":1,"file":"specs/spec-parser/assertions/target-directory-structure.md","content":"---\nid: target-directory-structure\nparent: spec-parser\ncreated: 2026-01-21T19:15:00Z\npriority: 1\nstatus: done\nbranch: feature/spec-parser\n---\n\n# CLI Directory Structure\n\n## What Must Be True\n\n**The project must follow standard Node.js CLI structure:**\n\n```\nspekk-cli/\n├── src/                  # All implementation code\n│   ├── parser/          # Spec parser\n│   │   ├── index.js     # Core logic\n│   │   ├── cli.js       # CLI interface\n│   │   └── __tests__/   # Tests (optional)\n│   ├── coach/           # Coach agent\n│   │   ├── index.js\n│   │   └── cli.js\n│   └── builder/         # Builder agent\n│       ├── index.js\n│       └── cli.js\n├── bin/                 # CLI entry points\n│   └── spekk.js        # Main executable\n├── specs/               # Specifications\n├── package.json         # Package config with \"bin\" field\n└── ...\n```\n\n## Directory Responsibilities\n\n**src/** - All implementation code lives here\n- Organized by module (parser, coach, builder)\n- Each module has index.js (logic) and cli.js (interface)\n- Tests co-located with code in __tests__/\n\n**bin/** - CLI executables\n- Main entry point for the `spekk` command\n- Thin wrapper that imports from src/\n\n**specs/** - Specifications only\n- No code, only markdown spec files\n- Follows spec-parser folder structure rules\n\n## npm Package Configuration\n\n**package.json must include:**\n```json\n{\n  \"type\": \"module\",\n  \"bin\": {\n    \"spekk\": \"./bin/spekk.js\"\n  },\n  \"scripts\": {\n    \"next\": \"node src/parser/cli.js\",\n    \"coach\": \"node src/coach/cli.js\",\n    \"builder\": \"node src/builder/cli.js\"\n  }\n}\n```\n\n## What Must NOT Exist\n\n- ❌ `app/` directory (wrong - that's for spekk-app, not spekk-cli)\n- ❌ `spec-parser/` as standalone at root (parser is part of CLI, lives in src/)\n- ❌ Code scattered outside src/ directory\n- ❌ Django or Python code (this is a Node.js CLI)\n\n## Success Criteria\n\nThis assertion is \"done\" when:\n\n- ✅ `src/` directory exists with all implementation code\n- ✅ `src/parser/`, `src/coach/`, `src/builder/` exist\n- ✅ `bin/spekk.js` exists as main CLI entry point\n- ✅ `npm run next` executes parser correctly\n- ✅ `node src/parser/cli.js` works directly\n- ✅ Parser outputs valid JSON with correct format\n- ✅ No `app/` directory exists\n- ✅ No standalone `spec-parser/` at root\n- ✅ Clean separation: src/ for code, bin/ for CLI, specs/ for specs\n\n## Rationale\n\nThis is standard Node.js CLI structure:\n- **src/** is convention for source code\n- **bin/** is convention for executables\n- Keeps the CLI portable and publishable to npm\n- Clear separation of concerns\n","branch":"feature/spec-parser","created":"2026-01-21T19:15:00Z"},{"id":"tests-in-correct-location","parent":"spec-parser","title":"Tests Must Be In Correct Location","status":"done","priority":1,"file":"specs/spec-parser/assertions/tests-in-correct-location.md","content":"---\nid: tests-in-correct-location\nparent: spec-parser\ncreated: 2026-01-21T19:45:00Z\npriority: 1\nstatus: done\ndepends-on: target-directory-structure\nbranch: feature/spec-parser\n---\n\n# Tests Must Be In Correct Location\n\n## Requirement\n\nSpec parser tests must follow the target directory structure with tests co-located with code in `__tests__/` subdirectories.\n\n## Success Criteria\n\n### Correct Test Location\n- ✅ Tests exist at: `src/parser/__tests__/spec-parser.test.js`\n- ✅ No tests exist at: `tests/spec-parser.test.js` (wrong location)\n- ✅ No tests exist at: `src/__tests__/spec-parser.test.js` (wrong location)\n\n### Directory Structure Compliance\n- ✅ Follows Node.js convention: code and tests co-located\n- ✅ Parser tests live with parser code in `src/parser/__tests__/`\n- ✅ Matches target directory structure spec\n\n### Test Content\n- ✅ Tests cover all parser functionality\n- ✅ Tests validate JSON output format\n- ✅ Tests check field validation\n- ✅ Tests verify priority sorting\n- ✅ Tests run with `npm run test:impl`\n\n## Cleanup Required\n\n**Files to remove:**\n- `tests/spec-parser.test.js` (duplicate in wrong location)\n- `src/__tests__/spec-parser.test.js` (duplicate in wrong location)\n\n**Files to keep/create:**\n- `src/parser/__tests__/spec-parser.test.js` (correct location)\n\n## Rationale\n\nThe target directory structure spec clearly states tests should be co-located with code in `__tests__/` subdirectories within each module. This prevents confusion and follows Node.js conventions.\n\n**Tests:** `src/parser/__tests__/spec-parser.test.js`","branch":"feature/spec-parser","dependsOn":"target-directory-structure","created":"2026-01-21T19:45:00Z"},{"id":"validates-required-fields","parent":"spec-parser","title":"Parser Must Validate Required Fields","status":"done","priority":2,"file":"specs/spec-parser/assertions/validates-required-fields.md","content":"---\nid: validates-required-fields\nparent: spec-parser\ncreated: 2026-01-20T16:10:00Z\npriority: 2\nstatus: done\ndepends-on: parses-frontmatter\nbranch: feature/spec-parser\n---\n\n# Parser Must Validate Required Fields\n\n## What Must Be True\n\nThe parser must validate that all spec and assertion files have required frontmatter fields:\n\n### Required for Specs\n- `id` (string, kebab-case, unique)\n- `created` (string, ISO 8601 timestamp)\n- `priority` (integer, 0 or greater)\n\n### Required for Assertions\n- `id` (string, kebab-case, unique within parent)\n- `parent` (string, must match existing spec id)\n- `created` (string, ISO 8601 timestamp)\n- `priority` (integer, 0 or greater)\n\n### Optional Fields (assertions only)\n- `status` (string: not_started | in_progress | done | failed | draft) - defaults to `not_started`\n- `updated` (string, ISO 8601 timestamp)\n\n**Note:** Parent spec files should NOT contain a `status` field. Parent status is computed by the parser from child assertions. If a legacy `status` field is present on a parent spec, the parser overrides it.\n\n## Validation Rules\n\n**For `id` field:**\n- Must be kebab-case (lowercase with hyphens)\n- No spaces, underscores, or special characters\n- Must be unique across all specs (for spec files)\n- Must be unique within parent spec (for assertion files)\n- Examples: `spec-parser`, `validates-required-fields`\n\n**For `created` and `updated` fields:**\n- Must be valid ISO 8601 format\n- Must be UTC timezone (ending in Z)\n- Format: `YYYY-MM-DDTHH:MM:SSZ`\n- Example: `2026-01-20T16:10:00Z`\n\n**For `priority` field:**\n- Must be integer: 1, 2, or 3\n- 1 = highest priority (critical, blocking)\n- 2 = medium priority (important, not blocking)\n- 3 = lowest priority (nice to have, future)\n- No other values allowed\n\n**For `status` field:**\n- If present, must be one of: `not_started`, `in_progress`, `done`\n- If missing, defaults to `not_started`\n\n**For `parent` field (assertions only):**\n- Must reference an existing spec `id`\n- Assertion must be located in `specs/{parent}/assertions/`\n\n## Error Handling\n\nParser should report clear errors:\n- \"Missing required field 'id' in specs/foo/bar.md\"\n- \"Invalid ISO 8601 timestamp in 'created' field: '2026-01-20'\"\n- \"Duplicate spec id 'spec-parser' found in multiple files\"\n- \"Invalid status value 'completed' (must be: not_started, in_progress, done)\"\n- \"Invalid priority value '0' (must be: 1, 2, or 3)\"\n- \"Parent spec 'unknown-spec' not found for assertion 'validates-required-fields'\"\n\n## Success Criteria\n\n- ✅ Parser rejects files missing required fields\n- ✅ Parser validates field formats\n- ✅ Parser detects duplicate IDs\n- ✅ Parser validates parent references for assertions\n- ✅ Parser provides clear, actionable error messages\n\n**Tests:** `src/parser/__tests__/spec-parser.test.js`\n","branch":"feature/spec-parser","dependsOn":"parses-frontmatter","created":"2026-01-20T16:10:00Z"},{"id":"validates-status-values","parent":"spec-parser","title":"Parser Must Validate Status Values","status":"done","priority":2,"file":"specs/spec-parser/assertions/validates-status-values.md","content":"---\nid: validates-status-values\nparent: spec-parser\ncreated: 2026-01-20T16:27:00Z\npriority: 2\nstatus: done\ndepends-on: parses-frontmatter\nbranch: feature/spec-parser\n---\n\n# Parser Must Validate Status Values\n\n**Tests:** src/parser/__tests__/field-validation.test.js\n\n## What Must Be True\n\nThe parser must validate that `status` field (when present) contains only valid values.\n\n## Valid Status Values\n\nOnly these five values are allowed:\n- `not_started` (default if omitted)\n- `in_progress`\n- `done`\n- `draft` (placeholder/planning, excluded from work queue)\n- `failed` (broken implementation, included in work queue for retry)\n\n## Validation Rules\n\n### Default Behavior\n- If `status` field is missing, treat as `not_started`\n- Parser should not require explicit `status` field\n\n### When Status is Present\n- Must be exactly one of the five valid values\n- Case-sensitive (must be lowercase with underscores)\n- No other values allowed\n\n## Invalid Examples\n\nParser should reject:\n- `completed` (use `done` instead)\n- `Not Started` (wrong case/format)\n- `in-progress` (wrong separator, should be underscore)\n- `todo` (not a valid status)\n- `pending` (not a valid status)\n- `finished` (use `done` instead)\n\n## Error Messages\n\nParser should provide clear errors:\n- \"Invalid status value 'completed' (must be: not_started, in_progress, done, draft, failed)\"\n- \"Invalid status format 'Not Started' (must be lowercase with underscores)\"\n\n## Success Criteria\n\n- ✅ Parser accepts all five valid status values (not_started, in_progress, done, draft, failed)\n- ✅ Parser treats missing status as `not_started`\n- ✅ Parser rejects invalid status values\n- ✅ Parser provides clear error messages for invalid status values\n- ✅ Parser is case-sensitive for status validation\n- ✅ Parser excludes 'draft' status from work queue (like 'done')\n- ✅ Parser includes 'failed' status in work queue for retry","branch":"feature/spec-parser","dependsOn":"parses-frontmatter","created":"2026-01-20T16:27:00Z"},{"id":"validates-timestamps","parent":"spec-parser","title":"Parser Must Validate Timestamp Formats","status":"done","priority":2,"file":"specs/spec-parser/assertions/validates-timestamps.md","content":"---\nid: validates-timestamps\nparent: spec-parser\ncreated: 2026-01-20T16:26:00Z\npriority: 2\nstatus: done\ndepends-on: parses-frontmatter\nbranch: feature/spec-parser\n---\n\n# Parser Must Validate Timestamp Formats\n\n**Tests:** src/parser/__tests__/timestamp-validation.test.js\n\n## What Must Be True\n\nThe parser must validate that `created` and `updated` fields use valid ISO 8601 format.\n\n## Required Format\n\n- **Format**: `YYYY-MM-DDTHH:MM:SSZ`\n- **Timezone**: Must be UTC (ending in Z)\n- **Example**: `2026-01-20T16:26:00Z`\n\n## Validation Rules\n\n### For `created` field:\n- Required in all specs and assertions\n- Must be valid ISO 8601 format\n- Must be UTC timezone\n- Immutable - never changes after creation\n\n### For `updated` field:\n- Optional field\n- If present, must be valid ISO 8601 format\n- Must be UTC timezone\n- Should only be used for significant changes\n\n## Invalid Examples\n\nThe parser should reject:\n- `2026-01-20` (missing time)\n- `2026-01-20T16:26:00` (missing timezone)\n- `2026-01-20T16:26:00+00:00` (wrong timezone format)\n- `Jan 20, 2026` (wrong format entirely)\n- `invalid-date` (not a date)\n\n## Error Messages\n\nParser should provide clear errors:\n- \"Invalid ISO 8601 timestamp in 'created' field: '2026-01-20'\"\n- \"Missing timezone in timestamp: '2026-01-20T16:26:00'\"\n- \"Invalid timestamp format in 'updated' field\"\n\n## Success Criteria\n\n- ✅ Parser accepts valid ISO 8601 UTC timestamps\n- ✅ Parser rejects invalid timestamp formats\n- ✅ Parser provides clear error messages for invalid timestamps\n- ✅ Parser validates both `created` and `updated` fields","branch":"feature/spec-parser","dependsOn":"parses-frontmatter","created":"2026-01-20T16:26:00Z"},{"id":"agent-spawns-use-inherited-stdio","parent":"spekk-cli","title":"CLI agent spawns use inherited stdio","status":"done","priority":1,"file":"specs/spekk-cli/assertions/agent-spawns-use-inherited-stdio.md","content":"---\nid: agent-spawns-use-inherited-stdio\nparent: spekk-cli\ncreated: 2026-03-16T00:00:00Z\npriority: 1\nstatus: done\n---\n\n# CLI agent spawns use inherited stdio\n\nAll CLI commands that launch Claude Code (`coach`, `builder`, `observer`, loops) pass the activation message as a positional argument with `stdio: 'inherit'`. No Claude spawn site pipes to stdin.\n\nThis ensures cross-platform compatibility — on Windows, Claude Code uses Ink which requires a real TTY for raw mode. Piped stdin breaks with \"Raw mode is not supported\".\n\n## Success Criteria\n\n- No Claude spawn in `src/coach/cli.js`, `src/builder/cli.js`, `src/observer/cli.js`, or `src/loops/index.js` uses `stdio: ['pipe', 'inherit', 'inherit']`\n- All Claude spawns use `stdio: 'inherit'` and pass the message as a positional arg\n- No `stdin.write()` / `stdin.end()` / EPIPE handling exists for Claude spawns\n- `src/serve/index.js` is unchanged (intentionally pipes for WebSocket protocol)\n- `buildClaudeSpawnConfig()` interactive branch is unchanged (already uses `stdio: 'inherit'`)\n","branch":"main","created":"2026-03-16T00:00:00Z"},{"id":"npm-scripts-launch-agents","parent":"spekk-cli","title":"NPM Scripts Launch Agents","status":"done","priority":1,"file":"specs/spekk-cli/assertions/npm-scripts-launch-agents.md","content":"---\nid: npm-scripts-launch-agents\nparent: spekk-cli\ncreated: 2026-01-21T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# NPM Scripts Launch Agents\n\n## Requirement\n\n`npm run coach` and `npm run builder` commands launch actual Claude Code agent sessions with the appropriate prompts, providing the looping behavior described in the orchestration specs.\n\n## Success Criteria\n\n### Coach Script (`npm run coach`):\n- Launches Claude Code with coach agent prompt from `specs/coach-agent/coach-agent.prompt.md`\n- Provides interactive session for spec creation\n- Loops back to coach after each spec is created and committed\n- Continues until user exits (Ctrl+C)\n- Operates on current working directory's specs\n\n### Builder Script (`npm run builder`):\n- Launches Claude Code with builder agent prompt from `specs/builder-agent/builder-agent.prompt.md`\n- Gets next priority assertion via spec parser\n- Launches builder agent with assertion context\n- Automatically commits changes after completion\n- Loops to next assertion until none remain\n- Handles interrupts gracefully\n\n### Current Issue\n\nBoth scripts currently only display their prompts instead of launching Claude Code sessions:\n\n```javascript\n// Current behavior: just prints prompt\nconsole.log(promptContent);\nconsole.log('You are now the Builder Agent...');\n```\n\n### Required Behavior\n\nSimple bash loops that:\n\n**Coach Script (`npm run coach`):**\n```bash\n#!/bin/bash\nwhile true; do\n  claude --dangerously-skip-permissions \u003c\u003c 'EOF'\nYou are the Coach Agent - read the prompt and follow the instructions exactly.\nEOF\n  # Loop continues until user Ctrl+C\ndone\n```\n\n**Builder Script (`npm run builder`):**\n```bash\n#!/bin/bash\nwhile true; do\n  # Get next assertion\n  NEXT=$(npm run next --silent 2\u003e/dev/null)\n  \n  # Check if all done\n  if [[ $NEXT == *'\"type\":\"complete\"'* ]]; then\n    echo \"🎉 All assertions completed!\"\n    break\n  fi\n  \n  # Launch builder agent\n  claude --dangerously-skip-permissions \u003c\u003c 'EOF'\nYou are the Builder Agent - read the prompt and follow the instructions exactly.\nEOF\ndone\n```\n\nKeep it simple - just bash loops around Claude Code with hard-coded prompts, like coach-loop.sh and builder-loop.sh patterns.\n\n**Tests:** src/coach/__tests__/coach-cli.test.js, src/builder/__tests__/builder-cli.test.js","branch":"main","created":"2026-01-21T19:30:00Z"},{"id":"orchestration-loops-exist","parent":"spekk-cli","title":"Orchestration Loops Exist","status":"done","priority":1,"file":"specs/spekk-cli/assertions/orchestration-loops-exist.md","content":"---\nid: orchestration-loops-exist\nparent: spekk-cli\ncreated: 2026-01-21T19:15:00Z\npriority: 1\nstatus: done\n---\n\n# Orchestration Loops Exist\n\n## Requirement\n\n`spekk coach` and `spekk builder` commands provide full orchestration workflows that automate the spec-driven development cycle.\n\n## Success Criteria\n\n### Builder Loop (`spekk builder`):\n✅ Gets next priority assertion via `spekk next`\n✅ Launches builder agent with assertion context\n✅ Waits for agent completion \n✅ Automatically commits changes with proper commit message\n✅ Repeats cycle until no more assertions\n✅ Handles interrupts gracefully (Ctrl+C)\n✅ Provides colored output and logging\n\n### Coach Loop (`spekk coach`):  \n✅ Launches coach agent in interactive mode\n✅ Waits for user input and spec creation\n✅ Automatically commits new specs\n✅ Returns to coach for next interaction\n✅ Continues until user exits\n✅ Handles interrupts gracefully\n\n### Workflow Integration:\n✅ Builder loop integrates with Claude Code agent sessions\n✅ Coach loop integrates with Claude Code agent sessions  \n✅ Proper error handling when agents fail\n✅ Git integration for automatic commits\n✅ Status logging and progress indicators\n\n## Historical Context\n\nOriginal builder-loop.sh workflow:\n- Parse next task from JSON\n- Extract task ID, title, file path\n- Invoke builder agent on specific assertion\n- Git commit with formatted message\n- Loop until complete\n\nThis full orchestration is essential for automated spec-driven development.\n\n**Tests:** src/cli/__tests__/orchestration-loops.test.js","branch":"main","created":"2026-01-21T19:15:00Z"},{"id":"status-command-exists","parent":"spekk-cli","title":"Status Command Exists","status":"done","priority":2,"file":"specs/spekk-cli/assertions/status-command-exists.md","content":"---\nid: status-command-exists\nparent: spekk-cli\ncreated: 2026-01-21T19:02:00Z\npriority: 2\nstatus: done\n---\n\n# Status Command Exists\n\n**Tests:** src/__tests__/status-command.test.js\n\n## Requirement\n\nStatus command shows comprehensive overview of all specs and assertions with their completion status. Available both as `spekk status` and `npm run status`.\n\n## Success Criteria\n\n### Command Functionality:\n✅ `spekk status` runs without errors\n✅ `npm run status` runs without errors\n✅ Shows all specs found in current directory's specs/ folder\n✅ Displays assertion count and completion ratio for each spec\n✅ Lists individual assertions with status icons\n✅ Shows next priority item at bottom\n\n### Output Format:\n✅ Uses clear status icons (✅ done, 🚧 in progress, 📋 not started, ⏸️ blocked)\n✅ Groups assertions under parent specs with indentation\n✅ Shows completion ratios (e.g., \"2/5 assertions complete\")\n✅ Highlights next priority item clearly\n✅ Handles empty specs/ directory gracefully\n\n### Performance:\n✅ Executes in \u003c 100ms even with many specs\n✅ Parses all specs and assertions correctly\n✅ Uses same validation logic as main parser","branch":"main","created":"2026-01-21T19:02:00Z"},{"id":"init-command","parent":"spekk-init","title":"`spekk init` Creates the specs/ Directory","status":"done","priority":1,"file":"specs/spekk-init/assertions/init-command.md","content":"---\nid: init-command\nparent: spekk-init\ncreated: 2026-06-11T00:00:00Z\npriority: 1\nstatus: done\nbranch: feat/agent-install\n---\n\n# `spekk init` Creates the specs/ Directory\n\n## Success Criteria\n\n- `spekk init` creates `specs/` at the git root when run inside a repository, otherwise in the current directory (same resolution as `findSpecsDir`)\n- Writes `specs/README.md` explaining the spec/assertion layout and listing the core commands, so the directory is non-empty (git-trackable) and self-explanatory\n- Idempotent: if `specs/` already exists it prints a friendly \"already set up\" message and exits 0 without touching anything\n- On success, prints next steps: `spekk coach`, `spekk builder`, and the `spekk install --target` route for other assistants\n- `spekk init --help` shows usage; `spekk help` lists `init` first in the command list\n- The installed agent shims reference `spekk init` (not a vague pointer) when they encounter a project without `specs/`\n- Documented in README Quick Start (step 1 of the workflow) and `docs/cli-reference.md`\n\n**Tests:** verified via CLI smoke test (fresh dir, git repo subdir, and already-initialized cases).\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"file-watcher-module-exists","parent":"spekk-show-watch","title":"File watcher module exists at `src/show/watcher.js`","status":"done","priority":1,"file":"specs/spekk-show-watch/assertions/file-watcher-module-exists.md","content":"---\nid: file-watcher-module-exists\nparent: spekk-show-watch\ncreated: 2026-02-26T18:00:00Z\npriority: 1\nstatus: done\nbranch: feature/spekk-show-watch\n---\n\n# File watcher module exists at `src/show/watcher.js`\n\nA self-contained module that watches the `specs/` directory for file changes and invokes a callback.\n\n## Success Criteria\n\n- `src/show/watcher.js` exports a `watchSpecs(specsDir, onChange)` function\n- `onChange` callback is invoked when `.md` files in `specs/` are created, modified, or deleted\n- Rapid successive changes are debounced (~500ms) so `onChange` fires once per batch\n- Uses **polling-based approach** (`fs.readdirSync`/`fs.statSync` on a `setInterval`) — not `fs.watch`\n- Polls every 500ms, comparing mtimes of all `.md` files against a cached snapshot\n- Detects: file modifications (mtime changed), new files added, files deleted\n- No external dependencies — Node.js stdlib only\n- Returns a cleanup function that clears the interval and stops polling\n- Test file at `src/__tests__/file-watcher-module.test.js` validates detection and cleanup\n\n**Tests:** src/__tests__/file-watcher-module.test.js\n\n## Bug: `fs.watch` with `{ recursive: true }` is unreliable on Linux\n\nOn Linux, `sed -i` and similar tools replace files via create-temp-then-rename. After the rename, `fs.watch` loses its inotify handles and silently stops firing events. Observed behavior: watcher fires for the first change, then goes silent for all subsequent changes.\n\n**Fix:** Replace `fs.watch` with polling. Scan the directory tree every 500ms, collect mtimes of all `.md` files, diff against previous snapshot. This is reliable across all platforms and file replacement strategies.\n\n## Interface Contract\n\n```js\n// src/show/watcher.js\nexport function watchSpecs(specsDir, onChange) {\n  // polls specsDir recursively every 500ms for .md file mtime changes\n  // calls onChange() debounced when changes detected\n  // returns () =\u003e void cleanup function\n}\n```\n","branch":"feature/spekk-show-watch","created":"2026-02-26T18:00:00Z"},{"id":"watch-mode-integrated","parent":"spekk-show-watch","title":"Watch mode is integrated end-to-end","status":"done","priority":1,"file":"specs/spekk-show-watch/assertions/watch-mode-integrated.md","content":"---\nid: watch-mode-integrated\nparent: spekk-show-watch\ncreated: 2026-02-26T18:00:00Z\npriority: 1\nstatus: done\ndepends-on: file-watcher-module-exists\nbranch: feature/spekk-show-watch\n---\n\n# Watch mode is integrated end-to-end\n\nThe `--watch` flag is parsed, all modules are wired together, and `spekk show --watch` works end-to-end.\n\n## Success Criteria\n\n- `bin/spekk.js` parses `--watch` / `-w` flags for the `show` command using `parseFlags()` from `src/cli/parse-flags.js`\n- `showSpekk()` in `src/show/cli.js` accepts an options object `{ watch }`\n- When `watch` is false/absent: behavior is unchanged (generate file, open browser, exit)\n- When `watch` is true:\n  1. Parses specs and generates HTML (with SSE client script injected)\n  2. Starts the watch server from `src/show/server.js`, serving a `getHTML` callback that re-parses and re-generates on each request\n  3. Starts the file watcher from `src/show/watcher.js` on the `specs/` directory\n  4. On file change: calls `notifyClients()` to push SSE reload event\n  5. Opens `http://localhost:{port}` in the default browser\n  6. Logs: \"Watching specs/ for changes... (press Ctrl+C to stop)\"\n  7. Ctrl+C triggers graceful shutdown: stops watcher, closes server and SSE connections, exits\n- Generated HTML in watch mode includes an inline `\u003cscript\u003e` with EventSource SSE client that:\n  - Connects to `/events`\n  - On `reload` event, calls `location.reload()`\n  - Auto-reconnects on connection loss (EventSource default behavior)\n- Non-watch mode HTML does NOT include the SSE script (no dead code in static output)\n- Existing tests in `src/__tests__/show-command.test.js` continue to pass (non-watch path unchanged)\n- Integration test at `src/__tests__/watch-mode-integration.test.js` validates the full flow:\n  - Server starts and serves HTML\n  - Modifying a spec file triggers browser reload event\n  - Server shuts down cleanly\n\n## Depends On\n\n- `file-watcher-module-exists` - provides `watchSpecs()`\n- `watch-server-module-exists` - provides `startWatchServer()`\n\nNote: only one `depends-on` in frontmatter (the watcher). The server is also required but the coordinator chains them appropriately.\n\n## Bug (fixed): Browser open fails in watch mode\n\nResolved — `resolveOpenUrl()` now detects HTTP URLs and skips `file://` prefix.\n\n## Bug: Missed reloads during rapid edits\n\nWhen a file change fires while the browser is mid-reload (old SSE connection closed, new one not yet connected), `notifyClients()` writes to zero clients and the change is silently lost. The browser loads stale HTML and never gets another event until the *next* file change.\n\n**Fix in `src/show/cli.js` `showSpekkWatch()`:** Track a `dirty` flag. When the watcher fires, set `dirty = true` AND call `notifyClients()`. In the server (`src/show/server.js`), when a new SSE client connects, if `dirty` is true, immediately send a `reload` event and reset the flag. This way, if the browser reconnects after missing an event, it gets an immediate reload.\n\nConcretely:\n- `startWatchServer` should accept an optional `isDirty` callback and call it when a new SSE client connects. If `isDirty()` returns true, immediately write a `reload` event to that client.\n- In `showSpekkWatch()`, maintain `let dirty = false`. Watcher sets `dirty = true` then calls `notifyClients()`. The `GET /` handler resets `dirty = false` (since the HTML was just freshly served). Pass `isDirty: () =\u003e dirty` to `startWatchServer`.\n\n## Enhancement: Preserve UI state across live reloads\n\n`location.reload()` resets all interactive UI state. The SSE client script should save and restore state via localStorage around each reload.\n\n**State to preserve:**\n1. **Expanded specs** — which spec dropdowns are open (IDs of elements with `.expanded` class under `[id^=\"assertions-\"]`)\n2. **Selected detail panel** — which assertion/spec detail is active (ID of the `.detail-content.active` element)\n3. **Sidebar scroll position** — `scrollTop` of the sidebar `.spec-list` container\n\n**Implementation (all changes within the SSE client `\u003cscript\u003e` block in `src/show/cli.js`):**\n- Before `location.reload()`: save expanded spec IDs, active detail ID, and scroll position to `sessionStorage` under a `spekkWatchState` key\n- On page load (in watch mode only): read `spekkWatchState` from sessionStorage, re-expand saved specs, re-activate the saved detail panel, restore scroll position, then clear the stored state\n- Use `sessionStorage` (not `localStorage`) since this state is ephemeral to the watch session\n- Restore scroll position via `requestAnimationFrame` to ensure DOM is rendered first\n\n**What's already persisted (no changes needed):**\n- Completed specs toggle — uses `localStorage.getItem('spekkShowCompleted')`\n- Metro map height — uses `localStorage.getItem('spekkMetroMapHeight')`\n- Metro map collapsed — uses `localStorage.getItem('spekkMetroMapCollapsed')`\n","branch":"feature/spekk-show-watch","dependsOn":"file-watcher-module-exists","created":"2026-02-26T18:00:00Z"},{"id":"watch-server-module-exists","parent":"spekk-show-watch","title":"Watch server module exists at `src/show/server.js`","status":"done","priority":1,"file":"specs/spekk-show-watch/assertions/watch-server-module-exists.md","content":"---\nid: watch-server-module-exists\nparent: spekk-show-watch\ncreated: 2026-02-26T18:00:00Z\npriority: 1\nstatus: done\nbranch: feature/spekk-show-watch\n---\n\n# Watch server module exists at `src/show/server.js`\n\nAn HTTP server that serves the spec explorer HTML and pushes live-reload events via SSE.\n\n## Success Criteria\n\n- `src/show/server.js` exports a `startWatchServer({ getHTML, port })` function\n- Server serves the HTML returned by `getHTML()` at `GET /`\n- Server has an SSE endpoint at `GET /events` that keeps connections open\n- Server exposes a `notifyClients()` method that sends a `reload` event to all connected SSE clients\n- When an SSE client receives `reload`, the browser-side script calls `location.reload()`\n- `getHTML()` is called fresh on every `GET /` request (so regenerated HTML is always served)\n- Server binds to `localhost` only (not `0.0.0.0`) for security\n- Default port is `3117`; if port is in use, tries next port up to 10 times\n- Returns `{ server, port, notifyClients, close }` for the caller to orchestrate\n- Sets `Content-Type: text/html` for `/` and `text/event-stream` for `/events`\n- SSE responses include `Cache-Control: no-cache` and `Connection: keep-alive` headers\n- Test file at `src/__tests__/watch-server-module.test.js` validates HTTP serving and SSE behavior\n\n## Interface Contract\n\n```js\n// src/show/server.js\nexport async function startWatchServer({ getHTML, port = 3117 }) {\n  // starts HTTP server on localhost:port\n  // GET / -\u003e serves getHTML() result as text/html\n  // GET /events -\u003e SSE stream\n  // returns { server, port, notifyClients: () =\u003e void, close: () =\u003e void }\n}\n```\n","branch":"feature/spekk-show-watch","created":"2026-02-26T18:00:00Z"},{"id":"create-field-validation-tests","parent":"test-file-organization","title":"Field Validation Tests File","status":"done","priority":1,"file":"specs/test-file-organization/assertions/create-field-validation-tests.md","content":"---\nid: create-field-validation-tests\nparent: test-file-organization\ncreated: 2026-01-21T23:33:00Z\npriority: 1\nstatus: done\n---\n\n# Field Validation Tests File\n\n## What Must Be True\n\nA focused test file exists at `src/parser/__tests__/field-validation.test.js` containing all spec and assertion field validation tests.\n\n## Test Coverage Required\n\n**From `tests/spec-parser.test.js`:**\n- Required fields validation for specs and assertions\n- Field format validation (kebab-case IDs, ISO timestamps, priority values)\n- Status field validation (valid/invalid values)\n- Duplicate ID detection (specs and assertions)\n- Parent reference validation\n- Error message quality\n\n**Key test sections to migrate:**\n- `Spec Parser Field Validation` describe block\n  - `Required Fields Validation` tests\n  - `Field Format Validation` tests\n  - `Status Field Validation` tests\n  - `Duplicate ID Detection` tests\n  - `Parent Reference Validation` tests\n  - `Error Message Quality` tests\n\n## File Location\n\n```\nsrc/parser/__tests__/field-validation.test.js\n```\n\n## Success Criteria\n\n- ✅ File exists at correct location\n- ✅ Contains comprehensive field validation test suite\n- ✅ Tests all required fields for specs and assertions\n- ✅ Validates format requirements (kebab-case, ISO dates, priorities)\n- ✅ Tests duplicate detection logic\n- ✅ Validates parent reference integrity\n- ✅ Tests error message quality\n- ✅ File is under 600 lines\n- ✅ All tests pass when run\n\n**Tests:** `npm test` runs this file and all tests pass","branch":"main","created":"2026-01-21T23:33:00Z"},{"id":"create-frontmatter-tests","parent":"test-file-organization","title":"Frontmatter Parsing Tests File","status":"done","priority":1,"file":"specs/test-file-organization/assertions/create-frontmatter-tests.md","content":"---\nid: create-frontmatter-tests\nparent: test-file-organization\ncreated: 2026-01-21T23:32:00Z\npriority: 1\nstatus: done\n---\n\n# Frontmatter Parsing Tests File\n\n## What Must Be True\n\nA focused test file exists at `src/parser/__tests__/frontmatter-parsing.test.js` containing all YAML frontmatter parsing functionality.\n\n## Test Coverage Required\n\n**From `src/__tests__/spec-parser.test.js`:**\n- Well-formed YAML frontmatter parsing\n- Frontmatter/content separation\n- Different YAML value types handling\n- Error cases (missing delimiters)\n- Empty frontmatter handling\n- Multi-line content handling\n- Real file validation\n\n**Key tests to migrate:**\n- `YAML Frontmatter Parsing` describe block (all tests)\n- `parses well-formed YAML frontmatter correctly`\n- `separates frontmatter from markdown content correctly`\n- `handles different YAML value types`\n- `throws error for missing opening/closing frontmatter delimiter`\n- `handles empty frontmatter correctly`\n- `handles multi-line markdown content`\n- `works with real spec and assertion files`\n\n## File Location\n\n```\nsrc/parser/__tests__/frontmatter-parsing.test.js\n```\n\n## Success Criteria\n\n- ✅ File exists at correct location\n- ✅ Contains complete YAML frontmatter test suite\n- ✅ Tests all parsing edge cases\n- ✅ Validates real file compatibility\n- ✅ File is under 400 lines\n- ✅ All tests pass when run\n\n**Tests:** `npm test` runs this file and all tests pass","branch":"main","created":"2026-01-21T23:32:00Z"},{"id":"create-json-output-tests","parent":"test-file-organization","title":"JSON Output Tests File","status":"done","priority":1,"file":"specs/test-file-organization/assertions/create-json-output-tests.md","content":"---\nid: create-json-output-tests\nparent: test-file-organization\ncreated: 2026-01-21T23:34:00Z\npriority: 1\nstatus: done\n---\n\n# JSON Output Tests File\n\n## What Must Be True\n\nA focused test file exists at `src/parser/__tests__/json-output.test.js` containing all JSON output format validation tests.\n\n## Test Coverage Required\n\n**From `tests/spec-parser.test.js`:**\n- Valid JSON structure validation\n- Success case field requirements\n- Complete case format\n- Empty case format\n- Error case JSON format\n- Single JSON object output (no streaming)\n- Field value types and formats\n- Output consistency across runs\n- JSON formatting (pretty-printed)\n\n**Key test sections to migrate:**\n- `JSON Output Validation` describe block\n  - `Valid JSON Structure` tests\n  - `Output Consistency` tests\n- Tests for parseable JSON to stdout\n- Required fields validation for JSON output\n- Status-specific format validation (complete, empty, error)\n\n## File Location\n\n```\nsrc/parser/__tests__/json-output.test.js\n```\n\n## Success Criteria\n\n- ✅ File exists at correct location\n- ✅ Contains complete JSON output validation suite\n- ✅ Tests all output formats (assertion, complete, empty, error)\n- ✅ Validates JSON structure and field requirements\n- ✅ Tests output consistency and formatting\n- ✅ File is under 500 lines\n- ✅ All tests pass when run\n\n**Tests:** `npm test` runs this file and all tests pass","branch":"main","created":"2026-01-21T23:34:00Z"},{"id":"create-parser-basic-tests","parent":"test-file-organization","title":"Parser Basic Tests File","status":"done","priority":1,"file":"specs/test-file-organization/assertions/create-parser-basic-tests.md","content":"---\nid: create-parser-basic-tests\nparent: test-file-organization\ncreated: 2026-01-21T23:31:00Z\npriority: 1\nstatus: done\n---\n\n# Parser Basic Tests File\n\n## What Must Be True\n\nA focused test file exists at `src/parser/__tests__/parser-basic.test.js` containing basic parser functionality and CLI tests.\n\n## Test Coverage Required\n\n**From `src/__tests__/spec-parser.test.js`:**\n- Parser script existence and executability\n- JSON output format validation (basic structure)\n- Next priority assertion identification\n- Folder structure enforcement (no flat .md files)\n- Valid spec directory structure validation\n\n**Key tests to migrate:**\n- `parser script exists and is executable`\n- `outputs valid JSON format`\n- `identifies next priority assertion correctly`\n- `enforces folder structure - no flat spec files`\n- `enforces folder structure - valid spec directories`\n\n## File Location\n\n```\nsrc/parser/__tests__/parser-basic.test.js\n```\n\n## Success Criteria\n\n- ✅ File exists at correct location\n- ✅ Contains all basic parser functionality tests\n- ✅ Tests CLI integration properly\n- ✅ Validates folder structure requirements\n- ✅ File is under 300 lines\n- ✅ All tests pass when run\n\n**Tests:** `npm test` runs this file and all tests pass","branch":"main","created":"2026-01-21T23:31:00Z"},{"id":"create-priority-algorithm-tests","parent":"test-file-organization","title":"Priority Algorithm Tests File","status":"done","priority":1,"file":"specs/test-file-organization/assertions/create-priority-algorithm-tests.md","content":"---\nid: create-priority-algorithm-tests\nparent: test-file-organization\ncreated: 2026-01-21T23:35:00Z\npriority: 1\nstatus: done\n---\n\n# Priority Algorithm Tests File\n\n## What Must Be True\n\nA focused test file exists at `src/parser/__tests__/priority-algorithm.test.js` containing all next priority identification and algorithm tests.\n\n## Test Coverage Required\n\n**From `tests/spec-parser.test.js`:**\n- Highest priority incomplete assertion identification\n- Timestamp-based tie breaking\n- Done assertion filtering\n- In-progress assertion inclusion\n- All-done case handling\n- CLI integration with priority algorithm\n\n**Key test sections to migrate:**\n- `Next Priority Identification` describe block\n  - `Priority Algorithm` tests\n  - `CLI Integration` tests\n- Tests for priority-based selection\n- Timestamp tie-breaking logic\n- Status filtering (not_started, in_progress vs done)\n- Null return when all complete\n\n## File Location\n\n```\nsrc/parser/__tests__/priority-algorithm.test.js\n```\n\n## Success Criteria\n\n- ✅ File exists at correct location\n- ✅ Contains complete priority selection test suite\n- ✅ Tests priority ordering (1 \u003e 2 \u003e 3)\n- ✅ Tests timestamp tie-breaking (older first)\n- ✅ Tests status filtering logic\n- ✅ Tests CLI integration with algorithm\n- ✅ File is under 400 lines\n- ✅ All tests pass when run\n\n**Tests:** `npm test` runs this file and all tests pass","branch":"main","created":"2026-01-21T23:35:00Z"},{"id":"remove-old-test-files","parent":"test-file-organization","title":"Remove Old Test Files","status":"done","priority":2,"file":"specs/test-file-organization/assertions/remove-old-test-files.md","content":"---\nid: remove-old-test-files\nparent: test-file-organization\ncreated: 2026-01-21T23:36:00Z\npriority: 2\nstatus: done\n---\n\n# Remove Old Test Files\n\n## What Must Be True\n\nOld test files in incorrect locations are removed after the new organized test structure is complete and verified.\n\n## Files to Remove\n\n- `tests/spec-parser.test.js` (wrong location)\n- `src/__tests__/spec-parser.test.js` (wrong location)\n- `src/__tests__/orchestration-loops.test.js` (if no longer needed)\n- `tests/` directory (if empty after cleanup)\n\n## Prerequisites\n\nThis assertion can only be completed after:\n- All new test files are created and passing\n- New test structure is verified working\n- No functionality is lost in migration\n\n## Success Criteria\n\n- ✅ `tests/spec-parser.test.js` is deleted\n- ✅ `src/__tests__/spec-parser.test.js` is deleted\n- ✅ `tests/` directory removed if empty\n- ✅ All tests still pass after cleanup\n- ✅ No test coverage is lost\n- ✅ Only `src/parser/__tests__/` contains parser tests\n\n**Tests:** `npm test` still passes with same or better coverage\n\n## Notes\n\nThis should be the final step after all other test organization assertions are complete.","branch":"main","created":"2026-01-21T23:36:00Z"}]};</script>

    <script>
    (function() {
        'use strict';

        var DATA = window.__SPEKK_DATA__;
        if (!DATA) return;

        var specs = DATA.specs || [];
        var assertions = DATA.assertions || [];
        var projectName = DATA.projectName || 'Project';

        // Index assertions by parent
        var assertionsByParent = {};
        var assertionById = {};
        for (var i = 0; i < assertions.length; i++) {
            var a = assertions[i];
            assertionById[a.id] = a;
            if (!assertionsByParent[a.parent]) {
                assertionsByParent[a.parent] = [];
            }
            assertionsByParent[a.parent].push(a);
        }

        // Index specs by id
        var specById = {};
        for (var i = 0; i < specs.length; i++) {
            specById[specs[i].id] = specs[i];
        }

        // Set page title
        document.title = 'Spec Explorer - ' + projectName;

        // Build header
        var headerTitle = document.getElementById('header-title');
        headerTitle.textContent = 'Spec Tree - ' + projectName;

        var headerStats = document.getElementById('header-stats');
        headerStats.textContent = specs.length + ' specs, ' + assertions.length + ' assertions';

        // Escape HTML
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // Status emoji for detail badges
        function statusEmoji(status) {
            switch (status) {
                case 'done': return '\u2705';
                case 'in_progress': return '\uD83D\uDD04';
                case 'failed': return '\u274C';
                case 'not_started': return '\u25CB';
                case 'draft': return '\u23F8\uFE0F';
                default: return '\u25CB';
            }
        }

        // Build tree panel
        function buildTree() {
            var treeEl = document.getElementById('spec-tree');
            var html = '';

            for (var si = 0; si < specs.length; si++) {
                var spec = specs[si];
                var specAssertions = assertionsByParent[spec.id] || [];
                var searchText = spec.id + ' ' + spec.title.toLowerCase() + ' ' + spec.status + ' ' + spec.priority;

                html += '<li class="spec-item" data-spec-id="' + escapeHtml(spec.id) + '" data-search-text="' + escapeHtml(searchText) + '">';
                html += '<div class="spec-header" data-action="toggle-spec" data-spec-id="' + escapeHtml(spec.id) + '" data-show-detail="true" data-type="spec">';
                html += '<span class="toggle-icon" id="toggle-' + escapeHtml(spec.id) + '">\u25B6</span>';
                html += '<span class="priority-badge priority-' + spec.priority + '">' + spec.priority + '</span>';
                html += '<span class="status-badge status-' + escapeHtml(spec.status) + '"></span>';
                html += '<span class="spec-title">' + escapeHtml(spec.title) + '</span>';
                html += '</div>';

                html += '<ul class="assertions-list" id="assertions-' + escapeHtml(spec.id) + '">';
                for (var ai = 0; ai < specAssertions.length; ai++) {
                    var assertion = specAssertions[ai];
                    var aSearchText = assertion.id + ' ' + assertion.title.toLowerCase() + ' ' + assertion.status + ' ' + assertion.priority;
                    html += '<li class="assertion-item" data-action="show-detail" data-assertion-id="' + escapeHtml(assertion.id) + '" data-type="assertion" data-search-text="' + escapeHtml(aSearchText) + '">';
                    html += '<div style="display: flex; align-items: center;">';
                    html += '<span class="priority-badge priority-' + assertion.priority + '">' + assertion.priority + '</span>';
                    html += '<span class="status-badge status-' + escapeHtml(assertion.status) + '"></span>';
                    html += '<span>' + escapeHtml(assertion.title) + '</span>';
                    html += '</div>';
                    html += '</li>';
                }
                html += '</ul>';
                html += '</li>';
            }

            treeEl.innerHTML = html;
        }

        // Build detail panels
        function buildDetailPanels() {
            var section = document.getElementById('detail-content-section');
            var html = '<div class="empty-state" id="empty-state"><h3>Spec Explorer</h3><p>Click on any spec or assertion to view details</p></div>';

            // Spec detail panels
            for (var si = 0; si < specs.length; si++) {
                var spec = specs[si];
                html += '<div class="detail-content" id="detail-spec-' + escapeHtml(spec.id) + '">';
                html += '<div class="detail-header">';
                html += '<div class="detail-title">' + escapeHtml(spec.title) + '</div>';
                html += '<div class="detail-meta">';
                html += '<span class="meta-item">Status: <span class="detail-status-badge">' + statusEmoji(spec.status) + '</span></span>';
                html += '<span class="meta-item">Priority: <span class="detail-priority-badge">' + spec.priority + '</span></span>';
                html += '<span class="meta-item">File: <strong>' + escapeHtml(spec.file) + '</strong></span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="detail-body markdown-body">' + DOMPurify.sanitize(marked.parse(spec.content || '')) + '</div>';
                html += '</div>';
            }

            // Assertion detail panels
            for (var ai = 0; ai < assertions.length; ai++) {
                var assertion = assertions[ai];
                html += '<div class="detail-content" id="detail-assertion-' + escapeHtml(assertion.id) + '" data-branch="' + escapeHtml(assertion.branch) + '">';
                html += '<div class="detail-header">';
                html += '<div class="detail-title">' + escapeHtml(assertion.title) + '</div>';
                html += '<div class="detail-meta">';
                html += '<span class="meta-item">Status: <span class="detail-status-badge">' + statusEmoji(assertion.status) + '</span></span>';
                html += '<span class="meta-item">Priority: <span class="detail-priority-badge">' + assertion.priority + '</span></span>';
                html += '<span class="meta-item">Parent: <strong>' + escapeHtml(assertion.parent) + '</strong></span>';
                html += '<span class="meta-item">Branch: <strong>' + escapeHtml(assertion.branch) + '</strong></span>';
                html += '<span class="meta-item">File: <strong>' + escapeHtml(assertion.file) + '</strong></span>';
                if (assertion.dependsOn) {
                    html += '<span class="meta-item">Depends On: <strong>' + escapeHtml(assertion.dependsOn) + '</strong></span>';
                }
                html += '</div>';
                html += '</div>';
                html += '<div class="detail-body markdown-body">' + DOMPurify.sanitize(marked.parse(assertion.content || '')) + '</div>';
                html += '</div>';
            }

            section.innerHTML = html;
        }

        // Build metro map SVGs per branch
        var metroMapCache = {};

        function getAssertionsByBranch() {
            var byBranch = {};
            for (var i = 0; i < assertions.length; i++) {
                var a = assertions[i];
                var branch = a.branch || 'main';
                if (!byBranch[branch]) {
                    byBranch[branch] = [];
                }
                byBranch[branch].push(a);
            }
            return byBranch;
        }

        var STATUS_COLORS = {
            not_started: '#64748b',
            in_progress: '#f59e0b',
            done: '#10b981',
            failed: '#ef4444',
            draft: '#94a3b8'
        };

        function generateMetroMapSVG(currentAssertionId, branchAssertions) {
            if (!branchAssertions || branchAssertions.length === 0) return '';

            var LAYER_SPACING = 120;
            var NODE_SPACING = 45;
            var TREE_GAP = 45;
            var PADDING_LEFT = 60;
            var PADDING_TOP = 30;
            var STATION_RADIUS = 8;
            var CURRENT_RADIUS = 10;
            var LABEL_OFFSET = 16;

            // Build parent-to-children map from dependsOn
            var childrenOf = {};
            var branchIds = {};
            for (var i = 0; i < branchAssertions.length; i++) {
                branchIds[branchAssertions[i].id] = true;
            }

            for (var i = 0; i < branchAssertions.length; i++) {
                var a = branchAssertions[i];
                if (a.dependsOn && branchIds[a.dependsOn]) {
                    if (!childrenOf[a.dependsOn]) {
                        childrenOf[a.dependsOn] = [];
                    }
                    childrenOf[a.dependsOn].push(a.id);
                }
            }

            // Find root nodes: no dependsOn or dependsOn not in this branch
            var roots = [];
            for (var i = 0; i < branchAssertions.length; i++) {
                var a = branchAssertions[i];
                if (!a.dependsOn || !branchIds[a.dependsOn]) {
                    roots.push(a.id);
                }
            }

            // Recursive tree layout
            var positions = {};
            var currentY = PADDING_TOP;

            function layoutTree(nodeId, depth) {
                var children = childrenOf[nodeId] || [];
                if (children.length === 0) {
                    var x = PADDING_LEFT + depth * LAYER_SPACING;
                    var y = currentY;
                    positions[nodeId] = { x: x, y: y };
                    currentY += NODE_SPACING;
                    return { minY: y, maxY: y };
                }

                var childBounds = [];
                for (var i = 0; i < children.length; i++) {
                    childBounds.push(layoutTree(children[i], depth + 1));
                }

                var firstChildMinY = childBounds[0].minY;
                var lastChildMaxY = childBounds[childBounds.length - 1].maxY;
                var centerY = (firstChildMinY + lastChildMaxY) / 2;
                var x = PADDING_LEFT + depth * LAYER_SPACING;
                positions[nodeId] = { x: x, y: centerY };

                return { minY: firstChildMinY, maxY: lastChildMaxY };
            }

            for (var ri = 0; ri < roots.length; ri++) {
                if (ri > 0) {
                    currentY += TREE_GAP;
                }
                layoutTree(roots[ri], 0);
            }

            // Determine terminal nodes (leaf nodes with no children)
            var terminalNodes = [];
            for (var i = 0; i < branchAssertions.length; i++) {
                var a = branchAssertions[i];
                if (!childrenOf[a.id] || childrenOf[a.id].length === 0) {
                    terminalNodes.push(a.id);
                }
            }

            // Calculate SVG dimensions
            var maxX = 0;
            var maxY = 0;
            for (var id in positions) {
                if (positions[id].x > maxX) maxX = positions[id].x;
                if (positions[id].y > maxY) maxY = positions[id].y;
            }

            // Add terminus column if multiple terminal nodes
            var hasTerminus = terminalNodes.length > 1;
            var terminusX = maxX + LAYER_SPACING;
            var terminusY = 0;
            if (hasTerminus) {
                var sumY = 0;
                for (var i = 0; i < terminalNodes.length; i++) {
                    sumY += positions[terminalNodes[i]].y;
                }
                terminusY = sumY / terminalNodes.length;
                maxX = terminusX;
                if (terminusY > maxY) maxY = terminusY;
            }

            var svgWidth = maxX + 300;
            var svgHeight = maxY + PADDING_TOP + 30;

            var svg = '<svg class="metro-map" width="' + svgWidth + '" height="' + svgHeight + '" viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '">';

            // Draw dependency lines
            for (var i = 0; i < branchAssertions.length; i++) {
                var a = branchAssertions[i];
                if (a.dependsOn && branchIds[a.dependsOn] && positions[a.dependsOn] && positions[a.id]) {
                    var from = positions[a.dependsOn];
                    var to = positions[a.id];

                    if (from.y === to.y) {
                        svg += '<line class="metro-dependency" x1="' + from.x + '" y1="' + from.y + '" x2="' + to.x + '" y2="' + to.y + '" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>';
                    } else {
                        var midX = (from.x + to.x) / 2;
                        var midY = (from.y + to.y) / 2;
                        svg += '<path class="metro-dependency" d="M' + from.x + ',' + from.y + ' Q' + midX + ',' + from.y + ' ' + midX + ',' + midY + ' T' + to.x + ',' + to.y + '" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>';
                    }
                }
            }

            // Draw terminus lines
            if (hasTerminus) {
                for (var i = 0; i < terminalNodes.length; i++) {
                    var from = positions[terminalNodes[i]];
                    if (from.y === terminusY) {
                        svg += '<line class="metro-dependency" x1="' + from.x + '" y1="' + from.y + '" x2="' + terminusX + '" y2="' + terminusY + '" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>';
                    } else {
                        var midX = (from.x + terminusX) / 2;
                        var midY = (from.y + terminusY) / 2;
                        svg += '<path class="metro-dependency" d="M' + from.x + ',' + from.y + ' Q' + midX + ',' + from.y + ' ' + midX + ',' + midY + ' T' + terminusX + ',' + terminusY + '" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>';
                    }
                }

                // Draw terminus node
                svg += '<g class="metro-terminus">';
                svg += '<circle cx="' + terminusX + '" cy="' + terminusY + '" r="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>';
                svg += '<text class="metro-label" x="' + (terminusX + 12) + '" y="' + (terminusY + 4) + '" font-size="11" fill="#94a3b8" font-style="italic">Done</text>';
                svg += '</g>';
            }

            // Draw stations
            for (var i = 0; i < branchAssertions.length; i++) {
                var a = branchAssertions[i];
                var pos = positions[a.id];
                if (!pos) continue;

                var isCurrent = a.id === currentAssertionId;
                var radius = isCurrent ? CURRENT_RADIUS : STATION_RADIUS;
                var fillColor = STATUS_COLORS[a.status] || STATUS_COLORS.not_started;
                var strokeWidth = isCurrent ? 4 : 3;
                var currentClass = isCurrent ? ' metro-station-current' : '';

                svg += '<g class="metro-station' + currentClass + '" data-assertion-id="' + escapeHtml(a.id) + '">';
                svg += '<title>' + escapeHtml(a.title) + ' (' + a.status + ')</title>';
                svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + radius + '" fill="' + fillColor + '" stroke="white" stroke-width="' + strokeWidth + '"/>';
                // Truncate label if too long
                var label = a.title;
                if (label.length > 35) {
                    label = label.substring(0, 32) + '...';
                }
                svg += '<text class="metro-label" x="' + (pos.x + LABEL_OFFSET) + '" y="' + (pos.y + 4) + '" font-size="11" fill="#475569">' + escapeHtml(label) + '</text>';
                svg += '</g>';
            }

            svg += '</svg>';
            return svg;
        }

        // Metro map state
        var metroMapState = {
            currentBranch: null,
            panStates: {}
        };

        function updateMetroMap(assertionId, branch) {
            var metroMapSection = document.getElementById('metro-map-section');
            var container = document.getElementById('metro-map-container');
            var branchNameEl = document.getElementById('metro-branch-name');

            metroMapSection.style.display = 'flex';
            branchNameEl.textContent = branch;

            // Get all assertions for this branch
            var byBranch = getAssertionsByBranch();
            var branchAssertions = byBranch[branch] || [];

            if (branchAssertions.length === 0) {
                container.innerHTML = '';
                return;
            }

            // Check if we need to switch branches
            if (metroMapState.currentBranch !== branch) {
                // Generate the SVG for this branch
                var svgHtml = generateMetroMapSVG(assertionId, branchAssertions);
                container.innerHTML = '<div class="metro-map-branch" id="metro-map-' + branch + '" data-branch="' + branch + '">' + svgHtml + '</div>';
                metroMapState.currentBranch = branch;

                // Restore pan state if exists
                var panState = metroMapState.panStates[branch];
                if (panState) {
                    var svg = container.querySelector('.metro-map');
                    if (svg) {
                        svg.style.transform = 'translate(' + panState.currentX + 'px, ' + panState.currentY + 'px)';
                    }
                }
            }

            // Update current station highlight
            var allStations = container.querySelectorAll('.metro-station');
            for (var i = 0; i < allStations.length; i++) {
                var station = allStations[i];
                var stationId = station.getAttribute('data-assertion-id');
                var circle = station.querySelector('circle');
                if (stationId === assertionId) {
                    station.classList.add('metro-station-current');
                    if (circle) {
                        circle.setAttribute('r', '10');
                        circle.setAttribute('stroke-width', '4');
                    }
                } else {
                    station.classList.remove('metro-station-current');
                    if (circle) {
                        circle.setAttribute('r', '8');
                        circle.setAttribute('stroke-width', '3');
                    }
                }
            }
        }

        function hideMetroMap() {
            var metroMapSection = document.getElementById('metro-map-section');
            metroMapSection.style.display = 'none';
        }

        // Initialize the UI
        buildTree();
        buildDetailPanels();

        // Mark completed specs
        function markCompletedSpecs() {
            var specItems = document.querySelectorAll('.spec-item');
            for (var i = 0; i < specItems.length; i++) {
                var specItem = specItems[i];
                var statusBadge = specItem.querySelector('.spec-header .status-badge');
                if (statusBadge && statusBadge.classList.contains('status-done')) {
                    specItem.classList.add('completed');
                }
            }
        }

        // Initialize completed specs toggle
        function initializeCompletedSpecsToggle() {
            var specTree = document.getElementById('spec-tree');
            var toggleCheckbox = document.getElementById('toggle-completed-specs');
            var hiddenCountElement = document.getElementById('hidden-count');

            markCompletedSpecs();

            var showCompleted = localStorage.getItem('spekkShowCompleted') === 'true';
            toggleCheckbox.checked = showCompleted;
            if (showCompleted) {
                specTree.classList.add('show-completed');
            }

            updateHiddenCount();

            toggleCheckbox.addEventListener('change', function() {
                var isChecked = this.checked;
                localStorage.setItem('spekkShowCompleted', isChecked.toString());

                if (isChecked) {
                    specTree.classList.add('show-completed');
                } else {
                    specTree.classList.remove('show-completed');
                }

                updateHiddenCount();
            });
        }

        function updateHiddenCount() {
            var hiddenCountElement = document.getElementById('hidden-count');
            var completedSpecs = document.querySelectorAll('.spec-item.completed');
            var isShowing = document.getElementById('spec-tree').classList.contains('show-completed');

            var completedCount = completedSpecs.length;

            if (completedCount > 0 && !isShowing) {
                hiddenCountElement.textContent = '(' + completedCount + ' completed ' + (completedCount === 1 ? 'spec' : 'specs') + ' hidden)';
