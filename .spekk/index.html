ader `\u003ch1\u003e` to include project name\n- Maintain \"Spec Explorer\" prefix for consistency\n\n### HTML Changes\n\n```html\n\u003c!-- Before --\u003e\n\u003ctitle\u003eSpec Explorer - Spekk\u003c/title\u003e\n\u003ch1\u003eSpec Tree\u003c/h1\u003e\n\n\u003c!-- After --\u003e  \n\u003ctitle\u003eSpec Explorer - spekk-cli\u003c/title\u003e\n\u003ch1\u003eSpec Tree - spekk-cli\u003c/h1\u003e\n```\n\n## Success Criteria\n\n- ✅ Run `spekk show` in different project directories\n- ✅ Browser tab shows unique title for each project\n- ✅ Page header includes project name\n- ✅ Can easily distinguish between multiple spekk explorer tabs","branch":"main","created":"2026-01-22T22:55:00Z"},{"id":"remove-priority-colors","parent":"simplified-display-formatting","title":"Remove Priority Number Color Coding","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/remove-priority-colors.md","content":"---\nid: remove-priority-colors\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:35:00Z\npriority: 2\nstatus: done\n---\n\n# Remove Priority Number Color Coding\n\nPriority numbers should be plain text without color-coded backgrounds or styling.\n\n## What Must Be True\n\nPriority badges display as plain numbers without visual emphasis through colors.\n\n### CSS Priority Styles\n- `.priority-1`, `.priority-2`, `.priority-3` classes have no colored backgrounds\n- No gradients, borders, or animations on priority badges\n- Priority numbers appear as neutral, unstyled text\n- Remove `urgent-glow` animation and colored styling\n\n### Plain Number Display\n- Priority badges show: `1`, `2`, `3` as plain text\n- No red/orange/green color coding\n- Consistent neutral styling across all priority levels\n- Focus on content, not visual hierarchy through color\n\n## Success Criteria\n\n- ✅ Run `spekk show` and verify priority numbers are not color-coded\n- ✅ All priority badges (1, 2, 3) have same neutral appearance  \n- ✅ No colored backgrounds, gradients, or animations\n- ✅ Priority display is minimal and clean","branch":"main","created":"2026-01-22T22:35:00Z"},{"id":"skip-assertions-in-draft-specs","parent":"simplified-display-formatting","title":"Skip Assertions in Draft Specs","status":"done","priority":1,"file":"specs/simplified-display-formatting/assertions/skip-assertions-in-draft-specs.md","content":"---\nid: skip-assertions-in-draft-specs\nparent: simplified-display-formatting\ncreated: 2026-01-22T23:10:00Z\npriority: 1\nstatus: done\n---\n\n# Skip Assertions in Draft Specs\n\nThe parser currently processes assertions from specs marked as `status: draft`, but should skip them entirely.\n\n## What Must Be True\n\nParser excludes all assertions from any spec with `status: draft` from work consideration.\n\n### Current Problem\n\n1. `parseAllSpecs()` reads ALL assertions regardless of parent spec status\n2. `findNextAssertion()` only filters individual assertions with `status: draft` \n3. Assertions from draft specs can still be picked up for work\n\n### Required Changes\n\n**In `findNextAssertion()` function:**\n- Before filtering assertions, also exclude assertions whose parent spec has `status: draft`\n- Check parent spec status in addition to assertion status\n- Filter logic: `!['done', 'draft'].includes(a.status) \u0026\u0026 parentSpec.status !== 'draft'`\n\n### Logic Update\n\n```javascript\nfunction findNextAssertion(assertions, specs) {\n  // Filter to incomplete items, excluding:\n  // - Assertions with status 'done' or 'draft'  \n  // - Assertions whose parent spec has status 'draft'\n  const incomplete = assertions.filter(a =\u003e {\n    if (['done', 'draft'].includes(a.status)) return false;\n    \n    const parentSpec = specs.find(s =\u003e s.id === a.parent);\n    if (parentSpec?.status === 'draft') return false;\n    \n    return true;\n  });\n  // ... rest of function\n}\n```\n\n### Function Signature Update\n\n- Update `findNextAssertion()` to accept both `assertions` and `specs` parameters\n- Update calls to pass both parameters: `findNextAssertion(assertions, specs)`\n\n## Success Criteria\n\n- ✅ Assertions from draft specs are never returned by `findNextAssertion()`\n- ✅ `spekk builder` ignores assertions in draft specs  \n- ✅ Draft specs serve as true \"planning/placeholder\" status\n- ✅ Function signature updated to accept specs parameter","branch":"main","created":"2026-01-22T23:10:00Z"},{"id":"update-failing-tests","parent":"simplified-display-formatting","title":"Update Failing Tests for Simplified Format","status":"done","priority":1,"file":"specs/simplified-display-formatting/assertions/update-failing-tests.md","content":"---\nid: update-failing-tests\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:40:00Z\npriority: 1\nstatus: done\n---\n\n# Update Failing Tests for Simplified Format\n\nThe Detail Badges Format test suite is failing because it expects the old HTML format with text labels and emojis.\n\n## What Must Be True\n\nTests validate the new simplified badge format instead of the old verbose format.\n\n### Test Updates Required\n\nFile: `src/__tests__/detail-badges-format.test.js`\n\n- **generateDetailStatusBadge tests** should expect: `\u003cspan class=\"detail-status-badge status-${status}\"\u003e${icon}\u003c/span\u003e`\n- **generateDetailPriorityBadge tests** should expect: `\u003cspan class=\"detail-priority-badge priority-${priority}\"\u003e${priority}\u003c/span\u003e`\n- **Status badge tests** should verify icon-only content (no text labels)\n- **Priority badge tests** should verify number-only content (no emojis)\n\n### Expected Test Behavior\n\n- Status badges contain only status icons (✅, 🚧, 📋, etc.)\n- Priority badges contain only numbers (1, 2, 3)\n- HTML structure matches our simplified format specification\n- All 4 failing test cases should pass\n\n## Success Criteria\n\n- ✅ Run `npm test` and all Detail Badges Format tests pass\n- ✅ Tests validate simplified format: priority number, status icon, title\n- ✅ No text labels or emoji decorations in test expectations  \n- ✅ CI pipeline passes completely","branch":"main","created":"2026-01-22T22:40:00Z"},{"id":"web-detail-badges-format","parent":"simplified-display-formatting","title":"Web Interface Detail Badges Format","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/web-detail-badges-format.md","content":"---\nid: web-detail-badges-format  \nparent: simplified-display-formatting\ncreated: 2026-01-22T22:33:00Z\npriority: 2\nstatus: done\n---\n\n# Web Interface Detail Badges Format\n\nThe detail panel badges in the spec explorer show simplified status and priority.\n\n## What Must Be True\n\nDetail view meta badges display simplified format without text labels or emoji decorations.\n\n### Status Detail Badge\n- Function `generateDetailStatusBadge()` returns: `\u003cspan class=\"detail-status-badge\"\u003e{status_icon}\u003c/span\u003e`\n- No text labels like \"done\", \"in progress\", \"not started\"\n- Only the status icon (✅, 🚧, 📋, etc.)\n\n### Priority Detail Badge  \n- Function `generateDetailPriorityBadge()` returns: `\u003cspan class=\"detail-priority-badge\"\u003e{priority}\u003c/span\u003e`\n- No emoji decorations like 🔥, ⚠️, 💡\n- Only the priority number (1, 2, 3)\n\n### Meta Display Format\n- Detail meta shows: `Status: {icon}` and `Priority: {number}`\n- Consistent with simplified format across the system\n\n**Tests:** src/__tests__/detail-badges-format.test.js\n\n## Success Criteria\n\n- ✅ Run `spekk show` and click on any spec/assertion\n- ✅ Status badge shows only icon (no text)  \n- ✅ Priority badge shows only number (no emoji)\n- ✅ Functions return simplified HTML markup\n- ✅ Detail view matches tree view formatting style","branch":"main","created":"2026-01-22T22:33:00Z"},{"id":"web-tree-display-format","parent":"simplified-display-formatting","title":"Web Interface Tree Display Format","status":"done","priority":2,"file":"specs/simplified-display-formatting/assertions/web-tree-display-format.md","content":"---\nid: web-tree-display-format\nparent: simplified-display-formatting\ncreated: 2026-01-22T22:32:00Z\npriority: 2\nstatus: done\n---\n\n# Web Interface Tree Display Format\n\nThe spec explorer web interface tree view displays items with simplified formatting.\n\n## What Must Be True\n\nTree view displays specs and assertions in the format: `{priority} {status_icon} {title}`\n\n### Spec Header Format\n- HTML renders: `\u003cspan class=\"priority-badge\"\u003e{priority}\u003c/span\u003e \u003cspan class=\"status-badge\"\u003e\u003c/span\u003e {title}`\n- Priority badge contains number only (no emojis)\n- Status badge shows icon via CSS (no text content)\n- Order: priority first, then status, then title\n\n### Assertion Item Format  \n- HTML renders same pattern for assertion items\n- Consistent ordering across specs and assertions\n- No text labels in status badges\n- No emoji content in priority badges\n\n## Success Criteria\n\n- ✅ Run `spekk show` and inspect tree view HTML\n- ✅ Priority badges contain only numbers: `\u003cspan\u003e1\u003c/span\u003e`, `\u003cspan\u003e2\u003c/span\u003e`, `\u003cspan\u003e3\u003c/span\u003e`\n- ✅ Status badges have no text content (icons via CSS)\n- ✅ Display order is: priority number, status icon, title\n- ✅ Format is consistent between specs and assertions","branch":"main","created":"2026-01-22T22:32:00Z"},{"id":"assertions-appear-as-subitems","parent":"spec-explorer-web-interface","title":"Assertions Appear as Sub-items","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/assertions-appear-as-subitems.md","content":"---\nid: assertions-appear-as-subitems\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 2\nstatus: done\n---\n\n# Assertions Appear as Sub-items\n\n## Assertion\n\nAssertions are displayed as sub-items under their parent specs in the tree structure.\n\n## Success Criteria\n\n- When a spec is expanded, its assertions appear as child nodes\n- Assertions are visually distinguished from specs (indentation, styling, icons)\n- Assertions are organized under the correct parent spec\n- Empty specs (with no assertions) can still be expanded but show appropriate messaging\n\n**Tests:** src/__tests__/assertions-appear-as-subitems.test.js\n\n## Test Plan\n\n- Expand a spec in the tree interface\n- Verify assertions appear as indented sub-items\n- Check that assertion names match those in the specs/[spec]/assertions/ directory\n- Confirm visual hierarchy is clear and intuitive","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"branch-metro-map-in-detail-panel","parent":"spec-explorer-web-interface","title":"Persistent Collapsible Metro Map in Detail Panel","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/branch-metro-map-in-detail-panel.md","content":"---\nid: branch-metro-map-in-detail-panel\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T19:00:00Z\npriority: 1\nstatus: done\nbranch: feature/dependency-visualization\n---\n\n# Persistent Collapsible Metro Map in Detail Panel\n\n## What Must Be True\n\nThe detail panel is split horizontally: a collapsible metro map section at the top, and scrollable assertion content below. The metro map persists across station clicks (no re-render), gives the dependency graph full panel width, and can be collapsed when the user wants to focus on content.\n\n## Success Criteria\n\n- 2-column layout: Tree (left) | Detail (right) — same as original\n- Detail panel split horizontally: metro map top, assertion content bottom\n- Metro map section takes full width of detail panel (~800px)\n- Metro map renders once per branch, NOT re-rendered when clicking stations\n- Clicking a station updates assertion content below AND toggles highlight class on map — no SVG re-render\n- Pan/zoom state preserved when navigating between assertions in same branch\n- Collapsible: toggle button collapses metro map to a thin \"Branch Dependencies ▶\" bar\n- Collapsed state saved in localStorage\n- When assertion has no applicable metro map (main branch, no deps), metro section shows the no-dependencies notice or is hidden\n- When switching to an assertion on a different branch, metro map re-renders for new branch\n- Compact vertical spacing: ~45px between independent trees (down from 70px)\n- Labels show assertion titles below each station\n\n## Visual Structure\n\n**Expanded (default):**\n```\n╔═══════════════╦═════════════════════════════════════════╗\n║ Tree Panel    ║ ▼ Branch Dependencies              [−] ║\n║               ║ ○───○───◉───○───●                      ║\n║ ▼ spec-a      ║      └──○───○───●                      ║\n║   assertion-1 ╠═════════════════════════════════════════╣\n║   assertion-2 ║ Chat Message Input                     ║\n║ ▼ spec-b      ║ Status: not_started  Priority: 2       ║\n║   assertion-3 ║                                        ║\n║               ║ ## What Must Be True                   ║\n║               ║ [content...]                           ║\n╚═══════════════╩═════════════════════════════════════════╝\n```\n\n**Collapsed:**\n```\n╔═══════════════╦═════════════════════════════════════════╗\n║ Tree Panel    ║ ▶ Branch Dependencies              [+] ║\n║               ╠═════════════════════════════════════════╣\n║ ▼ spec-a      ║ Chat Message Input                     ║\n║   assertion-1 ║ Status: not_started  Priority: 2       ║\n║   assertion-2 ║                                        ║\n║ ▼ spec-b      ║ ## What Must Be True                   ║\n║   assertion-3 ║ [content...]                           ║\n╚═══════════════╩═════════════════════════════════════════╝\n```\n\n## Layout Rules\n\n**Container:**\n- Keep existing `max-width: 1200px` container\n- Tree panel: ~400px fixed width (unchanged)\n- Detail panel: flex: 1\n\n**Detail panel structure:**\n- `.metro-map-section` at top: collapsible, with pan-and-zoom\n- `.detail-content-section` below: scrollable, fills remaining height\n- Divider border between sections\n\n**Metro map section (expanded):**\n- Max-height: ~300px (constrains vertical space)\n- `overflow: hidden` with pan-and-zoom for navigation\n- Background: `#f8fafc`\n- Collapsible header bar with toggle arrow and \"Branch Dependencies\" label\n- Full width of detail panel for generous horizontal space\n\n**Compact spacing:**\n- Tree spacing (vertical between independent chains): 45px\n- Layer spacing (horizontal between dependency levels): 120px\n- Station radius: 8px (normal), 10px (selected)\n\n## Collapse Behavior\n\n- Toggle button in header bar: `▼`/`▶` arrow or `[−]`/`[+]` icon\n- Collapsed: metro map section shrinks to header bar only (~36px height)\n- Expanded: metro map section shows at configured max-height\n- Transition: smooth height animation\n- State persisted: `localStorage.setItem('spekkMetroMapCollapsed', 'true/false')`\n- Default: expanded\n\n## Implementation Notes\n\n- Generate ONE metro map SVG per branch, embedded in `.metro-map-section`\n- On `showDetail()`, update `.detail-content-section` content AND toggle `.metro-station-current` class on stations\n- The metro map SVG element stays in the DOM across `showDetail()` calls\n- When assertion's branch changes, regenerate the metro map SVG\n- Pan-and-zoom handlers attached to `.metro-map-section` container\n- Metro map section header shows branch name: \"Branch Dependencies — feature/dependency-visualization\"\n","branch":"feature/dependency-visualization","created":"2026-02-25T19:00:00Z"},{"id":"clickable-metro-map-stations","parent":"spec-explorer-web-interface","title":"Clickable Metro Map Stations","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/clickable-metro-map-stations.md","content":"---\nid: clickable-metro-map-stations\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T19:01:00Z\npriority: 2\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Clickable Metro Map Stations\n\n## What Must Be True\n\nStations in the persistent metro map column are clickable and navigate to that assertion's detail view without re-rendering the metro map SVG or losing pan/zoom state.\n\n## Success Criteria\n\n- Clicking a station updates the detail panel (center column) to show that assertion\n- Metro map SVG is NOT re-rendered — only CSS classes are toggled\n- Previously selected station loses highlight; newly selected station gains highlight\n- Selected station: glow effect + thicker stroke (via `.metro-station-current` class)\n- Pan/zoom position is preserved across station clicks\n- Tree view (left panel) updates to show the clicked assertion as selected\n- If clicked assertion's parent spec is collapsed in tree, expand it\n- Cursor changes to pointer on station hover\n\n## Behavior Example\n\nUser viewing `chat-session-model`:\n1. Sees persistent metro map in right column with all branch assertions\n2. Clicks `chat-message-input` station in metro map\n3. Detail panel (center) updates to show `chat-message-input` content\n4. Metro map stays in place — only the highlight class moves to new station\n5. Pan/zoom position unchanged\n6. Tree view highlights `chat-message-input` item\n\n## Implementation Notes\n\n- `showDetail()` already updates detail panel — add class toggling logic:\n  ```javascript\n  // Remove current highlight from all stations\n  document.querySelectorAll('.metro-station-current').forEach(el =\u003e {\n    el.classList.remove('metro-station-current');\n  });\n  // Add highlight to clicked station\n  const station = document.querySelector(`.metro-station[data-assertion-id=\"${id}\"]`);\n  if (station) station.classList.add('metro-station-current');\n  ```\n- Station click handlers use existing event delegation on `data-action=\"show-detail\"`\n- No SVG regeneration — the metro map column content stays untouched\n- CSS for current station:\n  ```css\n  .metro-station-current circle {\n    stroke: #2563eb;\n    stroke-width: 4;\n    filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.6));\n  }\n  ```\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T19:01:00Z"},{"id":"clicking-shows-details-panel","parent":"spec-explorer-web-interface","title":"Clicking Shows Details Panel","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/clicking-shows-details-panel.md","content":"---\nid: clicking-shows-details-panel\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 2\nstatus: done\n---\n\n# Clicking Shows Details Panel\n\n## Assertion\n\nClicking on any spec or assertion displays its details in a right-side panel using event delegation with data attributes.\n\n## Success Criteria\n\n- Interface has a dedicated right panel for displaying details\n- Clicking any tree item (spec or assertion) updates the detail panel via event delegation\n- Detail panel shows the full content of the clicked item\n- Panel includes metadata like creation date, priority, status\n- Selected item is visually highlighted in the tree\n- **Uses data attributes for click handling (e.g., `data-action=\"show-detail\"`, `data-assertion-id=\"...\"`)** \n- **No inline onclick handlers for detail panel functionality**\n- **Event delegation handles all detail panel clicks via document listener**\n\n**Tests:** src/__tests__/clicking-shows-details-panel.test.js\n\n## Test Plan\n\n- Click various specs and assertions in the tree\n- Verify detail panel updates with correct content\n- Check that metadata is displayed properly\n- Confirm visual selection feedback in tree","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"creates-spekk-directory-automatically","parent":"spec-explorer-web-interface","title":"Creates .spekk Directory Automatically","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/creates-spekk-directory-automatically.md","content":"---\nid: creates-spekk-directory-automatically\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 1\nstatus: done\n---\n\n# Creates .spekk Directory Automatically\n\n## Assertion\n\nThe command creates the `.spekk/` directory automatically if it doesn't exist.\n\n## Success Criteria\n\n- Running `spekk show` in a directory without `.spekk/` creates the directory\n- No error occurs when `.spekk/` directory already exists\n- Directory is created with appropriate permissions\n\n## Test Plan\n\n```bash\n# Test creation\nrm -rf .spekk\nspekk show\ntest -d .spekk\n\n# Test existing directory\nspekk show  # Should not error\n```\n\n**Tests:** src/__tests__/show-command.test.js","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"displays-spec-tree-with-dropdowns","parent":"spec-explorer-web-interface","title":"Displays Spec Tree with Expandable Dropdowns","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/displays-spec-tree-with-dropdowns.md","content":"---\nid: displays-spec-tree-with-dropdowns\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 2\nstatus: done\n---\n\n# Displays Spec Tree with Expandable Dropdowns\n\n## Assertion\n\nThe generated HTML displays all specs as an expandable tree structure with dropdown functionality using modern event delegation instead of inline event handlers.\n\n## Success Criteria\n\n- Each spec appears as a top-level tree item\n- Tree items can be expanded/collapsed to show/hide children\n- Visual indicators show expanded/collapsed state (arrows, icons, etc.)\n- Tree structure reflects the actual spec hierarchy from the specs/ directory\n- **Uses data attributes instead of onclick handlers (e.g., `data-spec-id=\"spec-parser\"`, `data-action=\"toggle-spec\"`)**\n- **JavaScript uses event delegation with a single document event listener**\n- **No inline onclick attributes in the generated HTML**\n- **No \"Uncaught SyntaxError\" errors in browser console**\n- **All dropdown toggles work correctly via event delegation**\n\n## Implementation Approach\n\n### HTML Structure (No Inline Handlers)\n```html\n\u003cdiv class=\"spec-header\" data-spec-id=\"spec-parser\" data-action=\"toggle-spec\"\u003e\n  \u003cspan class=\"toggle-icon\" id=\"toggle-spec-parser\"\u003e▶\u003c/span\u003e\n  \u003c!-- ... --\u003e\n\u003c/div\u003e\n\n\u003cli class=\"assertion-item\" data-assertion-id=\"enforces-folder-structure\" data-action=\"show-detail\"\u003e\n  \u003c!-- ... --\u003e\n\u003c/li\u003e\n```\n\n### JavaScript Event Delegation\n```javascript\ndocument.addEventListener('click', function(event) {\n  const action = event.target.closest('[data-action]')?.getAttribute('data-action');\n  \n  if (action === 'toggle-spec') {\n    const specId = event.target.closest('[data-spec-id]').getAttribute('data-spec-id');\n    toggleSpec(specId, event);\n  } else if (action === 'show-detail') {\n    const assertionId = event.target.closest('[data-assertion-id]').getAttribute('data-assertion-id');\n    showDetail(assertionId, 'assertion', event);\n  }\n});\n```\n\n## Test Plan\n\n- Open generated HTML in browser\n- Verify all specs from specs/ directory appear in tree\n- Click to expand/collapse tree items using event delegation\n- Confirm visual feedback for interaction states\n- **Check browser console for JavaScript errors (should be none)**\n- **Verify no onclick attributes exist in generated HTML**\n- **Test all dropdown toggles function properly via data attributes**","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"emphasizes-status-and-priority-visually","parent":"spec-explorer-web-interface","title":"Emphasizes Status and Priority Visually","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/emphasizes-status-and-priority-visually.md","content":"---\nid: emphasizes-status-and-priority-visually\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 2\nstatus: done\n---\n\n# Emphasizes Status and Priority Visually\n\n## Assertion\n\nThe interface uses visual indicators to clearly show the status and priority of each spec and assertion.\n\n## Success Criteria\n\n- Different status values (not_started, in_progress, done) have distinct visual indicators (colors, icons, badges)\n- Priority levels (1, 2, 3) are visually differentiated \n- Visual indicators are consistent throughout the interface\n- Status and priority are visible both in tree view and detail panel\n- High priority or in-progress items are easily identifiable at a glance\n\n## Test Plan\n\n- Verify color coding or icons for different statuses\n- Check that priority levels have visual distinction\n- Confirm indicators appear in both tree and detail views\n- Test with specs/assertions having different status/priority combinations","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"generates-index-html-file","parent":"spec-explorer-web-interface","title":"Generates index.html File","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/generates-index-html-file.md","content":"---\nid: generates-index-html-file\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 1\nstatus: done\n---\n\n# Generates index.html File\n\n## Assertion\n\nThe command generates a valid HTML file at `.spekk/index.html` containing the spec explorer interface.\n\n## Success Criteria\n\n- File `.spekk/index.html` exists after running `spekk show`\n- Generated HTML is valid and well-formed\n- HTML includes necessary CSS and JavaScript for interactive functionality\n- File is overwritten on subsequent runs (not appended to)\n\n## Test Plan\n\n**Tests:** src/__tests__/show-command.test.js\n\n```bash\nspekk show\ntest -f .spekk/index.html\n# Validate HTML structure\ngrep -q \"\u003chtml\" .spekk/index.html\ngrep -q \"spec.*tree\" .spekk/index.html\n```","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"hide-completed-specs-toggle","parent":"spec-explorer-web-interface","title":"Hide Completed Specs Toggle","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/hide-completed-specs-toggle.md","content":"---\nid: hide-completed-specs-toggle\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T19:10:00Z\npriority: 2\nstatus: done\nbranch: feature/dependency-visualization\n---\n\n# Hide Completed Specs Toggle\n\n## What Must Be True\n\nThe spec tree view hides completed specs by default and includes a toggle to show/hide them.\n\n## Success Criteria\n\n- ✅ Specs with `status: done` are hidden by default on page load\n- ✅ Toggle checkbox appears in tree panel header: \"☐ Show completed specs\"\n- ✅ Checking toggle reveals all completed specs in tree\n- ✅ Unchecking toggle hides completed specs again\n- ✅ Toggle state persists in browser localStorage\n- ✅ Completed assertions within visible specs remain visible\n- ✅ Filter only applies to parent specs (not individual assertions)\n- ✅ Tree count updates to reflect filtered view: \"X specs, Y assertions (Z completed hidden)\"\n\n## Visual Example\n\n**Header with toggle:**\n```\n┌─────────────────────────────────┐\n│ Spec Tree - spekk-cli           │\n│ 5 specs, 12 assertions          │\n│ (8 completed specs hidden)      │\n│                                 │\n│ ☐ Show completed specs          │\n└─────────────────────────────────┘\n```\n\n**Default (completed hidden):**\n- spec-parser ✅ → hidden\n- builder-agent ✅ → hidden\n- authentication ⚠️ → visible (in progress)\n\n**Toggle checked (show all):**\n- spec-parser ✅ → visible\n- builder-agent ✅ → visible\n- authentication ⚠️ → visible\n\n## Behavior Rules\n\n- A spec is considered \"completed\" when ALL its assertions are done\n- Specs with any non-done assertion always visible\n- Spec status is computed from assertions (already handled by parser)\n- Hide/show applies visual state only (don't re-parse data)\n\n## Implementation Notes\n\n- Use CSS class `.spec-item.completed` with `display: none` by default\n- Add checkbox in tree panel header\n- JavaScript toggles visibility by adding/removing `.show-completed` class on container\n- Store preference: `localStorage.setItem('spekkShowCompleted', 'true/false')`\n- Update counter text dynamically based on visible items\n- Completed assertions within in-progress specs remain visible (important for context)\n","branch":"feature/dependency-visualization","created":"2026-02-25T19:10:00Z"},{"id":"hide-metro-map-for-ungrouped-assertions","parent":"spec-explorer-web-interface","title":"Hide Metro Map for Ungrouped Assertions","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/hide-metro-map-for-ungrouped-assertions.md","content":"---\nid: hide-metro-map-for-ungrouped-assertions\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:01:00Z\npriority: 1\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Hide Metro Map for Ungrouped Assertions\n\n## What Must Be True\n\nWhen an assertion has no `branch` field (defaults to main) and there are many unrelated main assertions, the metro map is hidden and replaced with a notice explaining why.\n\n## Success Criteria\n\n- ✅ If assertion has no branch field (or `branch: main`), check if branch is meaningful\n- ✅ A branch is \"meaningful\" if it has dependencies between its assertions\n- ✅ If branch has no dependencies (all isolated assertions), hide metro map\n- ✅ Show notice: \"ℹ️ No branch dependencies to visualize. This assertion is on the main branch with no related dependencies.\"\n- ✅ If assertion has `branch: feature/xyz`, always show metro map (even without deps)\n- ✅ Notice is styled distinctly (light blue background, info icon)\n\n## Rationale\n\nMain branch often has many unrelated completed specs. Showing all of them in the metro map creates a useless horizontal line of dots with no connections. Better to hide it and explain why.\n\n## Logic\n\n```javascript\nfunction shouldShowMetroMap(assertion, branchAssertions) {\n  // Always show for feature branches\n  if (assertion.branch \u0026\u0026 assertion.branch !== 'main') {\n    return true;\n  }\n\n  // For main branch, only show if there are dependencies\n  const hasDependencies = branchAssertions.some(a =\u003e a.dependsOn);\n  return hasDependencies;\n}\n```\n\n## Visual Example\n\n**Notice instead of metro map:**\n```\n╔══════════════════════════════════╗\n║ My Assertion                     ║\n║ Status: done  Priority: 1        ║\n║ Branch: main                     ║\n╠══════════════════════════════════╣\n║ ℹ️ No branch dependencies       ║\n║                                  ║\n║ This assertion is on the main    ║\n║ branch with no related           ║\n║ dependencies. Branch dependencies║\n║ are shown for feature branches   ║\n║ and main branch assertions with  ║\n║ dependency chains.               ║\n╠══════════════════════════════════╣\n║ ## What Must Be True             ║\n║ [assertion content...]           ║\n╚══════════════════════════════════╝\n```\n\n## Implementation Notes\n\n- Check `shouldShowMetroMap()` before generating metro map SVG\n- If false, generate notice HTML instead\n- Notice should be visually distinct but not alarming (info, not warning)\n- Consider adding link to docs about branch organization\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T20:01:00Z"},{"id":"metro-map-pan-and-zoom","parent":"spec-explorer-web-interface","title":"Metro Map Pan and Zoom","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/metro-map-pan-and-zoom.md","content":"---\nid: metro-map-pan-and-zoom\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:31:00Z\npriority: 1\nstatus: done\ndepends-on: metro-map-scrollable-viewport\nbranch: feature/dependency-visualization\n---\n\n# Metro Map Pan and Zoom\n\n## What Must Be True\n\nThe metro map column supports click-and-drag panning in both directions. Pan bounds are computed from the actual rendered tree layout height so all nodes are reachable with generous margin.\n\n## Success Criteria\n\n- Click and drag anywhere on metro map column to pan\n- Panning works in both horizontal and vertical directions\n- Cursor changes to grab/grabbing during drag\n- Clicking stations still works (doesn't trigger pan)\n- **Pan bounds computed from actual tree layout dimensions after all nodes are positioned**\n- **Bottom nodes fully visible when panned to lowest position**\n- **All edges (top, left, right, bottom) have ≥60px breathing room beyond outermost nodes**\n- Pan state preserved when clicking stations (no reset)\n- Optional: Mouse wheel for vertical scrolling\n- Optional: Pinch-to-zoom on trackpad\n\n## Bound Calculation\n\nPan limits must be derived from the actual SVG content dimensions, not hardcoded:\n\n```javascript\nfunction calculatePanBounds(mapContainer, svg) {\n  const containerRect = mapContainer.getBoundingClientRect();\n  const svgWidth = svg.getAttribute('width');\n  const svgHeight = svg.getAttribute('height');\n\n  const EDGE_MARGIN = 60; // Extra breathing room beyond content\n\n  return {\n    minX: Math.min(0, containerRect.width - svgWidth - EDGE_MARGIN),\n    maxX: EDGE_MARGIN,\n    minY: Math.min(0, containerRect.height - svgHeight - EDGE_MARGIN),\n    maxY: EDGE_MARGIN\n  };\n}\n```\n\n**Critical:** The SVG `width` and `height` attributes must reflect the full computed layout:\n```javascript\n// After computing all node positions\nconst maxX = Math.max(...positions.map(p =\u003e p.x));\nconst maxY = Math.max(...positions.map(p =\u003e p.y));\nconst EDGE_PADDING = 60;\n\nconst svgWidth = maxX + EDGE_PADDING * 2;\nconst svgHeight = maxY + EDGE_PADDING * 2;\n```\n\nThis ensures the SVG is sized to contain all nodes with padding, and pan bounds allow reaching every node.\n\n## Current Bug: Bottom Nodes Cut Off\n\n**Root cause:** SVG height doesn't account for the full tree extent plus padding. When many independent trees stack vertically, the total height can be very large (8000px+) but the pan bounds don't allow scrolling far enough to reveal bottom nodes.\n\n**Fix:** Compute `maxY` from actual positioned nodes after the full layout pass, add `EDGE_PADDING` on all sides, and use these real dimensions for both SVG sizing and pan bound calculation.\n\n## Implementation Notes\n\n- Pan handlers live on the metro map column (third column), not the detail panel\n- Use `requestAnimationFrame` for smooth updates\n- Pan state is column-level — persists across `showDetail()` calls\n- Recalculate bounds when metro map SVG changes (branch switch)\n- Ensure clicking stations doesn't trigger pan (check for `.metro-station` target)\n","branch":"feature/dependency-visualization","dependsOn":"metro-map-scrollable-viewport","created":"2026-02-25T20:31:00Z"},{"id":"metro-map-scrollable-viewport","parent":"spec-explorer-web-interface","title":"Metro Map Collapsible \u0026 Resizable Viewport","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/metro-map-scrollable-viewport.md","content":"---\nid: metro-map-scrollable-viewport\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:00:00Z\npriority: 1\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Metro Map Collapsible \u0026 Resizable Viewport\n\n**Tests:** src/__tests__/metro-map-scrollable-viewport.test.js\n\n## What Must Be True\n\nThe metro map section at the top of the detail panel has a constrained height with pan-and-zoom for navigation, can be collapsed to a thin header bar, and is resizable via a drag handle on the divider.\n\n## Success Criteria\n\n- Metro map section has default height ~300px when expanded\n- `overflow: hidden` — no scrollbars, pan-and-zoom handles navigation\n- Background: `#f8fafc` with border separating it from content below\n- Full width of detail panel (~800px)\n- Collapsible header bar with toggle: \"▼ Branch Dependencies — {branch-name}\"\n- Collapsed state: ~36px header-only bar, \"▶ Branch Dependencies\"\n- Collapse/expand has smooth height transition\n- Collapsed state persisted in localStorage\n- **Drag handle on the divider between metro map and assertion content**\n- **Dragging the handle resizes the metro map section height**\n- **Height constrained between 100px min and 600px max**\n- **Custom height persisted in localStorage**\n- **Cursor changes to `ns-resize` on handle hover and during drag**\n- **Text selection disabled during drag (prevent accidental highlighting)**\n- When metro map is not applicable, section is hidden entirely or shows notice\n- SVG has dynamic width/height based on tree layout dimensions\n\n## Visual Structure\n\n**Expanded with drag handle:**\n```\n╔═══════════════════════════════════════════════╗\n║ ▼ Branch Dependencies — feature/dep-viz  [−] ║\n║ ┌───────────────────────────────────────────┐ ║\n║ │ ○───○───◉───○───●                         │ ║\n║ │      └──○───○───●   [pan-and-zoom canvas] │ ║\n║ │ ○───○───●                                 │ ║\n║ └───────────────────────────────────────────┘ ║\n╠═══════════╤═══════════════════════════════════╣ ← drag handle\n║ [assertion content below]                     ║\n╚═══════════════════════════════════════════════╝\n```\n\n**Collapsed:**\n```\n╔═══════════════════════════════════════════════╗\n║ ▶ Branch Dependencies — feature/dep-viz  [+] ║\n╠═══════════════════════════════════════════════╣\n║ [assertion content below]                     ║\n╚═══════════════════════════════════════════════╝\n```\n\n## Drag Handle\n\n- Thin bar (~6px) on the bottom edge of the metro map section\n- Styled subtly: slightly darker border or a small grip icon (three horizontal dots)\n- Cursor: `ns-resize` on hover\n- During drag: body cursor locked to `ns-resize`, `user-select: none` on body\n- On mouseup: save new height to `localStorage.setItem('spekkMetroMapHeight', px)`\n- On page load: restore height from localStorage (fallback to 300px default)\n- When collapsed, drag handle is hidden\n\n## Implementation Notes\n\n- CSS for metro map section:\n  ```css\n  .metro-map-section {\n    height: 300px; /* default, overridden by localStorage */\n    min-height: 100px;\n    max-height: 600px;\n    overflow: hidden;\n    background: #f8fafc;\n    position: relative;\n    cursor: grab;\n    transition: height 0.3s ease;\n  }\n\n  .metro-map-section.collapsed {\n    height: 36px;\n    min-height: 36px;\n    cursor: default;\n    overflow: hidden;\n  }\n\n  .metro-map-resize-handle {\n    height: 6px;\n    cursor: ns-resize;\n    background: #e2e8f0;\n    border-bottom: 1px solid #cbd5e1;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n\n  .metro-map-resize-handle:hover {\n    background: #cbd5e1;\n  }\n  ```\n- Drag JS (~30 lines): mousedown on handle, mousemove updates section height, mouseup saves\n- Disable `transition` during drag for responsive feel, re-enable on mouseup\n- Pan-and-zoom handlers attached to `.metro-map-section`\n- When collapsed, pan-and-zoom and resize are disabled\n- When branch changes, replace SVG content and reset pan position\n- Visibility controlled by `shouldShowMetroMap()` logic\n- Toggle click handler on `.metro-map-header` bar\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T20:00:00Z"},{"id":"metro-map-station-tooltips","parent":"spec-explorer-web-interface","title":"Metro Map Station Tooltips","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/metro-map-station-tooltips.md","content":"---\nid: metro-map-station-tooltips\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:03:00Z\npriority: 2\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Metro Map Station Tooltips\n\n## What Must Be True\n\nHovering over a metro station shows a tooltip with the full assertion title, since titles are truncated in the visual.\n\n## Success Criteria\n\n- ✅ Tooltip appears on station hover\n- ✅ Shows full assertion title (not truncated)\n- ✅ Positioned above the station dot\n- ✅ Styled with dark background, white text, rounded corners\n- ✅ Smooth fade in/out animation\n- ✅ Tooltip doesn't cause layout shift or shake\n- ✅ Disappears when mouse leaves station\n\n## Visual Example\n\n```\n     ┌─────────────────────────┐\n     │ chat-message-input      │  ← Tooltip\n     └─────────┬───────────────┘\n               ↓\n              ◉  ← Station (hovered)\n          chat-me...\n```\n\n## Implementation\n\n**CSS:**\n```css\n.metro-station {\n  position: relative;\n}\n\n.metro-station-tooltip {\n  position: absolute;\n  bottom: calc(100% + 10px);\n  left: 50%;\n  transform: translateX(-50%);\n  background: #1e293b;\n  color: white;\n  padding: 6px 12px;\n  border-radius: 6px;\n  font-size: 11px;\n  white-space: nowrap;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.2s;\n  z-index: 100;\n}\n\n.metro-station:hover .metro-station-tooltip {\n  opacity: 1;\n}\n\n.metro-station-tooltip::after {\n  /* Arrow pointing down */\n  content: '';\n  position: absolute;\n  top: 100%;\n  left: 50%;\n  transform: translateX(-50%);\n  border: 5px solid transparent;\n  border-top-color: #1e293b;\n}\n```\n\n**HTML in SVG:**\nOption 1 - Use `\u003ctitle\u003e` element (native SVG tooltip):\n```xml\n\u003cg class=\"metro-station\"\u003e\n  \u003ctitle\u003eFull assertion title here\u003c/title\u003e\n  \u003ccircle class=\"station-dot\" r=\"8\"/\u003e\n  \u003ctext\u003eTruncated...\u003c/text\u003e\n\u003c/g\u003e\n```\n\nOption 2 - Use HTML overlay (more control):\n- Add `data-title=\"Full title\"` to `\u003cg\u003e` element\n- JavaScript creates HTML tooltip on hover\n- Position based on SVG element coordinates\n\n## Implementation Notes\n\n- SVG `\u003ctitle\u003e` is easiest but has limited styling\n- HTML overlay gives more control over appearance\n- Ensure tooltip doesn't interfere with hover shake fix\n- Use `pointer-events: none` on tooltip to prevent hover conflicts\n- Consider max-width and text wrapping for very long titles\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T20:03:00Z"},{"id":"metro-stations-have-stable-hover-state","parent":"spec-explorer-web-interface","title":"Metro Stations Have Stable Hover State","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/metro-stations-have-stable-hover-state.md","content":"---\nid: metro-stations-have-stable-hover-state\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:30:00Z\npriority: 1\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Metro Stations Have Stable Hover State\n\n## What Must Be True\n\nMetro station nodes remain visually stable when hovered - no shake, jitter, or position changes occur. Stations are clickable without \"running away\" from the cursor.\n\n## Success Criteria\n\n- ✅ Hovering over any metro station (including terminals) produces zero shake or jitter\n- ✅ Hover effect is smooth with no visual position changes\n- ✅ Cursor remains stable over station dots - elements don't \"run away\"\n- ✅ Only color/fill changes on hover, no transform properties\n- ✅ Stations with long names remain stable (no text-based reflow)\n- ✅ Terminal convergence nodes are stable and clickable\n\n## Current Bug\n\n**Symptoms:**\n- Hovering over terminal stations causes rapid shaking/jitter\n- Element appears to \"run away\" from cursor\n- Stations become unclickable due to movement\n\n**Root cause:**\n- CSS still uses `transform: scale(1.15)` on hover\n- Scaling changes SVG bounding box mid-hover\n- Creates feedback loop: hover → scale → boundary shifts → no longer hovering → scale back → repeat\n\n## Implementation\n\n**CSS approach (fixed):**\n- **Remove all transform-based hover effects** - no `transform: scale()`, no `transform-origin`\n- Pure CSS fill/stroke transition on hover\n- No filters, shadows, or transforms that could cause reflow\n- Target only `circle` fill property, not parent `\u003cg\u003e` element\n\n**Why this works:**\n- No coordinate transformations = no SVG recalculation\n- No layout/boundary changes = no reflow\n- Simple CSS property change = stable rendering\n- Isolated to circle fill = no parent boundary changes\n\n**Code:**\n```css\n.metro-station {\n    cursor: pointer;\n    /* NO transition, transform-origin, or transform-box properties */\n}\n\n.metro-station circle {\n    transition: fill 0.15s;\n}\n\n.metro-station:hover circle {\n    fill: #2563eb; /* Only change fill color */\n}\n\n/* Ensure no hover transforms on any metro elements */\n.metro-station:hover {\n    /* NO transform: scale() or any transform property */\n}\n```\n\n## Tests\n\n**Manual verification:**\n1. Open spec explorer metro map view\n2. Hover over various stations, especially terminals at convergence points\n3. Verify zero shake/jitter\n4. Verify stations remain clickable while hovering\n5. Move cursor slowly across station - should remain stable\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T20:30:00Z"},{"id":"metro-tracks-use-distinct-colors","parent":"spec-explorer-web-interface","title":"Metro Map Uses Tree-Stacking Layout with Uniform Gray Lines","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/metro-tracks-use-distinct-colors.md","content":"---\nid: metro-tracks-use-distinct-colors\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T21:00:00Z\npriority: 1\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Metro Map Uses Tree-Stacking Layout with Uniform Gray Lines\n\n## What Must Be True\n\nIndependent dependency trees are laid out as complete, self-contained units stacked vertically. Each tree occupies its own vertical band — no two trees share Y-space, making visual overlap between trees structurally impossible. Within a tree that has internal branching (one parent with multiple children), branches fan out vertically with enough space allocated so they never collide with adjacent trees.\n\nAll dependency lines (tracks) are uniform gray (`#94a3b8`). There are no per-track colors — visual distinction comes from the spatial layout, not line color.\n\n## Success Criteria\n\n- Independent trees are identified by their root nodes (assertions with no `dependsOn`)\n- Each independent tree is rendered as a complete unit before the next tree begins\n- Trees are stacked vertically — tree N's entire vertical extent is above tree N+1's start\n- Within a branching tree, children of a shared parent each get their own Y row\n- The shared parent node sits at the vertical center of its children's Y range\n- No two nodes from different trees ever occupy the same Y position\n- Horizontal position reflects dependency depth (left-to-right flow)\n- No dead/unused layout code exists in the codebase (e.g., unused Sugiyama functions, unused color palette/track-color assignment code)\n- All dependency lines use uniform gray color (`#94a3b8`, opacity 0.4, stroke-width 3)\n- No per-track color assignment logic exists for dependency lines\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T21:00:00Z"},{"id":"no-browser-in-tests","parent":"spec-explorer-web-interface","title":"Tests Never Open the Browser","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/no-browser-in-tests.md","content":"---\nid: no-browser-in-tests\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T01:00:00Z\npriority: 1\nstatus: done\n---\n\n# Tests Never Open the Browser\n\nRunning `npm test` never triggers the system browser to open. This is a side effect that steals focus and disrupts developer workflow.\n\n## Success Criteria\n\n- `showSpekk()` does not call `openInBrowser()` when `NODE_ENV=test` or `CI=true`\n- All test files that exercise HTML generation import `generateSpecExplorerHTML` directly instead of calling `showSpekk()`\n- `npm test` can run without any browser windows opening\n- The \"opens browser\" test in `show-command.test.js` validates the mechanism exists (e.g., `openInBrowser` is a function) without actually spawning a browser process\n- No other tests call `spekk show` via `execSync` without suppressing browser opening\n","branch":"main","created":"2026-02-25T01:00:00Z"},{"id":"opens-html-in-default-browser","parent":"spec-explorer-web-interface","title":"Opens HTML in Default Browser","status":"done","priority":3,"file":"specs/spec-explorer-web-interface/assertions/opens-html-in-default-browser.md","content":"---\nid: opens-html-in-default-browser\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 3\nstatus: done\n---\n\n# Opens HTML in Default Browser\n\n## Assertion\n\nThe command automatically opens the generated HTML file in the system's default browser after generation.\n\n## Success Criteria\n\n- After running `spekk show`, the default browser launches automatically\n- Browser opens to the correct local file path (`.spekk/index.html`)\n- Works across different operating systems (macOS, Linux, Windows)\n- Command completes successfully even if browser fails to open\n- No browser windows open if generation fails\n\n## Test Plan\n\n**Tests:** src/__tests__/show-command.test.js\n\n```bash\nspekk show\n# Verify browser opens with correct file\n# Test on different platforms if possible\n```","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"searchbar-filters-spec-tree","parent":"spec-explorer-web-interface","title":"Searchbar Filters Spec Tree","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/searchbar-filters-spec-tree.md","content":"---\nid: searchbar-filters-spec-tree\nparent: spec-explorer-web-interface\ncreated: 2026-02-26T20:00:00Z\npriority: 2\nstatus: done\nbranch: feature/spec-searchbar\n---\n\n# Searchbar Filters Spec Tree\n\n**Tests:** src/__tests__/searchbar-filters-spec-tree.test.js\n\n## What Must Be True\n\nA text input in the tree panel allows real-time filtering of specs and assertions by name, content, and status.\n\n## Success Criteria\n\n- Search input appears in the tree panel header, below the \"Show completed specs\" toggle and above the spec tree list\n- Placeholder text reads \"Search specs...\"\n- Typing filters the spec tree in real-time (case-insensitive substring match)\n- Search matches against spec names, assertion names, status, and priority\n- Search overrides the \"hide completed\" toggle — matching completed specs become visible during an active search\n- Clearing the search input restores normal toggle behavior (completed specs re-hide if toggle is unchecked)\n- If an assertion matches, its parent spec is shown and expanded to reveal the match\n- If only a spec name matches, it shows with all its assertions visible\n- Specs and assertions that don't match are hidden\n- Empty search input = no filter applied (all specs visible per toggle state)\n\n## Visual Example\n\n**Search input placement:**\n```\n┌─────────────────────────────────┐\n│ Spec Tree - project             │\n│ 5 specs, 12 assertions          │\n│ (3 completed specs hidden)      │\n│ ☐ Show completed specs          │\n│                                 │\n│ [🔍 Search specs...           ] │\n│                                 │\n│ ▸ authentication (in_progress)  │\n│ ▸ dashboard (not_started)       │\n└─────────────────────────────────┘\n```\n\n**With active search \"parser\":**\n```\n┌─────────────────────────────────┐\n│ [🔍 parser                    ] │\n│                                 │\n│ ▾ spec-parser (done)            │  ← completed but visible because it matches\n│   ├ parser-reads-frontmatter    │\n│   └ parser-handles-nested       │\n│ ▾ robust-error-handling         │  ← visible because child matches\n│   └ parser-error-messages       │  ← matches \"parser\"\n└─────────────────────────────────┘\n```\n\n## Behavior Rules\n\n- Filtering is purely visual (CSS class toggling + JS), no data re-parsing\n- Follows existing patterns: event delegation, classList manipulation, vanilla JS\n- Search state does NOT persist in localStorage (fresh on each page load)\n- When search is active and matches a completed spec, that spec is shown regardless of toggle state\n- When search is cleared, the completed specs toggle reasserts control\n- When search is cleared, specs that were auto-expanded by the search are re-collapsed (specs the user manually expanded before searching stay expanded)\n\n## Bug: Search auto-expand is not reversed on clear\n\nThe `initializeSearch` function in `src/show/cli.js` auto-expands specs when an assertion match is found (lines ~1465-1468) by adding `.expanded` class. But when the search is cleared (lines ~1423-1433), it only removes `search-hidden` and `search-match` — it never removes `.expanded` from specs that it auto-expanded.\n\n**Fix:** Before expanding a spec during search, track whether it was already expanded. On search clear, collapse any specs that were only expanded by the search (not by the user). The simplest approach: before performing the first search expansion, snapshot which specs are already expanded. On clear, restore to that snapshot.\n\n","branch":"feature/spec-searchbar","created":"2026-02-26T20:00:00Z"},{"id":"spekk-show-command-exists","parent":"spec-explorer-web-interface","title":"Spekk Show Command Exists","status":"done","priority":1,"file":"specs/spec-explorer-web-interface/assertions/spekk-show-command-exists.md","content":"---\nid: spekk-show-command-exists\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 1\nstatus: done\n---\n\n# Spekk Show Command Exists\n\n## Assertion\n\nThe `spekk show` command is recognized and executable from the CLI.\n\n## Success Criteria\n\n- Running `spekk show` does not produce \"command not found\" or similar errors\n- Command appears in `spekk --help` output\n- Command has appropriate help text describing its functionality\n\n**Tests:** src/__tests__/show-command.test.js\n\n## Test Plan\n\n```bash\nspekk show --help\nspekk --help | grep \"show\"\n```","branch":"main","created":"2026-01-22T21:00:00Z"},{"id":"status-icons-display-correctly","parent":"spec-explorer-web-interface","title":"Status Icons Display Correctly","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/status-icons-display-correctly.md","content":"---\nid: status-icons-display-correctly\nparent: spec-explorer-web-interface\ncreated: 2026-01-22T22:20:00Z\npriority: 2\nstatus: done\n---\n\n# Status Icons Display Correctly\n\n## Description\n\nThe spec explorer displays distinct, meaningful icons for each status type to provide clear visual differentiation in the tree interface.\n\n## Requirements\n\n**Status Icon Mapping:**\n- `not_started`: Gray empty circle (○) - represents unbegun work\n- `in_progress`: Spinning arrow (🔄) - represents active work \n- `done`: Green checkmark (✅) - represents completed work\n- `failed`: Red X (❌) - represents blocked work\n- `draft`: Pause icon (⏸️) - represents planning/placeholder items\n\n**Icon Display:**\n- Icons appear consistently in both tree badges and detail panel\n- Each status has appropriate CSS styling to match the icon meaning\n- Draft items are visually distinct from not_started items\n\n## Success Criteria\n\n- [ ] All five status values have defined icons in `getStatusIcon()` function\n- [ ] CSS classes exist for all status types including `.status-draft`\n- [ ] Draft specs/assertions display pause icon (⏸️) in tree view\n- [ ] Not_started specs/assertions display gray circle (○) in tree view\n- [ ] Icons are consistent between tree view and detail panel views\n\n## Testing\n\nCreate test specs with each status type and verify icons display correctly in the web interface.","branch":"main","created":"2026-01-22T22:20:00Z"},{"id":"subtle-track-terminus-dots","parent":"spec-explorer-web-interface","title":"Subtle Track Terminus Dots","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/subtle-track-terminus-dots.md","content":"---\nid: subtle-track-terminus-dots\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T19:21:00Z\npriority: 2\nstatus: done\ndepends-on: branch-metro-map-in-detail-panel\nbranch: feature/dependency-visualization\n---\n\n# Subtle Track Terminus Dots\n\n## What Must Be True\n\nTerminal assertions (no children) have a small, subtle endpoint dot that indicates chain completion status. Done nodes are visually quiet — they mark endpoints without drawing attention away from the assertion stations themselves.\n\n## Success Criteria\n\n- Each terminal assertion gets its own Done endpoint node\n- Done nodes are small: r=5 (compared to r=8 for assertion stations)\n- No text label underneath Done nodes (no \"Done\" text, no \"✓ Complete\")\n- Done node fill is green (#10b981) when the entire upstream chain is done\n- Done node fill is gray (#94a3b8) when any upstream assertion is not done\n- Done nodes have white stroke border (stroke-width: 2) for visibility\n- Done nodes are non-interactive (no click handler, `pointer-events: none`)\n- If branch has only one terminal assertion, no Done endpoint needed\n- Line from terminal assertion to its Done node uses same gray (#94a3b8) at low opacity\n\n## Visual Example\n\n**Done nodes are subtle endpoints:**\n```\n○───○───○───●    (● = small green dot, whole chain done)\n     └──○───◦    (◦ = small gray dot, chain not fully done)\n```\n\n## When to Show Done Nodes\n\n**Show when:**\n- Branch has 2+ terminal assertions (parallel endpoints)\n\n**Don't show when:**\n- Branch has 1 terminal assertion (already clear endpoint)\n\n## Implementation Notes\n\n- Detect terminal assertions: assertions with no children depending on them\n- Done node position: `x = terminalPos.x + 120`, `y = terminalPos.y`\n- Check upstream chain: walk `dependsOn` links back to root, check if all are `status: done`\n- `allDone ? '#10b981' : '#94a3b8'` for fill color\n- No `\u003ctext\u003e` elements on Done nodes\n- CSS: `.metro-terminus { cursor: default; pointer-events: none; }`\n","branch":"feature/dependency-visualization","dependsOn":"branch-metro-map-in-detail-panel","created":"2026-02-25T19:21:00Z"},{"id":"terminal-nodes-have-no-extra-lines","parent":"spec-explorer-web-interface","title":"Terminal Nodes Have No Extra Lines","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/assertions/terminal-nodes-have-no-extra-lines.md","content":"---\nid: terminal-nodes-have-no-extra-lines\nparent: spec-explorer-web-interface\ncreated: 2026-02-25T20:32:00Z\npriority: 2\nstatus: done\ndepends-on: subtle-track-terminus-dots\nbranch: feature/dependency-visualization\n---\n\n# Terminal Nodes Have No Extra Lines\n\n## What Must Be True\n\nTerminal nodes (assertions with no children) have clean visual presentation with no erroneous lines extending beyond them.\n\n## Success Criteria\n\n- ✅ Terminal nodes have no extra lines extending to their right\n- ✅ Track lines only appear between assertions with actual `depends-on` relationships\n- ✅ \"Done\" convergence terminal connections are clean and intentional\n- ✅ No stray horizontal lines across the metro map\n\n## Implementation\n\n**Root cause:** A main track line was being drawn horizontally across the entire metro map width, extending beyond all terminal nodes.\n\n**Solution:** Removed the main track line generation. Metro map now only displays:\n- Dependency lines between connected assertions (parent → child via `depends-on`)\n- Convergence paths from multiple terminal nodes to the \"Done\" terminus\n\n**Code removed:**\n```javascript\n// Removed this line that extended across entire map\n\u003cline class=\"metro-track\" x1=\"40\" y1=\"${trackY}\" x2=\"${maxX}\" y2=\"${trackY}\"/\u003e\n```\n\nThe metro map visual is now clean with only meaningful dependency connections visible.\n","branch":"feature/dependency-visualization","dependsOn":"subtle-track-terminus-dots","created":"2026-02-25T20:32:00Z"},{"id":"assertions-have-tests","parent":"spec-parser","title":"Assertions Must Have Automated Tests When Possible","status":"done","priority":2,"file":"specs/spec-parser/assertions/assertions-have-tests.md","content":"---\nid: assertions-have-tests\nparent: spec-parser\ncreated: 2026-01-20T16:25:00Z\npriority: 2\nstatus: done\ndepends-on: tests-in-correct-location\nbranch: feature/spec-parser\n---\n\n# Assertions Must Have Automated Tests When Possible\n\n## What Must Be True\n\nWhen an assertion describes behavior that can be automatically validated, it must have associated test files that prove the assertion is true.\n\n## Two Types of Tests\n\n### Type 1: Implementation Tests (JavaScript)\nFor testing **code behavior** - located in `app/**/__tests__/`\n\n**Use for:**\n- Code behavior (functions, scripts, APIs)\n- Data validation (parsers, validators)\n- Algorithm correctness\n- Output format validation\n- Any behavior that requires running application code\n\n**Example:** Testing that parser extracts YAML frontmatter correctly\n\n### Type 2: Sidecar Validation Tests (Bash)\nFor testing **spec system integrity** - located alongside assertions as `*.test.sh`\n\n**Use for:**\n- File/directory existence\n- Spec structure validation\n- Prompt completeness checks\n- Any validation that doesn't require running app code\n\n**Example:** Testing that builder-agent prompt file exists\n\n## Testability Categories\n\n### Always Testable (Automated Tests)\n- Code behavior → Implementation tests (JS)\n- File existence → Sidecar tests (bash)\n- Spec structure → Sidecar tests (bash)\n\n### Sometimes Testable (May require tooling)\n- UI behavior (with tools like Playwright, Cypress)\n- Visual design (screenshot testing)\n- Performance requirements (benchmarks)\n\n### Not Automatically Testable (Manual validation)\n- Subjective quality (\"looks good\", \"feels responsive\")\n- Business judgment calls\n- Manual processes\n\n## Implementation Test Structure\n\n**Location:** `app/**/__tests__/`\n\n```\napp/\n├── parser/\n│   ├── index.js\n│   └── __tests__/\n│       ├── parser.test.js\n│       └── ...\n├── dashboard/\n│   └── __tests__/\n│       └── dashboard.test.js\n└── ...\n```\n\n**Framework:** Node.js built-in test runner, Jest, or Vitest\n\n## Sidecar Test Structure\n\n**Location:** Co-located with assertions as `*.test.sh`\n\n```\nspecs/\n├── builder-agent/\n│   └── assertions/\n│       ├── prompt-exists.md\n│       └── prompt-exists.test.sh      # Sidecar test\n├── spec-parser/\n│   └── assertions/\n│       ├── app-directory-structure.md\n│       └── app-directory-structure.test.sh\n└── ...\n```\n\n**Format:** Bash script that exits 0 on success, non-zero on failure\n\n**Example:**\n```bash\n#!/usr/bin/env bash\n# specs/builder-agent/assertions/prompt-exists.test.sh\n\nPROMPT_FILE=\"specs/builder-agent/builder-agent.prompt.md\"\n\n[ -f \"$PROMPT_FILE\" ] || {\n  echo \"❌ Builder prompt missing at $PROMPT_FILE\"\n  exit 1\n}\n\nexit 0  # Silent on success\n```\n\n## Test Requirements\n\n**When an assertion is testable:**\n\n1. **Test file must exist:**\n   - Implementation tests: `src/**/__tests__/*.test.js`\n   - Sidecar tests: `specs/**/assertions/*.test.sh`\n\n2. **Test file must be linked** in assertion markdown:\n   ```markdown\n   **Tests:** `src/parser/__tests__/parser.test.js`\n   **Tests:** `specs/builder-agent/assertions/prompt-exists.test.sh`\n   ```\n\n3. **Tests must validate success criteria** from assertion\n4. **Tests must pass** for assertion to be marked `done`\n5. **Tests run on every change** to catch regressions\n\n## Example: Linking Tests to Assertion\n\nIn assertion markdown file:\n\n```markdown\n## Success Criteria\n\nThis assertion is \"done\" when:\n- ✅ Parser extracts YAML frontmatter\n- ✅ Parser handles malformed YAML gracefully\n- ✅ Parser returns correct data structure\n\n**Tests:** `src/parser/__tests__/parser.test.js`\n```\n\nIn test file:\n\n```javascript\n// src/parser/__tests__/parser.test.js\nimport { test } from 'node:test';\nimport { parseSpec } from '../index.js';\n\ntest('parses valid YAML frontmatter', () =\u003e {\n  // Test implementation\n});\n\ntest('handles malformed YAML', () =\u003e {\n  // Test implementation\n});\n```\n\n## Benefits\n\n1. **Automated validation**: No manual checking required\n2. **Regression detection**: Tests catch when changes break old assertions\n3. **Living documentation**: Tests show exactly what the assertion means\n4. **Confidence**: Can mark `done` with certainty\n5. **Continuous validation**: Tests run in CI/CD\n\n## Validation Protocol\n\nBefore marking an assertion `done`:\n1. Check if assertion is testable\n2. If yes, ensure test file exists and is linked\n3. Run tests: `npm test`\n4. All tests must pass\n5. Only then update status to `done`\n\n## Success Criteria\n\nThis assertion is \"done\" when:\n- ✅ All testable assertions have appropriate test files\n- ✅ Implementation tests live in `app/**/__tests__/` directories\n- ✅ Sidecar validation tests live as `*.test.sh` alongside assertions\n- ✅ Both test types are documented with examples\n- ✅ Test frameworks are set up and working (JS + bash)\n- ✅ Tests validate assertion success criteria\n- ✅ Tests pass consistently\n- ✅ Agent workflow includes test validation step\n- ✅ Sidecar test runner exists (see sidecar-test-runner assertion)\n\n**Tests:** `src/parser/__tests__/assertions-have-tests.test.js`\n","branch":"feature/spec-parser","dependsOn":"tests-in-correct-location","created":"2026-01-20T16:25:00Z"},{"id":"ci-runs-all-tests","parent":"spec-parser","title":"CI Runs All Tests","status":"done","priority":2,"file":"specs/spec-parser/assertions/ci-runs-all-tests.md","content":"---\nid: ci-runs-all-tests\nparent: spec-parser\ncreated: 2026-01-20T19:45:00Z\npriority: 2\nstatus: done\ndepends-on: assertions-have-tests\nbranch: feature/spec-parser\n---\n\n# CI Runs All Tests\n\n## What Must Be True\n\nA CI configuration must exist that automatically runs all tests (implementation and sidecar) on every push to prevent duplicate test runs in pull requests.\n\nTest commands must work cross-platform on macOS, Linux, and Windows.\n\n## CI Configuration Location\n\n```\n.github/\n└── workflows/\n    └── test.yml      # GitHub Actions workflow\n```\n\n## Expected Behavior\n\nWhen code is pushed to any branch:\n\n1. **Setup environment** - Install Node.js and dependencies\n2. **Run implementation tests** - Execute `npm run test:impl`\n3. **Run sidecar tests** - Execute `npm run test:specs`\n4. **Report results** - Show pass/fail status\n5. **Fail CI if any tests fail** - Prevent bad code from being merged\n\n## Workflow Triggers\n\nRun tests on:\n- Push to any branch only (not on pull request events to avoid duplicate runs)\n- Manual workflow dispatch (optional)\n\n## Required Steps\n\n**1. Checkout code**\n```yaml\n- uses: actions/checkout@v4\n```\n\n**2. Setup Node.js**\n```yaml\n- uses: actions/setup-node@v4\n  with:\n    node-version: '20'\n```\n\n**3. Install dependencies**\n```yaml\n- run: npm ci\n```\n\n**4. Run implementation tests**\n```yaml\n- name: Run implementation tests\n  run: npm run test:impl\n```\n\n**5. Run sidecar tests**\n```yaml\n- name: Run sidecar validation tests\n  run: npm run test:specs\n```\n\n## Success Reporting\n\nCI should:\n- ✅ Show green checkmark if all tests pass\n- ❌ Show red X if any tests fail\n- Display test output in CI logs\n- Block PR merges if tests fail (branch protection)\n\n## package.json Test Scripts\n\n**Critical:** Test scripts must work cross-platform (macOS, Linux, Windows).\n\n```json\n{\n  \"scripts\": {\n    \"test\": \"npm run test:impl \u0026\u0026 npm run test:specs\",\n    \"test:impl\": \"node src/test-runner.js\",\n    \"test:specs\": \"node src/spec-validator/cli.js\"\n  }\n}\n```\n\n**Implementation:** Use a test runner script (`src/test-runner.js`) that uses the `glob` package to find test files. This works reliably across all platforms, unlike shell glob expansion which behaves differently on macOS, Linux, and Windows.\n\n```javascript\n// src/test-runner.js\nimport { glob } from 'glob';\nimport { spawn } from 'child_process';\n\nasync function runTests() {\n  const testFiles = await glob('src/**/__tests__/**/*.test.js');\n  const nodeTest = spawn('node', ['--test', ...testFiles], {\n    stdio: 'inherit'\n  });\n  nodeTest.on('close', (code) =\u003e process.exit(code));\n}\nrunTests();\n```\n\nThis approach:\n- ✅ Works consistently on macOS, Linux, and Windows\n- ✅ Doesn't rely on shell glob expansion\n- ✅ Explicitly lists all test files to Node.js test runner\n- ✅ Uses the `glob` package (already in dependencies)\n\n## Success Criteria\n\n- ✅ `.github/workflows/test.yml` exists\n- ✅ Workflow triggers on push only (not pull_request to avoid duplicate runs)\n- ✅ Workflow sets up Node.js environment\n- ✅ Workflow installs npm dependencies\n- ✅ Workflow runs `npm run test:impl` (implementation tests)\n- ✅ Workflow runs `npm run test:specs` (sidecar tests)\n- ✅ **app/test-runner.js exists and uses glob package**\n- ✅ **Tests pass on Linux (GitHub Actions Ubuntu runner)**\n- ✅ **Tests pass on macOS and Windows**\n- ✅ Workflow fails if either test suite fails\n- ✅ CI status visible on PRs and commits\n- ✅ Test output visible in workflow logs\n- ✅ Works on macOS, Linux, and Windows\n\n**Tests:** Manual validation (trigger workflow and verify it runs)\n\n## Example Workflow\n\n```yaml\nname: Tests\n\non:\n  push:\n    branches: ['**']\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run implementation tests\n        run: npm run test:impl\n\n      - name: Run sidecar validation tests\n        run: npm run test:specs\n```\n\n## Notes\n\nThis ensures code quality by automatically validating:\n- Implementation behavior (JS tests)\n- Spec system integrity (sidecar tests)\n\nBefore any code is merged, both test suites must pass.\n\n**Cross-platform compatibility:** The test runner script approach works reliably on all platforms without depending on shell-specific glob expansion behavior\n","branch":"feature/spec-parser","dependsOn":"assertions-have-tests","created":"2026-01-20T19:45:00Z"},{"id":"detects-duplicate-ids","parent":"spec-parser","title":"Parser Must Detect Duplicate IDs","status":"done","priority":2,"file":"specs/spec-parser/assertions/detects-duplicate-ids.md","content":"---\nid: detects-duplicate-ids\nparent: spec-parser\ncreated: 2026-01-20T16:28:00Z\npriority: 2\nstatus: done\ndepends-on: parses-frontmatter\nbranch: feature/spec-parser\n---\n\n# Parser Must Detect Duplicate IDs\n\n**Tests:** src/parser/__tests__/spec-parser.test.js\n\n## What Must Be True\n\nThe parser must detect and report duplicate `id` values across specs and within spec assertions.\n\n## ID Uniqueness Rules\n\n### Spec-Level IDs\n- Each spec `id` must be unique across all specs\n- No two spec files can have the same `id`\n- Example: Only one spec can have `id: \"spec-parser\"`\n\n### Assertion-Level IDs  \n- Each assertion `id` must be unique within its parent spec\n- Assertions in different specs CAN have the same `id`\n- Example: Multiple specs can each have an assertion with `id: \"validates-input\"`\n\n## Validation Scope\n\n### Global Check (Specs)\n```\nspecs/\n├── spec-parser/spec-parser.md        (id: spec-parser)\n└── living-dashboard/living-dashboard.md (id: spec-parser) ❌ DUPLICATE\n```\n\n### Local Check (Assertions within Spec)\n```\nspecs/spec-parser/assertions/\n├── validates-fields.md     (id: validates-fields)  \n└── other-assertion.md      (id: validates-fields) ❌ DUPLICATE\n```\n\n## Error Messages\n\nParser should report clear duplicate ID errors:\n- \"Duplicate spec id 'spec-parser' found in files: specs/spec-parser/spec-parser.md, specs/other-spec/other-spec.md\"\n- \"Duplicate assertion id 'validates-fields' in spec 'spec-parser' found in files: validates-fields.md, other-file.md\"\n\n## Success Criteria\n\n- ✅ Parser detects duplicate spec IDs across all specs\n- ✅ Parser detects duplicate assertion IDs within each spec\n- ✅ Parser allows same assertion IDs in different specs\n- ✅ Parser provides clear error messages showing conflicting files\n- ✅ Parser reports ALL duplicates found (not just first one)","branch":"feature/spec-parser","dependsOn":"parses-frontmatter","created":"2026-01-20T16:28:00Z"},{"id":"enforces-folder-structure","parent":"spec-parser","title":"Parser Must Enforce Folder Structure","status":"done","priority":1,"file":"specs/spec-parser/assertions/enforces-folder-structure.md","content":"---\nid: enforces-folder-structure\nparent: spec-parser\ncreated: 2026-01-20T16:00:00Z\npriority: 1\nstatus: done\nbranch: feature/spec-parser\n---\n\n# Parser Must Enforce Folder Structure\n\n## What Must Be True\n\nAll specs in `specs/` must follow the declared folder structure:\n\n```\nspecs/\n├── {spec-id}/\n│   ├── {spec-id}.md              # Main spec file\n│   └── assertions/               # Assertions subfolder\n│       ├── {assertion-id}.md\n│       └── ...\n```\n\n## Validation Rules\n\nThe parser must validate that:\n\n1. **Each spec is a folder** - No flat `.md` files at `specs/*.md` level\n2. **Main spec file exists** - `specs/{spec-id}/{spec-id}.md` must exist\n3. **Assertions folder exists** - `specs/{spec-id}/assertions/` must exist (can be empty)\n4. **Assertion files in correct location** - All assertion `.md` files must be inside `assertions/` subfolder\n5. **Consistent naming** - Folder name should match the spec file name (both use same `id`)\n\n## Current State\n\nExisting specs are currently flat files:\n- `specs/spec-format.md` ❌\n- `specs/living-spec-dashboard.md` ❌\n- `specs/spec-builder-prototype.md` ❌\n\nThese must be migrated to:\n- `specs/living-spec-dashboard/`\n  - `living-spec-dashboard.md`\n  - `assertions/`\n- `specs/spec-builder-prototype/`\n  - `spec-builder-prototype.md`\n  - `assertions/`\n\n## Migration Requirements\n\nWhen this assertion is worked on:\n\n1. Create folder for each existing flat spec\n2. Move spec file into its folder\n3. Create `assertions/` subfolder\n4. Extract any inline assertions from spec files into separate assertion files\n5. Update any cross-references or links\n\n## Special Case: spec-format.md\n\nThe content of `spec-format.md` should become assertions under `spec-parser/assertions/` because the format rules ARE validation criteria for the parser:\n- `parses-frontmatter.md`\n- `validates-required-fields.md`\n- `validates-timestamps.md`\n- `validates-status-values.md`\n- `detects-duplicate-ids.md`\n\n## Success Criteria\n\nThis assertion is \"done\" when:\n- ✅ All specs in `specs/` follow folder structure\n- ✅ No flat `.md` files at `specs/*.md` level (except index if we add one later)\n- ✅ Parser validates structure and rejects malformed specs\n- ✅ All existing spec content preserved and functional\n","branch":"feature/spec-parser","created":"2026-01-20T16:00:00Z"},{"id":"identifies-next-priority","parent":"spec-parser","title":"Parser Must Identify Next Priority Item","status":"done","priority":2,"file":"specs/spec-parser/assertions/identifies-next-priority.md","content":"---\nid: identifies-next-priority\nparent: spec-parser\ncreated: 2026-01-20T16:15:00Z\npriority: 2\nstatus: done\ndepends-on: validates-status-values\nbranch: feature/spec-parser\n---\n\n# Parser Must Identify Next Priority Item\n\n## What Must Be True\n\nThe parser must identify the single highest-priority incomplete assertion to work on next.\n\n## Priority Algorithm\n\n1. **Read all specs and assertions** from `specs/` directory\n2. **Filter to incomplete items:**\n   - Include items where `status != \"done\"`\n   - This includes `not_started` and `in_progress`\n3. **Work at assertion level:**\n   - Return next incomplete assertion, not spec\n   - Assertions are the atomic unit of work\n4. **Sort by priority:**\n   - Priority 1 items come first (highest)\n   - Then priority 2 items\n   - Then priority 3 items (lowest)\n5. **Break ties (deterministic):**\n   - If multiple items have same priority, select oldest by `created` timestamp\n   - Older items worked on first (encourages finishing old work before adding new)\n6. **Return single item:**\n   - Output the one highest-priority incomplete assertion\n\n## Special Cases\n\n**All assertions done for a spec:**\n- If a spec has all assertions `done`, mark the spec as `done` (status aggregation)\n- Move to next spec's assertions\n\n**All work complete:**\n- If all assertions in all specs are `done`, output indicating no work remaining\n- Exit with success status\n\n**No specs exist:**\n- If `specs/` directory is empty, output indicating no specs found\n- Exit with success status\n\n## Output Format\n\n```json\n{\n  \"type\": \"assertion\",\n  \"id\": \"validates-required-fields\",\n  \"parent\": \"spec-parser\",\n  \"file\": \"specs/spec-parser/assertions/validates-required-fields.md\",\n  \"priority\": 1,\n  \"status\": \"not_started\",\n  \"title\": \"Parser Must Validate Required Fields\",\n  \"content\": \"... full markdown content ...\",\n  \"spec\": {\n    \"id\": \"spec-parser\",\n    \"file\": \"specs/spec-parser/spec-parser.md\",\n    \"title\": \"Spec Parser\"\n  }\n}\n```\n\n## Success Criteria\n\n- ✅ Parser returns highest priority incomplete assertion\n- ✅ Parser never returns completed items\n- ✅ Parser works at assertion level (not spec level)\n- ✅ Parser handles ties correctly (by created date, then id)\n- ✅ Parser handles \"all done\" case gracefully\n- ✅ Parser handles \"no specs\" case gracefully\n\n**Tests:** `src/parser/__tests__/spec-parser.test.js`\n","branch":"feature/spec-parser","dependsOn":"validates-status-values","created":"2026-01-20T16:15:00Z"},{"id":"locked-by-field-for-parallel-builders","parent":"spec-parser","title":"Locked-By Field for Parallel Builders","status":"done","priority":1,"file":"specs/spec-parser/assertions/locked-by-field-for-parallel-builders.md","content":"---\nid: locked-by-field-for-parallel-builders\nparent: spec-parser\ncreated: 2026-02-25T19:30:00Z\npriority: 1\nstatus: done\ndepends-on: identifies-next-priority\nbranch: feature/spec-parser\n---\n\n# Locked-By Field for Parallel Builders\n\n## What Must Be True\n\nAssertions support a `locked-by` field that enables parallel builders to claim work without conflicts.\n\n## Success Criteria\n\n- ✅ Parser reads optional `locked-by` field from assertion YAML frontmatter\n- ✅ Parser exposes `lockedBy` in assertion JSON output\n- ✅ `spekk next` skips assertions where `status: in_progress` AND `locked-by` is set\n- ✅ `spekk next` includes assertions where `status: in_progress` but no `locked-by` (backwards compatible)\n- ✅ Builder sets `locked-by` field when marking assertion `in_progress`\n- ✅ **Builder MUST remove `locked-by` field when marking assertion `done` or `failed`**\n- ✅ Builder validates `locked-by` was removed before committing completion\n- ✅ Lock format: `locked-by: builder-{hostname}-{pid}-{timestamp}`\n- ✅ Stale locks (\u003e2 hours old) are ignored by `spekk next`\n\n## Workflow\n\n**Builder claims work:**\n1. Run `spekk next` → get assertion without `locked-by`\n2. Update YAML frontmatter:\n   ```yaml\n   status: in_progress\n   locked-by: builder-macbook-12345-1706210400\n   ```\n3. Commit immediately\n4. Pull to check for conflicts\n5. If conflict (someone else claimed it), resolve and pick next assertion\n\n**Builder releases lock:**\n1. Work complet
