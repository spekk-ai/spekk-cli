<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spec Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        .tree-panel {

        .metro-map-section {

        }

        .metro-map-section.collapsed {
            height: 36px !important;
            min-height: 36px !important;

        }

        .metro-map-section.no-transition {

        }

        .metro-map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: #f1f5f9;
            cursor: pointer;

        .metro-map-header:hover {
            background: #e2e8f0;
        }

        .metro-map-header-left {

        }

        .metro-map-toggle-icon {
            font-size: 12px;
            color: #64748b;
            transition: transform 0.2s;
        }

        .metro-map-section.collapsed .metro-map-toggle-icon {
            transform: rotate(-90deg);
        }

        .metro-map-header-title {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .metro-map-header .branch-name {
            font-size: 12px;
            color: #64748b;
            font-family: 'Courier New', monospace;
        }

        .metro-map-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            cursor: grab;
            background: #f8fafc;
        }

        .metro-map-container.panning {
            cursor: grabbing;
            user-select: none;

        .metro-map-container .metro-map {
            transition: transform 0.1s ease-out;
        }

        .metro-map-resize-handle {
            height: 6px;
            cursor: ns-resize;
            background: #e2e8f0;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .metro-map-resize-handle:hover {
            background: #cbd5e1;
        }

        .metro-map-resize-handle .grip-dots {
            display: flex;
            gap: 3px;
        }

        .metro-map-resize-handle .grip-dots span {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .metro-map-section.collapsed .metro-map-resize-handle {
            display: none;
        }

        .detail-content-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .header h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .header .stats {
            color: #64748b;
            font-size: 14px;
        }

        .header .hidden-count {
            color: #94a3b8;
            font-size: 13px;

        }

        .spec-tree {

        }

        .spec-item {

        }

        .spec-item.completed {
            display: none;
        }

        .spec-tree.show-completed .spec-item.completed {
            display: block;
        }

        .toggle-container {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .toggle-container label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #475569;

        }

        .toggle-container input[type="checkbox"] {

            cursor: pointer;
        }

        .spec-header {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .spec-header:hover {
            background: #e2e8f0;
        }

        .spec-header.expanded {
            background: #dbeafe;
        }

        .spec-header.selected {
            background: #eff6ff;
            border-left: 3px solid #3b82f6;
        }

            margin-right: 8px;
            font-size: 12px;
            color: #64748b;
            transition: transform 0.2s;
        }

        .toggle-icon.expanded {
            transform: rotate(90deg);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .status-not_started {
            background: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }
        .status-not_started::before {
            content: "\25CB";
            font-size: 10px;
        }

        .status-in_progress {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
            animation: pulse-yellow 2s infinite;
        }
        .status-in_progress::before {
            content: "\1F504";
            font-size: 10px;
        }

        .status-failed {
            background: #fecaca;
            color: #dc2626;
            border: 1px solid #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
        .status-failed::before {
            content: "\274C";
            font-size: 10px;
        }

        .status-done {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;

        }
        .status-done::before {
            content: "\2705";
            font-size: 10px;
        }

        .status-draft {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .status-draft::before {
            content: "\23F8\FE0F";

        }

            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }

        .assertions-list.expanded {

            background: #eff6ff;
            border-left-color: #3b82f6;

        .detail-title {

            border: 1px solid #e2e8f0;

        .no-dependencies-notice {
            display: flex;
            align-items: flex-start;

            border: 1px solid #bfdbfe;

        }

            font-size: 13px;
            line-height: 1.5;

        }

        .search-container {
            margin-top: 12px;

        }

        .search-container input {

            background: #f8fafc;

    </style>

    <script>window.__SPEKK_DATA__ = {"projectName":"spekk-cli","specs":[{"id":"agent-install","title":"Agent Install — Use Spekk Prompts from Any Coding Assistant","status":"done","priority":1,"file":"specs/agent-install/agent-install.md","content":"---\nid: agent-install\ncreated: 2026-06-11T00:00:00Z\npriority: 1\n---\n\n# Agent Install — Use Spekk Prompts from Any Coding Assistant\n\nUsers can install the spekk agents (coach, builder, observer) as subagents in their preferred coding assistant (Claude Code, OpenCode, Codex, ...), instead of being limited to `spekk coach` / `spekk builder` launching Claude Code.\n\n## Design\n\nThe binary remains the single source of truth for prompts and skills:\n\n- **`spekk prompt \u003cagent\u003e`** prints the layered-resolved agent prompt to stdout. This is the universal escape hatch — it works with any tool that can run a shell command or accept pasted text.\n- **`spekk skill list \u003cagent\u003e` / `spekk skill show \u003cagent\u003e \u003cname\u003e`** expose the existing layered `SkillResolver` on the command line, so an agent running in any harness can fetch skill content on demand. Built-in skills ship in the binary; nothing is installed to disk. `.spekk/skills/` (project) and `~/.config/spekk/skills/` (user) remain optional override layers.\n- **`spekk install --target \u003ctool\u003e`** writes a **thin shim** subagent file per agent into the host tool's agent directory. The shim contains only host frontmatter (name/description for auto-delegation) and an instruction to run `spekk prompt \u003cagent\u003e` and adopt the output as operating instructions. Because the real prompt is fetched from the binary at session start, installed agents never go stale and always match the behavior of the `spekk` binary they shell out to.\n\n### Why thin shims (not full prompt copies)\n\n- Copied prompts freeze at install time and silently drift from the binary (`spekk next` behavior, skill names, workflow changes).\n- The shim couples prompt version to binary version by construction; updating the binary updates every host.\n- Reinstalls are only needed when the shim format itself changes, which is rare by design.\n\n### Non-intrusiveness principles\n\n- Global install is the default — agent definitions are project-agnostic capabilities; a repo opts in by having a `specs/` directory.\n- Installed agents must degrade gracefully: if the project has no `specs/` directory or the `spekk` binary is missing, say so briefly and stand down. Never push the workflow on a project that hasn't opted in.\n- No new dotfiles are created. Built-in skills are served from the embedded FS.\n\n## Supported targets\n\n| Target | Global location | Project location (`--project`) |\n|--------|----------------|-------------------------------|\n| `claude-code` (alias `claude`) | `~/.claude/agents/spekk-\u003cagent\u003e.md` | `.claude/agents/spekk-\u003cagent\u003e.md` |\n| `copilot` | `~/.copilot/agents/spekk-\u003cagent\u003e.agent.md` | `.github/agents/spekk-\u003cagent\u003e.agent.md` |\n| `cursor` | `~/.cursor/agents/spekk-\u003cagent\u003e.md` | `.cursor/agents/spekk-\u003cagent\u003e.md` |\n| `opencode` | `~/.config/opencode/agents/spekk-\u003cagent\u003e.md` | `.opencode/agents/spekk-\u003cagent\u003e.md` |\n| `codex` | `~/.codex/prompts/spekk-\u003cagent\u003e.md` | not supported (error) |\n\nThe target list is intentionally limited to tools we can actually test. The long tail is served by guidance instead of integrations: `spekk install --help`, the unknown-target error, and the README all point to `spekk prompt \u003cagent\u003e` as the universal mechanism (wire it into the tool's custom-agent/rules mechanism or `AGENTS.md`). Additional targets are added by extending the registry in `internal/install`.\n","branch":"main"},{"id":"bootstrap-system-recovery","title":"Bootstrap System Recovery","status":"done","priority":1,"file":"specs/bootstrap-system-recovery/bootstrap-system-recovery.md","content":"---\nid: bootstrap-system-recovery\ncreated: 2026-01-28T21:30:00Z\npriority: 1\n---\n\n# Bootstrap System Recovery\n\n## Overview\n\n**CRITICAL BOOTSTRAPPING PROBLEM:** The builder cannot run due to parser syntax errors, which means the builder cannot fix itself. This requires manual intervention to restore basic functionality.\n\n## Current Failures\n\n1. `spekk builder` fails with parser syntax error\n2. Parser has illegal `continue` statement at line 78\n3. Builder uses internal parser instead of global CLI\n4. CLI reads from wrong directory context\n\n## Bootstrap Strategy\n\nSince the builder cannot run to fix itself, these critical fixes must be implemented manually or with direct code intervention to restore the system.\n\n**Immediate Goal:** Get `spekk next` working so the builder can resume automated implementation.","branch":"main"},{"id":"builder-agent","title":"Builder Agent (SUPERSEDED)","status":"done","priority":1,"file":"specs/builder-agent/builder-agent.md","content":"---\nid: builder-agent\ncreated: 2026-01-20T18:15:00Z\npriority: 1\n---\n\n# Builder Agent (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-agents` for the Go replacement.\n\n## Overview\n\nThe builder agent is the execution engine of the spec-driven system. It takes assertions and makes them true through implementation and testing.\n\nThis is the core \"work loop\" that turns declarative specs into working code.\n\n## What It Does\n\n### 1. Get Next Task\nRuns parser to identify highest-priority incomplete assertion:\n```bash\nnode scripts/next-spec.js\n```\n\n### 2. Read Assertion\nUnderstands what must be true:\n- Success criteria\n- Testability (can this be automated?)\n- Context from parent spec\n\n### 3. Determine Testability\n- **Code/scripts** → YES (write unit tests)\n- **UI/UX** → MAYBE (integration tests)\n- **Manual process** → NO (prose validation)\n\n### 4. Write Tests First (if testable)\n- Create test file in `tests/`\n- Link test in assertion: `**Tests:** tests/file.test.js`\n- Write tests that validate success criteria\n\n### 5. Implement\nMake tests pass or satisfy success criteria\n\n### 6. Validate\n- Run tests (`npm test`)\n- Verify no regressions\n- Check success criteria met\n\n### 7. Update Status\nEdit assertion frontmatter:\n```yaml\n```\n\n### 8. Commit\nCreate git commit with changes\n\n## Integration with System\n\n**Triggered by:** Ralph loop after parser identifies next work\n\n**Reads from:**\n- Parser JSON output\n- Assertion markdown files\n- Parent spec files (for context)\n\n**Writes to:**\n- Implementation files (code, scripts, etc.)\n- Test files (if testable)\n- Assertion status updates\n\n**Output:** Working implementation with passing tests\n\n## Why Builder Is Priority 1\n\nThe builder IS the system in bootstrap phase:\n1. Without builder, nothing gets implemented\n2. Builder implements parser (which drives everything)\n3. Builder implements itself (self-hosting)\n4. Other agents come later\n\nThe builder must work before we can be truly spec-driven.\n\n## Prompt\n\nSee `builder-agent.prompt.md` for detailed agent instructions.\n\n## Assertions\n\nSee `assertions/` for what must be true about builder behavior.\n","branch":"main"},{"id":"builder-cli-flags","title":"Builder CLI Flags","status":"done","priority":1,"file":"specs/builder-cli-flags/builder-cli-flags.md","content":"---\nid: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\n---\n\n# Builder CLI Flags\n\n## Overview\n\nThe `spekk builder` command loops continuously through assertions by default (Ctrl+C to exit). Flags control scope and interaction mode.\n\n## Flags\n\n| Flag | Behavior |\n|------|----------|\n| (none) | Loop through all assertions continuously (default) |\n| `--once` | Build one assertion then exit |\n| `--dry-run` | Preview what would be built, don't launch Claude |\n| `--spec \u003cid\u003e` | Work only on assertions in this spec |\n| `--assertion \u003cid\u003e` | Work only on this specific assertion |\n| `--confirm` | Ask y/n before each build |\n| `--interactive` / `-i` | Run Claude in interactive (non-headless) mode |\n\n## Flag Combinations\n\n- `--spec \u003cid\u003e` - Loop through all assertions in a spec\n- `--spec \u003cid\u003e --once` - Build next assertion in a spec then exit\n- `--confirm` - Loop through everything with confirmation prompts\n- `--spec \u003cid\u003e --dry-run` - Preview assertions in a specific spec\n\n## Examples\n\n```bash\n# Default: loop through all assertions\nspekk builder\n\n# Build just one and stop\nspekk builder --once\n\n# See what's next without building\nspekk builder --dry-run\n\n# Build just the login-button assertion\nspekk builder --assertion login-button\n\n# Loop through all assertions in the auth spec\nspekk builder --spec auth\n\n# Supervised autonomous mode\nspekk builder --confirm\n```\n\n## Assertions\n\nSee `assertions/` for what must be true about each flag's behavior.\n","branch":"main"},{"id":"cleanup-repository","title":"Clean Up Repository","status":"done","priority":1,"file":"specs/cleanup-repository/cleanup-repository.md","content":"---\nid: cleanup-repository\ncreated: 2026-01-28T21:18:00Z\npriority: 1\n---\n\n# Clean Up Repository\n\n## Overview\n\nThe repository root directory contains temporary files, debug scripts, and test artifacts that should not be committed to version control. These files were likely created during development and testing but should be removed.\n\n## Files to Clean Up\n\n**Debug Files:**\n- `debug-coach.js`\n- `debug-copy.js` \n- `test-fix.js`\n\n**Debug Directories:**\n- `debug-mock-mowlIc/`\n- `debug-test/`\n\n**Temporary Test Directories:**\n- `temp-test-DB4WyD/`\n- `temp-test-debug/`\n- `temp-test-mKLbyt/`\n\n**Observation Files:**\n- `observations/` directory contains hundreds of timestamped markdown files\n\n## Repository Hygiene Principles\n\n- Temporary files and directories should never be committed\n- Debug scripts should be in `.gitignore` or removed when done\n- Test artifacts should be cleaned up after test runs\n- Generated files that aren't source of truth should be excluded","branch":"main"},{"id":"cli-prompt-resolution","title":"CLI Agent Prompt Resolution","status":"done","priority":1,"file":"specs/cli-prompt-resolution/cli-prompt-resolution.md","content":"---\nid: cli-prompt-resolution\ncreated: 2026-01-28T19:30:00Z\npriority: 1\n---\n\n# CLI Agent Prompt Resolution\n\n## Problem\n\nWhen running `spekk coach` from a directory outside the spekk-cli installation (e.g., `~/thinknimble/vuenome`), Claude Code cannot find the coach agent prompt file because it looks for `specs/coach-agent/coach-agent.prompt.md` relative to the current working directory.\n\nThe CLI should work from any directory while:\n1. Running Claude Code in the user's working directory (so it can access their project files)\n2. Making agent prompt files available to Claude Code from spekk-cli installation directory (NO copying to user directory)\n3. Keeping the user's working directory clean and unmodified\n4. Following the same pattern for all agent commands (coach, builder, observer)\n\n## Requirements\n\n- `spekk coach`, `spekk builder`, and `spekk observer` commands work from any directory\n- `spekk` (spec parser) and `spekk --all` commands work from any directory  \n- Claude Code runs in user's working directory to access their project files  \n- Agent prompt files are read directly from spekk-cli installation directory (NO copying)\n- Spec parser reads specs from spekk-cli installation directory, not current directory\n- User's working directory remains clean and unmodified\n- Solution works consistently across different environments and installation methods\n\n## Success Criteria\n\n- User can run `spekk coach` from `~/thinknimble/vuenome` and Claude Code successfully loads the coach prompt from spekk-cli installation\n- User can run `spekk` from `~/thinknimble/vuenome` and get next assertion from spekk-cli specs\n- Claude Code's working directory remains `~/thinknimble/vuenome` so it can work with user's files\n- No temporary files or directories created in user's working directory\n- All commands (coach, builder, observer, parser) work consistently from any directory\n- User's project directory structure is never modified by the CLI","branch":"main"},{"id":"coach-agent","title":"Coach Agent (SUPERSEDED)","status":"done","priority":3,"file":"specs/coach-agent/coach-agent.md","content":"---\nid: coach-agent\ncreated: 2026-01-20T17:00:00Z\npriority: 3\n---\n\n# Coach Agent (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-agents` for the Go replacement.\n\n## Overview\n\nThe coach agent translates messy, imperative user requests into clean, testable declarative specs. This is the \"front door\" of the spec-driven system - where requirements emerge through conversation and refinement.\n\n## Critical Constraint: Code is Read-Only\n\n**The coach NEVER writes or edits implementation code.**\n\n- ⛔ Coach does NOT use Edit or Write tools on `.js`, `.ts`, `.jsx`, `.tsx` files\n- ⛔ Coach does NOT modify files in `app/` directory\n- ✅ Coach CAN read code to understand context for writing better specs\n- ✅ Coach ONLY writes spec files (`.md` files in `specs/` directory)\n\n**Role separation:**\n- **Coach:** Writes specs describing WHAT must be true\n- **Builder:** Writes code to MAKE it true\n\nIf a user asks the coach to fix code directly, coach responds: \"I'm the coach - I write specs. The builder agent implements them.\"\n\n## The Problem It Solves\n\nUsers don't naturally think in terms of testable assertions. They say:\n- \"We should fix the copy on the login page\"\n- \"Add dark mode\"\n- \"Make the dashboard faster\"\n\nThe coach helps refine these into well-formed specs with clear, testable assertions.\n\n## What It Does\n\n### 1. Receive User Request\nAccept natural language input about what the user wants to build or change.\n\n### 2. Check Existing Specs\n- **Receive full spec JSON hierarchy** (output from parser `--all` flag)\n- Scan existing specs to see if this is an update or new spec\n- If updating existing spec, load it for context\n- Identify potential conflicts with existing specs\n\n**Context requirement:**\nCoach must receive the complete spec hierarchy on every invocation:\n```json\n{\n  \"type\": \"hierarchy\",\n  \"specs\": [\n    {\n      \"id\": \"spec-parser\",\n      \"title\": \"Spec Parser\",\n      \"priority\": 1,\n      \"status\": \"in_progress\",\n      \"assertions\": [...]\n    },\n    ...\n  ]\n}\n```\n\nThis provides full context of:\n- All existing specs and their assertions\n- Current status of each item\n- Priority levels\n- What's been built, what's in progress, what's not started\n\nWithout this context, coach can't make informed decisions about where new specs fit or if they conflict with existing work.\n\n### 3. Ask Clarifying Questions\nGuide the user through refinement:\n- What exactly should happen?\n- How will we know it's working?\n- What's the priority? (1=critical, 2=important, 3=nice-to-have)\n- Are there edge cases to consider?\n- Should this be broken into multiple assertions?\n\n### 4. Draft Spec Structure\nPropose a spec with:\n- Clear spec ID (kebab-case)\n- Main spec file describing the feature\n- Specific, testable assertions\n- Appropriate priority levels\n- Success criteria for each assertion\n\n### 5. Get User Approval\nShow the proposed spec structure and ask if it captures their intent.\n\n### 6. Create or Update Spec Files\nWrite the spec and assertion files to `specs/` directory with proper:\n- Folder structure (`specs/{spec-id}/`)\n- YAML frontmatter (id, created, priority, status)\n- Clear markdown content\n- Testability indicators (can this be automated?)\n\n**Preserve design artifacts:**\nWhen users provide mockups, prototypes, or design references:\n- Save mockup images as `specs/{spec-id}/mockup.png` (or appropriate extension)\n- Save prototype HTML/CSS files alongside the spec\n- Reference artifacts using relative paths in the spec\n- This keeps requirements and their references together for future reference\n\n**Status management when updating specs:**\n- If creating new spec/assertion: `status: not_started`\n- If updating existing assertion with `status: done`:\n  - Change to `status: in_progress`\n  - This signals builder to re-implement\n  - Ensures updated requirements get picked up\n- If updating assertion already `in_progress` or `not_started`: keep as-is\n\n### 7. Commit Spec Changes\nImmediately commit spec changes to git with clear, descriptive messages. This creates an audit trail of spec evolution and helps track when requirements changed.\n\nCommit message should describe what the spec defines or what changed.\n\n### 8. Re-coordinate (for feature branch changes)\nAfter updating assertions on a feature branch, re-run the coordinator skill to refresh the dependency tree and work plan.\n\n**When to re-coordinate:**\n- Adding new assertions to a feature branch\n- Changing assertion priorities or dependencies\n- Marking assertions as failed (requires re-work)\n- Major structural changes to branch\n\n**Process:**\n1. Read `specs/coach-skills-system/coordinator-skill.md`\n2. Analyze current branch dependency structure\n3. Show updated dependency tree to user\n4. Validate with parser\n5. Update frontmatter if dependencies changed\n6. Commit coordination updates if needed\n\n**Why this matters:**\n- Keeps dependency tree accurate for builders\n- Identifies newly-unlocked parallel work\n- Prevents conflicts from stale dependencies\n- Shows clear path through feature work\n\n**Skip if:**\n- Only content changes (not status/priority/dependencies)\n- Working on isolated main branch assertions\n- No structural changes to dependencies\n\n## Example Interaction\n\n```\nUser: \"We need to add dark mode to the dashboard\"\n\nCoach: I can help spec that out. Let me ask a few questions:\n\n1. Should dark mode be:\n   - User preference (toggle in settings)\n   - System preference (auto-detect OS setting)\n   - Both?\n\n2. Which components need dark mode support?\n   - Just the dashboard?\n   - Entire application?\n\n3. What's the priority?\n   - 1 (critical - blocks other work)\n   - 2 (important - should do soon)\n   - 3 (nice to have - when there's time)\n\nUser: User preference, entire application, priority 2\n\nCoach: Perfect. Here's what I'm proposing:\n\nSpec: dark-mode-support\nPriority: 2\n\nAssertions:\n1. User can toggle dark mode in settings (priority 1)\n2. All components render correctly in dark mode (priority 1)\n3. Dark mode preference persists across sessions (priority 2)\n4. Smooth transition animation between modes (priority 3)\n\nDoes this capture what you want?\n\nUser: Yes\n\nCoach: ✅ Created spec at specs/dark-mode-support/\nNext: Builder agents will implement these assertions in priority order.\n```\n\n## Output Format\n\nThe coach creates files in the specs directory:\n\n```\nspecs/\n└── dark-mode-support/\n    ├── dark-mode-support.md       # Main spec\n    └── assertions/\n        ├── user-can-toggle.md\n        ├── components-render.md\n        ├── preference-persists.md\n        └── smooth-transition.md\n```\n\n## Integration with Builder Workflow\n\n**Creating new specs:**\n1. Coach creates spec with assertions (`status: not_started`)\n2. Parser identifies next assertion to work on\n3. Builder agent implements it\n4. Tests validate it\n5. Builder marks `status: done`\n6. Repeat\n\n**Updating existing specs:**\n1. Coach updates assertion content\n2. Coach changes `status: done` → `status: in_progress`\n3. Parser identifies assertion needs work\n4. Builder re-implements with new requirements\n5. Tests validate updated behavior\n6. Builder marks `status: done` again\n\nThis status workflow ensures changes to specs trigger re-implementation.\n\n## Why This Matters\n\n**Without coach:**\n- Users write specs incorrectly\n- Specs are too vague or too specific\n- Assertions aren't testable\n- Priority is unclear\n\n**With coach:**\n- Consistent spec format\n- Clear, testable assertions\n- Appropriate granularity\n- Proper prioritization\n- Users guided through best practices\n\nThis is the **imperative → declarative** bridge that makes the system usable.\n\n## Declarative vs Imperative\n\n**Critical distinction:** Assertions must be DECLARATIVE, not imperative.\n\n**Imperative (wrong):**\n- \"Migrate code to app/\"\n- \"Move parser to app/parser/\"\n- \"Refactor the dashboard\"\n- Instructions about WHAT TO DO\n\n**Declarative (correct):**\n- \"No implementation code exists outside app/\"\n- \"Parser implementation lives in app/parser/\"\n- \"Dashboard displays spec hierarchy\"\n- Statements about WHAT MUST BE TRUE\n\n**Why this matters:**\n- User says: \"We should move the parser code\" (imperative)\n- Coach translates to: \"Parser implementation lives in app/parser/\" (declarative)\n- Builder reads assertion and figures out HOW to make it true\n- Assertion describes target state, not the steps\n\n**Coach's job:** Help users express their imperative requests as declarative assertions about desired state.\n\n## Repository Hygiene Principle\n\nThe coach ensures specs maintain good repository hygiene. Generated files and dependencies should never be committed.\n\n**What should be git-ignored:**\n- Dependencies (`node_modules/`) - reproducible from package manifests\n- Build artifacts (`dist/`, `build/`, `out/`) - reproducible from source\n- Secrets (`.env`) - never commit credentials\n- Generated files - derived from source, not source of truth\n\n**Coaching approach:**\n- `.gitignore` is itself a form of specification - respect and trust it\n- When creating specs, express intent (\"build artifacts are not committed\") without duplicating .gitignore patterns\n- Guide users to think about source vs. derived files\n- Specs should declare what files/artifacts exist, not specify .gitignore rules\n\nThis principle keeps the repository clean and focused on source of truth.\n\n## Assertions\n\nSee `assertions/` subfolder for what must be true for the coach agent to work correctly.\n","branch":"main"},{"id":"coach-skills-system","title":"Coach Skills System","status":"done","priority":1,"file":"specs/coach-skills-system/coach-skills-system.md","content":"---\nid: coach-skills-system\ncreated: 2026-01-23T22:14:00Z\npriority: 1\n---\n\n# Coach Skills System\n\nExtends the coach agent with specialized skills that can be automatically suggested and applied during user conversations.\n\n## Overview\n\nThe coach agent should be able to:\n- Automatically detect when specialized skills would be helpful\n- Suggest and apply relevant skills during conversations\n- Maintain a lean, extensible framework for adding new skills\n- Provide structured outputs when using skills\n\n## Architecture\n\nSkills are **markdown files with workflow instructions**, not JavaScript classes.\n\n**Rationale:**\n- Coach agent IS already Claude - skills shouldn't call Claude API\n- Skills should be instructions for the AI, not procedural code\n- Consistent with spec-driven architecture (everything else is markdown)\n- Easy to create (write markdown, not implement JS classes)\n\n**Structure:**\n- Skills live in `specs/coach-skills-system/` as markdown files\n- Each skill defines: triggers, workflow steps, validation\n- Coach prompt lists available skills (or directory location)\n- Coach reads markdown files directly\n- Coach executes workflows using its own intelligence\n- **Zero infrastructure needed** - Just markdown files + coach\n- No JavaScript classes, no loaders, no registries, no API calls\n\n## Skills Available\n\n### Business Model Validator\nHelps validate startup/business models through structured questioning and scoring across:\n- Industry background \u0026 expertise\n- Product validation\n- Market demand\n- Business goals \u0026 strategy\n- Traction \u0026 momentum\n- Hypothesis prioritization\n\nProduces quantitative health score and actionable recommendations.\n\n### Meeting Notes to Specs\nProcesses meeting transcripts and extracts actionable outcomes. Activated via `spekk coach meeting`. Categorizes content into:\n- **Todos** - action items and follow-ups → TODOS.md\n- **Specs** - features and product changes → spec files in specs/\n- **Context** - architectural decisions → CONTEXT.md\n\nSee `specs/meeting-notes-to-specs/` for full spec.\n\n## Success Criteria\n\n- Coach automatically suggests skills when appropriate contexts arise\n- Business model validation skill works end-to-end\n- Framework supports adding future skills without major changes\n- All skill interactions produce structured, useful outputs\n","branch":"main"},{"id":"fix-builder-test-validation","title":"Fix Builder Test Validation","status":"done","priority":1,"file":"specs/fix-builder-test-validation/fix-builder-test-validation.md","content":"---\nid: fix-builder-test-validation\ncreated: 2026-01-28T21:40:00Z\npriority: 1\n---\n\n# Fix Builder Test Validation\n\n## Overview\n\nThe builder is incorrectly marking assertions as `done` without properly validating that tests pass. This leads to CI failures while the builder thinks everything is working.\n\n## Current Problems\n\n1. **Builder prompt references wrong test commands** - Says `just test` but project uses `npm test`\n2. **Builder not actually checking test results** - Marks assertions `done` despite failing tests\n3. **37 tests currently failing** - But builder completed assertions anyway\n\n## Root Cause\n\nThe builder prompt instructs to use `just` commands that don't exist in this project, and doesn't properly verify test success before marking assertions complete.","branch":"main"},{"id":"fix-ci-workflow-hanging","title":"Fix CI Workflow Hanging","status":"done","priority":1,"file":"specs/fix-ci-workflow-hanging/fix-ci-workflow-hanging.md","content":"---\nid: fix-ci-workflow-hanging\ncreated: 2026-01-22T21:10:00Z\npriority: 1\n---\n\n# Fix CI Workflow Hanging\n\n## Problem\n\nCI is hanging indefinitely on the \"Test CLI functionality\" step because it tries to run interactive coach and builder commands that wait for user input, which never comes in CI environment.\n\n## What Must Be True\n\nThe GitHub Actions CI workflow must only include the steps that are specified in the original CI requirements and must complete successfully without hanging.\n\n### Current CI Issues\n\nThe workflow includes extra steps not specified in `specs/spec-parser/assertions/ci-runs-all-tests.md`:\n\n1. **\"Validate CLI commands\"** - Not required by spec\n2. **\"Test CLI functionality\"** - Hangs on interactive commands\n\nThese steps try to run:\n```bash\nnode bin/spekk.js coach --help  # Hangs - starts interactive session\nnode bin/spekk.js builder --help # Hangs - starts interactive session\n```\n\n### Required CI Steps (Per Original Spec)\n\nThe CI workflow should **only** include what's specified in `ci-runs-all-tests.md`:\n\n1. ✅ Setup environment (checkout, Node.js, dependencies)\n2. ✅ Run implementation tests (`npm run test:impl`)\n3. ✅ Run sidecar tests (`npm run test:specs`)\n4. ✅ Report pass/fail status\n\n### CI Workflow Should Be\n\n```yaml\nname: Tests\n\non:\n  push:\n    branches: ['**']\n  pull_request:\n    branches: ['**']\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run implementation tests\n        run: npm run test:impl\n\n      - name: Run sidecar validation tests\n        run: npm run test:specs\n```\n\n## Success Criteria\n\n- ✅ CI workflow completes without hanging\n- ✅ CI workflow only includes steps specified in `ci-runs-all-tests.md`\n- ✅ Implementation tests pass in CI\n- ✅ Sidecar validation tests pass in CI\n- ✅ No interactive commands in CI workflow\n- ✅ CI run time is reasonable (under 5 minutes)\n- ✅ Workflow fails only if tests fail, not due to hanging","branch":"main"},{"id":"fix-cli-context-bug","title":"Fix CLI Context Bug","status":"done","priority":1,"file":"specs/fix-cli-context-bug/fix-cli-context-bug.md","content":"---\nid: fix-cli-context-bug\ncreated: 2026-01-28T21:22:00Z\npriority: 1\n---\n\n# Fix CLI Context Bug\n\n## Overview\n\nThe `spekk next` command is incorrectly reading specs from the spekk-cli installation directory instead of the current working directory. This breaks the fundamental design principle that the CLI should be context-aware and work on whatever project the user is currently in.\n\n## Expected Behavior\n\nWhen a user runs `spekk next` from any directory, the CLI should:\n1. Look for a `specs/` directory in the current working directory\n2. Parse and prioritize specs from that local `specs/` directory\n3. Return the next priority assertion from the local project\n\n## Current Bug\n\nThe CLI is reading from the spekk-cli's own `specs/` directory instead of `process.cwd() + '/specs/'`\n\n## Impact\n\nThis makes the CLI unusable for external projects, defeating the entire purpose of having a global CLI tool for spec-driven development.","branch":"main"},{"id":"fix-hardcoded-paths-in-tests","title":"Fix Hardcoded Paths in Tests","status":"done","priority":1,"file":"specs/fix-hardcoded-paths-in-tests/fix-hardcoded-paths-in-tests.md","content":"---\nid: fix-hardcoded-paths-in-tests\ncreated: 2026-01-22T20:45:00Z\npriority: 1\n---\n\n# Fix Hardcoded Paths in Tests\n\n## Problem\n\nCI tests are failing because test files use hardcoded absolute paths like `/Users/william/thinknimble/spekk-cli/bin/spekk.js` which only exist on the developer's local machine, not in CI environments.\n\n## What Must Be True\n\nAll test files must use relative paths or dynamically resolved paths that work across all environments (local development, CI, other developers' machines).\n\n### Current Failing Pattern\n\nTests currently use:\n```javascript\nexecSync('node /Users/william/thinknimble/spekk-cli/bin/spekk.js show', { \n  encoding: 'utf8',\n  cwd: testDir,\n  timeout: 5000 \n});\n```\n\n### Required Solution Pattern\n\nTests must use relative paths from the project root:\n```javascript\nexecSync('node bin/spekk.js show', { \n  encoding: 'utf8',\n  cwd: process.cwd(), // Use project root as working directory\n  timeout: 5000 \n});\n```\n\nOr dynamically resolve the project root:\n```javascript\nimport { dirname, join } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst __dirname = dirname(fileURLToPath(import.meta.url));\nconst projectRoot = join(__dirname, '../..');\nconst spekkBin = join(projectRoot, 'bin/spekk.js');\n\nexecSync(`node ${spekkBin} show`, { \n  encoding: 'utf8',\n  cwd: testDir,\n  timeout: 5000 \n});\n```\n\n## Success Criteria\n\n- ✅ All tests pass in CI environment (GitHub Actions)\n- ✅ All tests pass on different developer machines\n- ✅ No hardcoded absolute paths in any test files\n- ✅ Tests use relative paths or dynamically resolved paths\n- ✅ Tests work regardless of where the project is cloned\n- ✅ `npm run test:impl` returns 0 exit code in CI","branch":"main"},{"id":"fix-parser-syntax-error","title":"Fix Parser Syntax Error","status":"done","priority":1,"file":"specs/fix-parser-syntax-error/fix-parser-syntax-error.md","content":"---\nid: fix-parser-syntax-error\ncreated: 2026-01-28T21:15:00Z\npriority: 1\n---\n\n# Fix Parser Syntax Error\n\n## Overview\n\nThe spekk CLI parser has a syntax error that prevents it from running. There's an illegal `continue` statement outside of a loop context.\n\n## Error Details\n\n```\nfile:///Users/william/thinknimble/spekk-cli/src/parser/index.js:78\n          continue;\n          ^^^^^^^^\n\nSyntaxError: Illegal continue statement: no surrounding iteration statement\n```\n\n## Required Fix\n\nThe parser code at line 78 in `src/parser/index.js` has a `continue` statement that's not inside a loop. This is invalid JavaScript and must be fixed for the CLI to function.","branch":"main"},{"id":"fix-watch-server-ipv4","title":"Fix: Watch server binds to 127.0.0.1 (IPv4) explicitly","status":"done","priority":1,"file":"specs/fix-watch-server-ipv4/fix-watch-server-ipv4.md","content":"---\nid: fix-watch-server-ipv4\ncreated: 2026-03-11T00:25:00Z\npriority: 1\n---\n\n# Fix: Watch server binds to 127.0.0.1 (IPv4) explicitly\n\nThe watch server currently binds to `'localhost'` which resolves to `::1` (IPv6) on Linux.\nTest requests using `http.get` or `fetch` connect to `127.0.0.1` (IPv4), causing ECONNREFUSED.\n\n## Root Cause\n\n`server.listen(port, 'localhost', ...)` in `src/show/server.js` uses `'localhost'` which resolves\nto `::1` on Linux (Node 18+), while HTTP clients resolve `localhost` to `127.0.0.1` (IPv4).\n\n## Fix\n\nBind explicitly to `'127.0.0.1'` instead of `'localhost'` — still localhost-only (secure),\nbut deterministically IPv4.\n\n## Done When\n\nWatch server and integration tests pass on Linux CI.\n","branch":"main"},{"id":"gemfury-package-management","title":"GemFury Package Management (SUPERSEDED)","status":"done","priority":1,"file":"specs/gemfury-package-management/gemfury-package-management.md","content":"---\nid: gemfury-package-management\ncreated: 2026-02-05T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# GemFury Package Management (SUPERSEDED)\n\n\u003e **Superseded:** This spec is no longer applicable. The project has migrated from Node.js/npm to Go. Distribution now uses GitHub Releases with cross-compiled Go binaries instead of GemFury/npm. See the `golang-cleanup` spec for details.\n\n## What Must Be True\n\n~~The @spekk/cli package is distributed via GemFury (npm.fury.io/thinknimble).~~ Distribution now uses GitHub Releases with Go binaries.\n\n## Assertions\n\n1. `readme-contains-installation-instructions` - README explains how users install from GemFury\n2. `contributing-documents-publish-process` - CONTRIBUTING.md explains how maintainers publish releases\n","branch":"main"},{"id":"golang-agents","title":"Go Agent Launchers","status":"done","priority":1,"file":"specs/golang-agents/golang-agents.md","content":"---\nid: golang-agents\ncreated: 2026-04-05T12:15:00Z\npriority: 1\n---\n\n# Go Agent Launchers\n\nPort the coach, builder, and observer agent launchers from Node.js to Go.\n\nThese are thin wrappers — they resolve prompts, optionally activate skills, then exec `claude` as a subprocess with inherited stdio. The real logic lives in the prompt/skill resolvers (ported in golang-cli).\n\n## Current Architecture\n\n- `src/coach/cli.js` — resolve prompt, optionally activate skill, spawn claude (162 lines)\n- `src/builder/cli.js` — resolve prompt, parse flags, spawn claude in various modes (574 lines)\n- `src/observer/cli.js` — resolve prompt, spawn claude (160 lines)\n- `src/loops/index.js` — builder/coach orchestration loops (293 lines)\n\n## Strategy\n\n- Each agent launcher becomes a Go function in `internal/agents/`\n- All use the shared prompt resolver and skill resolver from `internal/cli/`\n- Builder is the most complex (multiple modes: once, continuous, interactive, dry-run, confirm)\n- Loops become Go functions that call the agent launchers in a loop\n","branch":"main"},{"id":"golang-cleanup","title":"Go Migration Cleanup","status":"done","priority":3,"file":"specs/golang-cleanup/golang-cleanup.md","content":"---\nid: golang-cleanup\ncreated: 2026-04-05T12:32:00Z\npriority: 3\n---\n\n# Go Migration Cleanup\n\nRemove all Node.js code, dependencies, and build infrastructure after the full Go migration is complete.\n\nThis is the final phase — only executed after every module has been ported and validated in Go.\n\n## Strategy\n\n- Delete all JS source files and tests\n- Remove package.json, node_modules, npm scripts\n- Update CI/CD to build Go binary\n- Update installation instructions for single binary distribution\n- Update CLAUDE.md and spec prompts to reference Go commands\n","branch":"main"},{"id":"golang-cli","title":"Go CLI Core","status":"done","priority":1,"file":"specs/golang-cli/golang-cli.md","content":"---\nid: golang-cli\ncreated: 2026-04-05T12:10:00Z\npriority: 1\n---\n\n# Go CLI Core\n\nPort the CLI entry point, command routing, flag parsing, prompt resolution, and skill resolution from Node.js to Go.\n\nThis is the spine of the binary — it routes `spekk \u003ccommand\u003e` to the correct handler. Depends on the Go parser being functional first, since the default command runs the parser.\n\n## Current Architecture\n\n- `bin/spekk.js` — switch/case command router\n- `src/cli/parse-flags.js` — generic flag parser (53 lines)\n- `src/cli/prompt-resolver.js` — layered prompt resolution (base → global → local) (165 lines)\n- `src/cli/skill-resolver.js` — layered skill discovery (local → global → package) (159 lines)\n\n## Strategy\n\n- Go binary becomes the single `spekk` entry point\n- All command routing moves to Go\n- Prompt and skill resolution ported as Go packages\n- Agent commands exec `claude` as a subprocess (same pattern, different language)\n","branch":"main"},{"id":"golang-parser","title":"Go Parser","status":"done","priority":1,"file":"specs/golang-parser/golang-parser.md","content":"---\nid: golang-parser\ncreated: 2026-04-05T12:00:00Z\npriority: 1\n---\n\n# Go Parser\n\nPort the spec parser from Node.js to Go as the first phase of the full Go migration (strangler fig approach).\n\nThe parser is the foundation — every other module (builder, coach, show, status, loops) depends on its JSON output. Porting it first gives us single-binary distribution for `spekk next` and establishes the Go project structure that all subsequent modules build on.\n\n## Strategy\n\n- Go binary produces **identical JSON output** to the Node parser for the same input specs\n- Node CLI delegates to Go binary when present, falls back to JS parser if not\n- Once validated, Node parser code is removed\n- Existing parser test scenarios define acceptance criteria for the Go implementation\n\n## Success Criteria\n\n- `go build ./cmd/spekk` compiles a working binary\n- `spekk next` returns identical JSON whether using Go or Node parser\n- All validation rules (frontmatter, status, timestamps, branches, depends-on, duplicates) match Node behavior\n- Priority algorithm, branch-aware filtering, and lock staleness produce same results\n- Node parser code is deleted after Go parser is validated\n","branch":"main"},{"id":"golang-sandbox","title":"Go Sandbox Command","status":"done","priority":2,"file":"specs/golang-sandbox/golang-sandbox.md","content":"---\nid: golang-sandbox\ncreated: 2026-04-05T12:28:00Z\npriority: 2\n---\n\n# Go Sandbox Command\n\nPort the `spekk sandbox` subcommands from Node.js to Go.\n\nManages DigitalOcean cloud sandbox environments. Already has a Go-based deploy agent that runs on the droplet — this spec ports the CLI-side orchestration.\n\n## Current Architecture\n\n- `src/sandbox/cli.js` — subcommand routing (125 lines)\n- `src/sandbox/create.js` — droplet creation with cloud-init (282 lines)\n- `src/sandbox/do-api.js` — DigitalOcean API client (91 lines)\n- `src/sandbox/store.js` — local metadata store in `~/.spekk/sandboxes/` (44 lines)\n- `src/sandbox/tokens.js` — token management (10 lines)\n- `src/sandbox/list.js`, `status.js`, `ssh.js`, `destroy.js`, `deploy.js`, `release.js` — subcommand implementations\n- `src/sandbox/agent.js`, `templates.js` — agent/template management\n\n## Strategy\n\n- Port DigitalOcean API client to Go (net/http)\n- Port metadata store to Go (single JSON file: `sandboxes.json` in the global config dir)\n- Port each subcommand as a Go function\n- Cloud-init template embedded via Go embed\n","branch":"main"},{"id":"golang-security-hardening","title":"Go Migration Security Hardening","status":"done","priority":1,"file":"specs/golang-security-hardening/golang-security-hardening.md","content":"---\nid: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\n---\n\n# Go Migration Security Hardening\n\nSecurity fixes and correctness improvements identified during PR #70 review of the Node.js → Go migration. Addresses WebSocket origin validation, race conditions, silent error swallowing, path traversal, file permissions, resource leaks, and dead code.\n","branch":"main"},{"id":"golang-serve","title":"Go Serve Command","status":"done","priority":2,"file":"specs/golang-serve/golang-serve.md","content":"---\nid: golang-serve\ncreated: 2026-04-05T12:25:00Z\npriority: 2\n---\n\n# Go Serve Command\n\nPort the `spekk serve` WebSocket server from Node.js to Go.\n\nThe serve module runs a WebSocket server that bridges a browser extension to Claude Code for interactive spec coaching. Uses the `ws` npm package currently.\n\n## Current Architecture\n\n- `src/serve/index.js` — WebSocket server, claude process management (312 lines)\n- `src/serve/message-formatter.js` — Format messages between browser and claude (266 lines)\n- `src/serve/shapes.js` — TN Models WebSocket adapter shapes (131 lines)\n- `src/serve/cli.js` — CLI entry point (43 lines)\n\n## Strategy\n\n- Use gorilla/websocket or nhooyr.io/websocket for WebSocket server\n- Port message formatting to Go\n- Claude subprocess management same pattern as agent launchers\n","branch":"main"},{"id":"golang-show","title":"Go Show Command","status":"done","priority":2,"file":"specs/golang-show/golang-show.md","content":"---\nid: golang-show\ncreated: 2026-04-05T12:22:00Z\npriority: 2\n---\n\n# Go Show Command\n\nPort the `spekk show` web interface generator from Node.js to Go.\n\nThe largest single module (~1958 lines). Generates a self-contained HTML file with the spec explorer UI, including metro map visualization, search, detail panels, and optional watch mode with SSE live reload.\n\n## Current Architecture\n\n- `src/show/cli.js` — HTML generation with embedded CSS/JS (1958 lines)\n- `src/show/server.js` — SSE server for watch mode (92 lines)\n- `src/show/watcher.js` — File watcher using fs.watch (76 lines)\n\n## Strategy\n\n- Go generates the same HTML output using Go templates or string building\n- Watch mode uses Go's fsnotify + net/http for SSE\n- The HTML/CSS/JS is the product — it's embedded in the Go binary as string constants or embed.FS\n","branch":"main"},{"id":"golang-status","title":"Go Status Command","status":"done","priority":2,"file":"specs/golang-status/golang-status.md","content":"---\nid: golang-status\ncreated: 2026-04-05T12:20:00Z\npriority: 2\nbranch: feature/golang-migration\n---\n\n# Go Status Command\n\nPort the `spekk status` command from Node.js to Go.\n\nSimple module — reads parsed specs and displays a formatted overview to the terminal. 136 lines of JS.\n\n## Strategy\n\n- Reuse the Go parser to get specs + assertions\n- Format and print to stdout with status icons and completion stats\n","branch":"feature/golang-migration"},{"id":"install-script","title":"One-Command Install Script","status":"in_progress","priority":2,"file":"specs/install-script/install-script.md","content":"---\nid: install-script\ncreated: 2026-06-11T00:00:00Z\npriority: 2\n---\n\n# One-Command Install Script\n\nA developer reading the README finds a single copy-paste command that installs spekk. No platform tables, no multi-step instructions at the top of the funnel.\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/spekk-ai/spekk-cli/main/install.sh | sh\n```\n\n## Install Location: User-Owned by Default\n\nThe default install directory is `~/.local/bin` (created if missing), not\n`/usr/local/bin`.\n\n**Rationale:** spekk is a self-updating CLI (`spekk update`, see\n`specs/self-update/`). A binary installed with sudo into a root-owned\ndirectory cannot update itself without sudo, which breaks the update flow for\nthe common case. Self-updating CLIs belong in user-owned directories — this is\nthe established precedent set by rustup (`~/.cargo/bin`), deno (`~/.deno/bin`),\nbun (`~/.bun/bin`), and uv (`~/.local/bin`). The alternative — auto-escalating\nto sudo from inside the binary during `spekk update` — was considered and\nrejected: a CLI silently invoking sudo on the user's behalf is a security\nanti-pattern, and the fail-fast error message\n(`specs/self-update/assertions/fail-fast-permission-error.md`) already covers\nlegacy sudo installs.\n\nUsers who prefer a system-wide install keep that option:\n`SPEKK_INSTALL_DIR=/usr/local/bin` still works, with the existing sudo\nfallback when the target directory is not writable.\n\nThe trade-off of `~/.local/bin` is that it is not on `$PATH` on every system,\nso the script must detect that and tell the user exactly what line to add.\n\n## Assertions\n\n- `install-sh-works` — core install behavior (done)\n- `default-install-dir-user-owned` — default moves to `~/.local/bin` (not yet implemented)\n- `path-warning-after-install` — PATH check with copy-paste fix (not yet implemented)\n","branch":"main"},{"id":"layered-prompt-system","title":"Layered Prompt System","status":"done","priority":1,"file":"specs/layered-prompt-system/layered-prompt-system.md","content":"---\nid: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\n---\n\n# Layered Prompt System\n\n## Overview\n\nAgent prompts are assembled from layers, allowing customization at global and project levels while preserving base behavior from the spekk package. Users can either extend the base prompt or completely override it.\n\n## Naming Convention\n\nAgent names are simplified: `coach`, `builder`, `observer` (not `coach-agent`, etc.).\n\n- `\u003cagent\u003e.prompt.md` — **extends** the base prompt (appended after it)\n- `\u003cagent\u003e.prompt.override.md` — **replaces** the base prompt entirely\n\n## Layers\n\n| Layer | Extend Path | Override Path | Purpose |\n|-------|------------|---------------|---------|\n| Base | `\u003cspekk-package\u003e/specs/\u003cagent\u003e-agent/\u003cagent\u003e.prompt.md` | — | Ships with spekk, core agent behavior |\n| Global | `~/.config/spekk/\u003cagent\u003e.prompt.md` | `~/.config/spekk/\u003cagent\u003e.prompt.override.md` | User's personal defaults across all projects |\n| Local | `.spekk/\u003cagent\u003e.prompt.md` | `.spekk/\u003cagent\u003e.prompt.override.md` | Project-specific customizations |\n\n## Resolution\n\n1. Determine base prompt:\n   - If local override (`.spekk/\u003cagent\u003e.prompt.override.md`) exists → use as base\n   - Else if global override (`~/.config/spekk/\u003cagent\u003e.prompt.override.md`) exists → use as base\n   - Else use package base (`\u003cspekk\u003e/specs/\u003cagent\u003e-agent/\u003cagent\u003e.prompt.md`, required)\n2. Append global extend (`~/.config/spekk/\u003cagent\u003e.prompt.md`) if exists\n3. Append local extend (`.spekk/\u003cagent\u003e.prompt.md`) if exists\n4. Concatenate with `\\n\\n---\\n\\n` separator\n\n## Examples\n\n### Extending: Adding company coding standards to builder\n\nCreate `~/.config/spekk/builder.prompt.md`:\n```markdown\n## Company Standards\n\n- Use TypeScript strict mode\n- All functions must have JSDoc comments\n- No console.log in production code\n```\n\nThis is appended to the base builder prompt for every project you work on.\n\n### Extending: Adding project-specific context to coach\n\nCreate `.spekk/coach.prompt.md`:\n```markdown\n## Domain Knowledge\n\nThis is a healthcare app. When creating specs:\n- Consider HIPAA compliance\n- PHI must never be logged\n- All dates must be in patient's timezone\n```\n\nThis is appended to the base coach prompt for this project only.\n\n### Overriding: Completely replacing the builder prompt\n\nCreate `.spekk/builder.prompt.override.md`:\n```markdown\n# Custom Builder Agent\n\nYou are a builder agent for a Django/React project.\n...entirely custom instructions...\n```\n\nThis replaces the base builder prompt entirely. Global and local extends still layer on top.\n\n## Assertions\n\nSee `assertions/` for what must be true about layered prompt resolution.\n","branch":"main"},{"id":"layered-skill-discovery","title":"Layered Skill Discovery System","status":"done","priority":1,"file":"specs/layered-skill-discovery/layered-skill-discovery.md","content":"---\nid: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\n---\n\n# Layered Skill Discovery System\n\n## Overview\n\nSkills for coach and builder agents are discovered from layered directories — exactly like agent prompts work today via `PromptResolver`. Users can add their own skills at the local (project) or global (home) level, and package-shipped skills serve as the fallback.\n\nPreviously, skills were hardcoded in a `SKILL_MAP` in `src/coach/cli.js` and the builder had no skill support at all. This spec replaces that with a `SkillResolver` class that mirrors the `PromptResolver` pattern.\n\n## Architecture\n\n### SkillResolver\n\nA new `SkillResolver` class in `src/cli/skill-resolver.js` provides:\n- `resolveSkill(agentName, subcommand)` — returns `{ name, content, source }` or `null`\n- `listSkills(agentName)` — returns `[{ name, source }]`\n\nConstructor accepts `{ homeDir, cwd }` for testability (same as `PromptResolver`).\n\n### Resolution Order (first match wins)\n\n| Layer | Path | Purpose |\n|-------|------|---------|\n| Local | `.spekk/skills/{agent}/*.md` | Project-specific skills |\n| Global | `~/.config/spekk/skills/{agent}/*.md` | User's personal skills across all projects |\n| Package | `specs/coach-skills-system/` (coach) / `specs/builder-skills/` (builder) | Ships with spekk |\n\n### Skill Name Derivation\n\n- Primary: filename stem minus `.md` (e.g., `my-validator.md` → subcommand `my-validator`)\n- Secondary: frontmatter `id` field as alternative lookup name\n\n### Legacy Aliases\n\nFor backward compatibility with existing CLI subcommands:\n- `meeting` → `meeting-notes-to-specs-skill`\n- `coordinate` → `coordinator-skill`\n\n### Skill Activation\n\nWhen a skill resolves, its full markdown content is inlined into the activation message within `\u003cskill-content\u003e` tags. The agent receives the complete workflow instructions directly — same pattern as the existing coach skill inlining.\n\n## Both Agents Support Skills\n\n- **Coach:** `spekk coach \u003cskill\u003e` (replaces `SKILL_MAP` approach)\n- **Builder:** `spekk builder \u003cskill\u003e [flags]` (new — first positional arg is checked as skill)\n\n## Dynamic Help\n\nBoth `spekk coach --help` and `spekk builder --help` dynamically list available skills by calling `skillResolver.listSkills()`.\n\n## Assertions\n\nSee `assertions/` for what must be true about layered skill discovery.\n","branch":"main"},{"id":"meeting-notes-to-specs","title":"Meeting Notes to Specs","status":"done","priority":2,"file":"specs/meeting-notes-to-specs/meeting-notes-to-specs.md","content":"---\nid: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 2\n---\n\n# Meeting Notes to Specs\n\nA coach skill that processes meeting transcripts and extracts actionable outcomes: todos, specs, and context updates.\n\n## Overview\n\nMeeting-to-spec conversion is a **coach responsibility**. When the user provides a meeting transcript, the coach activates its meeting-processing skill to categorize content into three outputs:\n\n1. **Todos** - action items and follow-ups\n2. **Specs** - features and product changes\n3. **Context** - architectural decisions and patterns\n\nThis is not a standalone agent. It extends the coach's existing capabilities through the coach skills framework (see `specs/coach-skills-system/`). The coach prompt is the base — meeting processing is an additive skill/mode, not a separate prompt.\n\n## Success Criteria\n\n- Coach skill activates when user provides a meeting transcript via `spekk coach meeting`\n- Meeting transcript → structured outputs in \u003c30 seconds\n- Todos separated from specs (action items ≠ product features)\n- All outputs formatted correctly and ready to commit\n- Single commit includes all three categories with clear labeling\n- No duplication of spec format rules — reuses coach's existing knowledge of spec structure\n\n## Workflow\n\n```\nInput: meeting transcript file (via `spekk coach meeting`)\n↓\nCoach activates meeting-processing skill\n↓\nOutput 1: TODOS.md (action tracking)\nOutput 2: Proposed specs (waits for approval)\nOutput 3: Updated CONTEXT.md (shows diff for approval)\n↓\nSingle commit with all changes\n```\n","branch":"main"},{"id":"observer-agent","title":"Observer Agent (SUPERSEDED)","status":"done","priority":2,"file":"specs/observer-agent/observer-agent.md","content":"---\nid: observer-agent\ncreated: 2026-01-22T17:00:00Z\npriority: 2\n---\n\n# Observer Agent (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-agents` for the Go replacement.\n\nThe observer agent continuously monitors the system for drift and misalignment between specifications and implementation. It acts as a quality assurance layer that identifies issues for human review and coaching.\n\n## Purpose\n\nThe observer detects four key types of drift:\n\n1. **Code-spec misalignment** - Implementation doesn't match what specs declare\n2. **Outdated specs** - Specifications that no longer reflect current needs\n3. **Spec compression opportunities** - Multiple specs that could be consolidated\n4. **Spec conflicts** - Contradictory requirements between different specs\n\n## Behavior\n\nThe observer runs in a continuous loop, scanning the codebase and specs directory to identify drift. It records findings in the `observations/` directory as markdown files with YAML frontmatter for human review.\n\nUnlike coach and builder agents, the observer does not make changes - it only observes and reports. Humans review observations with the coach agent to determine appropriate spec updates.\n\n## Integration\n\n- Observations are parsed by the same spec parser that handles specs and assertions\n- CLI provides commands to launch observer in continuous monitoring mode\n- Observer findings feed back into the spec-driven development cycle through human review","branch":"main"},{"id":"optimize-test-performance","title":"Optimize Test Performance","status":"done","priority":1,"file":"specs/optimize-test-performance/optimize-test-performance.md","content":"---\nid: optimize-test-performance\ncreated: 2026-01-28T21:25:00Z\npriority: 1\n---\n\n# Optimize Test Performance\n\n## Overview\n\nTests are currently taking too long (timing out after 30s) and failing in CI. Individual tests are taking 5+ seconds when they should complete in milliseconds. The goal is to get the entire test suite running in under 10 seconds.\n\n## Current Issues\n\n**Performance Problems:**\n- Tests timing out after 30 seconds in CI\n- Individual tests taking 5+ seconds each\n- Some tests taking over 5000ms (orchestration loops)\n- 37 test files found, but too slow to complete\n\n**Root Causes:**\n- Tests may be spawning real processes instead of mocking\n- File system operations without proper cleanup\n- Network calls or external dependencies\n- Inefficient test setup/teardown\n\n## Target Performance\n\n- **Total test suite:** \u003c 30 seconds\n- **Individual tests:** \u003c 500ms each\n- **Test suites:** \u003c 3 seconds each\n- **CI pipeline:** Reliable completion without timeouts","branch":"main"},{"id":"robust-error-handling","title":"Robust Error Handling","status":"done","priority":1,"file":"specs/robust-error-handling/robust-error-handling.md","content":"---\nid: robust-error-handling\ncreated: 2026-01-28T21:35:00Z\npriority: 1\n---\n\n# Robust Error Handling\n\n## Overview\n\nThe CLI should gracefully handle malformed files and parsing errors instead of completely failing. Users should get warnings but the system should continue to function.\n\n## Current Problem\n\nThe CLI completely fails and exits when it encounters malformed observation files or other parsing errors, making the entire system unusable.\n\n## Required Behavior\n\n- **Warn but continue** - Log warnings for malformed files\n- **Skip invalid files** - Ignore files that can't be parsed\n- **Never crash the CLI** - Always return valid JSON or continue processing\n- **Provide helpful messages** - Tell users which files have issues","branch":"main"},{"id":"sandbox-command","title":"Sandbox Command (SUPERSEDED)","status":"done","priority":1,"file":"specs/sandbox-command/sandbox-command.md","content":"---\nid: sandbox-command\ncreated: 2026-03-12T15:00:00Z\npriority: 1\n---\n\n# Sandbox Command (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-sandbox` for the Go replacement.\n\n## Overview\n\nThe `spekk sandbox` command manages DigitalOcean droplet-based agent sandboxes. Each sandbox is an isolated Ubuntu 24.04 droplet running the Spekk agent client, which connects outward to the Spekk Django app via WebSocket to receive messages and invoke Claude Code.\n\nThis is a developer tool for provisioning, deploying, and managing agent infrastructure from the CLI.\n\n## Commands\n\n```\nspekk sandbox create --name \u003cname\u003e [--region nyc1] [--size s-2vcpu-4gb]\nspekk sandbox list\nspekk sandbox status \u003cname\u003e\nspekk sandbox ssh \u003cname\u003e\nspekk sandbox destroy \u003cname\u003e\nspekk sandbox deploy \u003cname\u003e\n```\n\n## Architecture\n\n- Uses DigitalOcean API directly via Node.js `fetch` (no `doctl` dependency)\n- Requires `DO_API_TOKEN` environment variable for API access\n- Stores sandbox metadata locally in `~/.config/spekk/sandboxes.json`\n- Cloud-init template and agent-client.py are bundled with the CLI package\n- SSH key must be pre-registered in DigitalOcean; CLI uses the user's default SSH key\n\n## Provisioning Flow (create)\n\n1. Call DO API to create a droplet with cloud-init.yaml as user data\n2. Poll droplet status until active, then poll SSH until cloud-init completes (`/opt/spekk/.provisioned` marker)\n3. Read credentials from environment or prompt interactively: `ANTHROPIC_API_KEY`, `GITHUB_TOKEN`, `SPEKK_AGENT_TOKEN`, `SPEKK_HOST`\n4. SSH in and run credential setup (write `/etc/spekk/agent.env`, configure git/gh for agent user)\n5. Deploy `agent-client.py` to `/opt/spekk/`, install Python dependencies, start systemd service\n6. Register the agent in Django via API (creates Agent model)\n7. Print connection status and sandbox summary\n\n## Reference Infrastructure\n\nThe provisioning templates live in the `spekk-agent-sandboxes` repo at `infrastructure/droplet/`:\n- `cloud-init.yaml` -- droplet provisioning (Docker, Node.js, git, gh, Claude Code CLI)\n- `setup-credentials.sh` -- post-provision secret injection\n- `agent-client.py` -- WebSocket client that connects to Django\n- `deploy-agent.sh` -- copies agent client and starts systemd service\n","branch":"main"},{"id":"sandbox-go-release","title":"Sandbox Go Release Integration","status":"done","priority":1,"file":"specs/sandbox-go-release/sandbox-go-release.md","content":"---\nid: sandbox-go-release\ncreated: 2026-04-01T00:00:00Z\npriority: 1\n---\n\n# Sandbox Go Release Integration\n\nThe sandbox commands deploy the Go agent binary by downloading versioned release artifacts (binary + cloud-init.yaml) from the spekk-app GitHub repository. No infrastructure code is bundled in this repo or duplicated from spekk-app.\n","branch":"main"},{"id":"self-hosted-gh-runners","title":"Self-Hosted GitHub Actions Runners","status":"done","priority":1,"file":"specs/self-hosted-gh-runners/self-hosted-gh-runners.md","content":"---\nid: self-hosted-gh-runners\ncreated: 2026-03-10T00:00:00Z\npriority: 1\n---\n\n# Self-Hosted GitHub Actions Runners\n\nGitHub Actions workflows use self-hosted runners on the DO droplet instead of GitHub-hosted runners, eliminating GitHub Actions minute consumption.\n\n## Context\n\nThe spekk-ai/spekk-app repo already has self-hosted runners configured on a DigitalOcean droplet. This spec mirrors that setup for the spekk-cli-runners repo.\n\n## Manual Prerequisite (ops step, not builder work)\n\nBefore workflows will succeed, register a new runner on the DO droplet for this repo:\n\n1. Go to GitHub → spekk-ai/spekk-cli-runners → Settings → Actions → Runners → New self-hosted runner\n2. Follow the registration steps on the droplet\n3. The runner will pick up jobs tagged `[self-hosted, linux]`\n\n## Done When\n\nBoth workflow files use `runs-on: [self-hosted, linux]` with a containerized Node environment, matching the pattern in spekk-app.\n","branch":"main"},{"id":"self-update","title":"Self-Update Command","status":"in_progress","priority":2,"file":"specs/self-update/self-update.md","content":"---\nid: self-update\ncreated: 2026-06-12T00:00:00Z\npriority: 2\n---\n\n# Self-Update Command\n\n`spekk update` upgrades the installed binary in place from the latest GitHub\nrelease, with no package manager and no auth token required. `spekk update\n--check` previews what would happen without touching the filesystem.\n\n```bash\nspekk update          # download and install the latest release\nspekk update --check  # show current vs. latest version, install nothing\n```\n\nShipped in v1.5.0 (PR #107); implementation lives in `internal/update/`\n(`update.go`, tests in `update_test.go`). PR #114 hardened the permission\nfailure mode (see `fail-fast-permission-error`).\n\n## Design\n\n- **Release source:** `https://api.github.com/repos/spekk-ai/spekk-cli/releases/latest`,\n  unauthenticated. Release assets are named `spekk-{goos}-{goarch}`\n  (plus `.exe` on Windows), matching what `publish.yml` uploads and what\n  `install.sh` downloads.\n- **In-place atomic replace:** the new binary is written to a temp file in the\n  same directory as the running binary (resolved through symlinks via\n  `os.Executable` + `filepath.EvalSymlinks`), then renamed over it. Same-dir\n  temp + rename keeps the swap atomic on POSIX filesystems.\n- **Fail fast on permissions:** the temp file is created *before* any download,\n  so a read-only install dir (e.g. a sudo-installed `/usr/local/bin`) fails\n  immediately with an actionable message instead of after wasting a download.\n- **No auto-sudo:** the binary never escalates privileges itself; it tells the\n  user to re-run with sudo. The companion fix is moving the default install\n  location to a user-owned directory (see the `install-script` spec).\n\n## Assertions\n\nSee `assertions/` for what must be true about the update flow.\n","branch":"main"},{"id":"simplified-display-formatting","title":"Simplified Display Formatting","status":"done","priority":2,"file":"specs/simplified-display-formatting/simplified-display-formatting.md","content":"---\nid: simplified-display-formatting\ncreated: 2026-01-22T22:30:00Z\npriority: 2\n---\n\n# Simplified Display Formatting\n\nStatus and priority displays should be simplified to reduce visual noise and improve readability.\n\n## Requirements\n\nThe current status and priority displays are too verbose with unnecessary text labels and emoji clutter. This spec defines a cleaner, more focused display format.\n\n### Display Format\n\nAll status and priority displays should follow this pattern:\n**Priority Number → Status Icon → Title**\n\n### Status Display Rules\n\n- Status should show **icon only** (no text labels)\n- Remove text like \"Done\", \"In Progress\", \"Not Started\" \n- Keep existing status icons: ✅ 🚧 📋 ⏸️ 📝\n\n### Priority Display Rules  \n\n- Priority should show **number only** (no emoji decorations)\n- Remove priority emojis like 🔥 ⚠️ 💡\n- Show just: 1, 2, 3\n\n### Affected Components\n\nThis applies to:\n- Console status command output\n- Web interface tree view\n- Web interface detail badges\n- All other status/priority displays in the system\n\n## Success Criteria\n\n- All displays show format: `{priority} {status_icon} {title}`\n- No text labels on status badges\n- No emoji decorations on priority badges  \n- Consistent ordering across all components","branch":"main"},{"id":"spec-explorer-web-interface","title":"Spec Explorer Web Interface (SUPERSEDED)","status":"done","priority":2,"file":"specs/spec-explorer-web-interface/spec-explorer-web-interface.md","content":"---\nid: spec-explorer-web-interface\ncreated: 2026-01-22T21:00:00Z\npriority: 2\n---\n\n# Spec Explorer Web Interface (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-show` for the Go replacement.\n\n## Overview\n\nThe `spekk show` command generates a web-based interface for exploring specs as an interactive tree with detailed views. This provides a visual alternative to the text-based `spekk status` command.\n\n## Core Functionality\n\nThe command creates a temporary web page that displays the spec hierarchy as an expandable tree interface, similar to a file explorer. Users can navigate the spec structure and view detailed information about each spec and assertion.\n\n## Interface Design\n\n**Tree Navigation:**\n- Specs appear as top-level items in an expandable dropdown tree\n- Assertions appear as sub-items under their parent specs\n- Visual indicators show status and priority for each item\n\n**Detail Panel:**\n- Right-side panel shows details when clicking any spec or assertion\n- Emphasizes status (not_started, in_progress, done) and priority (1, 2, 3)\n- Displays spec/assertion content and metadata\n\n## File Generation\n\n**Location:** Generated HTML file is placed at `.spekk/index.html`\n**Directory Creation:** `.spekk/` directory is created automatically if it doesn't exist\n**Browser Launch:** Generated file opens in the system's default browser\n\n## Success Criteria\n\nUsers can run `spekk show` in any spec-driven project directory and immediately see a visual representation of their spec hierarchy with detailed status information.","branch":"main"},{"id":"spec-parser","title":"Spec Parser (SUPERSEDED)","status":"done","priority":1,"file":"specs/spec-parser/spec-parser.md","content":"---\nid: spec-parser\ncreated: 2026-01-20T15:35:00Z\npriority: 1\n---\n\n# Spec Parser (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-parser` for the Go replacement.\n\n## Overview\n\nThe spec parser is the foundation of the Spekk system - it reads specification files and identifies what to work on next. This is the \"factory builder\" that enables spec-driven development.\n\n## Spec File Structure\n\n### Folder Organization\nEach spec is a folder containing:\n- Main spec file: `{spec-id}/{spec-id}.md`\n- Assertions subfolder: `{spec-id}/assertions/`\n- Assertion files: `{spec-id}/assertions/{assertion-id}.md`\n\nExample:\n```\nspecs/\n├── spec-parser/\n│   ├── spec-parser.md\n│   └── assertions/\n│       ├── parses-frontmatter.md\n│       ├── validates-required-fields.md\n│       └── ...\n```\n\n### File Format\nBoth specs and assertions are Markdown files with YAML frontmatter.\n\n**Spec file frontmatter:**\n```yaml\n---\nid: spec-parser              # Unique identifier (kebab-case)\ncreated: 2026-01-20T15:35:00Z  # ISO 8601 timestamp (immutable)\npriority: 1                   # 1 (highest) | 2 (medium) | 3 (lowest)\n---\n```\n\n**Assertion file frontmatter:**\n```yaml\n---\nid: parses-frontmatter       # Unique within parent spec\nparent: spec-parser          # Parent spec id\ncreated: 2026-01-20T16:00:00Z\npriority: 1                   # 1 (highest) | 2 (medium) | 3 (lowest)\n---\n```\n\n### Priority Levels\n\nOnly three priority levels are allowed:\n- **1** - Highest priority (critical, blocking)\n- **2** - Medium priority (important, but not blocking)\n- **3** - Lowest priority (nice to have, future work)\n\nThis constraint keeps prioritization simple and forces clear decisions about importance.\n\n## What the Parser Does\n\n### 1. Read and Parse\n- Recursively scans `specs/` directory for spec folders\n- Reads all `.md` files (specs and assertions)\n- Extracts and validates YAML frontmatter\n- Builds hierarchical structure: specs → assertions\n\n### 2. Validate Format\n- Ensures required fields exist (`id`, `created`, `priority`)\n- Validates field types and formats\n- Checks for duplicate IDs\n- Validates folder structure matches declared format\n- Reports errors for malformed specs\n\n### 3. Identify Next Work Item\n- Filters to incomplete items (status != \"done\")\n- Sorts by priority (1 is highest, then 2, then 3)\n- **Tie-breaking**: When multiple items have same priority, select oldest by `created` timestamp\n- Returns the single highest-priority incomplete assertion\n- If all assertions done for a spec, returns next spec\n\n### 4. Output Format\nMachine-readable JSON output:\n```json\n{\n  \"type\": \"assertion\",\n  \"id\": \"parses-frontmatter\",\n  \"parent\": \"spec-parser\",\n  \"file\": \"specs/spec-parser/assertions/parses-frontmatter.md\",\n  \"priority\": 0,\n  \"status\": \"not_started\",\n  \"title\": \"Parser Must Extract YAML Frontmatter\"\n}\n```\n\n## Status Aggregation\n\nSpecs derive their status from assertions:\n- Spec is `done` only when ALL assertions are `done`\n- If ANY assertion is `in_progress`, spec shows as `in_progress`\n- If ANY assertion is `not_started`, spec shows as `not_started`\n\nStatus values:\n- `not_started` - Not yet implemented (default)\n- `in_progress` - Currently being worked on\n- `done` - Implemented and validated\n- `draft` - Placeholder/planning stage (excluded from work queue)\n\n## Implementation\n\nThe parser is a **Node.js module** in `src/parser/`.\n\n**Key Design Principles:**\n- **Standalone**: Can be run independently as CLI tool\n- **Language agnostic**: Outputs JSON that any language can consume\n- **Fast**: Executes in \u003c 100ms even with many specs\n- **Self-contained**: Minimal dependencies, no database required\n\n**Current Implementation:**\n- Language: Node.js + ES modules\n- Location: `src/parser/`\n- Dependencies: Built-in YAML frontmatter parsing (no external deps needed)\n- Interface: CLI that outputs JSON to stdout\n\n**Usage:**\n```bash\n# From project root\nnpm run next\n\n# Or directly\nnode src/parser/cli.js\n\n# Returns JSON to stdout\n```\n\n## Why This Exists\n\nThe parser enables spec-driven development. Without it:\n- Agents/developers manually scan files to find next priority\n- No validation that specs follow the declared format\n- No automation of the \"what's next?\" workflow\n\nWith the parser:\n- Ralph loop can automate work: `parser → read assertion → work → mark done → commit`\n- CI can verify specs are well-formed\n- Dashboards can show status and priorities\n- The system becomes self-hosting\n\nThis is infrastructure for the infrastructure.\n\n## Assertions\n\nSee `assertions/` subfolder for detailed validation criteria and behaviors that must be true for this spec to be considered complete.\n","branch":"main"},{"id":"spekk-cli","title":"Spekk CLI (SUPERSEDED)","status":"done","priority":2,"file":"specs/spekk-cli/spekk-cli.md","content":"---\nid: spekk-cli\ncreated: 2026-01-21T19:00:00Z\npriority: 2\n---\n\n# Spekk CLI (SUPERSEDED)\n\n\u003e **Superseded:** This spec describes the original Node.js implementation. See `golang-cli` for the Go replacement.\n\n## Overview\n\nThe spekk-cli command-line interface provides core spec-driven development commands for parsing specs, launching agents, and managing workflows across any spec-driven project.\n\n## Core Commands\n\n### Parser Commands\n- `spekk` (default) - Parse specs in current directory and return next priority item\n- `spekk next` - Alias for default parser behavior\n- `spekk status` - Show status overview of all specs and assertions\n\n### Agent Commands  \n- `spekk coach` - Launch coach loop (interactive agent sessions) for current directory\n- `spekk builder` - Launch builder loop (automated implementation) for current directory\n\n### Utility Commands\n- `spekk --version` - Show CLI version\n- `spekk --help` - Show command help\n\n## Status Overview Command\n\nThe `spekk status` command provides a comprehensive
