 view of spec progress:\n\n```bash\n$ spekk status\n\n📋 Spec Status Overview\n\n✅ semantic-versioning (3/3 assertions complete)\n🚧 spekk-cli-extraction (1/7 assertions complete)\n   ✅ project-structure-exists\n   📋 specs-moved-to-cli  \n   📋 cli-parses-external-specs\n   📋 agent-loops-work-externally\n   📋 local-parser-removed\n   📋 cli-project-is-spec-driven\n   📋 current-project-uses-spekk-cli\n⏸️  other-spec (0/2 assertions complete)\n\nNext Priority: specs-moved-to-cli (spekk-cli-extraction)\n```\n\n## Design Principles\n\n**Context Awareness:** CLI operates on current working directory's specs/ folder\n**Global Installation:** Available as `spekk` command anywhere on system  \n**Self-Contained:** No dependencies on local project structure\n**Fast Execution:** All operations complete in \u003c 100ms\n**Cross-Platform:** Works on macOS, Linux, Windows","branch":"main"},{"id":"spekk-init","title":"spekk init — One Command to Opt a Project In","status":"done","priority":2,"file":"specs/spekk-init/spekk-init.md","content":"---\nid: spekk-init\ncreated: 2026-06-11T00:00:00Z\npriority: 2\n---\n\n# spekk init — One Command to Opt a Project In\n\nThe recommended workflow is `spekk init` → `spekk coach` → `spekk builder`. `spekk init` is the opt-in gesture: it creates the `specs/` directory that tells spekk (and any installed spekk agents) that this project uses spec-driven development. It does nothing else — no config files, no dotfiles, no scaffolding beyond a short README so the directory is git-trackable and self-explanatory.\n","branch":"main"},{"id":"spekk-show-watch","title":"Live-Reload Watch Mode for `spekk show`","status":"done","priority":1,"file":"specs/spekk-show-watch/spekk-show-watch.md","content":"---\nid: spekk-show-watch\ncreated: 2026-02-26T18:00:00Z\npriority: 1\n---\n\n# Live-Reload Watch Mode for `spekk show`\n\n`spekk show --watch` starts a local HTTP server that serves the spec explorer and live-reloads the browser via Server-Sent Events (SSE) whenever spec files change.\n\n## Architecture\n\nThe current `spekk show` generates a static HTML file and opens it via `file://`. Watch mode adds:\n\n1. **File watcher** (`src/show/watcher.js`) - Watches `specs/` directory for changes, debounces rapid edits\n2. **HTTP server with SSE** (`src/show/server.js`) - Serves the generated HTML over HTTP and pushes reload events via SSE `/events` endpoint\n3. **SSE client script** - Injected into generated HTML when in watch mode; listens for reload events and refreshes the page\n4. **CLI integration** - `--watch` flag parsed via existing `parseFlags()` utility, `showSpekk()` branches between static-file mode and watch-server mode\n\n## Design Decisions\n\n- **No new dependencies** - Uses only Node.js stdlib (`http`, `fs.watch`)\n- **SSE over WebSocket** - One-direction push is all we need; SSE is simpler, no handshake, native browser support\n- **Debounced regeneration** - File watcher debounces to ~300ms to avoid thrashing during batch edits\n- **Graceful shutdown** - Ctrl+C cleanly closes server, watcher, and all SSE connections\n","branch":"main"},{"id":"test-file-organization","title":"Parser Test File Organization","status":"done","priority":1,"file":"specs/test-file-organization/test-file-organization.md","content":"---\nid: test-file-organization\ncreated: 2026-01-21T23:30:00Z\npriority: 1\n---\n\n# Parser Test File Organization\n\n## What Must Be True\n\nParser tests must be properly organized in separate, focused test files at the correct location to avoid token limits and improve maintainability.\n\n## Current Problem\n\n- Tests are in wrong locations: `tests/spec-parser.test.js` and `src/__tests__/spec-parser.test.js`\n- Combined file size exceeds builder agent token limits (~1700 lines)\n- Tests cover different concerns but are mixed together\n\n## Target Structure\n\n```\nsrc/parser/__tests__/\n├── parser-basic.test.js         # Basic parsing and CLI functionality\n├── frontmatter-parsing.test.js  # YAML frontmatter parsing tests  \n├── field-validation.test.js     # Required fields, format validation\n├── json-output.test.js          # JSON output format validation\n├── priority-algorithm.test.js   # Next priority identification logic\n└── folder-structure.test.js     # Directory structure validation\n```\n\n## Success Criteria\n\n- ✅ All test files are in `src/parser/__tests__/` directory\n- ✅ Tests are split into focused, single-responsibility files\n- ✅ No individual test file exceeds 500 lines\n- ✅ All existing test coverage is preserved\n- ✅ Tests run successfully with `npm test`\n- ✅ Old test files in `tests/` and `src/__tests__/` are removed\n- ✅ Each test file has clear, descriptive naming\n\n**Tests:** Manual validation (run `npm test` to verify all pass)","branch":"main"}],"assertions":[{"id":"coach-prompt-skill-references","parent":"agent-install","title":"Coach Prompt References Skills via `spekk skill`, Not Repo Paths","status":"done","priority":2,"file":"specs/agent-install/assertions/coach-prompt-skill-references.md","content":"---\nid: coach-prompt-skill-references\nparent: agent-install\ncreated: 2026-06-11T00:00:00Z\npriority: 2\nstatus: done\nbranch: feat/agent-install\n---\n\n# Coach Prompt References Skills via `spekk skill`, Not Repo Paths\n\nThe coach prompt instructs agents to fetch skill content with `spekk skill show coach \u003cname\u003e` instead of reading `specs/coach-skills-system/*.md` from disk, so the prompt works in any project — not just inside the spekk-cli repo.\n\n## Success Criteria\n\n- `specs/coach-agent/coach.prompt.md` tells the agent to discover skills with `spekk skill list coach` and load one with `spekk skill show coach \u003cname\u003e`.\n- Reading skill files directly from `specs/coach-skills-system/` is mentioned only as a fallback for when the `spekk` CLI is unavailable (e.g., working inside this repo without the binary).\n- No other instruction in the prompt depends on the spekk-cli repo's own directory layout being present in the user's project.\n\n**Tests:** prompt content is verified by inspection; resolution behavior covered by `internal/cli/skill_test.go`.\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"install-command","parent":"agent-install","title":"`spekk install --target \u003ctool\u003e` Writes Thin Shim Subagents","status":"done","priority":1,"file":"specs/agent-install/assertions/install-command.md","content":"---\nid: install-command\nparent: agent-install\ncreated: 2026-06-11T00:00:00Z\npriority: 1\nstatus: done\nbranch: feat/agent-install\n---\n\n# `spekk install --target \u003ctool\u003e` Writes Thin Shim Subagents\n\n`spekk install --target \u003ctool\u003e` installs spekk's agents (coach, builder, observer) into a host coding assistant as thin shim files that fetch their real instructions from the binary at session start.\n\n## Success Criteria\n\n- `internal/install` package exports `Install(opts Options) ([]string, error)` returning the list of written file paths. `Options` includes `Target`, `Project bool`, `HomeDir`, `Cwd` (injectable for tests).\n- Supported targets: `claude-code` (alias `claude`), `copilot`, `cursor`, `opencode`, `codex`:\n  - `claude-code`: global `~/.claude/agents/spekk-\u003cagent\u003e.md`, project `.claude/agents/spekk-\u003cagent\u003e.md`; YAML frontmatter with `name` and `description`.\n  - `copilot`: global `~/.copilot/agents/spekk-\u003cagent\u003e.agent.md`, project `.github/agents/spekk-\u003cagent\u003e.agent.md`; YAML frontmatter with `name` and `description`; note the `.agent.md` extension.\n  - `cursor`: global `~/.cursor/agents/spekk-\u003cagent\u003e.md`, project `.cursor/agents/spekk-\u003cagent\u003e.md`; YAML frontmatter with `name` and `description`.\n  - `opencode`: global `~/.config/opencode/agents/spekk-\u003cagent\u003e.md`, project `.opencode/agents/spekk-\u003cagent\u003e.md`; YAML frontmatter with `description` and `mode: subagent`.\n  - `codex`: global `~/.codex/prompts/spekk-\u003cagent\u003e.md`; `--project` returns an error explaining it is not supported for codex.\n- Shim body (shared across targets) instructs the agent to:\n  - run `spekk prompt \u003cagent\u003e` and adopt the output as its operating instructions for the session, and\n  - if the `spekk` command is not found, tell the user to install spekk (linking the repo) and stop.\n- Each agent's frontmatter `description` scopes auto-delegation to spec-driven-development requests in projects containing a `specs/` directory, so the agents stay dormant elsewhere.\n- Directories are created as needed; existing shim files are overwritten (idempotent re-install).\n- `spekk install` with a missing or unknown `--target` prints an error listing valid targets and pointing at `spekk prompt \u003cagent\u003e` as the fallback for unlisted tools, then exits 1.\n- Long-tail guidance lives in `spekk install --help` (OTHER TOOLS section) and the README (\"Use Spekk from Your Coding Assistant\"): any tool can consume `spekk prompt \u003cagent\u003e` directly via its custom-agent/rules mechanism or an `AGENTS.md` line.\n- `spekk install --help` shows usage; `spekk help` lists the `install` command.\n- On success the command prints each written path.\n\n**Tests:** `internal/install/install_test.go` — written paths per target/scope, shim content (frontmatter + body), codex `--project` error, unknown target error, idempotent overwrite.\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"prompt-command","parent":"agent-install","title":"`spekk prompt \u003cagent\u003e` Prints the Resolved Agent Prompt","status":"done","priority":1,"file":"specs/agent-install/assertions/prompt-command.md","content":"---\nid: prompt-command\nparent: agent-install\ncreated: 2026-06-11T00:00:00Z\npriority: 1\nstatus: done\nbranch: feat/agent-install\n---\n\n# `spekk prompt \u003cagent\u003e` Prints the Resolved Agent Prompt\n\n`spekk prompt \u003cagent\u003e` prints the layered-resolved prompt for `coach`, `builder`, or `observer` to stdout, suitable for piping or for a host-tool agent to consume.\n\n## Success Criteria\n\n- `spekk prompt coach` prints the coach prompt (resolved via the existing `PromptResolver` layering: local/global overrides, embedded base, global/local extensions) to stdout with no extra decoration.\n- Works identically for `builder` and `observer`.\n- Unknown agent name prints an error to stderr listing valid agents and exits 1.\n- Missing agent argument prints usage to stderr and exits 1.\n- `spekk prompt --help` shows usage.\n- `spekk help` lists the `prompt` command.\n\n**Tests:** `internal/cli/prompt_test.go` (resolution already covered); command wiring exercised via `cmd/spekk` dispatch.\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"skill-command","parent":"agent-install","title":"`spekk skill` Exposes Layered Skill Discovery on the CLI","status":"done","priority":1,"file":"specs/agent-install/assertions/skill-command.md","content":"---\nid: skill-command\nparent: agent-install\ncreated: 2026-06-11T00:00:00Z\npriority: 1\nstatus: done\nbranch: feat/agent-install\n---\n\n# `spekk skill` Exposes Layered Skill Discovery on the CLI\n\n`spekk skill list \u003cagent\u003e` and `spekk skill show \u003cagent\u003e \u003cname\u003e` expose the existing `SkillResolver` so agents running in any harness can discover and fetch skill content without filesystem access to the spekk repo.\n\n## Success Criteria\n\n- `spekk skill list coach` prints one line per available skill: the skill name and its source (the resolving directory, or `embedded`), using `SkillResolver.ListSkills`.\n- The listing excludes the spec doc that shares its directory's name (e.g. `coach-skills-system.md` inside `specs/coach-skills-system/`) — only actual skills are listed.\n- `spekk skill show coach \u003cname\u003e` prints the skill's markdown content to stdout, using `SkillResolver.ResolveSkill` (which honors the layer order: `.spekk/skills/\u003cagent\u003e/` → `~/.config/spekk/skills/\u003cagent\u003e/` → install dir → embedded FS).\n- Unknown skill name prints an error to stderr and exits 1.\n- Missing arguments print usage to stderr and exit 1.\n- `spekk skill --help` shows usage for both subcommands.\n- `spekk help` lists the `skill` command.\n\n**Tests:** `internal/cli/skill_test.go` (resolution already covered); command wiring exercised via `cmd/spekk` dispatch.\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"manual-parser-syntax-fix","parent":"bootstrap-system-recovery","title":"Manual Parser Syntax Fix","status":"done","priority":1,"file":"specs/bootstrap-system-recovery/assertions/manual-parser-syntax-fix.md","content":"---\nid: manual-parser-syntax-fix\nparent: bootstrap-system-recovery\ncreated: 2026-01-28T21:30:00Z\npriority: 1\nstatus: done\n---\n\n# Manual Parser Syntax Fix\n\n## What Must Be True\n\nThe parser at `src/parser/index.js` line 78 has the illegal `continue` statement fixed so `spekk next` can execute.\n\n## Critical Bootstrap Fix\n\n**Location:** `src/parser/index.js:78`\n**Issue:** `continue;` statement outside of loop context\n**Error:** `SyntaxError: Illegal continue statement: no surrounding iteration statement`\n\n## Manual Fix Required\n\nSince the builder cannot run to fix this automatically, this requires direct code editing:\n\n1. **Examine line 78** in `src/parser/index.js`\n2. **Remove or replace** the illegal `continue` statement\n3. **Likely solutions:**\n   - Remove the line if it's not needed\n   - Replace with `return` if early exit is intended\n   - Wrap in proper loop if iteration was intended\n\n## Success Criteria\n\n- ✅ `spekk next` executes without syntax errors\n- ✅ `node src/parser/cli.js` runs successfully\n- ✅ Parser can be called by builder loop\n\n## Urgency\n\n**BLOCKING:** This must be fixed before any other development can proceed. The entire spec-driven system depends on the parser working.","branch":"main","created":"2026-01-28T21:30:00Z"},{"id":"builder-locks-and-unlocks-assertions","parent":"builder-agent","title":"Builder Locks and Unlocks Assertions","status":"done","priority":1,"file":"specs/builder-agent/assertions/builder-locks-and-unlocks-assertions.md","content":"---\nid: builder-locks-and-unlocks-assertions\nparent: builder-agent\ncreated: 2026-02-25T20:10:00Z\npriority: 1\nstatus: done\ndepends-on: locked-by-field-for-parallel-builders\nbranch: feature/builder-locks\n---\n\n# Builder Locks and Unlocks Assertions\n\n## What Must Be True\n\nThe builder agent locks assertions when starting work and releases locks when completing work, enabling parallel builder execution.\n\n## Success Criteria\n\n- ✅ Builder adds `locked-by` field when marking assertion `in_progress`\n- ✅ Lock format: `builder-{hostname}-{pid}-{timestamp}`\n- ✅ Builder commits lock immediately after adding (before starting implementation)\n- ✅ Builder pulls after committing to detect conflicts\n- ✅ If conflict detected (someone else locked it), builder picks next assertion\n- ✅ Builder removes `locked-by` field when marking assertion `done`\n- ✅ Builder removes `locked-by` field when marking assertion `failed`\n- ✅ Lock removal happens in same commit as status change\n- ✅ Builder prompt includes locking instructions\n\n## Lock Workflow\n\n**Claiming work:**\n1. Run `spekk next` → get unlocked assertion\n2. Update YAML frontmatter:\n   ```yaml\n   status: in_progress\n   locked-by: builder-macbook-pro-12345-1706210400\n   ```\n3. Commit immediately with message: \"Lock assertion: {assertion-id}\"\n4. Pull to check for conflicts\n5. If conflict:\n   - Resolve (accept other builder's lock)\n   - Run `spekk next` again to get different assertion\n6. If no conflict:\n   - Begin implementation\n\n**Releasing lock:**\n1. Work completes\n2. Update YAML frontmatter:\n   ```yaml\n   status: done\n   # locked-by field removed\n   ```\n3. Commit with implementation changes\n\n## Generating Lock ID\n\nBuilder generates lock ID on startup:\n```bash\nHOSTNAME=$(hostname)\nPID=$$\nTIMESTAMP=$(date +%s)\nLOCK_ID=\"builder-${HOSTNAME}-${PID}-${TIMESTAMP}\"\n```\n\nExample: `builder-macbook-pro-12345-1706210400`\n\n## Implementation Notes\n\n- Builder prompt already includes locking instructions (section 5)\n- Parser already handles `locked-by` field (see locked-by-field-for-parallel-builders)\n- Git provides atomic commit mechanism for claiming work\n- Stale locks (\u003e2 hours) handled by parser, not builder\n- Builder doesn't need to check lock age - parser does it\n\n**Tests:** `src/builder/__tests__/builder-locks-and-unlocks.test.js`\n\n## Validation\n\nTest parallel builders:\n1. Run builder A on assertion-1\n2. Run builder B simultaneously\n3. Verify:\n   - Both builders lock different assertions\n   - No duplicate work\n   - Locks released on completion\n","branch":"feature/builder-locks","dependsOn":"locked-by-field-for-parallel-builders","created":"2026-02-25T20:10:00Z"},{"id":"builder-runner-exists","parent":"builder-agent","title":"Builder Runner Script Exists","status":"done","priority":1,"file":"specs/builder-agent/assertions/builder-runner-exists.md","content":"---\nid: builder-runner-exists\nparent: builder-agent\ncreated: 2026-01-20T19:40:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Runner Script Exists\n\n## What Must Be True\n\nA builder runner script must exist at the project root that orchestrates the builder agent workflow: get next task → work on it → commit → repeat.\n\n## File Location\n\n```\nbuilder-loop.sh      # Project root\n```\n\n## Expected Behavior\n\nThe script automates the builder agent workflow:\n\n1. **Get next task** - Run `npm run next` to identify next assertion\n2. **Work on task** - Invoke builder agent to implement the assertion\n3. **Commit changes** - Create git commit when task completes\n4. **Repeat** - Loop back to step 1\n\n**Stop conditions:**\n- No more incomplete assertions\n- User interrupts (Ctrl+C)\n- Builder encounters an error\n\n## Script Responsibilities\n\n**Task identification:**\n- Call parser to get next highest-priority assertion\n- Exit cleanly if no tasks remain\n\n**Builder invocation:**\n- Launch builder agent with appropriate context\n- Pass assertion details to builder\n- Capture builder output\n\n**Commit automation:**\n- Create meaningful commit messages\n- Include assertion ID and title in commit\n- Handle git operations safely\n\n**Error handling:**\n- Graceful failure if parser fails\n- Stop loop if builder fails\n- Clear error messages for user\n\n## Usage\n\n```bash\n# Run the builder loop\n./builder-loop.sh\n\n# The script handles:\n# - Finding next task\n# - Running builder agent\n# - Committing changes\n# - Looping to next task\n```\n\n## Success Criteria\n\n- ✅ `builder-loop.sh` exists at project root\n- ✅ Script is executable (`chmod +x builder-loop.sh`)\n- ✅ Script calls `npm run next` to get tasks\n- ✅ Script invokes builder agent with task context\n- ✅ Script creates git commits for completed work\n- ✅ Script loops until no tasks remain\n- ✅ Script handles Ctrl+C gracefully\n- ✅ Script stops on errors (doesn't infinite loop)\n- ✅ Clear output showing progress\n\n**Tests:** Manual validation (integration script)\n\n## Notes\n\nThis script is the automation layer that runs the builder agent repeatedly. It's expected to evolve as the builder workflow matures, hence it lives in the project root (not in app/) where it can be easily modified.\n","branch":"main","created":"2026-01-20T19:40:00Z"},{"id":"builder-uses-global-cli","parent":"builder-agent","title":"Builder Uses Global CLI Commands","status":"done","priority":1,"file":"specs/builder-agent/assertions/builder-uses-global-cli.md","content":"---\nid: builder-uses-global-cli\nparent: builder-agent\ncreated: 2026-01-28T21:10:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Uses Global CLI Commands\n\n## What Must Be True\n\nThe builder agent prompt must instruct builders to use the global `spekk` CLI commands instead of local npm scripts when working on external projects.\n\n## Required Updates\n\nThe builder prompt at `specs/builder-agent/builder-agent.prompt.md` must:\n\n1. Replace all instances of `npm run next` with `spekk next`\n2. Use global CLI commands consistently throughout the workflow\n3. Explain that `spekk` is the global CLI tool for spec-driven development\n\n## Specific Changes\n\n**In \"Get Next Task\" section (around line 22):**\n- ❌ OLD: `npm run next`\n- ✅ NEW: `spekk next`\n\n**In \"Validate System Health\" section (around line 117):**\n- ❌ OLD: `npm run next`  \n- ✅ NEW: `spekk next`\n\n**In bootstrap instructions:**\n- Should mention using `spekk next` when the parser doesn't exist yet\n\n## Success Criteria\n\n- ✅ All references to `npm run next` replaced with `spekk next`\n- ✅ Builder prompt explains that spekk is the global CLI tool\n- ✅ Instructions are consistent throughout the prompt\n- ✅ No local npm script references remain for spec parsing\n\n## Impact\n\nThis change ensures builders working on external projects use the standardized global CLI instead of project-specific npm scripts. The spekk CLI is designed to work from any directory with a specs/ folder.","branch":"main","created":"2026-01-28T21:10:00Z"},{"id":"creates-detailed-pr-descriptions","parent":"builder-agent","title":"Builder Creates Detailed PR Descriptions","status":"done","priority":2,"file":"specs/builder-agent/assertions/creates-detailed-pr-descriptions.md","content":"---\nid: creates-detailed-pr-descriptions\nparent: builder-agent\ncreated: 2026-01-22T17:20:00Z\npriority: 2\nstatus: done\n---\n\n# Builder Creates Detailed PR Descriptions\n\nWhen the builder creates pull requests, it provides comprehensive descriptions that explain the implementation and how it addresses the specifications.\n\n## Success Criteria\n\n- [ ] PR titles clearly describe the feature/fix implemented\n- [ ] PR body includes \"Summary\" section with 2-3 bullet points of what was implemented\n- [ ] PR body includes \"Test plan\" section with verification steps\n- [ ] PR body references the specific specs and assertions addressed\n- [ ] PR body explains any implementation decisions or trade-offs made\n- [ ] PR body follows consistent markdown formatting\n- [ ] PR descriptions help reviewers understand the scope and impact of changes","branch":"main","created":"2026-01-22T17:20:00Z"},{"id":"lean-test-philosophy","parent":"builder-agent","title":"Builder Follows Lean Testing Philosophy","status":"done","priority":1,"file":"specs/builder-agent/assertions/lean-test-philosophy.md","content":"---\nid: lean-test-philosophy\nparent: builder-agent\ncreated: 2026-02-25T00:30:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Follows Lean Testing Philosophy\n\nThe builder agent writes high-value tests only and actively removes redundant or low-value tests.\n\n## Success Criteria\n\n- Builder prompt includes explicit lean testing guidance\n- Tests validate meaningful behavior, not implementation details\n- No redundant tests — if two tests fail for the same reason, only one exists\n- Trivial code (getters, pass-throughs, framework behavior) is not tested\n- When the builder encounters redundant or low-value tests while working on an assertion, it deletes them\n- Integration tests are preferred over unit tests when they cover the same workflow more efficiently\n- Test suite runs fast and every test earns its place\n","branch":"main","created":"2026-02-25T00:30:00Z"},{"id":"prompt-exists","parent":"builder-agent","title":"Builder Agent Prompt Must Exist","status":"done","priority":1,"file":"specs/builder-agent/assertions/prompt-exists.md","content":"---\nid: prompt-exists\nparent: builder-agent\ncreated: 2026-01-20T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Agent Prompt Must Exist\n\n## What Must Be True\n\nA clear, complete prompt file must exist at `specs/builder-agent/builder-agent.prompt.md` that defines how the builder agent operates.\n\n## File Location\n\n```\nspecs/\n└── builder-agent/\n    └── builder-agent.prompt.md\n```\n\n## Required Content\n\nThe prompt must include:\n\n1. **Role definition** - What the builder agent does\n2. **Workflow steps** - How to get tasks, implement, test, commit\n3. **Stop instruction** - Work on ONE assertion at a time, then STOP\n4. **Test requirements** - When and how to write tests\n5. **Status management** - How to update assertion status\n6. **File paths** - Updated references to `app/` directory structure (not `scripts/` or `tests/`)\n\n## Key Requirements\n\n**Directory references must be current:**\n- ✅ References `app/parser/` for implementation\n- ✅ References `app/**/__tests__/` for tests\n- ✅ Uses `spekk next` command (global CLI, not `npm run next`)\n- ❌ No references to `scripts/` directory\n- ❌ No references to `tests/` directory\n\n**Behavioral requirements:**\n- Must explicitly state: \"Work on ONE assertion at a time, then STOP\"\n- Must include step 7: \"Stop\" instruction\n- Must not encourage looping or automatic continuation\n\n## Success Criteria\n\n- ✅ File exists at `specs/builder-agent/builder-agent.prompt.md`\n- ✅ Contains role definition for builder agent\n- ✅ Includes complete workflow (get task, read, implement, test, validate, update status, commit, stop)\n- ✅ Explicitly instructs builder to work on ONE task and STOP\n- ✅ References correct directory structure (`app/` not `scripts/` or `tests/`)\n- ✅ Uses global CLI commands (`spekk next`, not local npm scripts)\n- ✅ Explains status values (not_started, in_progress, done)\n- ✅ Describes priority levels (1, 2, 3)\n\n**Tests:** `specs/builder-agent/assertions/prompt-exists.test.sh`\n\nSidecar test should validate:\n- File exists at correct path\n- Contains key sections (role, workflow, stop instruction)\n- References `app/` directory structure\n- Uses `spekk next` command (global CLI)\n- Does not reference deprecated `scripts/` or `tests/` directories\n- Does not use local npm scripts for spec parsing\n","branch":"main","created":"2026-01-20T19:30:00Z"},{"id":"reads-complete-specs","parent":"builder-agent","title":"Builder Must Read Complete Specification Files","status":"done","priority":1,"file":"specs/builder-agent/assertions/reads-complete-specs.md","content":"---\nid: reads-complete-specs\nparent: builder-agent\ncreated: 2026-01-21T18:45:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Must Read Complete Specification Files\n\n## What Must Be True\n\n**Builder agents must read complete specification files** - never partial content that could miss critical requirements.\n\nWhen implementing an assertion, the builder must:\n\n1. **Read the FULL assertion file** - every line, no truncation\n2. **Read the FULL parent spec file** - complete context and requirements  \n3. **Read related assertion files** - understand interconnected requirements\n4. **Never rely on partial reads** - no line limits, no truncation\n\n## Why This Matters\n\n**Partial reads cause implementation errors:**\n- Missing language/technology requirements (Node.js vs Python)\n- Missing architectural constraints (standalone vs Django-integrated) \n- Missing explicit prohibitions (\"Must NOT exist\")\n- Incomplete understanding of success criteria\n\n**Recent example:**\n- Spec required standalone Node.js parser in `app/parser/`\n- Builder created Django management command instead\n- Likely caused by reading only ~90 lines, missing Node.js requirement\n\n## Implementation Requirements\n\n**File reading behavior:**\n- Use Read tool without line limits\n- Read complete files: `Read(file_path, limit=None, offset=None)`\n- For long files, read in chunks but process complete content\n- Never truncate frontmatter or success criteria sections\n\n**Required reading sequence:**\n1. Read assigned assertion file (complete)\n2. Read parent spec file (complete) \n3. Read related assertions if referenced\n4. Validate understanding against ALL requirements\n\n## Success Criteria\n\nThis assertion is \"done\" when:\n\n- ✅ Builder reads complete assertion files (no line limits)\n- ✅ Builder reads complete parent spec files  \n- ✅ Builder demonstrates understanding of full requirements\n- ✅ Builder catches technology/language requirements (Node.js vs Python)\n- ✅ Builder respects architectural constraints (standalone vs integrated)\n- ✅ Builder follows all explicit prohibitions (\"Must NOT exist\")\n- ✅ No more implementation errors from partial reading\n- ✅ Builder can explain WHY it chose specific implementation approach\n\n## Test Cases\n\n**Testable scenarios:**\n1. Spec with Node.js requirement → Builder uses Node.js (not Python)\n2. Spec with standalone requirement → Builder avoids framework integration  \n3. Spec with \"Must NOT exist\" section → Builder removes/avoids prohibited items\n4. Long spec file (\u003e100 lines) → Builder references content from entire file\n5. Assertion referencing parent spec → Builder shows knowledge of parent context\n\n**Tests:** src/builder/__tests__/reads-complete-specs.test.js\n\n## Implementation Notes\n\nThis is a **meta-requirement** about how builders operate, not what they build. It ensures quality execution of the spec-driven system itself.\n\n**Critical for system reliability** - partial understanding leads to off-spec implementations that require rework.","branch":"main","created":"2026-01-21T18:45:00Z"},{"id":"all-flag","parent":"builder-cli-flags","title":"--all Flag Is Removed (Looping Is Default)","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/all-flag.md","content":"---\nid: all-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --all Flag Is Removed (Looping Is Default)\n\n## Description\n\nContinuous looping is the default builder behavior. The `--all` flag is redundant and should be removed to avoid confusion.\n\n## Success Criteria\n\n- `spekk builder` loops through all assertions by default (no flag needed)\n- Default behavior: gets next priority assertion, builds it, repeats\n- Does not stop on failure — logs the failure and moves to the next assertion\n- Only stops when all assertions are `done` or `failed`\n- When all assertions complete, waits and polls for new work\n- Ctrl+C exits gracefully\n- The `--all` flag no longer exists in the CLI\n- `--spec` scopes the loop to a single spec's assertions\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"assertion-flag","parent":"builder-cli-flags","title":"--assertion Flag Targets Specific Assertion","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/assertion-flag.md","content":"---\nid: assertion-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --assertion Flag Targets Specific Assertion\n\n## Description\n\nThe `--assertion \u003cid\u003e` flag tells the builder to work on exactly that assertion, bypassing the priority queue.\n\n## Success Criteria\n\n- `spekk builder --assertion login-button` builds only that assertion\n- Ignores priority ordering - builds it regardless of priority\n- Works even if assertion status is `done` (allows re-running)\n- Shows error if assertion ID doesn't exist\n- Exits after building (single assertion, no loop)\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"confirm-flag","parent":"builder-cli-flags","title":"--confirm Flag Asks Before Building","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/confirm-flag.md","content":"---\nid: confirm-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --confirm Flag Asks Before Building\n\n## Description\n\nThe `--confirm` flag adds interactive confirmation before each build, allowing supervised autonomous mode.\n\n## Success Criteria\n\n- `spekk builder --confirm` shows assertion details and prompts `Build this? [y/n]`\n- `y` or `Enter` proceeds with build\n- `n` skips to next assertion\n- `q` exits the builder\n- Works with `--all` for supervised continuous mode\n- Works with `--spec` to confirm only within that spec\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"consistent-spekk-command","parent":"builder-cli-flags","title":"Consistent Use of Local spekk Command","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/consistent-spekk-command.md","content":"---\nid: consistent-spekk-command\nparent: builder-cli-flags\ncreated: 2026-02-25T00:14:00Z\npriority: 1\nstatus: done\n---\n\n# Consistent Use of Local spekk Command\n\n## Description\n\n`buildSpekkNextCommand()` hardcodes the string `'spekk next'` for injection into Claude's prompt, but `getNextAssertion()` correctly uses `getSpekkCommand()` which resolves to the local `bin/spekk.js`. This inconsistency means Claude may use a globally installed `spekk` instead of the local one, causing version mismatches.\n\n## Success Criteria\n\n- `buildSpekkNextCommand()` uses `getSpekkCommand()` instead of hardcoding `'spekk next'`\n- All references to the spekk CLI within the codebase use `getSpekkCommand()` for consistency\n- Claude's injected prompt references the local `bin/spekk.js` path, not the global `spekk`\n- No hardcoded `'spekk'` command strings exist outside of `getSpekkCommand()`\n\n**Tests:** src/builder/__tests__/cli.test.js (buildSpekkNextCommand consistency suite)\n","branch":"main","created":"2026-02-25T00:14:00Z"},{"id":"deduplicate-parse-flags","parent":"builder-cli-flags","title":"Deduplicate parseFlags Into Shared Utility","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/deduplicate-parse-flags.md","content":"---\nid: deduplicate-parse-flags\nparent: builder-cli-flags\ncreated: 2026-02-25T00:14:00Z\npriority: 1\nstatus: done\n---\n\n# Deduplicate parseFlags Into Shared Utility\n\n## Description\n\nTwo separate `parseFlags` functions exist — one in `src/builder/cli.js` and another in `src/parser/cli.js`. These should be consolidated into a single shared utility.\n\n## Success Criteria\n\n- One `parseFlags` function exists as a shared utility (not duplicated across modules)\n- Both `src/builder/cli.js` and `src/parser/cli.js` import from the shared utility\n- No duplicate flag-parsing logic across the codebase\n- Existing tests continue to pass after consolidation\n\n**Tests:** src/cli/__tests__/parse-flags.test.js\n","branch":"main","created":"2026-02-25T00:14:00Z"},{"id":"dry-run-flag","parent":"builder-cli-flags","title":"--dry-run Flag Shows What Would Be Built","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/dry-run-flag.md","content":"---\nid: dry-run-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --dry-run Flag Shows What Would Be Built\n\n## Description\n\nThe `--dry-run` flag shows what assertion would be built without actually launching Claude. Useful for previewing the queue.\n\n## Success Criteria\n\n- `spekk builder --dry-run` displays the next assertion's details:\n  - Assertion ID\n  - Title\n  - File path\n  - Priority\n  - Status\n- Does not launch Claude Code\n- Exits immediately after displaying\n- Works with `--spec` to preview filtered queue\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"interactive-flag","parent":"builder-cli-flags","title":"--interactive Flag Runs Claude in Non-Headless Mode","status":"done","priority":2,"file":"specs/builder-cli-flags/assertions/interactive-flag.md","content":"---\nid: interactive-flag\nparent: builder-cli-flags\ncreated: 2026-02-25T00:14:00Z\npriority: 2\nstatus: done\n---\n\n# --interactive Flag Runs Claude in Non-Headless Mode\n\n## Description\n\nThe `--interactive` / `-i` flag launches Claude in interactive (non-headless) mode, allowing the user to collaborate with Claude during the build rather than running fully autonomously.\n\n**Tests:** `src/builder/__tests__/cli.test.js` (buildClaudeSpawnConfig suite)\n\n## Success Criteria\n\n- `spekk builder --interactive` or `spekk builder -i` launches Claude without `--print` flag\n- User can interact with Claude during the build session\n- Default (no flag) remains headless/autonomous mode\n- Combines with `--assertion` to interactively build a specific assertion\n- Combines with `--spec` to interactively build within a spec's scope\n","branch":"main","created":"2026-02-25T00:14:00Z"},{"id":"once-flag","parent":"builder-cli-flags","title":"--once Flag Builds Single Assertion Then Exits","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/once-flag.md","content":"---\nid: once-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --once Flag Builds Single Assertion Then Exits\n\n## Description\n\nThe default `spekk builder` behavior is to loop continuously through all assertions until complete (Ctrl+C to exit). The `--once` flag overrides this to build exactly one assertion and exit.\n\n## Success Criteria\n\n- `spekk builder` with no flags loops continuously (gets next assertion, builds it, repeats)\n- `spekk builder --once` gets the next priority assertion, builds it, then exits\n- Exit code 0 on success after single build\n- Combines with `--spec` to build one assertion from a specific spec then exit\n- Combines with `--confirm` for a single prompted build\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"spec-flag","parent":"builder-cli-flags","title":"--spec Flag Filters to Specific Spec","status":"done","priority":1,"file":"specs/builder-cli-flags/assertions/spec-flag.md","content":"---\nid: spec-flag\nparent: builder-cli-flags\ncreated: 2026-02-21T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# --spec Flag Filters to Specific Spec\n\n## Description\n\nThe `--spec \u003cid\u003e` flag limits the builder to work only on assertions within the specified spec.\n\n## Success Criteria\n\n- `spekk builder --spec auth` only considers assertions under `specs/auth/`\n- Respects priority ordering within that spec\n- Combines with other flags:\n  - `--spec auth --all` builds all assertions in auth spec\n  - `--spec auth --dry-run` previews next assertion in auth spec\n- Shows error if spec ID doesn't exist\n","branch":"main","created":"2026-02-21T12:00:00Z"},{"id":"gitignore-updated","parent":"cleanup-repository","title":"Gitignore Updated","status":"done","priority":1,"file":"specs/cleanup-repository/assertions/gitignore-updated.md","content":"---\nid: gitignore-updated\nparent: cleanup-repository\ncreated: 2026-01-28T21:18:00Z\npriority: 1\nstatus: done\n---\n\n# Gitignore Updated\n\n## What Must Be True\n\nThe `.gitignore` file includes patterns to prevent temporary files from being tracked.\n\n## Required Patterns\n\nThe `.gitignore` must include:\n\n```gitignore\n# Temporary directory for all development artifacts\n.tmp/\n\n# Observations directory (ephemeral files for observer agent)\nobservations/\n```\n\n## Success Criteria\n\n- ✅ `.gitignore` exists in repository root\n- ✅ `.tmp/` directory pattern is included\n- ✅ Running `git status` shows no untracked temporary files\n\n## Notes\n\nThe `.tmp/` directory provides a centralized location for all temporary development artifacts, debug files, and test outputs. This approach is cleaner than multiple specific patterns.","branch":"main","created":"2026-01-28T21:18:00Z"},{"id":"no-debug-files-in-root","parent":"cleanup-repository","title":"No Debug Files in Root","status":"done","priority":1,"file":"specs/cleanup-repository/assertions/no-debug-files-in-root.md","content":"---\nid: no-debug-files-in-root\nparent: cleanup-repository\ncreated: 2026-01-28T21:18:00Z\npriority: 1\nstatus: done\n---\n\n# No Debug Files in Root\n\n## What Must Be True\n\nNo debug or test files exist in the repository root directory. All temporary artifacts must be in `.tmp/`.\n\n## Files That Must Not Exist in Root\n\n```\ndebug-coach.js\ndebug-copy.js\ntest-fix.js\ndebug-mock-mowlIc/\ndebug-test/\ntemp-test-DB4WyD/\ntemp-test-debug/\ntemp-test-mKLbyt/\nspekk-app-reference/\napp/ (incomplete implementation artifacts)\n```\n\n## Success Criteria\n\n- ✅ Repository root contains no temporary development artifacts\n- ✅ All debug/test files are moved to `.tmp/` directory\n- ✅ Repository follows clean organization principles\n\n## Implementation Notes\n\nThese files should be moved to `.tmp/` rather than deleted, in case they're still needed for development or debugging purposes.","branch":"main","created":"2026-01-28T21:18:00Z"},{"id":"observations-directory-cleaned","parent":"cleanup-repository","title":"Observations Directory Cleaned","status":"done","priority":2,"file":"specs/cleanup-repository/assertions/observations-directory-cleaned.md","content":"---\nid: observations-directory-cleaned\nparent: cleanup-repository\ncreated: 2026-01-28T21:18:00Z\npriority: 2\nstatus: done\n---\n\n# Observations Directory Cleaned\n\n## What Must Be True\n\nThe `observations/` directory exists and is properly configured according to observer-agent specs.\n\n## Current State\n\nThe directory contains hundreds of timestamped markdown files. According to the observer-agent specs, this directory should exist and contain observations.\n\n## Success Criteria\n\n- ✅ `observations/` directory remains in repository root (required by observer-agent spec)\n- ✅ Directory is tracked in Git (using Git as database for observations)\n- ✅ Observer-agent functionality preserved\n\n## Implementation\n\nThe observations directory should stay and be committed to Git since we use Git as our database. While observations are ephemeral from a human workflow perspective, they need to be tracked in version control for proper system operation.","branch":"main","created":"2026-01-28T21:18:00Z"},{"id":"tmp-directory-established","parent":"cleanup-repository","title":"Tmp Directory Established","status":"done","priority":1,"file":"specs/cleanup-repository/assertions/tmp-directory-established.md","content":"---\nid: tmp-directory-established\nparent: cleanup-repository\ncreated: 2026-01-28T21:20:00Z\npriority: 1\nstatus: done\n---\n\n# Tmp Directory Established\n\n## What Must Be True\n\nA `.tmp/` directory exists as the centralized location for all temporary development artifacts.\n\n## Implementation\n\n1. Create `.tmp/` directory in repository root\n2. Move existing temporary files to `.tmp/`:\n   - `debug-coach.js` → `.tmp/debug-coach.js`\n   - `debug-copy.js` → `.tmp/debug-copy.js`\n   - `test-fix.js` → `.tmp/test-fix.js`\n   - `debug-mock-mowlIc/` → `.tmp/debug-mock-mowlIc/`\n   - `debug-test/` → `.tmp/debug-test/`\n   - `temp-test-DB4WyD/` → `.tmp/temp-test-DB4WyD/`\n   - `temp-test-debug/` → `.tmp/temp-test-debug/`\n   - `temp-test-mKLbyt/` → `.tmp/temp-test-mKLbyt/`\n   - `spekk-app-reference/` → `.tmp/spekk-app-reference/`\n   - `app/` → `.tmp/app/` (incomplete implementation artifacts)\n\n## Success Criteria\n\n- ✅ `.tmp/` directory exists\n- ✅ All temporary artifacts moved to `.tmp/`\n- ✅ Repository root is clean of temporary files\n- ✅ All functionality still works after moving files\n\n## Convention\n\nGoing forward, builders should place all debug files, test artifacts, and temporary outputs in `.tmp/` rather than the repository root.","branch":"main","created":"2026-01-28T21:20:00Z"},{"id":"agent-prompts-accessible-anywhere","parent":"cli-prompt-resolution","title":"Agent Prompts Accessible Anywhere","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/agent-prompts-accessible-anywhere.md","content":"---\nid: agent-prompts-accessible-anywhere\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# Agent Prompts Accessible Anywhere\n\n## Assertion\n\nAgent prompt files from the spekk-cli installation are accessible to Claude Code regardless of the user's current working directory.\n\n## Success Criteria\n\n- Coach agent prompt (`specs/coach-agent/coach-agent.prompt.md`) is found by Claude Code when run from any directory\n- Builder agent prompt (`specs/builder-agent/builder-agent.prompt.md`) is found by Claude Code when run from any directory  \n- Observer agent prompt (`specs/observer-agent/observer-agent.prompt.md`) is found by Claude Code when run from any directory\n- Claude Code receives the correct \"You are the [Agent] Agent - read the prompt and follow the instructions exactly\" message and can access the corresponding prompt file\n\n**Tests Required:**\n- `verify-prompt-file-accessible` assertion must be completed\n- Unit tests in `src/cli/__tests__/prompt-resolution.test.js` (✅ completed)\n- Integration tests proving end-to-end prompt access\n\n## Constraints\n\n**❌ PROHIBITED APPROACH:**\n- Copying prompt files to user's working directory (messy, pollutes user's project)\n- Creating temporary files or directories in user's project space\n- Any approach that modifies the user's working directory structure\n\n**✅ REQUIRED APPROACH:**\n- Read prompt files directly from spekk-cli installation directory\n- Keep user's working directory clean and unmodified\n- Claude Code runs in user's directory but accesses prompts from installation\n\n## Context\n\nThe CLI needs to make these prompt files available to Claude Code through one of these approaches:\n- Pass prompt content directly via stdin (along with agent activation message)\n- Use Claude Code's memory/instruction system to load prompt content\n- Set environment variables with prompt file paths for Claude Code to read\n- Send prompt file path in agent activation message for Claude Code to read directly","branch":"main","created":"2026-01-28T19:30:00Z"},{"id":"claude-code-runs-in-user-directory","parent":"cli-prompt-resolution","title":"Claude Code Runs in User Directory","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/claude-code-runs-in-user-directory.md","content":"---\nid: claude-code-runs-in-user-directory\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# Claude Code Runs in User Directory\n\n## Assertion\n\nWhen launching agent commands via spekk CLI, Claude Code runs in the user's current working directory, not in the spekk-cli installation directory.\n\n## Success Criteria\n\n- Test verifies Claude Code's working directory matches where `spekk coach` was run\n- Test confirms Claude Code can access files in the user's project directory  \n- Test verifies user's project CLAUDE.md is loaded (not spekk-cli's CLAUDE.md)\n- Integration tests prove Claude Code doesn't run from spekk-cli installation directory\n\n**Tests:** src/cli/__tests__/working-directory-verification.test.js\n\n**Tests Required:**\n- `verify-claude-working-directory` assertion must be completed  \n- Test should verify file access and working directory programmatically\n\n## Context\n\nThis ensures users can work on their own projects while still having access to the spekk agent prompts. The CLI should not force users to work from within the spekk-cli directory.","branch":"main","created":"2026-01-28T19:30:00Z"},{"id":"cli-works-from-any-directory","parent":"cli-prompt-resolution","title":"CLI Works From Any Directory","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/cli-works-from-any-directory.md","content":"---\nid: cli-works-from-any-directory\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:30:00Z\npriority: 1\nstatus: done\n---\n\n# CLI Works From Any Directory\n\n## Assertion\n\nAll spekk CLI commands (`spekk`, `spekk coach`, `spekk builder`, `spekk observer`) work when run from any directory, not just from within the spekk-cli installation directory.\n\n## Success Criteria\n\n- Integration tests verify `spekk`, `spekk coach`, `spekk builder`, and `spekk observer` work from external directories\n- Commands exit successfully (code 0) when run from any directory\n- No \"file not found\" or \"directory not found\" errors when running from external directories\n- Parser finds specs from spekk-cli installation, not current directory\n- All commands work consistently across different working directories\n\n**Tests:** src/cli/__tests__/external-directory-integration.test.js\n\n## Context\n\nCurrently, when running from an external directory, Claude Code cannot locate the agent prompt files because they are resolved relative to the current working directory instead of the spekk-cli installation directory.","branch":"main","created":"2026-01-28T19:30:00Z"},{"id":"integration-test-external-directory","parent":"cli-prompt-resolution","title":"Integration Test External Directory","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/integration-test-external-directory.md","content":"---\nid: integration-test-external-directory\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:45:00Z\npriority: 1\nstatus: done\n---\n\n# Integration Test External Directory\n\n## Assertion\n\nAn integration test exists that verifies `spekk coach` works correctly when run from an external directory.\n\n## Success Criteria\n\n- Test creates a temporary external directory (e.g., `/tmp/test-spekk-external`)\n- Test runs `spekk coach` command from that directory using spawn/execSync\n- Test captures that the command exits successfully (exit code 0)\n- Test verifies no \"file not found\" errors related to prompt files\n- Test verifies Claude Code initialization message appears\n- Test exists in the test suite and passes\n\n## Context\n\nThis integration test proves that the prompt resolution actually works in the real scenario that was failing before - running spekk coach from outside the installation directory.","branch":"main","created":"2026-01-28T19:45:00Z"},{"id":"remove-copying-implementation","parent":"cli-prompt-resolution","title":"Remove Copying Implementation","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/remove-copying-implementation.md","content":"---\nid: remove-copying-implementation\nparent: cli-prompt-resolution\ncreated: 2026-01-28T20:00:00Z\npriority: 1\nstatus: done\n---\n\n# Remove Copying Implementation\n\n## Assertion\n\nThe current `PromptResolver` implementation that copies prompt files to user's working directory is removed and replaced with a clean approach.\n\n## Success Criteria\n\n- `src/cli/prompt-resolver.js` is deleted or completely rewritten to not copy files\n- `withPromptFiles()` function does not create any files or directories in user's working directory\n- All agent CLI files (`src/coach/cli.js`, `src/builder/cli.js`, `src/observer/cli.js`) use new approach\n- Unit tests in `src/cli/__tests__/prompt-resolution.test.js` are updated to test new approach\n- No `copyFileSync`, `mkdirSync`, or file copying logic remains in the codebase\n\n## Context\n\nThe current implementation copies prompt files to the user's working directory, which pollutes their project space. This violates the requirement to keep the user's directory clean and unmodified.\n\n## Alternative Approaches\n\nThe new implementation should use one of these approaches instead:\n- Pass prompt content via stdin along with agent activation message\n- Set environment variable with prompt file path for Claude Code to read\n- Use Claude Code's memory/instruction system\n- Modify agent activation message to include prompt file path","branch":"main","created":"2026-01-28T20:00:00Z"},{"id":"spec-parser-works-externally","parent":"cli-prompt-resolution","title":"Spec Parser Works Externally","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/spec-parser-works-externally.md","content":"---\nid: spec-parser-works-externally\nparent: cli-prompt-resolution\ncreated: 2026-01-28T20:15:00Z\npriority: 1\nstatus: done\n---\n\n# Spec Parser Works Externally\n\n## Assertion\n\nThe spec parser (default `spekk` command) works when run from any directory, not just from within the spekk-cli installation directory.\n\n## Success Criteria\n\n- Running `spekk` (no arguments) from external directory successfully finds next assertion\n- Running `spekk --all` from external directory lists all specs and assertions\n- Parser correctly locates `specs/` directory from spekk-cli installation, not current directory\n- No \"directory not found\" or \"no specs found\" errors when running from external directories\n- Parser output is identical whether run from spekk-cli directory or external directory\n\n## Context\n\nCurrently, the spec parser looks for `specs/` relative to the current working directory. When run from external directories (like `~/thinknimble/vuenome`), it can't find the specs and fails.\n\nThis is the same path resolution issue that affected agent prompts. The parser needs to resolve the specs directory relative to the spekk-cli installation, not the user's working directory.\n\n**Tests:** src/parser/__tests__/external-directory.test.js\n\n## Implementation Requirements\n\nThe parser should:\n- Use `__dirname` or similar to locate spekk-cli installation directory\n- Read specs from `{installation}/specs/` not `{cwd}/specs/`\n- Maintain all existing functionality (finding next assertion, listing all specs)\n- Work consistently from any directory","branch":"main","created":"2026-01-28T20:15:00Z"},{"id":"verify-claude-working-directory","parent":"cli-prompt-resolution","title":"Verify Claude Working Directory","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/verify-claude-working-directory.md","content":"---\nid: verify-claude-working-directory\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:45:00Z\npriority: 1\nstatus: done\n---\n\n# Verify Claude Working Directory\n\n## Assertion\n\nA test exists that verifies Claude Code runs in the user's current working directory when launched via spekk CLI.\n\n## Success Criteria\n\n- Test creates a temporary directory with a test file (e.g., `test-project.txt`)\n- Test runs `spekk coach` from that directory  \n- Test verifies Claude Code can see and access the test file in its working directory\n- Test confirms Claude Code working directory matches the directory where spekk was run\n- Test verifies Claude Code does NOT run from the spekk-cli installation directory\n\n**Tests:** src/cli/__tests__/working-directory-verification.test.js\n\n## Context\n\nThis ensures users can work on their own project files through Claude Code while still having access to spekk agent prompts. Critical for the user experience.","branch":"main","created":"2026-01-28T19:45:00Z"},{"id":"verify-prompt-file-accessible","parent":"cli-prompt-resolution","title":"Verify Prompt File Accessible","status":"done","priority":1,"file":"specs/cli-prompt-resolution/assertions/verify-prompt-file-accessible.md","content":"---\nid: verify-prompt-file-accessible\nparent: cli-prompt-resolution\ncreated: 2026-01-28T19:45:00Z\npriority: 1\nstatus: done\n---\n\n# Verify Prompt File Accessible\n\n**Tests:** src/cli/__tests__/verify-prompt-file-accessible.test.js\n\n## Assertion\n\nA test exists that verifies Claude Code can find and access the coach prompt file after prompt resolution.\n\n## Success Criteria\n\n- Test runs `spekk coach` from external directory\n- Test verifies NO `specs/` directory is created in the user's working directory\n- Test confirms Claude Code receives the agent activation message successfully  \n- Test verifies Claude Code can access coach prompt from spekk-cli installation directory\n- Test confirms user's working directory remains completely unmodified\n- Test verifies no temporary files or cleanup needed in user's directory\n\n## Context\n\nThis proves the core functionality - that the prompt resolution system actually makes the agent prompt files available to Claude Code when running from any directory.","branch":"main","created":"2026-01-28T19:45:00Z"},{"id":"asks-clarifying-questions","parent":"coach-agent","title":"Coach Must Ask Clarifying Questions","status":"done","priority":3,"file":"specs/coach-agent/assertions/asks-clarifying-questions.md","content":"---\nid: asks-clarifying-questions\nparent: coach-agent\ncreated: 2026-01-20T17:10:00Z\npriority: 3\nstatus: done\n---\n\n# Coach Must Ask Clarifying Questions\n\n## What Must Be True\n\nWhen user requests are vague or incomplete, the coach must guide them through refinement by asking targeted questions.\n\n## Question Categories\n\n### 1. Scope Questions\n- What exactly should happen?\n- Which parts of the system are affected?\n- Are there related features this depends on?\n\n### 2. Testability Questions\n- How will we know this is working?\n- What does success look like?\n- What are the edge cases?\n\n### 3. Priority Questions\n- How important is this? (1=critical, 2=important, 3=nice-to-have)\n- Does this block other work?\n- When does this need to be done?\n\n### 4. Granularity Questions\n- Should this be broken into smaller pieces?\n- Are there multiple independent assertions here?\n- Can parts be implemented separately?\n\n## Example\n\n**Vague request:** \"Make the app faster\"\n\n**Coach questions:**\n1. Which part feels slow? (page load, interactions, data fetching)\n2. What's the current behavior? What should it be?\n3. How will we measure improvement? (load time, response time)\n4. What's the acceptable threshold? (\u003c 2 seconds, \u003c 500ms)\n\n**Result:** Specific, measurable assertions about performance\n\n## Success Criteria\n\n- ✅ Coach identifies when requests are too vague\n- ✅ Coach asks targeted questions to refine requirements\n- ✅ Coach guides users toward testable assertions\n- ✅ Coach helps determine appropriate priority\n- ✅ Questions lead to well-formed specs\n\n**Tests:** app/coach/__tests__/asks-clarifying-questions.test.js\n","branch":"main","created":"2026-01-20T17:10:00Z"},{"id":"creates-spec-files","parent":"coach-agent","title":"Coach Must Create Well-Formed Spec Files","status":"done","priority":3,"file":"specs/coach-agent/assertions/creates-spec-files.md","content":"---\nid: creates-spec-files\nparent: coach-agent\ncreated: 2026-01-20T17:15:00Z\npriority: 3\nstatus: done\n---\n\n# Coach Must Create Well-Formed Spec Files\n\n**Tests:** app/coach/__tests__/creates-spec-files.test.js\n\n## What Must Be True\n\nAfter refinement dialogue, coach must create properly formatted spec files that follow the declared structure.\n\n## File Structure It Creates\n\n```\nspecs/\n└── {spec-id}/\n    ├── {spec-id}.md              # Main spec file\n    └── assertions/\n        ├── {assertion-1}.md\n        ├── {assertion-2}.md\n        └── ...\n```\n\n## Spec File Format\n\nMain spec file must have:\n```yaml\n---\nid: spec-id\ncreated: 2026-01-20T17:15:00Z\npriority: 2\nstatus: not_started\n---\n\n# Spec Title\n\n## Overview\nWhat this spec defines...\n\n## What It Does\nDetailed description...\n```\n\n## Assertion File Format\n\nEach assertion must have:\n```yaml\n---\nid: assertion-id\nparent: spec-id\ncreated: 2026-01-20T17:16:00Z\npriority: 1\nstatus: not_started\n---\n\n# Assertion Title\n\n## What Must Be True\nClear, testable requirement...\n\n## Success Criteria\n- ✅ Criterion 1\n- ✅ Criterion 2\n```\n\n## Validation\n\nCoach must ensure:\n- **Valid YAML frontmatter** (parseable, correct fields)\n- **Unique IDs** (no duplicates)\n- **Valid priorities** (1, 2, or 3)\n- **ISO 8601 timestamps** (YYYY-MM-DDTHH:MM:SSZ)\n- **Kebab-case IDs** (lowercase-with-hyphens)\n- **Clear success criteria** (how to validate assertion)\n- **Testability noted** (can this be automated?)\n\n## Success Criteria\n\n- ✅ Coach creates folder structure correctly\n- ✅ Coach writes valid YAML frontmatter\n- ✅ Coach generates unique, valid IDs\n- ✅ Coach includes clear success criteria\n- ✅ Coach sets appropriate priorities\n- ✅ Coach creates testable assertions\n- ✅ Generated specs pass parser validation\n","branch":"main","created":"2026-01-20T17:15:00Z"},{"id":"receives-user-requests","parent":"coach-agent","title":"Coach Must Receive and Parse User Requests","status":"done","priority":3,"file":"specs/coach-agent/assertions/receives-user-requests.md","content":"---\nid: receives-user-requests\nparent: coach-agent\ncreated: 2026-01-20T17:05:00Z\npriority: 3\nstatus: done\n---\n\n# Coach Must Receive and Parse User Requests\n\n**Implementation:** app/coach/index.js, app/coach/cli.js\n\n## What Must Be True\n\nThe coach agent must accept natural language input from users describing what they want to build or change.\n\n## Input Formats\n\nThe coach should handle various input styles:\n- **Direct requests**: \"Add dark mode\"\n- **Problem statements**: \"Users can't see the dashboard in bright sunlight\"\n- **Feature descriptions**: \"We need a way for users to export their data\"\n- **Change requests**: \"Fix the copy on the login page - it should say 'Sign in' not 'Login'\"\n- **Vague ideas**: \"Make the app faster\"\n\n## What It Does\n\n1. **Accept input** via command line or conversational interface\n2. **Parse intent** - understand what the user wants\n3. **Identify type**:\n   - New feature (create new spec)\n   - Update existing feature (modify spec)\n   - Bug fix (may update existing assertion)\n   - Refactor (may update multiple specs)\n\n## Success Criteria\n\n- ✅ Coach accepts text input\n- ✅ Coach handles various input formats\n- ✅ Coach identifies if request is new spec or update\n- ✅ Coach can handle vague requests (will ask clarifying questions)\n- ✅ Coach responds appropriately to user's intent\n","branch":"main","created":"2026-01-20T17:05:00Z"},{"id":"spec-aware-coach-context","parent":"coach-agent","title":"Serve uses the real coach agent prompt and coach reads specs on first interaction","status":"done","priority":1,"file":"specs/coach-agent/assertions/spec-aware-coach-context.md","content":"---\nid: spec-aware-coach-context\nparent: coach-agent\ncreated: 2026-03-01T17:00:00Z\npriority: 1\nstatus: done\n---\n\n# Serve uses the real coach agent prompt and coach reads specs on first interaction\n\nThe serve command spawns Claude using the same coach agent prompt that `spekk coach` uses (via `launchAgentWithPrompt`), not a hardcoded duplicate. The extension sends an `init` message on connect with client context. The CLI passes it through like any other message. The coach reads specs from the filesystem itself using its own tools.\n\n## Success Criteria\n\n- `serve/index.js` uses `launchAgentWithPrompt('coach-agent')` from `prompt-resolver.js` to get the coach agent prompt instead of importing from `coach-prompt.js`\n- `serve/coach-prompt.js` is deleted — no duplicate prompt\n- `message-formatter.js` handles the `init` message type and formats it as readable text for Claude (not dropped, not returned as null)\n- The CLI forwards the formatted init message to Claude's stdin like any other message (no special handling — dumb pipe)\n- The coach agent prompt (`specs/coach-agent/coach-agent.prompt.md`) instructs Claude to read the `specs/` directory on its first interaction to understand the current spec landscape\n- The coach agent prompt instructs Claude to default toward creating or updating specs after understanding a request\n- The coach agent prompt instructs Claude to check existing spec groups before proposing new ones\n- The coach agent prompt allows one-off questions and lightweight conversations without forcing everything into a spec\n","branch":"main","created":"2026-03-01T17:00:00Z"},{"id":"auto-detect-skills","parent":"coach-skills-system","title":"Auto-Detect Skills","status":"done","priority":1,"file":"specs/coach-skills-system/assertions/auto-detect-skills.md","content":"---\nid: auto-detect-skills\nparent: coach-skills-system\ncreated: 2026-01-23T22:14:00Z\npriority: 1\nstatus: done\n---\n\n# Auto-Detect Skills\n\nCoach automatically detects when to suggest specialized skills during conversations.\n\n## Success Criteria\n\n- When user mentions business model, startup validation, or founder assessment → coach suggests business-model-validator skill\n- Detection happens automatically without explicit skill requests\n- Coach explains why the skill would be helpful before using it\n- Users can accept or decline skill suggestions\n\n## Examples\n\n**Trigger phrases:**\n- \"validate this business model\"\n- \"assess this startup\"\n- \"founder wants to...\"\n- \"business plan review\"\n- \"is this viable?\"\n\n**Coach response:**\n\"I can use my business-model-validator skill to systematically assess this through structured questions and provide a quantitative health score. Would you like me to do that?\"\n","branch":"main","created":"2026-01-23T22:14:00Z"},{"id":"business-model-validator-skill","parent":"coach-skills-system","title":"Business Model Validator Skill","status":"done","priority":1,"file":"specs/coach-skills-system/assertions/business-model-validator-skill.md","content":"---\nid: business-model-validator-skill\nparent: coach-skills-system\ncreated: 2026-01-23T22:14:00Z\npriority: 1\nstatus: done\n---\n\n# Business Model Validator Skill\n\nCoach has business model validation capability that conducts systematic startup/business assessment.\n\n## Success Criteria\n\n- Conducts structured assessment across 6 key areas:\n  1. Industry background \u0026 expertise\n  2. Product validation\n  3. Market demand\n  4. Business goals \u0026 strategy\n  5. Traction \u0026 momentum\n  6. Hypothesis prioritization\n\n- Uses scoring methodology: 2 points (clear/evidence), 1 point (adequate), 0 points (unclear/concerning)\n- Asks probing follow-up questions based on responses\n- Tracks answers and identifies gaps throughout session\n\n## Validation Framework\n\n**Sample questions by area:**\n- Industry: \"What relevant experience does the founder have?\"\n- Product: \"What stage of development? Any user testing?\"\n- Market: \"What evidence exists for demand? Target customer?\"\n- Goals: \"Primary goal? Monetization strategy?\"\n- Traction: \"Current metrics? Funding raised?\"\n- Hypotheses: \"Riskiest assumptions? What could invalidate this?\"\n\n**Tests:** src/coach/__tests__/business-model-validator.test.js\n","branch":"main","created":"2026-01-23T22:14:00Z"},{"id":"cli-subcommands-inline-skill-content","parent":"coach-skills-system","title":"CLI Subcommands Inline Skill Content from Markdown Files","status":"done","priority":1,"file":"specs/coach-skills-system/assertions/cli-subcommands-inline-skill-content.md","content":"---\nid: cli-subcommands-inline-skill-content\nparent: coach-skills-system\ncreated: 2026-02-25T20:15:00Z\npriority: 1\nstatus: done\n---\n\n# CLI Subcommands Inline Skill Content from Markdown Files\n\nWhen a CLI subcommand activates a skill (e.g., `spekk coach meeting`, `spekk coach coordinate`), the CLI reads the corresponding skill markdown file from `specs/coach-skills-system/` and inlines its full content into the activation message. The coach agent receives the complete workflow instructions directly — it does not need to discover or read the skill file itself.\n\n## What Must Be True\n\n### Generic Skill Resolution\n- A mapping exists from subcommand name to skill filename (e.g., `meeting` → `meeting-notes-to-specs-skill.md`, `coordinate` → `coordinator-skill.md`)\n- The skill file is resolved relative to the spekk installation's `specs/coach-skills-system/` directory (same path resolution as `prompt-resolver.js`)\n- If the skill file does not exist at the resolved path, a clear error is shown and the process exits (consistent with existing missing-file error patterns in cli.js)\n\n### Activation Message Contains Skill Content\n- The activation message includes the full markdown content of the skill file, clearly delimited (e.g., within a labeled section)\n- The activation instruction tells the coach to follow the inlined workflow immediately — not to go read a file\n- Existing behavior (transcript file handling for `meeting`, etc.) continues to work after the skill content\n\n### No Hardcoded Workflow Steps in JS\n- Workflow steps are NOT hardcoded as JS string concatenation in `src/coach/cli.js`\n- The JS code only handles: subcommand detection, skill file resolution/reading, and subcommand-specific args (like transcript files)\n- All workflow content comes from the skill markdown files — single source of truth\n\n### Extensible Pattern\n- Adding a new CLI subcommand for a skill requires only: adding the subcommand-to-filename mapping and any subcommand-specific arg handling\n- No workflow duplication between JS and markdown\n\n## Success Criteria\n\n- `spekk coach meeting` activation message contains the full content of `meeting-notes-to-specs-skill.md`\n- `spekk coach coordinate` activation message contains the full content of `coordinator-skill.md` (when PR #25 merges)\n- Coach agent reliably activates the meeting skill workflow when launched via `spekk coach meeting`\n- Skill markdown files remain the single source of truth for workflow instructions\n- Tests validate that skill content is present in the activation message\n","branch":"main","created":"2026-02-25T20:15:00Z"},{"id":"coordinate-cli-command","parent":"coach-skills-system","title":"Coach Accepts \"coordinate\" Subcommand","status":"done","priority":1,"file":"specs/coach-skills-system/assertions/coordinate-cli-command.md","content":"---\nid: coordinate-cli-command\nparent: coach-skills-system\ncreated: 2026-02-25T15:58:00Z\npriority: 1\nstatus: done\n---\n\n# Coach Accepts \"coordinate\" Subcommand\n\nThe coach CLI accepts `spekk coach coordinate` to activate the coordinator skill.\n\n## What Must Be True\n\n### CLI Command\n- User runs: `spekk coach coordinate`\n- Coach launches with coordinator skill active\n- Follows same pattern as `spekk coach meeting`\n\n### Activation Message\n- Coach receives skill activation message\n- Message tells coach to activate coordinator skill immediately\n- No trigger detection needed (explicit invocation)\n\n### Help Documentation\n- `spekk coach --help` shows `coordinate` subcommand\n- Help text describes: \"Analyze work and create dependency-aware plan\"\n\n## Implementation\n\nIn `src/coach/cli.js`:\n- Change `if (subcommand === 'coordinator')` to `if (subcommand === 'coordinate')`\n- Update activation message to reference correct command\n- Update help text\n\n## Validation\n\n```bash\nspekk coach coordinate\n# Should activate coordinator skill\n\nspekk coach --help\n# Should list \"coordinate\" subcommand\n```\n","branch":"main","created":"2026-02-25T15:58:00Z"},{"id":"extensible-skills-framework","parent":"coach-skills-system","title":"Extensible Skills Framework","status":"done","priority":3,"file":"specs/coach-skills-system/assertions/extensible-skills-framework.md","content":"---\nid: extensible-skills-framework\nparent: coach-skills-system\ncreated: 2026-01-23T22:14:00Z\npriority: 3\nstatus: done\n---\n\n# Extensible Skills Framework\n\nSkills system supports adding new specialized coaching capabilities as markdown workflow files.\n\n## What Must Be True\n\n### Skill Format\n- Skills are markdown files in `specs/coach-skills-system/`\n- Naming: `skillname-skill.md`\n- Required sections:\n  - `# Skill Name`\n  - `## Triggers` - List of trigger keywords\n  - `## Workflow` - Numbered steps\n  - `## Validation` - Success criteria\n- Optional: Context, Examples\n\n### Coach Execution\n- Coach receives spekk installation path in activation message\n- Coach prompt lists available skills in `specs/coach-skills-system/`\n- Coach detects triggers in user input\n- Coach reads skill markdown file from installation path\n- Coach executes workflow steps using its intelligence\n- Coach validates results (e.g., with parser)\n- **No JavaScript loader/registry needed** - Coach reads files directly\n- **No skill classes needed** - Skills are instructions for the AI\n- **No API calls** - Coach IS the AI\n\n### Path Resolution\nSince `spekk` can be run from any directory:\n- Working directory = user's project (`process.cwd()`)\n- Spekk installation = where spekk is installed (calculated from `__dirname`)\n- Skills location = `{spekk-installation}/specs/coach-skills-system/`\n\nCoach needs to know spekk installation path to find skills.\n\n### Example Skill Structure\n```markdown\n# Coordinator Skill\n\n## Triggers\n- \"plan the work\"\n- \"dependency graph\"\n\n## Workflow\n1. Read draft assertions\n2. Analyze dependencies\n3. Show tree to user\n4. Update YAML\n5. Validate with parser\n6. Commit\n```\n\n## Validation\n\n### What Must Exist\n- Skill markdown files in `specs/coach-skills-system/`\n- Coach prompt lists available skills\n- Coach receives spekk installation path in activation message\n- Skills follow consistent format (triggers, workflow, validation)\n\nExample activation message addition:\n```\nSpekk installation: /usr/local/lib/node_modules/@spekk/cli\nSkills directory: /usr/local/lib/node_modules/@spekk/cli/specs/coach-skills-system/\n```\n\n### What Must NOT Exist\n- ❌ No `markdown-skill-loader.js` or similar (coach reads files directly)\n- ❌ No JavaScript skill classes (deleted, including deprecated ones)\n- ❌ No skill registry infrastructure (coach knows where skills are)\n- ❌ No `IMPLEMENTATION_SUMMARY.md` (lives in PR/commits)\n\n### Testing\n- Coach receives installation path in activation message\n- Coach can read skills from installation path (not cwd)\n- Coach successfully detects skill triggers\n- Coach reads and executes workflow steps\n- Works when spekk is run from any directory\n- New skills added by just creating markdown file\n- No code changes needed for new skills\n","branch":"main","created":"2026-01-23T22:14:00Z"},{"id":"fix-cli-reads-local-specs-test","parent":"coach-skills-system","title":"Fix Failing cli-reads-local-specs Test","status":"done","priority":1,"file":"specs/coach-skills-system/assertions/fix-cli-reads-local-specs-test.md","content":"---\nid: fix-cli-reads-local-specs-test\nparent: coach-skills-system\ncreated: 2026-02-25T16:08:00Z\npriority: 1\nstatus: done\n---\n\n# Fix Failing cli-reads-local-specs Test\n\nThe test `src/parser/__tests__/cli-reads-local-specs.test.js` is failing, causing 1 test failure in the suite.\n\n## What Must Be True\n\n- All tests pass (119/119, not 118/119)\n- Test properly validates CLI reads specs from working directory\n- Test doesn't have environment dependencies\n\n## Root Cause\n\nThe test passes in isolation but fails in the full suite - **test interference**.\n\n**Evidence:**\n```bash\n# Running alone:\nnpm test src/parser/__tests__/cli-reads-local-specs.test.js\n# Result: 123/123 pass ✅\n\n# Running in full suite:\nnpm test\n# Result: 122/123 pass, cli-reads-local-specs fails ❌\n```\n\n**Issue:** Another test is leaving the environment in a state that breaks this test.\n\n## Fix Required\n\n1. **Isolate test environment** - Ensure test doesn't depend on global state\n2. **Add proper cleanup** - Reset working directory, clear temp files\n3. **Fix test ordering** - Make test resilient to execution order\n4. **Check beforeEach/afterEach** - Verify proper setup/teardown\n\n## Validation\n\n```bash\nnpm test\n# Should show: # pass 119, # fail 0\n```\n","branch":"main","created":"2026-02-25T16:08:00Z"},{"id":"structured-assessment-report","parent":"coach-skills-system","title":"Structured Assessment Report","status":"done","priority":2,"file":"specs/coach-skills-system/assertions/structured-assessment-report.md","content":"---\nid: structured-assessment-report\nparent: coach-skills-system\ncreated: 2026-01-23T22:14:00Z\npriority: 2\nstatus: done\n---\n\n# Structured Assessment Report\n\nBusiness model validation produces a comprehensive report with quantitative scoring and actionable recommendations.\n\n## Success Criteria\n\nReport includes all required sections:\n- Overall health score (X/Y points, percentage)\n- Strengths (key positive findings)\n- Concerns (major gaps or risks)\n- Unanswered/unclear items\n- Priority hypotheses to test (next 6 months)\n- Recommended actions (specific next steps)\n\n## Report Format\n\n```\nBUSINESS MODEL VALIDATION REPORT\n================================\nOverall Health Score: X/Y points (Z%)\n\nStrengths:\n- [Key positive findings]\n\nConcerns:\n- [Major gaps or risks]\n\nUnanswered/Unclear:\n- [Questions that need clarification]\n\nPriority Hypotheses to Test (Next 6 Months):\n1. [Most critical assumption to validate]\n2. [Second priority]\n3. [Third priority]\n\nRecommended Actions:\n- [Specific next steps]\n```\n\n## Output Requirements\n\n- Save report as `business-model-validation.md` in relevant project folder under `/projects`\n- Create project folder if it doesn't exist\n- Report is actionable and constructive\n- Scoring is transparent and explained\n\n**Tests:** src/coach/__tests__/business-model-validator.test.js\n","branch":"main","created":"2026-01-23T22:14:00Z"},{"id":"builder-uses-npm-test-commands","parent":"fix-builder-test-validation","title":"Builder Uses NPM Test Commands","status":"done","priority":1,"file":"specs/fix-builder-test-validation/assertions/builder-uses-npm-test-commands.md","content":"---\nid: builder-uses-npm-test-commands\nparent: fix-builder-test-validation\ncreated: 2026-01-28T21:40:00Z\npriority: 1\nstatus: done\n---\n\n# Builder Uses NPM Test Commands\n\n## What Must Be True\n\nThe builder agent prompt instructs builders to use the correct test commands for this project (`npm test`) instead of non-existent `just` commands.\n\n## Current Problem\n\nBuilder prompt at line ~82-85 says:\n```bash\n# Use justfile commands for standardized testing\njust test           # Run all tests (server + client)\njust server-test    # Run server tests only  \njust client-test    # Run client tests only\n```\n\nBut this project doesn't use `just` - it uses npm scripts.\n\n## Success Criteria\n\n- ✅ Builder prompt references `npm test` instead of `just test`\n- ✅ Remove references to non-existent `just` commands\n- ✅ Instructions match actual project test setup\n- ✅ Builder validates tests actually pass before marking `done`\n\n## Correct Commands\n\nShould be:\n```bash\nnpm test              # Run all tests \nnpm run test:impl     # Run implementation tests only\nnpm run test:specs    # Run spec validation tests only\n```","branch":"main","created":"2026-01-28T21:40:00Z"},{"id":"remove-extra-ci-steps","parent":"fix-ci-workflow-hanging","title":"Remove Extra CI Steps","status":"done","priority":1,"file":"specs/fix-ci-workflow-hanging/assertions/remove-extra-ci-steps.md","content":"---\nid: remove-extra-ci-steps\nparent: fix-ci-workflow-hanging\ncreated: 2026-01-22T21:10:00Z\npriority: 1\nstatus: done\n---\n\n# Remove Extra CI Steps\n\n## What Must Be True\n\nThe `.github/workflows/test.yml` file must be simplified to only include the steps specified in the original CI requirements, removing the extra steps that cause hanging.\n\n### Steps to Remove\n\nThe following steps are **not** specified in `specs/spec-parser/assertions/ci-runs-all-tests.md` and must be removed:\n\n1. **\"Validate CLI commands\"** step:\n   ```yaml\n   - name: Validate CLI commands\n     run: |\n       node bin/spekk.js --help\n       node bin/spekk.js loop --help\n       npm run next\n   ```\n\n2. **\"Test CLI functionality\"** step:\n   ```yaml\n   - name: Test CLI functionality\n     run: |\n       # Test that core commands work\n       node bin/spekk.js coach --help || echo \"Coach help test complete\"\n       node bin/spekk.js builder --help || echo \"Builder help test complete\"\n       \n       # Test parser integration - verify it outputs valid JSON\n       echo \"Testing parser JSON output...\"\n       node src/parser/cli.js \u003e /tmp/parser_output.json\n       # ... rest of JSON validation\n   ```\n\n### Required Final Workflow\n\nThe workflow must contain **only** these steps:\n\n```yaml\nname: Tests\n\non:\n  push:\n    branches: ['**']\n  pull_request:\n    branches: ['**']\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Install dependencies\n        run: npm ci\n\n      - name: Run
