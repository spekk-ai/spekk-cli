 implementation tests\n        run: npm run test:impl\n\n      - name: Run sidecar validation tests\n        run: npm run test:specs\n```\n\n### Why These Steps Must Be Removed\n\n1. **Interactive Commands:** `coach --help` and `builder --help` start interactive Claude Code sessions that wait for user input\n2. **Not Specified:** These steps aren't required by any existing spec\n3. **Causing Failures:** They cause CI to hang indefinitely \n4. **Scope Creep:** They go beyond the original CI specification\n\n### Implementation Notes\n\nThe original CI spec (`ci-runs-all-tests.md`) was already marked as `status: done`, meaning the basic CI functionality was complete. The extra steps were added later and are causing the current issues.\n\n## Success Criteria\n\n- ✅ `.github/workflows/test.yml` contains exactly 5 steps (checkout, setup-node, install, test:impl, test:specs)\n- ✅ No \"Validate CLI commands\" step exists\n- ✅ No \"Test CLI functionality\" step exists  \n- ✅ No interactive commands (`coach`, `builder`) in workflow\n- ✅ CI completes in under 2 minutes without hanging\n- ✅ Implementation tests pass (`npm run test:impl` returns 0)\n- ✅ Sidecar tests pass (`npm run test:specs` returns 0)","branch":"main","created":"2026-01-22T21:10:00Z"},{"id":"cli-reads-local-specs","parent":"fix-cli-context-bug","title":"CLI Reads Local Specs","status":"done","priority":1,"file":"specs/fix-cli-context-bug/assertions/cli-reads-local-specs.md","content":"---\nid: cli-reads-local-specs\nparent: fix-cli-context-bug\ncreated: 2026-01-28T21:22:00Z\npriority: 1\nstatus: done\n---\n\n# CLI Reads Local Specs\n\n## What Must Be True\n\nThe `spekk next` command reads specs from the current working directory's `specs/` folder, not from the CLI installation directory.\n\n## Current Bug\n\nThe CLI is reading from its own installation `specs/` directory instead of the user's current project directory.\n\n## Success Criteria\n\n- ✅ `spekk next` reads from `process.cwd() + '/specs/'`\n- ✅ When run from different directories, CLI operates on those directories' specs\n- ✅ CLI doesn't read from spekk-cli installation directory when run externally\n- ✅ Error handling when no `specs/` directory exists in current working directory\n\n## Test Cases\n\n1. **From spekk-cli directory:** Should read `./specs/`\n2. **From external project:** Should read that project's `./specs/`\n3. **From directory with no specs:** Should show appropriate error message\n\n## Implementation Notes\n\nThe parser logic needs to:\n- Use `process.cwd()` to determine the working directory\n- Look for specs in `${process.cwd()}/specs/`\n- Not hardcode paths to the CLI's own specs directory\n\n## Tests\n\n**Tests:** src/parser/__tests__/cli-reads-local-specs.test.js\n\n## Validation Commands\n\n```bash\n# Test from different directories\ncd /path/to/external/project \u0026\u0026 spekk next\ncd /another/project \u0026\u0026 spekk next\n```\n\nEach should read specs from their respective local directories.","branch":"main","created":"2026-01-28T21:22:00Z"},{"id":"update-test-files-to-use-relative-paths","parent":"fix-hardcoded-paths-in-tests","title":"Update Test Files to Use Relative Paths","status":"done","priority":1,"file":"specs/fix-hardcoded-paths-in-tests/assertions/update-test-files-to-use-relative-paths.md","content":"---\nid: update-test-files-to-use-relative-paths\nparent: fix-hardcoded-paths-in-tests\ncreated: 2026-01-22T20:45:00Z\npriority: 1\nstatus: done\n---\n\n# Update Test Files to Use Relative Paths\n\n## What Must Be True\n\nAll test files that currently use hardcoded absolute paths must be updated to use relative paths that work in any environment.\n\n### Files That Need Updating\n\nThese test files contain hardcoded paths to `/Users/william/thinknimble/spekk-cli/bin/spekk.js`:\n\n1. `src/__tests__/assertions-appear-as-subitems.test.js`\n2. `src/__tests__/show-command.test.js`\n3. `src/__tests__/clicking-shows-details-panel.test.js`\n4. `src/__tests__/web-detail-badges-format.test.js`\n5. `src/__tests__/fix-javascript-template-errors.test.js`\n\n### Required Changes\n\n**Pattern to Replace:**\n```javascript\nexecSync('node /Users/william/thinknimble/spekk-cli/bin/spekk.js show', { \n  encoding: 'utf8',\n  cwd: testDir,\n  timeout: 5000 \n});\n```\n\n**Replace With:**\n```javascript\nimport { dirname, join } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\n// At top of file, add:\nconst __dirname = dirname(fileURLToPath(import.meta.url));\nconst projectRoot = join(__dirname, '../..');\nconst spekkBin = join(projectRoot, 'bin/spekk.js');\n\n// In test execution:\nexecSync(`node \"${spekkBin}\" show`, { \n  encoding: 'utf8',\n  cwd: testDir,\n  timeout: 5000 \n});\n```\n\n### Implementation Steps\n\n1. **Add path resolution imports** to each affected test file\n2. **Calculate project root path** dynamically using `__dirname` and relative navigation\n3. **Replace hardcoded paths** with dynamically resolved paths\n4. **Quote the path** to handle spaces in directory names\n5. **Test in multiple environments** to ensure compatibility\n\n### Alternative Simpler Approach\n\nInstead of complex path resolution, use the project root as the working directory:\n\n```javascript\n// Set working directory to project root instead of temp dir\nconst originalCwd = process.cwd();\nprocess.chdir(join(__dirname, '../..'));\n\ntry {\n  execSync('node bin/spekk.js show', { \n    encoding: 'utf8',\n    env: { ...process.env, SPEKK_TEST_OUTPUT_DIR: testDir },\n    timeout: 5000 \n  });\n} finally {\n  process.chdir(originalCwd);\n}\n```\n\nThis approach:\n- ✅ Uses simple relative paths\n- ✅ Works in any environment\n- ✅ Doesn't require complex path resolution\n- ✅ Maintains test isolation\n\n## Success Criteria\n\n- ✅ No test files contain `/Users/william/thinknimble/spekk-cli/` absolute paths\n- ✅ All affected test files use dynamic path resolution or relative paths\n- ✅ Tests pass on macOS, Linux, and Windows\n- ✅ Tests pass in CI environment (GitHub Actions Ubuntu)\n- ✅ `npm run test:impl` returns 0 exit code\n- ✅ All 5 identified test files are updated and working","branch":"main","created":"2026-01-22T20:45:00Z"},{"id":"parser-runs-without-syntax-errors","parent":"fix-parser-syntax-error","title":"Parser Runs Without Syntax Errors","status":"done","priority":1,"file":"specs/fix-parser-syntax-error/assertions/parser-runs-without-syntax-errors.md","content":"---\nid: parser-runs-without-syntax-errors\nparent: fix-parser-syntax-error\ncreated: 2026-01-28T21:15:00Z\npriority: 1\nstatus: done\n---\n\n# Parser Runs Without Syntax Errors\n\n## What Must Be True\n\nThe parser at `src/parser/index.js` must execute without any syntax errors when the spekk CLI is invoked.\n\n## Current Issue\n\nLine 78 contains an illegal `continue` statement that's not inside a loop:\n```javascript\ncontinue;  // This is outside any loop - syntax error!\n```\n\n## Success Criteria\n\n- ✅ `spekk` command executes without syntax errors\n- ✅ `spekk next` command executes without syntax errors\n- ✅ `spekk builder` command executes without syntax errors\n- ✅ No \"Illegal continue statement\" errors\n- ✅ Parser successfully parses spec files when no syntax errors exist\n\n## Implementation Notes\n\nThe fix likely involves either:\n1. Removing the orphaned `continue` statement if it's not needed\n2. Wrapping the logic in a proper loop if iteration was intended\n3. Replacing `continue` with `return` if early exit was intended\n4. Restructuring the code to properly handle the control flow\n\n## Validation\n\nRun these commands without syntax errors:\n```bash\nspekk\nspekk next\nspekk status\n```","branch":"main","created":"2026-01-28T21:15:00Z"},{"id":"watch-server-binds-to-ipv4","parent":"fix-watch-server-ipv4","title":"Watch server binds to 127.0.0.1 (IPv4) explicitly","status":"done","priority":1,"file":"specs/fix-watch-server-ipv4/assertions/watch-server-binds-to-ipv4.md","content":"---\nid: watch-server-binds-to-ipv4\nparent: fix-watch-server-ipv4\ncreated: 2026-03-11T00:25:00Z\npriority: 1\nstatus: done\nbranch: fix/watch-server-ipv4\n---\n\n# Watch server binds to 127.0.0.1 (IPv4) explicitly\n\n`src/show/server.js` binds to `'127.0.0.1'` instead of `'localhost'` so tests pass on Linux.\n\n## Success Criteria\n\n- `listenWithRetry` in `src/show/server.js` calls `server.listen(port, '127.0.0.1', ...)` (not `'localhost'`)\n- All tests in `src/__tests__/watch-server-module.test.js` pass on Linux\n- All tests in `src/__tests__/watch-mode-integration.test.js` pass on Linux\n- Test in `watch-server-module.test.js` for binding address still passes:\n  `addr.address === '127.0.0.1'` (the `|| addr.address === '::1'` branch becomes dead code but assertion still holds)\n- `npm test` exits 0\n","branch":"fix/watch-server-ipv4","created":"2026-03-11T00:25:00Z"},{"id":"contributing-documents-publish-process","parent":"gemfury-package-management","title":"CONTRIBUTING.md Documents Publish Process","status":"done","priority":1,"file":"specs/gemfury-package-management/assertions/contributing-documents-publish-process.md","content":"---\nid: contributing-documents-publish-process\nparent: gemfury-package-management\ncreated: 2026-02-05T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# CONTRIBUTING.md Documents Publish Process\n\n## What Must Be True\n\nA CONTRIBUTING.md file exists at the repository root that documents how maintainers publish new versions of @spekk/cli to GemFury.\n\n## Success Criteria\n\n- [ ] CONTRIBUTING.md file exists at repository root\n- [ ] Documents how to set up a GemFury publish token (different from read token)\n- [ ] Documents versioning conventions (semver)\n- [ ] Documents the publish command/process\n- [ ] Documents any pre-publish checklist (tests pass, changelog updated, etc.)\n\n## Notes\n\nThe publish process likely involves:\n1. Bumping version in package.json\n2. Running tests\n3. Publishing to GemFury via npm publish or fury CLI\n4. Creating a git tag\n\nThe builder should investigate the actual GemFury publish workflow and document it accurately.\n","branch":"main","created":"2026-02-05T12:00:00Z"},{"id":"github-action-publishes-to-gemfury","parent":"gemfury-package-management","title":"GitHub Action Publishes to GemFury","status":"done","priority":1,"file":"specs/gemfury-package-management/assertions/github-action-publishes-to-gemfury.md","content":"---\nid: github-action-publishes-to-gemfury\nparent: gemfury-package-management\ncreated: 2026-02-05T18:00:00Z\npriority: 1\nstatus: done\n---\n\n# GitHub Action Publishes to GemFury\n\n## What Must Be True\n\nA GitHub Action workflow automates publishing the `@spekk/cli` package to GemFury. The workflow is manually triggered, runs tests before publishing, and uses proper npm packaging configuration.\n\n## Success Criteria\n\n### Workflow File\n- `.github/workflows/publish.yml` exists\n- Triggered via `workflow_dispatch` (manual)\n- Uses Node.js 20\n- Runs `npm ci` to install dependencies\n- Runs `npm test` before publishing\n- Packs the tarball with `npm pack`\n- Pushes to GemFury using `GEMFURY_TOKEN` secret via curl\n\n### NPM Ignore\n- `.npmignore` file exists\n- Excludes `__tests__/` directories\n- Excludes `*.test.js` and `*.test.sh` files\n- Excludes `src/test-runner.js` and `src/test-runner-mocked.js`\n- Excludes `.tmp/` directory\n\n### NPM Registry Config\n- `.npmrc` file exists\n- Configures `@spekk` scope to use `https://npm.fury.io/thinknimble/`\n\n### Package.json Updates\n- Name is scoped: `@spekk/cli`\n- `files` array specifies included files:\n  - `bin/`\n  - `src/` (excluding test files)\n  - `specs/builder-agent/`\n  - `specs/coach-agent/`\n- `publishConfig.registry` points to `https://npm.fury.io/thinknimble/`\n- `prepublishOnly` script runs `npm test`\n\n## Validation\n\n- GitHub Action runs successfully when triggered\n- Published package contains only production files (no tests)\n- Package installs correctly from GemFury registry\n","branch":"main","created":"2026-02-05T18:00:00Z"},{"id":"publish-workflow-fails-on-error","parent":"gemfury-package-management","title":"Publish Workflow Fails on Error","status":"done","priority":1,"file":"specs/gemfury-package-management/assertions/publish-workflow-fails-on-error.md","content":"---\nid: publish-workflow-fails-on-error\nparent: gemfury-package-management\ncreated: 2026-02-05T21:15:00Z\npriority: 1\nstatus: done\n---\n\n# Publish Workflow Fails on Error\n\n## What Must Be True\n\nThe GitHub Action publish workflow fails (non-zero exit) when GemFury returns an error response, even if the HTTP status is 200.\n\n## Context\n\nGemFury returns HTTP 200 with error messages in the response body (e.g., \"account access denied\"). The workflow must check the response body and fail explicitly when the upload doesn't succeed.\n\n## Success Criteria\n\n- Workflow captures curl response output\n- Workflow checks response for success indicator (\"ok\")\n- Workflow exits with non-zero code if response doesn't indicate success\n- Workflow outputs clear error message on failure\n- GitHub Actions marks the run as failed when publish fails\n\n## Validation\n\n- Simulate a publish failure (e.g., invalid token) and verify the workflow run shows as failed in GitHub Actions\n","branch":"main","created":"2026-02-05T21:15:00Z"},{"id":"readme-contains-installation-instructions","parent":"gemfury-package-management","title":"README Contains GemFury Installation Instructions","status":"done","priority":1,"file":"specs/gemfury-package-management/assertions/readme-contains-installation-instructions.md","content":"---\nid: readme-contains-installation-instructions\nparent: gemfury-package-management\ncreated: 2026-02-05T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# README Contains GemFury Installation Instructions\n\n## What Must Be True\n\nThe README.md file contains a clear \"Installation\" section that explains how to install @spekk/cli from the GemFury private registry.\n\n## Success Criteria\n\n- [ ] README has an \"Installation\" section (before \"Quick Start\" or development instructions)\n- [ ] Instructions cover getting a GemFury token from a team lead\n- [ ] Instructions explain adding the token to shell config (~/.zshrc or ~/.bashrc)\n- [ ] Instructions show how to configure npm to use the GemFury registry for @spekk scope\n- [ ] Instructions include the install command: `npm install -g @spekk/cli`\n- [ ] Instructions include verification step: `spekk --help`\n- [ ] Instructions include how to update: `npm update -g @spekk/cli`\n\n## Reference Content\n\nThe installation section should include these steps:\n\n### 1. Get a Gemfury token\nAsk a team lead for a Gemfury **read** (or full access) token for the `thinknimble` org.\n\n### 2. Add the token to your shell\n```bash\n# Add to ~/.zshrc or ~/.bashrc\nexport GEMFURY_SPEKK_TOKEN=your_token_here\n```\nThen reload: `source ~/.zshrc` (or `~/.bashrc`)\n\n### 3. Configure npm\nAdd to global `~/.npmrc`:\n```\n@spekk:registry=https://npm.fury.io/thinknimble/\n//npm.fury.io/thinknimble/:_authToken=${GEMFURY_SPEKK_TOKEN}\n```\n\nOr run:\n```bash\nnpm config set @spekk:registry https://npm.fury.io/thinknimble/\nnpm config set //npm.fury.io/thinknimble/:_authToken \"$GEMFURY_SPEKK_TOKEN\"\n```\n\n### 4. Install\n```bash\nnpm install -g @spekk/cli\n```\n\n### 5. Verify\n```bash\nspekk --help\n```\n\n### Updating\n```bash\nnpm update -g @spekk/cli\n```\n","branch":"main","created":"2026-02-05T12:00:00Z"},{"id":"go-builder-launcher","parent":"golang-agents","title":"Go builder agent launcher","status":"done","priority":1,"file":"specs/golang-agents/assertions/go-builder-launcher.md","content":"---\nid: go-builder-launcher\nparent: golang-agents\ncreated: 2026-04-05T12:16:00Z\npriority: 1\nstatus: done\ndepends-on: go-prompt-resolver\nbranch: feature/golang-migration\n---\n\n# Go builder agent launcher\n\nThe Go builder launcher supports all builder modes: continuous, once, dry-run, interactive, confirm, and skill activation.\n\n## Success Criteria\n\n**Modes:**\n- Default (no flags): continuous loop — get next assertion, launch claude, repeat\n- `--once`: build one assertion then exit\n- `--dry-run` / `-d`: display next assertion details without launching claude\n- `--interactive` / `-i`: launch claude with `--system-prompt` (user drives session)\n- `--confirm` / `-c`: prompt y/n/q before each build\n- `spekk builder \u003cskill\u003e`: resolve and activate a builder skill\n\n**Flag handling:**\n- `--spec \u003cid\u003e` / `-s \u003cid\u003e`: filter assertions to specific spec\n- `--assertion \u003cid\u003e`: target specific assertion\n- `--help` / `-h`: display help\n\n**Process management:**\n- In continuous mode, SIGINT during a build interrupts claude but doesn't kill the parent\n- SIGINT between builds exits gracefully\n- In interactive mode, SIGINT is suppressed (claude handles Ctrl+C natively)\n- Colored console output for status messages\n\n**Build loop:**\n- Calls parser to get next assertion\n- Handles `complete`, `error`, and unexpected result types\n- On parser error in continuous mode: log warning, retry after 5s\n- On `complete` in continuous mode: wait 5s then check again\n- 1s pause between iterations\n","branch":"feature/golang-migration","dependsOn":"go-prompt-resolver","created":"2026-04-05T12:16:00Z"},{"id":"go-coach-launcher","parent":"golang-agents","title":"Go coach agent launcher","status":"done","priority":1,"file":"specs/golang-agents/assertions/go-coach-launcher.md","content":"---\nid: go-coach-launcher\nparent: golang-agents\ncreated: 2026-04-05T12:15:00Z\npriority: 1\nstatus: done\ndepends-on: go-prompt-resolver\nbranch: feature/golang-migration\n---\n\n# Go coach agent launcher\n\nThe Go coach launcher resolves the coach prompt, optionally activates a skill, and spawns `claude` with inherited stdio.\n\n## Success Criteria\n\n- `spekk coach` launches claude with the coach activation message\n- `spekk coach \u003cskill\u003e` resolves the skill and appends skill content to the activation message\n- `spekk coach meeting \u003cfile\u003e` reads the transcript file and includes it in the activation message\n- `spekk coach --help` displays help with available skills\n- Claude process gets inherited stdio (real TTY)\n- SIGINT forwarded to claude process for graceful shutdown\n- Exit code from claude preserved\n- Error message if `claude` CLI is not found (ENOENT)\n","branch":"feature/golang-migration","dependsOn":"go-prompt-resolver","created":"2026-04-05T12:15:00Z"},{"id":"go-observer-launcher","parent":"golang-agents","title":"Go observer agent launcher","status":"done","priority":1,"file":"specs/golang-agents/assertions/go-observer-launcher.md","content":"---\nid: go-observer-launcher\nparent: golang-agents\ncreated: 2026-04-05T12:17:00Z\npriority: 1\nstatus: done\ndepends-on: go-prompt-resolver\nbranch: feature/golang-migration\n---\n\n# Go observer agent launcher\n\nThe Go observer launcher resolves the observer prompt and spawns `claude` with inherited stdio.\n\n## Success Criteria\n\n- `spekk observer` launches claude with observer activation message\n- `spekk observer --interval \u003cseconds\u003e` passes scan interval preference in activation message\n- `spekk observer --quiet` passes quiet mode preference in activation message\n- `spekk observer --help` displays help\n- Claude process gets inherited stdio\n- SIGINT forwarded to claude for graceful shutdown\n- Exit code from claude preserved\n","branch":"feature/golang-migration","dependsOn":"go-prompt-resolver","created":"2026-04-05T12:17:00Z"},{"id":"go-orchestration-loops","parent":"golang-agents","title":"Go orchestration loops","status":"done","priority":2,"file":"specs/golang-agents/assertions/go-orchestration-loops.md","content":"---\nid: go-orchestration-loops\nparent: golang-agents\ncreated: 2026-04-05T12:18:00Z\npriority: 2\nstatus: done\ndepends-on: go-builder-launcher\nbranch: feature/golang-migration\n---\n\n# Go orchestration loops\n\nThe Go builder and coach loops continuously run agent sessions with git commit handling between iterations.\n\n## Success Criteria\n\n**Builder loop (`spekk loop builder`):**\n- Gets next assertion via parser\n- Launches claude builder agent\n- After agent completes: stages and commits changes if any\n- Handles parser errors (transient: retry after 5s)\n- Handles `complete` state (wait 5s, check again)\n- SIGINT/SIGTERM exit gracefully\n- Colored console output with iteration counter\n\n**Coach loop (`spekk loop coach`):**\n- Launches claude coach agent in interactive mode\n- After agent completes: stages and commits spec changes if any\n- SIGINT/SIGTERM exit gracefully\n- Colored console output with session counter\n","branch":"feature/golang-migration","dependsOn":"go-builder-launcher","created":"2026-04-05T12:18:00Z"},{"id":"remove-node-source","parent":"golang-cleanup","title":"All Node.js source code removed","status":"done","priority":3,"file":"specs/golang-cleanup/assertions/remove-node-source.md","content":"---\nid: remove-node-source\nparent: golang-cleanup\ncreated: 2026-04-05T12:32:00Z\npriority: 3\nstatus: done\ndepends-on: node-parser-removed\nbranch: feature/golang-migration\n---\n\n# All Node.js source code removed\n\nAfter the Go binary handles all commands, all Node.js implementation code is deleted.\n\n## Success Criteria\n\n- `src/` directory deleted entirely\n- `bin/spekk.js` deleted\n- `package.json`, `package-lock.json` deleted\n- `node_modules/` deleted (and in .gitignore)\n- No `.js` files remain in the project root or source directories\n- Go binary is the sole `spekk` executable\n- `go build ./cmd/spekk` is the only build step required\n","branch":"feature/golang-migration","dependsOn":"node-parser-removed","created":"2026-04-05T12:32:00Z"},{"id":"update-ci-for-go","parent":"golang-cleanup","title":"CI/CD updated for Go build and test","status":"done","priority":3,"file":"specs/golang-cleanup/assertions/update-ci-for-go.md","content":"---\nid: update-ci-for-go\nparent: golang-cleanup\ncreated: 2026-04-05T12:33:00Z\npriority: 3\nstatus: done\ndepends-on: remove-node-source\nbranch: feature/golang-migration\n---\n\n# CI/CD updated for Go build and test\n\nGitHub Actions workflows updated to build and test the Go binary instead of Node.js.\n\n## Success Criteria\n\n- Test workflow runs `go test ./...` instead of `npm test`\n- Build step runs `go build ./cmd/spekk`\n- Publish workflow builds Go binaries for linux/amd64, linux/arm64, darwin/amd64, darwin/arm64\n- Release creates GitHub release with platform-specific binaries\n- No npm publish step remains\n- Go version pinned in workflow (matches go.mod)\n","branch":"feature/golang-migration","dependsOn":"remove-node-source","created":"2026-04-05T12:33:00Z"},{"id":"update-installation-docs","parent":"golang-cleanup","title":"Installation and documentation updated for Go binary","status":"done","priority":3,"file":"specs/golang-cleanup/assertions/update-installation-docs.md","content":"---\nid: update-installation-docs\nparent: golang-cleanup\ncreated: 2026-04-05T12:34:00Z\npriority: 3\nstatus: done\ndepends-on: update-ci-for-go\nbranch: feature/golang-migration\n---\n\n# Installation and documentation updated for Go binary\n\nAll documentation reflects the Go binary distribution model instead of npm package.\n\n## Success Criteria\n\n- README installation instructions show `go install` or binary download\n- No references to `npm install`, `node`, or `package.json` in docs\n- CLAUDE.md updated: `npm run next` → `spekk next`, etc.\n- Spec prompts (coach, builder, observer) updated to reference Go binary\n- Contributing guide describes Go development workflow (`go build`, `go test`)\n- Gemfury publish spec marked as superseded (Go uses GitHub releases, not npm registry)\n","branch":"feature/golang-migration","dependsOn":"update-ci-for-go","created":"2026-04-05T12:34:00Z"},{"id":"go-command-router","parent":"golang-cli","title":"Go binary routes all CLI commands","status":"done","priority":1,"file":"specs/golang-cli/assertions/go-command-router.md","content":"---\nid: go-command-router\nparent: golang-cli\ncreated: 2026-04-05T12:10:00Z\npriority: 1\nstatus: done\ndepends-on: go-project-structure\nbranch: feature/golang-migration\n---\n\n# Go binary routes all CLI commands\n\nThe Go binary at `cmd/spekk/main.go` is the single entry point that routes all `spekk \u003ccommand\u003e` invocations to the correct handler.\n\n## Success Criteria\n\n- `spekk` with no args runs the parser (default behavior)\n- `spekk next` runs the parser with flags (`--all`, `--spec`, `--assertion`, `--all-branches`)\n- `spekk coach`, `spekk builder`, `spekk observer` route to agent launchers\n- `spekk loop builder`, `spekk loop coach` route to loop handlers\n- `spekk status` routes to status display\n- `spekk show` routes to show handler (with `--watch` flag)\n- `spekk serve` routes to serve handler (with `--port`, `--host` flags)\n- `spekk sandbox \u003csubcommand\u003e` routes to sandbox handler\n- `spekk help`, `spekk --help`, `spekk -h` display help text with available commands and skills\n- Unknown commands print error and exit with code 1\n","branch":"feature/golang-migration","dependsOn":"go-project-structure","created":"2026-04-05T12:10:00Z"},{"id":"go-flag-parser","parent":"golang-cli","title":"Go flag parser handles all CLI flags","status":"done","priority":1,"file":"specs/golang-cli/assertions/go-flag-parser.md","content":"---\nid: go-flag-parser\nparent: golang-cli\ncreated: 2026-04-05T12:11:00Z\npriority: 1\nstatus: done\ndepends-on: go-command-router\nbranch: feature/golang-migration\n---\n\n# Go flag parser handles all CLI flags\n\nA shared flag parsing utility in Go that handles boolean and string flags for all commands.\n\n## Success Criteria\n\n- Parses boolean flags (e.g., `--once`, `--dry-run`, `--watch`, `--confirm`, `--interactive`)\n- Parses string flags with values (e.g., `--spec auth`, `-s auth`, `--assertion foo`)\n- Supports short aliases (e.g., `-s` for `--spec`, `-d` for `--dry-run`, `-c` for `--confirm`)\n- Applies defaults (false for boolean, empty for string)\n- Unknown flags are ignored (not fatal)\n- Each command defines its own flag set using the shared utility\n","branch":"feature/golang-migration","dependsOn":"go-command-router","created":"2026-04-05T12:11:00Z"},{"id":"go-prompt-resolver","parent":"golang-cli","title":"Go prompt resolver implements layered prompt resolution","status":"done","priority":1,"file":"specs/golang-cli/assertions/go-prompt-resolver.md","content":"---\nid: go-prompt-resolver\nparent: golang-cli\ncreated: 2026-04-05T12:12:00Z\npriority: 1\nstatus: done\ndepends-on: go-command-router\nbranch: feature/golang-migration\n---\n\n# Go prompt resolver implements layered prompt resolution\n\nThe Go prompt resolver loads agent prompts using the same layered resolution as the Node implementation.\n\n## Success Criteria\n\n**Base prompt resolution (first match wins):**\n- Local override: `.spekk/{agent}.prompt.override.md`\n- Global override: `~/.config/spekk/{agent}.prompt.override.md`\n- Package base: `specs/{agent}-agent/{agent}.prompt.md` (relative to spekk installation)\n\n**Extension layers (appended in order):**\n- Global extend: `~/.config/spekk/{agent}.prompt.md`\n- Local extend: `.spekk/{agent}.prompt.md`\n\n**Behavior:**\n- Layers concatenated with `\\n\\n---\\n\\n` separator\n- Missing override/extend files silently skipped\n- Missing package base prompt is a fatal error\n- `createActivationMessage()` wraps prompt with working directory context\n- Works for all agents: coach, builder, observer\n","branch":"feature/golang-migration","dependsOn":"go-command-router","created":"2026-04-05T12:12:00Z"},{"id":"go-skill-resolver","parent":"golang-cli","title":"Go skill resolver implements layered skill discovery","status":"done","priority":1,"file":"specs/golang-cli/assertions/go-skill-resolver.md","content":"---\nid: go-skill-resolver\nparent: golang-cli\ncreated: 2026-04-05T12:13:00Z\npriority: 1\nstatus: done\ndepends-on: go-command-router\nbranch: feature/golang-migration\n---\n\n# Go skill resolver implements layered skill discovery\n\nThe Go skill resolver discovers and loads skill files using the same layered resolution as the Node implementation.\n\n## Success Criteria\n\n**Resolution order (first match wins):**\n1. Local: `.spekk/skills/{agent}/*.md`\n2. Global: `~/.config/spekk/skills/{agent}/*.md`\n3. Package: `specs/{agent}-skills-system/*.md` or `specs/builder-skills/*.md`\n\n**Skill matching:**\n- Direct filename match: `{name}.md`\n- Legacy alias match: e.g., `meeting` → `meeting-notes-to-specs-skill`\n- Frontmatter `id` field match (scans all `.md` files in directory)\n\n**Listing:**\n- `listSkills(agent)` returns all skills with deduplication (local shadows global shadows package)\n- `listAliases(agent)` returns legacy alias map\n\n**Legacy aliases preserved:**\n- Coach: `meeting` → `meeting-notes-to-specs-skill`, `coordinate` → `coordinator-skill`\n","branch":"feature/golang-migration","dependsOn":"go-command-router","created":"2026-04-05T12:13:00Z"},{"id":"go-parser-computes-state","parent":"golang-parser","title":"Go parser computes derived state","status":"done","priority":1,"file":"specs/golang-parser/assertions/go-parser-computes-state.md","content":"---\nid: go-parser-computes-state\nparent: golang-parser\ncreated: 2026-04-05T12:03:00Z\npriority: 1\nstatus: done\ndepends-on: go-parser-reads-specs\nbranch: feature/golang-migration\n---\n\n# Go parser computes derived state\n\nThe Go parser implements the same derived state computation as the Node parser: parent status rollup, next priority algorithm, branch filtering, and lock handling.\n\n## Success Criteria\n\n**Parent status computation:**\n- If any active child is `failed` → parent is `failed`\n- If all active children are `done` → parent is `done`\n- If any child is `in_progress` or `not_started` → parent is `in_progress`\n- No active children → parent is `not_started`\n- Draft children excluded from computation\n- Parent specs with `status: draft` keep their draft status (not overwritten)\n\n**Next priority algorithm:**\n- Excludes assertions with status `done` or `draft`\n- Excludes assertions whose parent spec is `draft`\n- Filters by current git branch (unless `--all-branches`)\n- Filters by `--spec` flag if provided\n- Excludes assertions with unsatisfied `depends-on` (dependency not `done`)\n- Excludes `in_progress` assertions with fresh (non-stale) locks\n- Lock is stale if \u003e2 hours old (parsed from `builder-{host}-{pid}-{timestamp}` format)\n- Sorts by: priority (ascending) → created date (ascending) → id (ascending)\n- Returns first match\n\n**CLI flags:**\n- `--all` returns full hierarchy JSON\n- `--spec \u003cid\u003e` filters to specific spec\n- `--assertion \u003cid\u003e` returns specific assertion directly\n- `--all-branches` disables branch filtering\n","branch":"feature/golang-migration","dependsOn":"go-parser-reads-specs","created":"2026-04-05T12:03:00Z"},{"id":"go-parser-json-matches-node","parent":"golang-parser","title":"Go parser JSON output matches Node parser","status":"done","priority":1,"file":"specs/golang-parser/assertions/go-parser-json-matches-node.md","content":"---\nid: go-parser-json-matches-node\nparent: golang-parser\ncreated: 2026-04-05T12:04:00Z\npriority: 1\nstatus: done\ndepends-on: go-parser-computes-state\nbranch: feature/golang-migration\n---\n\n# Go parser JSON output matches Node parser\n\nThe Go parser produces semantically identical JSON output to the Node parser for all output modes.\n\n## Success Criteria\n\n**Next assertion output** (`spekk next`):\n- JSON contains: `type`, `id`, `parent`, `file`, `priority`, `status`, `branch`, `created`, `dependsOn`, `lockedBy`, `title`, `content`, `spec` (with `id`, `file`, `title`)\n- Field names use camelCase (matching Node convention): `dependsOn`, `lockedBy`\n\n**Hierarchy output** (`spekk next --all`):\n- JSON contains: `type: \"hierarchy\"`, `specs` array, `observations` array\n- Each spec has: `id`, `title`, `status`, `priority`, `file`, `assertions` array\n- Assertions sorted by priority then id; specs sorted by priority then id\n\n**Complete output** (no remaining work):\n- `{ \"type\": \"complete\", \"status\": \"complete\", \"message\": \"All specifications are complete\" }`\n\n**Empty output** (no specs found):\n- `{ \"status\": \"empty\", \"message\": \"No specifications found in specs/ directory\" }`\n\n**Error output** (validation failures):\n- `{ \"error\": true, \"message\": \"...\" }` with non-zero exit code\n\n**Validation test:**\n- Running both Node and Go parsers against this project's `specs/` produces identical JSON (ignoring whitespace)\n","branch":"feature/golang-migration","dependsOn":"go-parser-computes-state","created":"2026-04-05T12:04:00Z"},{"id":"go-parser-reads-specs","parent":"golang-parser","title":"Go parser reads and parses spec directories","status":"done","priority":1,"file":"specs/golang-parser/assertions/go-parser-reads-specs.md","content":"---\nid: go-parser-reads-specs\nparent: golang-parser\ncreated: 2026-04-05T12:01:00Z\npriority: 1\nstatus: done\ndepends-on: go-project-structure\nbranch: feature/golang-migration\n---\n\n# Go parser reads and parses spec directories\n\nThe Go parser walks `specs/`, reads YAML frontmatter from markdown files, and builds the spec + assertion tree.\n\n## Success Criteria\n\n- Parser discovers all spec group directories under `specs/`\n- Parser reads `{spec-id}/{spec-id}.md` as parent spec files\n- Parser reads `{spec-id}/assertions/*.md` as assertion files\n- YAML frontmatter extracted correctly: id, parent, created, priority, status, depends-on, branch, locked-by\n- Markdown content (after frontmatter) preserved\n- First H1 heading extracted as title\n- CRLF line endings normalized to LF before parsing\n- Files without `---` frontmatter delimiter are silently skipped\n- Malformed files logged as warnings to stderr and skipped (not fatal)\n- Specs without an `assertions/` directory logged as warning and skipped\n- Running against this project's own `specs/` produces correct spec tree\n","branch":"feature/golang-migration","dependsOn":"go-project-structure","created":"2026-04-05T12:01:00Z"},{"id":"go-parser-validates-specs","parent":"golang-parser","title":"Go parser validates spec files","status":"done","priority":1,"file":"specs/golang-parser/assertions/go-parser-validates-specs.md","content":"---\nid: go-parser-validates-specs\nparent: golang-parser\ncreated: 2026-04-05T12:02:00Z\npriority: 1\nstatus: done\ndepends-on: go-parser-reads-specs\nbranch: feature/golang-migration\n---\n\n# Go parser validates spec files\n\nThe Go parser enforces the same validation rules as the Node parser, producing identical error messages for invalid input.\n\n## Success Criteria\n\n- Required fields enforced: specs need `id`, `created`, `priority`; assertions also need `parent`\n- ID format validated as kebab-case (`^[a-z][a-z0-9]*(-[a-z0-9]+)*$`)\n- Priority validated as 1, 2, or 3 only\n- Status validated as one of: `not_started`, `in_progress`, `done`, `draft`, `failed`\n- Timestamps validated as ISO 8601 format (`YYYY-MM-DDTHH:MM:SSZ`)\n- Branch field validated: no leading/trailing slashes, valid git branch characters, warns on non-standard patterns\n- Duplicate spec IDs across groups detected and reported\n- Duplicate assertion IDs within a spec detected and reported\n- Assertion `parent` field references an existing spec\n- `depends-on` field validated: must be kebab-case string, must reference existing assertion, no self-references\n- Circular dependencies detected and reported with cycle path\n- Folder structure enforced: no flat `.md` files with frontmatter at `specs/` root, spec directories must contain `{dir-name}.md`\n","branch":"feature/golang-migration","dependsOn":"go-parser-reads-specs","created":"2026-04-05T12:02:00Z"},{"id":"go-project-structure","parent":"golang-parser","title":"Go module and project structure exists","status":"done","priority":1,"file":"specs/golang-parser/assertions/go-project-structure.md","content":"---\nid: go-project-structure\nparent: golang-parser\ncreated: 2026-04-05T12:00:00Z\npriority: 1\nstatus: done\nbranch: feature/golang-migration\n---\n\n# Go module and project structure exists\n\nA Go module is initialized at the project root with standard Go project layout.\n\n## Success Criteria\n\n- `go.mod` exists at project root with module path `github.com/spekk-ai/spekk-cli`\n- `cmd/spekk/main.go` exists as the CLI entry point\n- `internal/parser/` package exists for parser logic\n- `go build ./cmd/spekk` compiles without errors\n- Binary accepts `next` subcommand (can be a stub that exits 0)\n","branch":"feature/golang-migration","created":"2026-04-05T12:00:00Z"},{"id":"node-delegates-to-go","parent":"golang-parser","title":"spekk next delegates to Go binary","status":"done","priority":2,"file":"specs/golang-parser/assertions/node-delegates-to-go.md","content":"---\nid: node-delegates-to-go\nparent: golang-parser\ncreated: 2026-04-05T12:05:00Z\npriority: 2\nstatus: done\ndepends-on: go-parser-json-matches-node\nbranch: feature/golang-migration\n---\n\n# spekk next delegates to Go binary\n\nThe Node CLI detects a compiled Go binary and delegates parser commands to it, falling back to the JS parser if the binary is not found.\n\n## Success Criteria\n\n- Node CLI checks for Go binary at `./spekk` or `./bin/spekk-go` (platform-appropriate path)\n- If Go binary exists and is executable, parser commands (`next`, with all flags) are delegated to it via child process\n- Go binary's stdout is passed through as the CLI output\n- Go binary's stderr (warnings) is passed through to stderr\n- Exit code from Go binary is preserved\n- If Go binary is not found, falls back to existing Node parser seamlessly\n- No user-visible behavior change — same JSON output regardless of which parser runs\n","branch":"feature/golang-migration","dependsOn":"go-parser-json-matches-node","created":"2026-04-05T12:05:00Z"},{"id":"node-parser-removed","parent":"golang-parser","title":"Node.js parser code removed","status":"done","priority":3,"file":"specs/golang-parser/assertions/node-parser-removed.md","content":"---\nid: node-parser-removed\nparent: golang-parser\ncreated: 2026-04-05T12:06:00Z\npriority: 3\nstatus: done\ndepends-on: node-delegates-to-go\nbranch: feature/golang-migration\n---\n\n# Node.js parser code removed\n\nAfter the Go parser is validated and the delegation layer is stable, the Node.js parser implementation is deleted.\n\n## Success Criteria\n\n- `src/parser/index.js` is deleted\n- `src/parser/cli.js` is replaced with a thin wrapper that calls the Go binary (no fallback)\n- All `src/parser/__tests__/*.test.js` files are deleted\n- Equivalent test coverage exists as Go tests in `internal/parser/`\n- `npm run next` invokes the Go binary directly\n- `go test ./internal/parser/...` passes all tests\n- No JS parser logic remains anywhere in the codebase\n","branch":"feature/golang-migration","dependsOn":"node-delegates-to-go","created":"2026-04-05T12:06:00Z"},{"id":"go-sandbox-api-client","parent":"golang-sandbox","title":"Go DigitalOcean API client","status":"done","priority":2,"file":"specs/golang-sandbox/assertions/go-sandbox-api-client.md","content":"---\nid: go-sandbox-api-client\nparent: golang-sandbox\ncreated: 2026-04-05T12:28:00Z\npriority: 2\nstatus: done\ndepends-on: go-command-router\nbranch: feature/golang-migration\n---\n\n# Go DigitalOcean API client\n\nA Go HTTP client for the DigitalOcean API that handles droplet CRUD, SSH key management, project assignment, and VPC placement.\n\n## Success Criteria\n\n- Creates droplets with cloud-init user data\n- Lists droplets filtered by spekk tag\n- Gets droplet status by ID\n- Destroys droplets by ID\n- Manages SSH keys (create, list, find by fingerprint)\n- Assigns droplets to DigitalOcean projects\n- Places droplets in specific VPCs\n- Uses `DIGITALOCEAN_TOKEN` environment variable for auth\n- Proper error handling for API failures (rate limits, not found, auth errors)\n","branch":"feature/golang-migration","dependsOn":"go-command-router","created":"2026-04-05T12:28:00Z"},{"id":"go-sandbox-commands","parent":"golang-sandbox","title":"Go sandbox subcommands","status":"done","priority":2,"file":"specs/golang-sandbox/assertions/go-sandbox-commands.md","content":"---\nid: go-sandbox-commands\nparent: golang-sandbox\ncreated: 2026-04-05T12:29:00Z\npriority: 2\nstatus: done\ndepends-on: go-sandbox-api-client\nbranch: feature/golang-migration\n---\n\n# Go sandbox subcommands\n\nAll sandbox subcommands ported to Go with identical CLI interface.\n\n## Success Criteria\n\n**`spekk sandbox create --name \u003cname\u003e`:**\n- A new DigitalOcean droplet is provisioned and accessible via SSH\n- A dedicated SSH key pair exists for the sandbox and is registered with DigitalOcean\n- Agent credentials (API token, AWS, GitHub) are injected and the agent service is ready\n- Sandbox metadata is persisted locally for use by other subcommands\n- `--region`, `--size`, `--project`, `--vpc` flags are supported\n\n**`spekk sandbox list`:**\n- All known sandboxes are displayed with name, IP, region, status, and creation date\n\n**`spekk sandbox status \u003cname\u003e`:**\n- Droplet status, provisioning state, and agent service health are displayed\n\n**`spekk sandbox ssh \u003cname\u003e`:**\n- An interactive SSH session opens to the sandbox using its dedicated key\n\n**`spekk sandbox destroy \u003cname\u003e`:**\n- The droplet, its SSH key on DigitalOcean, the local key files, and local metadata are all removed\n- Confirmation is required unless `--force` is passed\n\n**`spekk sandbox deploy \u003cname\u003e`:**\n- The latest release binary is installed on the sandbox and the agent service is restarted\n\n**All commands:**\n- `--help` flag displays subcommand-specific help\n- Clear error messages for missing arguments, unknown sandboxes, and API failures\n","branch":"feature/golang-migration","dependsOn":"go-sandbox-api-client","created":"2026-04-05T12:29:00Z"},{"id":"builder-process-race-condition","parent":"golang-security-hardening","title":"Builder agent protects activeProcess with synchronization","status":"done","priority":1,"file":"specs/golang-security-hardening/assertions/builder-process-race-condition.md","content":"---\nid: builder-process-race-condition\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\nstatus: done\nbranch: feature/golang-migration\n---\n\n# Builder agent protects activeProcess with synchronization\n\nThe `activeProcess` pointer in `internal/agent/builder.go` is accessed from both the main goroutine (which sets it during `launchClaude`) and a signal-handler goroutine (which reads it to forward SIGINT). Access is synchronized with a mutex to prevent data races.\n\n## Success Criteria\n\n- `activeProcess` reads and writes are protected by a `sync.Mutex`\n- The signal-handler goroutine locks the mutex before reading `activeProcess`\n- `launchClaude` locks the mutex before writing `activeProcess`\n- `go test -race ./internal/agent/...` passes without data race warnings\n","branch":"feature/golang-migration","created":"2026-04-24T12:00:00Z"},{"id":"launcher-path-traversal","parent":"golang-security-hardening","title":"Agent launcher validates file paths against traversal","status":"done","priority":1,"file":"specs/golang-security-hardening/assertions/launcher-path-traversal.md","content":"---\nid: launcher-path-traversal\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\nstatus: done\nbranch: feature/golang-migration\n---\n\n# Agent launcher validates file paths against traversal\n\nThe `BuildSkillMessage` function in `internal/agent/launcher.go` validates that resolved transcript file paths do not escape the current working directory via `../` traversal. Paths that resolve outside the working directory are rejected with an error.\n\n## Success Criteria\n\n- After resolving the transcript path, the function checks that the resolved absolute path has the working directory as a prefix\n- Paths like `../../etc/passwd` are rejected with a clear error message\n- Legitimate relative paths (e.g. `notes/meeting.txt`) still work\n- Absolute paths within the working directory still work\n- Test covers both accepted and rejected paths\n","branch":"feature/golang-migration","created":"2026-04-24T12:00:00Z"},{"id":"remove-builder-placeholder","parent":"golang-security-hardening","title":"Builder placeholder code removed","status":"done","priority":2,"file":"specs/golang-security-hardening/assertions/remove-builder-placeholder.md","content":"---\nid: remove-builder-placeholder\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 2\nstatus: done\nbranch: feature/golang-migration\n---\n\n# Builder placeholder code removed\n\nThe dead code `if cfg.Interactive \u0026\u0026 false { /* placeholder */ }` in `internal/agent/builder.go` is removed.\n\n## Success Criteria\n\n- The line `if cfg.Interactive \u0026\u0026 false { /* placeholder */ }` no longer exists in builder.go\n- All tests pass\n","branch":"feature/golang-migration","created":"2026-04-24T12:00:00Z"},{"id":"sandbox-store-file-permissions","parent":"golang-security-hardening","title":"Sandbox metadata file has restrictive permissions","status":"done","priority":1,"file":"specs/golang-security-hardening/assertions/sandbox-store-file-permissions.md","content":"---\nid: sandbox-store-file-permissions\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\nstatus: done\nbranch: feature/golang-migration\n---\n\n# Sandbox metadata file has restrictive permissions\n\nThe `sandboxes.json` file written by `internal/sandbox/store.go` uses `0o600` permissions (owner read/write only) instead of `0o644`, since it contains infrastructure metadata including droplet IPs and IDs.\n\n## Success Criteria\n\n- `os.WriteFile` call in `writeSandboxes` uses file mode `0o600`\n- Existing tests continue to pass\n","branch":"feature/golang-migration","created":"2026-04-24T12:00:00Z"},{"id":"serve-goroutine-cleanup","parent":"golang-security-hardening","title":"WebSocket pipe-reader goroutines use context for cancellation","status":"done","priority":2,"file":"specs/golang-security-hardening/assertions/serve-goroutine-cleanup.md","content":"---\nid: serve-goroutine-cleanup\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 2\nstatus: done\ndepends-on: serve-json-error-handling\nbranch: feature/golang-migration\n---\n\n# WebSocket pipe-reader goroutines use context for cancellation\n\nThe stdout and stderr reader goroutines in `internal/serve/serve.go` are tied to a cancellation context. When the WebSocket connection closes or the Claude process exits, the context is cancelled, unblocking any goroutines that might otherwise hang on a broken pipe.\n\n## Success Criteria\n\n- A `context.WithCancel` is created per WebSocket connection\n- The cancel function is called on connection cleanup (both normal close and error paths)\n- Pipe-reader goroutines call `connCancel()` via `defer` when they exit (signaling completion)\n- The Claude process wait goroutine calls cancel after the process exits\n- Goroutines unblock naturally when pipes close on process exit; the cancel function coordinates cleanup across all goroutines\n","branch":"feature/golang-migration","dependsOn":"serve-json-error-handling","created":"2026-04-24T12:00:00Z"},{"id":"serve-json-error-handling","parent":"golang-security-hardening","title":"Serve WebSocket handler logs JSON unmarshal errors","status":"done","priority":1,"file":"specs/golang-security-hardening/assertions/serve-json-error-handling.md","content":"---\nid: serve-json-error-handling\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\nstatus: done\ndepends-on: websocket-origin-validation\nbranch: feature/golang-migration\n---\n\n# Serve WebSocket handler logs JSON unmarshal errors\n\nAll `json.Unmarshal` calls in the WebSocket message handler (`internal/serve/serve.go` switch cases for chat, element_selection, action_recording, init) check and log errors instead of silently discarding them. Malformed messages produce a debug log and are skipped without crashing.\n\n## Success Criteria\n\n- Each `json.Unmarshal` in the incoming-message switch checks its error return\n- On unmarshal failure, a debug-level log is emitted with the event type and error\n- The malformed message is skipped (no `sendToClaude` call)\n- `json.Marshal` error in `sendToClaude` is also checked and logged\n- `stdinPipe.Write` error is checked and logged\n","branch":"feature/golang-migration","dependsOn":"websocket-origin-validation","created":"2026-04-24T12:00:00Z"},{"id":"websocket-origin-validation","parent":"golang-security-hardening","title":"WebSocket server restricts connection origins to localhost","status":"done","priority":1,"file":"specs/golang-security-hardening/assertions/websocket-origin-validation.md","content":"---\nid: websocket-origin-validation\nparent: golang-security-hardening\ncreated: 2026-04-24T12:00:00Z\npriority: 1\nstatus: done\nbranch: feature/golang-migration\n---\n\n# WebSocket server restricts connection origins to localhost\n\nThe `spekk serve` WebSocket upgrader validates the `Origin` header and only accepts connections originating from localhost (`http://localhost:*`, `http://127.0.0.1:*`, `http://[::1]:*`, and Chrome extension origins). All other origins are rejected with HTTP 403.\n\n## Success Criteria\n\n- `upgrader.CheckOrigin` validates the request Origin header against a localhost allowlist\n- Chrome extension origins (`chrome-extension://`) are also accepted\n- Connections with no Origin header are accepted (non-browser clients like CLI tools)\n- Connections from any other origin (e.g. `http://evil.com`) are rejected\n- Test covers accepted and rejected origins\n","branch":"feature/golang-migration","created":"2026-04-24T12:00:00Z"},{"id":"go-serve-websocket","parent":"golang-serve","title":"Go serve command runs WebSocket server","status":"done","priority":2,"file":"specs/golang-serve/assertions/go-serve-websocket.md","content":"---\nid: go-serve-websocket\nparent: golang-serve\ncreated: 2026-04-05T12:25:00Z\npriority: 2\nstatus: done\ndepends-on: go-prompt-resolver\nbranch: feature/golang-migration\n---\n\n# Go serve command runs WebSocket server\n\nThe `spekk serve` command in Go starts a WebSocket server that bridges browser extension messages to Claude Code.\n\n## Success Criteria\n\n- `spekk serve` starts WebSocket server on default port 3118\n- `spekk serve --port \u003cn\u003e` uses custom port\n- `spekk serve --host \u003chost\u003e` uses custom host\n- WebSocket origin validation restricts connections to localhost, loopback, and chrome-extension origins\n- WebSocket accepts connections and handles message types: chat, element_selection, action_recording, init\n- On chat message: spawns claude process with coach prompt + message content\n- Streams claude output back to WebSocket client as response messages\n- Formats messages correctly (chat → claude input, claude output → chat response)\n- Multiple concurrent sessions supported\n- SIGINT shuts down server and all claude processes gracefully\n- Health check endpoint at `/health`\n","branch":"feature/golang-migration","dependsOn":"go-prompt-resolver","created":"2026-04-05T12:25:00Z"},{"id":"go-show-html-generation","parent":"golang-show","title":"Go show command generates spec explorer HTML","status":"done","priority":2,"file":"specs/golang-show/assertions/go-show-html-generation.md","content":"---\nid: go-show-html-generation\nparent: golang-show\ncreated: 2026-04-05T12:22:00Z\npriority: 2\nstatus: done\ndepends-on: go-parser-json-matches-node\nbranch: feature/golang-migration\n---\n\n# Go show command generates spec explorer HTML\n\nThe `spekk show` command in Go generates a self-contained HTML file with the spec explorer web interface and opens it in the default browser.\n\n## Success Criteria\n\n- Parses specs using Go parser\n- Generates single HTML file at `.spekk/show/index.html` (creates directory if needed)\n- HTML contains embedded CSS and JS (no external dependencies)\n- Spec tree displayed with collapsible dropdowns per spec group\n- Assertions appear as sub-items under their parent spec\n- Status icons display correctly for all status values\n- Clicking a spec or assertion shows detail panel with full content\n- Search bar filters the spec tree\n- Metro map visualization shows branch-based dependency graph\n- Opens generated HTML in default browser (platform-aware: `open` on macOS, `xdg-open` on Linux)\n","branch":"feature/golang-migration","dependsOn":"go-parser-json-matches-node","created":"2026-04-05T12:22:00Z"},{"id":"go-show-watch-mode","parent":"golang-show","title":"Go show watch mode with live reload","status":"done","priority":2,"file":"specs/golang-show/assertions/go-show-watch-mode.md","content":"---\nid: go-show-watch-mode\nparent: golang-show\ncreated: 2026-04-05T12:23:00Z\npriority: 2\nstatus: done\ndepends-on: go-show-html-generation\nbranch: feature/golang-migration\n---\n\n# Go show watch mode with live reload\n\nThe `spekk show --watch` mode watches for spec file changes and pushes updates to the browser via SSE.\n\n## Success Criteria\n\n- `spekk show --watch` / `spekk show -w` starts file watcher and HTTP server\n- Watches `specs/` directory for `.md` file changes\n- On change: re-parses specs, regenerates HTML, sends SSE event to connected browsers\n- Browser receives SSE event and reloads while preserving UI state (expanded specs, active detail panel, scroll position)\n- HTTP server binds to `127.0.0.1` (IPv4) on an available port\n- Server URL printed to console\n- SIGINT shuts down watcher and server gracefully\n","branch":"feature/golang-migration","dependsOn":"go-show-html-generation","created":"2026-04-05T12:23:00Z"},{"id":"go-status-display","parent":"golang-status","title":"Go status command displays spec overview","status":"done","priority":2,"file":"specs/golang-status/assertions/go-status-display.md","content":"---\nid: go-status-display\nparent: golang-status\ncreated: 2026-04-05T12:20:00Z\npriority: 2\nstatus: done\ndepends-on: go-parser-json-matches-node\nbranch: feature/golang-migration\n---\n\n# Go status command displays spec overview\n\nThe `spekk status` command in Go displays a formatted overview of all specs, assertions, and progress.\n\n## Success Criteria\n\n- Displays each spec with status icon, title, and completion ratio (done/total)\n- Assertions listed under their parent spec with indentation, sorted by priority then created\n- Status icons: done=check, in_progress=construction, not_started=clipboard, draft=memo\n- Overall statistics: total assertions, done, in progress, not started, blocked counts\n- Completion percentage displayed\n- Next priority item shown with title, parent spec, priority, status, and file path\n- Empty specs directory shows helpful getting-started message\n- Handles all spec scenarios: complete, partial, empty\n","branch":"feature/golang-migration","dependsOn":"go-parser-json-matches-node","created":"2026-04-05T12:20:00Z"},{"id":"default-install-dir-user-owned","parent":"install-script","title":"Default Install Directory Is User-Owned (`~/.local/bin`)","status":"not_started","priority":1,"file":"specs/install-script/assertions/default-install-dir-user-owned.md","content":"---\nid: default-install-dir-user-owned\nparent: install-script\ncreated: 2026-06-12T00:00:00Z\npriority: 1\nstatus: not_started\nbranch: feat/user-owned-install-dir\n---\n\n# Default Install Directory Is User-Owned (`~/.local/bin`)\n\n## Description\n\n`install.sh` installs to `~/.local/bin` by default so that the installed\nbinary is user-owned and `spekk update` works without sudo. The previous\ndefault was `/usr/local/bin`, which made every self-update require sudo on a\nstandard install.\n\n## Success Criteria\n\n- With no environment overrides, `install.sh` installs to\n  `$HOME/.local/bin/spekk`\n- `~/.local/bin` is created (`mkdir -p`) if it does not exist\n- No sudo is invoked anywhere in the default flow\n- `SPEKK_INSTALL_DIR` still overrides the destination; when the override\n  points at a directory the user cannot write (e.g. `/usr/local/bin`), the\n  existing sudo fallback is retained (\"Installing to \u003cdir\u003e (requires sudo)\"\n  + `sudo mv`)\n- The script's usage comment and the README/`docs/install.md` install docs\n  reflect the new default and the `SPEKK_INSTALL_DIR` escape hatch\n- Script remains POSIX sh (no bashisms), so `curl ... | sh` stays safe\n\n## Notes\n\nRationale recorded in the parent spec: user-owned directories are the\nrustup/deno/bun/uv precedent for self-updating CLIs; auto-sudo escalation\nfrom inside the binary was rejected. Open question for the implementer:\nwhether to also print a hint for users with an existing sudo-installed\n`/usr/local/bin/spekk` (the stale copy could shadow the new one depending on\nPATH order) — a one-line \"found another spekk at \u003cpath\u003e\" warning would be in\nthe spirit of this spec but is not required by it.\n","branch":"feat/user-owned-install-dir","created":"2026-06-12T00:00:00Z"},{"id":"install-sh-works","parent":"install-script","title":"install.sh Installs the Latest Release on macOS and Linux","status":"done","priority":1,"file":"specs/install-script/assertions/install-sh-works.md","content":"---\nid: install-sh-works\nparent: install-script\ncreated: 2026-06-11T00:00:00Z\npriority: 1\nstatus: done\nbranch: feat/agent-install\n---\n\n# install.sh Installs the Latest Release on macOS and Linux\n\n`install.sh` at the repo root is a POSIX-sh script that installs the latest spekk release with one command.\n\n## Success Criteria\n\n- Detects OS (`darwin`/`linux`) and architecture (`amd64`/`arm64` including `x86_64`/`aarch64` aliases); errors clearly on anything else, pointing Windows users to the releases page\n- Downloads `spekk-\u003cos\u003e-\u003carch\u003e` from `https://github.com/spekk-ai/spekk-cli/releases/latest/download/`\n- Installs `spekk` to the default install directory, overridable via `SPEKK_INSTALL_DIR`; uses `sudo` only when the target directory is not writable (which directory is the default is specified by `default-install-dir-user-owned`)\n- Cleans up its temp file on failure\n- Prints the installed version and a pointer to getting started\n- Works under plain `sh` (no bashisms) so `curl ... | sh` is safe\n- README leads with this one-liner in the Install section; `docs/install.md` quick-install uses it too\n- Released binaries report their real version (publish.yml builds `cmd/spekk` with `-ldflags \"-X main.version=\u003ctag\u003e\"`), so the script's \"Installed spekk \\\u003cversion\\\u003e\" line is meaningful and `spekk update` works on installed binaries\n\n**Tests:** verified by running `SPEKK_INSTALL_DIR=\u003ctmpdir\u003e sh install.sh` against the live latest release.\n","branch":"feat/agent-install","created":"2026-06-11T00:00:00Z"},{"id":"path-warning-after-install","parent":"install-script","title":"Install Warns With a Copy-Paste Fix When the Install Dir Is Not on PATH","status":"not_started","priority":2,"file":"specs/install-script/assertions/path-warning-after-install.md","content":"---\nid: path-warning-after-install\nparent: install-script\ncreated: 2026-06-12T00:00:00Z\npriority: 2\nstatus: not_started\ndepends-on: default-install-dir-user-owned\nbranch: feat/user-owned-install-dir\n---\n\n# Install Warns With a Copy-Paste Fix When the Install Dir Is Not on PATH\n\n## Description\n\n`~/.local/bin` is not on `$PATH` on every system. After installing,\n`install.sh` checks whether the install directory is on `$PATH` and, if not,\nprints a clear warning containing the exact line the user should add to\ntheir shell config — no detective work required.\n\n## Success Criteria\n\n- After a successful install, the script checks whether the install\n  directory (default or `SPEKK_INSTALL_DIR`) appears as a component of\n  `$PATH` (exact component match, not substring)\n- If it is on `$PATH`: no warning, output unchanged from today\n- If it is not on `$PATH`, the script prints a warning that includes:\n  - the directory that is missing from `$PATH`\n  - the exact line to add, e.g.\n    `export PATH=\"$HOME/.local/bin:$PATH\"`\n  - the rc file to add it to, chosen from the user's shell where reasonable:\n    `$SHELL` ending in `zsh` → `~/.zshrc`, ending in `bash` → `~/.bashrc`\n    (`~/.bash_profile` on macOS), otherwise a generic \"your shell config\"\n  - a reminder to restart the shell or `source` the rc file\n- The warning goes to stderr or stands out clearly from the success output;\n  the script still exits 0 (the install itself succeeded)\n- The post-install version line (`\"$INSTALL_DIR/spekk\" version`) keeps using\n  the full path, so it works even before PATH is fixed\n- PATH detection works under plain `sh` (no bashisms)\n\n## Notes\n\nThe script only prints the instruction — it must not edit the user's rc\nfiles. Modifying dotfiles from a piped `curl | sh` script was deliberately\nleft out of scope.\n","branch":"feat/user-owned-install-dir","dependsOn":"default-install-dir-user-owned","created":"2026-06-12T00:00:00Z"},{"id":"base-prompt-required","parent":"layered-prompt-system","title":"Base Prompt Is Required (Unless Overridden)","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/base-prompt-required.md","content":"---\nid: base-prompt-required\nparent: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\nstatus: done\n---\n\n# Base Prompt Is Required (Unless Overridden)\n\n## Description\n\nThe base prompt from the spekk package is required unless a global or local override replaces it. If no base and no override exist, the agent fails to launch with a clear error.\n\n## Success Criteria\n\n- Base prompt loaded from `\u003cspekk-package\u003e/specs/\u003cagent\u003e-agent/\u003cagent\u003e.prompt.md`\n- Internal prompt files are renamed from `\u003cagent\u003e-agent.prompt.md` to `\u003cagent\u003e.prompt.md` (e.g., `coach.prompt.md`)\n- If base prompt is missing AND no override exists, error is thrown\n- If base prompt is missing BUT an override exists, resolution succeeds\n- Error message clearly identifies the missing file\n- `PromptResolver` agent names are simplified: `coach`, `builder`, `observer`\n","branch":"main","created":"2026-02-21T12:15:00Z"},{"id":"global-prompt-optional","parent":"layered-prompt-system","title":"Global Prompt Is Optional","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/global-prompt-optional.md","content":"---\nid: global-prompt-optional\nparent: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\nstatus: done\n---\n\n# Global Prompt Is Optional\n\n**Tests:** src/cli/__tests__/prompt-resolver.test.js\n\n## Description\n\nThe global prompt from `~/.config/spekk/` is optional. If present, it's appended to the base prompt. If missing, resolution continues silently.\n\n## Success Criteria\n\n- Global extend prompt loaded from `~/.config/spekk/\u003cagent\u003e.prompt.md`\n- Global override prompt loaded from `~/.config/spekk/\u003cagent\u003e.prompt.override.md`\n- If override exists, it replaces the package base prompt\n- If extend exists, content is appended after the base (or overridden base)\n- If neither exists, no error — resolution continues\n- `~` correctly expands to user's home directory on all platforms\n","branch":"main","created":"2026-02-21T12:15:00Z"},{"id":"local-prompt-optional","parent":"layered-prompt-system","title":"Local Prompt Is Optional","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/local-prompt-optional.md","content":"---\nid: local-prompt-optional\nparent: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\nstatus: done\n---\n\n# Local Prompt Is Optional\n\n## Description\n\nThe local prompt from the project's `.spekk/` directory is optional. If present, it's appended after global. If missing, resolution continues silently.\n\n## Success Criteria\n\n- Local extend prompt loaded from `.spekk/\u003cagent\u003e.prompt.md` (relative to cwd)\n- Local override prompt loaded from `.spekk/\u003cagent\u003e.prompt.override.md` (relative to cwd)\n- If override exists, it replaces the base prompt (takes precedence over global override)\n- If extend exists, content is appended after global extend\n- If neither exists, no error — resolution continues\n- Works correctly regardless of where spekk is invoked from\n","branch":"main","created":"2026-02-21T12:15:00Z"},{"id":"prompts-concatenated-with-separator","parent":"layered-prompt-system","title":"Prompts Concatenated With Separator","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/prompts-concatenated-with-separator.md","content":"---\nid: prompts-concatenated-with-separator\nparent: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\nstatus: done\ndepends_on:\n  - base-prompt-required\n  - global-prompt-optional\n  - local-prompt-optional\n---\n\n# Prompts Concatenated With Separator\n\n## Description\n\nWhen multiple prompt layers exist, they are concatenated with a clear separator so the agent can distinguish between layers.\n\n## Success Criteria\n\n- Layers concatenated in order: base (or override) → global extend → local extend\n- Separator between layers is `\\n\\n---\\n\\n`\n- Final prompt is a single string passed to Claude\n- No separator added if only one layer exists\n","branch":"main","created":"2026-02-21T12:15:00Z"},{"id":"readme-documents-prompt-customization","parent":"layered-prompt-system","title":"README Documents Prompt Customization","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/readme-documents-prompt-customization.md","content":"---\nid: readme-documents-prompt-customization\nparent: layered-prompt-system\ncreated: 2026-03-16T00:00:00Z\npriority: 1\nstatus: done\ndepends_on:\n  - works-for-all-agents\n---\n\n# README Documents Prompt Customization\n\n## Description\n\nThe README includes a section early in the document (before detailed CLI usage) explaining how to customize agent prompts using the layered prompt system.\n\n## Success Criteria\n\n- README has a \"Customizing Agent Prompts\" section near the top (setup/getting-started area)\n- Explains the extend vs override distinction with file naming convention\n- Shows the global (`~/.config/spekk/`) and local (`.spekk/`) paths\n- Includes at least one example of extending a prompt and one of overriding\n- Mentions that `.spekk/` can be committed or gitignored per team preference\n","branch":"main","created":"2026-03-16T00:00:00Z"},{"id":"works-for-all-agents","parent":"layered-prompt-system","title":"Works For All Agents","status":"done","priority":1,"file":"specs/layered-prompt-system/assertions/works-for-all-agents.md","content":"---\nid: works-for-all-agents\nparent: layered-prompt-system\ncreated: 2026-02-21T12:15:00Z\npriority: 1\nstatus: done\ndepends_on:\n  - prompts-concatenated-with-separator\n---\n\n# Works For All Agents\n\n## Description\n\nLayered prompt resolution works for all agent types via a shared `PromptResolver`.\n\n## Success Criteria\n\n- Coach agent supports layered prompts\n- Builder agent supports layered prompts\n- Observer agent supports layered prompts\n- Any future agents automatically support layered prompts via `PromptResolver`\n- All agents use simplified names (`coach`, `builder`, `observer`) in the resolver\n","branch":"main","created":"2026-02-21T12:15:00Z"},{"id":"builder-supports-skills","parent":"layered-skill-discovery","title":"Builder CLI Supports Skill Subcommands","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/builder-supports-skills.md","content":"---\nid: builder-supports-skills\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\ndepends-on: skill-resolver-layered-resolution\n---\n\n# Builder CLI Supports Skill Subcommands\n\n## Description\n\nThe builder CLI (`src/builder/cli.js`) now accepts a skill subcommand as the first positional argument. If it resolves via `SkillResolver`, the skill content is inlined into the activation message and Claude is launched once. Skills compose with flags: `spekk builder my-skill --once` works.\n\n## Success Criteria\n\n- `src/builder/cli.js` imports and uses `SkillResolver` from `src/cli/skill-resolver.js`\n- First positional (non-flag) argument is extracted and checked as a potential skill name\n- If skill resolves, content is inlined within `\u003cskill-content\u003e` tags in the activation message\n- Claude is launched once with the skill-enriched activation message, then exits\n- If the positional arg does not resolve as a skill, normal builder behavior continues\n- `showHelp()` dynamically lists available builder skills from all layers\n- `spekk builder api-audit` discovers and inlines a global skill from `~/.config/spekk/skills/builder/`\n- Flag parsing is unaffected — `extractSkillArg()` correctly skips flags and their values\n","branch":"main","dependsOn":"skill-resolver-layered-resolution","created":"2026-03-28T12:00:00Z"},{"id":"coach-uses-skill-resolver","parent":"layered-skill-discovery","title":"Coach CLI Uses SkillResolver for Skill Detection","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/coach-uses-skill-resolver.md","content":"---\nid: coach-uses-skill-resolver\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\ndepends-on: skill-resolver-layered-resolution\n---\n\n# Coach CLI Uses SkillResolver for Skill Detection\n\n## Description\n\nThe coach CLI (`src/coach/cli.js`) delegates all skill resolution to `SkillResolver` instead of using a hardcoded `SKILL_MAP`. The `buildSkillActivationMessage()` function accepts an optional `SkillResolver` instance for testability. `showHelp()` dynamically lists available coach skills.\n\n## Success Criteria\n\n- `src/coach/cli.js` imports and uses `SkillResolver` from `src/cli/skill-resolver.js`\n- `buildSkillActivationMessage()` delegates to `resolver.resolveSkill('coach', subcommand)`\n- `launchCoachAgent()` uses `skillResolver.resolveSkill('coach', subcommand)` to detect skills\n- `showHelp()` calls `skillResolver.listSkills('coach')` and dynamically lists available skills\n- Skill content is inlined within `\u003cskill-content\u003e` tags in the activation message\n- Coach-specific behavior (transcript handling for `meeting`) remains in coach CLI\n- Adding a new coach skill requires only creating a markdown file — no JS changes needed\n","branch":"main","dependsOn":"skill-resolver-layered-resolution","created":"2026-03-28T12:00:00Z"},{"id":"legacy-aliases-backward-compat","parent":"layered-skill-discovery","title":"Legacy Aliases Preserve Backward Compatibility","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/legacy-aliases-backward-compat.md","content":"---\nid: legacy-aliases-backward-compat\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# Legacy Aliases Preserve Backward Compatibility\n\n## Description\n\nExisting CLI subcommands (`spekk coach meeting`, `spekk coach coordinate`) continue to work via legacy alias mappings in the `SkillResolver`. The old `SKILL_MAP` and `resolveSkillContent()` function are removed from `src/coach/cli.js`.\n\n## Success Criteria\n\n- `spekk coach meeting` resolves to `meeting-notes-to-specs-skill` via legacy alias\n- `spekk coach coordinate` resolves to `coordinator-skill` via legacy alias\n- No `SKILL_MAP` constant exists in `src/coach/cli.js`\n- No `resolveSkillContent()` function exists in `src/coach/cli.js`\n- Meeting-specific transcript handling works (coach-specific behavior preserved)\n- `src/serve/index.js` uses `SkillResolver` for coordinator skill resolution\n- `spekk coach --help` lists alias names (`meeting`, `coordinate`) as the displayed subcommand names, not the underlying skill filenames\n","branch":"main","created":"2026-03-28T12:00:00Z"},{"id":"legacy-skill-classes-removed","parent":"layered-skill-discovery","title":"Legacy Skill OOP Classes Are Removed","status":"done","priority":2,"file":"specs/layered-skill-discovery/assertions/legacy-skill-classes-removed.md","content":"---\nid: legacy-skill-classes-removed\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 2\nstatus: done\n---\n\n# Legacy Skill OOP Classes Are Removed\n\n## Description\n\nThe unused `Skill` base class and its re-export no longer exist. Skills are inlined by the CLI at launch — the agent prompt does not include a `Skills directory:` path.\n\n## Success Criteria\n\n- `src/coach/skill-interface.js` does not exist\n- `src/coach/skills/index.js` does not exist\n- `src/coach/skills/` directory does not exist\n- `src/coach/__tests__/skill-interface.test.js` does not exist\n- `PromptResolver.createActivationMessage()` does not include a `Skills directory:` line in its output\n- `specs/builder-skills/` directory exists as an empty placeholder (with `.gitkeep`)\n- `package.json` `files` array includes `specs/builder-skills/`\n","branch":"main","created":"2026-03-28T12:00:00Z"},{"id":"skill-name-derivation","parent":"layered-skill-discovery","title":"Skills Are Identified by Filename Stem and Frontmatter ID","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/skill-name-derivation.md","content":"---\nid: skill-name-derivation\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# Skills Are Identified by Filename Stem and Frontmatter ID\n\n## Description\n\nA skill's subcommand name is derived from its filename stem (minus `.md`). Additionally, the `id` field in YAML frontmatter serves as an alternative lookup name, so `api-audit-tool.md` with `id: api-audit` can be invoked as `spekk builder api-audit`.\n\n## Success Criteria\n\n- Filename stem is the primary skill name: `my-validator.md` → subcommand `my-validator`\n- Frontmatter `id` field is checked as fallback when no filename match exists\n- Only `.md` files are considered as skills (non-`.md` files are ignored)\n- `listSkills()` returns skill names derived from filename stems\n- `listSkills()` deduplicates across layers — earlier layers (local) take precedence\n","branch":"main","created":"2026-03-28T12:00:00Z"},{"id":"skill-resolver-layered-resolution","parent":"layered-skill-discovery","title":"SkillResolver Resolves Skills in Layered Order","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/skill-resolver-layered-resolution.md","content":"---\nid: skill-resolver-layered-resolution\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\n---\n\n# SkillResolver Resolves Skills in Layered Order\n\n## Description\n\nThe `SkillResolver` class discovers skills using a layered resolution order: local (`.spekk/skills/{agent}/`) \u003e global (`~/.config/spekk/skills/{agent}/`) \u003e package (`specs/coach-skills-system/` or `specs/builder-skills/`). First match wins.\n\n## Success Criteria\n\n- `SkillResolver` is a class in `src/cli/skill-resolver.js`\n- Constructor accepts `{ homeDir, cwd }` for testability, defaulting to `os.homedir()` and `process.cwd()`\n- `resolveSkill(agentName, subcommand)` returns `{ name, content, source }` or `null`\n- Resolution checks local dir first, then global, then package\n- A local skill with the same filename as a global skill takes precedence\n- A local or global skill with the same filename as a package skill takes precedence\n- Returns `null` when no skill matches in any layer\n- Package skill directories are: `specs/coach-skills-system/` for coach, `specs/builder-skills/` for builder\n","branch":"main","created":"2026-03-28T12:00:00Z"},{"id":"skill-resolver-tested","parent":"layered-skill-discovery","title":"SkillResolver Has Comprehensive Test Coverage","status":"done","priority":1,"file":"specs/layered-skill-discovery/assertions/skill-resolver-tested.md","content":"---\nid: skill-resolver-tested\nparent: layered-skill-discovery\ncreated: 2026-03-28T12:00:00Z\npriority: 1\nstatus: done\ndepends-on: skill-resolver-layered-resolution\n---\n\n# SkillResolver Has Comprehensive Test Coverage\n\n## Description\n\nThe `SkillResolver` is tested using isolated temp directories for all three layers. Tests cover resolution order, override semantics, aliases, frontmatter id matching, listing, and deduplication. Coach and builder CLI tests are updated to reflect the new interfaces.\n\n## Success Criteria\n\n- `src/cli/__tests__/skill-resolver.test.js` exists with tests for:\n  - Resolution from package, global, and local directories\n  - Local overrides global, local overrides package\n  - Legacy alias resolution (`meeting` → `meeting-notes-to-specs-skill`)\n  - Frontmatter `id` field resolution\n  - `listSkills()` returns skills from all layers, deduplicated\n  - Non-`.md` files are ignored\n  - `null` returned for unknown skills\n  - Constructor defaults for `homeDir` and `cwd`\n- `src/coach/__tests__/cli.test.js` does not import `SKILL_MAP` or `resolveSkillContent`\n- `src/builder/__tests__/cli.test.js` includes tests for `extractSkillArg` and `buildBuilderSkillMessage`\n- All tests use temp directories for isolation (no side effects on real file system)\n","branch":"main","dependsOn":"skill-resolver-layered-resolution","created":"2026-03-28T12:00:00Z"},{"id":"cli-routes-through-coach","parent":"meeting-notes-to-specs","title":"CLI Routes Through Coach","status":"done","priority":1,"file":"specs/meeting-notes-to-specs/assertions/cli-routes-through-coach.md","content":"---\nid: cli-routes-through-coach\nparent: meeting-notes-to-specs\ncreated: 2026-02-24T23:59:00Z\npriority: 1\nstatus: done\n---\n\n# CLI Routes Through Coach\n\nMeeting processing is accessed via `spekk coach meeting`, not as a top-level `spekk meeting` command.\n\n## Success Criteria\n\n- `spekk coach meeting` launches the coach with meeting-processing skill active\n- The activation message includes the full content of the meeting skill markdown file (not just a vague \"activate skill\" instruction)\n- No top-level `spekk meeting` command exists\n- Meeting processing is a subcommand of coach, keeping the three-agent architecture (coach, builder, observer)\n- `spekk coach meeting \u003ctranscript-file\u003e` accepts a transcript file argument\n- Without a file argument, coach prompts the user to paste or provide a transcript\n\n## Bug (2026-02-25)\n\nCurrently the CLI appends a 3-line activation instruction (\"Activate your meeting-notes-to-specs skill immediately\") but never reads or inlines `specs/coach-skills-system/meeting-notes-to-specs-skill.md`. The coach agent doesn't know what workflow to follow and falls back to regular coach behavior. See `cli-subcommands-inline-skill-content` assertion in coach-skills-system for the generic fix.\n","branch":"main","created":"2026-02-24T23:59:00Z"},{"id":"decisions-update-context","parent":"meeting-notes-to-specs","title":"Decisions Update CONTEXT.md","status":"done","priority":2,"file":"specs/meeting-notes-to-specs/assertions/decisions-update-context.md","content":"---\nid: decisions-update-context\nparent: meeting-notes-to-specs\ncreated: 2025-02-12T19:30:00Z\npriority: 2\nstatus: done\n---\n\n# Decisions Update CONTEXT.md\n\nArchitectural decisions and patterns discussed in meetings are extracted by the coach's meeting-processing skill and added to CONTEXT.md.\n\n**Tests:** src/coach/__tests__/decisions-update-context.test.js\n\n## Success Criteria\n\n- Architectural decisions identified from meeting transcript\n- Ex
