#cloud-config
#
# Cloud-init template for Spekk sandbox droplets.
#
# Usage:
#   doctl compute droplet create sandbox-agent-1 \
#     --image ubuntu-24-04-x64 \
#     --size s-2vcpu-4gb \
#     --region nyc1 \
#     --user-data-file cloud-init.yaml \
#     --ssh-keys YOUR_SSH_KEY_FINGERPRINT
#
# After creation, SSH in and run setup-credentials.sh to inject secrets.
# Then run deploy-agent.sh to copy the Go binary and start the service.
#

package_update: true
package_upgrade: true

users:
  - name: agent
    shell: /bin/bash
    groups: [docker, sudo, systemd-journal]
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      # Replace with your SSH public key
      - ssh-ed25519 AAAA... your-key-here

packages:
  - git
  - jq
  - htop
  - tmux
  - vim
  - unzip
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban

write_files:
  - path: /etc/systemd/system/spekk-agent.service
    content: |
      [Unit]
      Description=Spekk Agent Client
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=agent
      WorkingDirectory=/workspace
      EnvironmentFile=/etc/spekk/agent.env
      ExecStart=/opt/spekk/agent-client
      Restart=always
      RestartSec=5
      StandardOutput=append:/var/log/spekk/agent.log
      StandardError=append:/var/log/spekk/agent.log

      [Install]
      WantedBy=multi-user.target

  - path: /etc/spekk/agent.env.example
    content: |
      # Required: Agent auth token for WebSocket connection to the control host
      SPEKK_AGENT_TOKEN=
      # Required: Control host (e.g., your-control-host.example)
      SPEKK_HOST=
      # Required: Anthropic API key for Claude Code
      ANTHROPIC_API_KEY=
      # Required: GitHub PAT for the agent's GitHub identity
      GITHUB_TOKEN=

  # fail2ban: ban an address after repeated failed SSH logins.
  - path: /etc/fail2ban/jail.d/sandbox-sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
      findtime = 10m

runcmd:
  # Docker (official repo)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Host firewall (UFW). Default-deny inbound, so a droplet defends itself from
  # first boot and does not depend on a network-level firewall. Egress stays
  # open: the agent needs GitHub, container registries, the model API, and the
  # control host. SSH stays open for administrative access; a later step in the
  # hardening plan moves that to a private network and closes public SSH.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  # Make UFW govern Docker-published ports. Docker inserts its own iptables
  # rules ahead of UFW's input chain, so a plain "deny incoming" does not stop a
  # container that publishes a port (for example ports: ["5432:5432"]). This
  # DOCKER-USER block returns early for private ranges and drops all other new
  # inbound to published ports. It persists across reboots and Docker restarts,
  # because UFW re-applies after.rules on every reload.
  - |
    cat >> /etc/ufw/after.rules <<'UFW_DOCKER'

    # BEGIN UFW AND DOCKER
    *filter
    :ufw-user-forward - [0:0]
    :ufw-docker-logging-deny - [0:0]
    :DOCKER-USER - [0:0]
    -A DOCKER-USER -j ufw-user-forward
    -A DOCKER-USER -j RETURN -s 10.0.0.0/8
    -A DOCKER-USER -j RETURN -s 172.16.0.0/12
    -A DOCKER-USER -j RETURN -s 192.168.0.0/16
    -A DOCKER-USER -p udp -m udp --sport 53 --dport 1024:65535 -j RETURN
    -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 192.168.0.0/16
    -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 10.0.0.0/8
    -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 172.16.0.0/12
    -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 192.168.0.0/16
    -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 10.0.0.0/8
    -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 172.16.0.0/12
    -A DOCKER-USER -j RETURN
    -A ufw-docker-logging-deny -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[UFW DOCKER BLOCK] "
    -A ufw-docker-logging-deny -j DROP
    COMMIT
    # END UFW AND DOCKER
    UFW_DOCKER
  - ufw --force enable
  # Enable the sshd jail written to /etc/fail2ban/jail.d above.
  - systemctl enable fail2ban
  - systemctl restart fail2ban

  # Node.js LTS (via NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

  # GitHub CLI
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  - apt-get update -y
  - apt-get install -y gh

  # Claude Code CLI
  - npm install -g @anthropic-ai/claude-code

  # Workspace
  - mkdir -p /workspace
  - chown agent:agent /workspace

  # Spekk agent directory
  - mkdir -p /opt/spekk
  - mkdir -p /etc/spekk
  - mkdir -p /var/log/spekk
  - chown agent:agent /var/log/spekk

  # Git config for agent user
  - su - agent -c 'git config --global init.defaultBranch main'

  # Mark provisioning complete
  - touch /opt/spekk/.provisioned
